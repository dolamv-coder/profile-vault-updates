name = "orbit-license"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "orbit-license"
# Replace with the id printed by: npx wrangler d1 create orbit-license
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# "true": each Discord sign-in becomes a request posted to DISCORD_WEBHOOK_URL, and you approve
# or deny it from the link in that message. "" hands out keys straight away.
REQUIRE_APPROVAL = "true"
# Optional: only members of this Discord server get a key (right-click the server > Copy Server ID).
REQUIRED_GUILD_ID = ""
# Optional: Discord accounts younger than this many days are turned away. 0 turns the check off.
MIN_ACCOUNT_AGE_DAYS = "0"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   DISCORD_CLIENT_ID      Discord application's Client ID
#   DISCORD_CLIENT_SECRET  Discord application's Client Secret
#   LICENSE_SIGNING_KEY    private JWK from scripts/gen-key.mjs
#   DISCORD_WEBHOOK_URL    channel webhook for key requests (required when REQUIRE_APPROVAL is "true")
#   ADMIN_TOKEN            optional: enables /admin/* (list, revoke, restore)
