name: Deploy license worker

# Runs when a change to the worker lands on main, or by hand from the Actions tab.
# Needs, under Settings > Secrets and variables > Actions:
#   secret   CLOUDFLARE_API_TOKEN   token that can edit Workers and D1
#   secret   CLOUDFLARE_ACCOUNT_ID  (a variable of that name works too)
#   variable D1_DATABASE_ID         id of the orbit-license D1 database
#   secret   NOTIFY_USER_ID         optional: the Discord user ID each new channel post @mentions
on:
  push:
    branches: [main]
    paths: ["license-worker/**", "!license-worker/**/*.md"]
  workflow_dispatch:

concurrency:
  group: deploy-license-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: license-worker/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Point wrangler.toml at the real database
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if ! [[ "$D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Set the D1_DATABASE_ID repository variable (npx wrangler d1 list shows it)."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml
          grep -q "$D1_DATABASE_ID" wrangler.toml

      # Pasted values often carry a stray space or line break, which Cloudflare rejects.
      - name: Check the Cloudflare settings
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$ACCOUNT" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "$token" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."; exit 1
          fi
          echo "::add-mask::$token"
          if ! [[ "$account" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or not an Account ID (32 letters and digits, shown on the Workers & Pages page)."; exit 1
          fi
          ok=false
          for u in "https://api.cloudflare.com/client/v4/user/tokens/verify" "https://api.cloudflare.com/client/v4/accounts/$account/tokens/verify"; do
            if curl -sS -H "Authorization: Bearer $token" "$u" | grep -Eq '"status" *: *"active"'; then ok=true; break; fi
          done
          if [ "$ok" != true ]; then
            echo "::error::Cloudflare didn't accept CLOUDFLARE_API_TOKEN. Create a new API token (Edit Cloudflare Workers template plus Account > D1 > Edit) and paste only the token."; exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Update database tables
        run: npm run db:init

      - name: Deploy
        run: npm run deploy

      # A secret rather than a line in wrangler.toml, since this repo is public. Left alone when unset,
      # so one put on the worker by hand stays.
      - name: Set who each channel post pings
        env:
          NOTIFY_USER_ID: ${{ secrets.NOTIFY_USER_ID }}
        run: |
          if [ -n "$NOTIFY_USER_ID" ]; then
            printf '%s' "$NOTIFY_USER_ID" | npx wrangler secret put NOTIFY_USER_ID
          fi

      - name: Check it answers
        run: |
          sleep 5
          curl -fsS https://orbit-license.orbit-app.workers.dev/discord/ready
