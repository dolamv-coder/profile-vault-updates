name: Attach fafoaco.com (one-off)

# Temporary, at the owner's request (2026-10-11: "Are you able to access my cloudflare and do it for me?"): attaches the
# owner's domain to the workers with the deploy token, as Workers & Pages → Domains would, then checks the addresses
# answer. Removed again once it has run. Prints no token and no account id.
on:
  push:
    branches: [claude/elegant-shannon-wp2xrc]
    paths: [".github/workflows/attach-fafoaco-domains.yml"]

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach the custom domains
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          account="$(printf '%s' "$ACCOUNT" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          echo "::add-mask::$account"
          api="https://api.cloudflare.com/client/v4"
          get() { curl -sS -H "Authorization: Bearer $token" "$api$1"; }
          echo "--- the zone"
          get "/zones?name=fafoaco.com" | jq --arg a "$account" '{success, errors, zones: [.result[]? | {name, status, in_this_account: (.account.id == $a)}]}'
          zone="$(get "/zones?name=fafoaco.com" | jq -r '.result[0].id // empty')"
          echo "--- worker domains before"
          get "/accounts/$account/workers/domains" | jq '{success, errors, domains: [.result[]? | {hostname, service}]}'
          for pair in "license.fafoaco.com orbit-license" "app.fafoaco.com app" "fafoaco.com app" "www.fafoaco.com app"; do
            set -- $pair
            echo "--- attach $1 to $2"
            body="$(jq -nc --arg h "$1" --arg s "$2" --arg z "$zone" '{hostname: $h, service: $s, environment: "production"} + (if $z != "" then {zone_id: $z} else {} end)')"
            curl -sS -X PUT -H "Authorization: Bearer $token" -H "Content-Type: application/json" "$api/accounts/$account/workers/domains" --data "$body" \
              | jq '{success, errors, messages, attached: (.result | if type == "object" then {hostname, service, zone_name} else null end)}'
          done
          echo "--- worker domains after"
          get "/accounts/$account/workers/domains" | jq '{success, errors, domains: [.result[]? | {hostname, service}]}'
          if [ -n "$zone" ]; then
            echo "--- Always Use HTTPS"
            curl -sS -X PATCH -H "Authorization: Bearer $token" -H "Content-Type: application/json" "$api/zones/$zone/settings/always_use_https" --data '{"value":"on"}' | jq '{success, errors, value: .result.value}'
          fi

      - name: Check the addresses answer
        run: |
          for i in $(seq 1 36); do
            lic="$(curl -sS -m 10 https://license.fafoaco.com/discord/ready 2>&1 | head -c 200)"
            app="$(curl -sS -m 10 -o /dev/null -w '%{http_code} %header{x-orbit-version}' https://app.fafoaco.com/ 2>&1 | head -c 200)"
            site="$(curl -sS -m 10 -o /dev/null -w '%{http_code}' https://fafoaco.com/ 2>&1 | head -c 200)"
            www="$(curl -sS -m 10 -o /dev/null -w '%{http_code} %{redirect_url}' https://www.fafoaco.com/ 2>&1 | head -c 200)"
            echo "[$i] license: $lic | app: $app | fafoaco.com: $site | www: $www"
            if echo "$lic" | grep -q '"ready"' && echo "$app" | grep -q '^200 [0-9]' && echo "$site" | grep -q '^200' && echo "$www" | grep -Eq '^(200|30[0-9])'; then echo "All four answer."; exit 0; fi
            sleep 20
          done
          echo "::warning::Not all four answered within 12 minutes (new certificates can take longer)."
