name: Check fafoaco.com live (one-off)

# Temporary: reads the live addresses after the 1.9.109 release (nothing is changed). Removed once it has run.
on:
  push:
    branches: [claude/elegant-shannon-wp2xrc]
    paths: [".github/workflows/check-fafoaco-live.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the live addresses
        run: |
          show() { printf '%-55s ' "$1"; curl -sS -m 15 -o /dev/null -w "%{http_code} v=%header{x-orbit-version} -> %{redirect_url}\n" "$1" 2>&1 | tail -1; }
          show https://fafoaco.com/
          show https://fafoaco.com/download
          show https://www.fafoaco.com/
          show http://fafoaco.com/
          show http://app.fafoaco.com/
          show https://app.fafoaco.com/
          show https://app.orbit-app.workers.dev/
          echo "front page: $(curl -sS -m 15 https://fafoaco.com/ | grep -o '<title>[^<]*</title>\|Version [0-9.]*' | head -2 | tr '\n' ' ')"
          echo "license.fafoaco.com /discord/ready: $(curl -sS -m 15 https://license.fafoaco.com/discord/ready)"
          echo "old license address /discord/ready: $(curl -sS -m 15 https://orbit-license.orbit-app.workers.dev/discord/ready)"
          loc="$(curl -sS -m 15 -o /dev/null -w '%{redirect_url}' "https://license.fafoaco.com/discord/start?r=checkcheckcheck123456")"
          echo "sign-in start sends Discord: $(printf '%s' "$loc" | grep -o 'redirect_uri=[^&]*')"
          echo "the page says: $(curl -sS -m 15 https://app.fafoaco.com/ | grep -o 'Cop it. Track it. FAFO.' | head -1)"
