name: Release desktop app

# Builds the Windows download, Orbit-Windows.zip, from desktop/ (see desktop/README.md) and tests it:
# pull requests that touch desktop/ run the tests and the build. Run it by hand from the Actions tab on
# main to publish the build as the GitHub release v<desktop/package.json version>, which becomes the
# latest one that the app's download links point to (releases/latest/download/Orbit-Windows.zip).
# The page of that version has to be published first (update.json), and the release mustn't exist yet.
on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-release.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      # Includes Electron 33.4.11, so the tests run under the app's own Node.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: ELECTRON="$(node -p "require('electron')")" npm test

      - name: Build
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node build.mjs --unreleased-page; else node build.mjs; fi
          version="$(jq -r .version dist/build.json)"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ ! -s dist/notes.md ]; then
            echo "::error::desktop/release-notes/$version.md is missing. Add what changed for people downloading it, then run this again."
            exit 1
          fi

      - name: Check the build
        run: ELECTRON="$(node -p "require('electron')")" node test/check-build.mjs dist/Orbit-Windows.zip

      - name: Keep the build for the release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows
          path: |
            desktop/dist/Orbit-Windows.zip
            desktop/dist/build.json
            desktop/dist/notes.md
          retention-days: 7

  # Only this job can write. It runs no code from the build: it uploads the files the build job
  # produced and tested.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-windows
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version dist/build.json)"
          sha="$(jq -r .sha256 dist/build.json)"
          tag="v$version"
          if [ "$(sha256sum dist/Orbit-Windows.zip | cut -d' ' -f1)" != "$sha" ]; then echo "::error::The zip isn't the one the build job checked."; exit 1; fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. To publish another build, set desktop/package.json to a newer page's version."
            exit 1
          fi
          cp dist/Orbit-Windows.zip dist/ProfileVault-Windows.zip   # the name older pages link to
          printf '\n\nsha256 of Orbit-Windows.zip: `%s`\n' "$sha" >> dist/notes.md
          gh release create "$tag" dist/Orbit-Windows.zip dist/ProfileVault-Windows.zip -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Orbit $version for Windows" --notes-file dist/notes.md --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
