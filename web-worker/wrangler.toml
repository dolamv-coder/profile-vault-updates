# Orbit on the web: https://app.orbit-app.workers.dev serves the Orbit page UPDATE_URL names.
name = "app"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Where the page comes from: installed apps' update address, main's update.json, so the web version follows each
# release. (From 2026-10-01 to 1.9.106 it was paused at 1.9.67, at the owner's request, with this set to update.json in the
# "Release 1.9.67" commit; the owner had it follow releases again with 1.9.106.)
UPDATE_URL = "https://raw.githubusercontent.com/dolamv-coder/profile-vault-updates/main/update.json"
