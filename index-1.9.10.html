<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap">
<script>try{var t=localStorage.getItem("pv-theme");if(t&&t!=="default")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  --desk:#111419; --sheet:#1A1E25; --sheet-2:#232833;
  --ink:#EEF1F5; --ink-2:#9BA3AF; --ink-3:#6B7482;
  --line:#2C323C; --line-2:#242a33;
  --accent:#E23B36; --accent-2:#F05650; --on-accent:#FFFFFF;
  --caution:#F5B300; --on-caution:#000000;
  --danger:#F0605A; --ok:#43C583; --info:#4A9DF0; --violet:#8B7BF0;
  --stock:#EDECE7; --stock-ink:#12151A;
  --btn-ink-bg:#EEF1F5; --btn-ink-fg:#12151A;
  --scrim:rgba(6,8,12,.62);
  --fs:.87; /* text size: 1 = original, lower = smaller */
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --desk:#E3E6EA; --sheet:#FFFFFF; --sheet-2:#F2F4F6;
  --ink:#101317; --ink-2:#4A5058; --ink-3:#737A83;
  --line:#D3D8DE; --line-2:#E4E8EC;
  --accent:#D22B26; --accent-2:#B4231F; --on-accent:#FFFFFF;
  --danger:#C4231B; --ok:#1F7A4D;
  --stock:#FFFFFF; --stock-ink:#000;
  --btn-ink-bg:#101317; --btn-ink-fg:#FFFFFF;
  --scrim:rgba(20,22,26,.42);
  color-scheme:light;
}
/* ---------- Space theme: midnight sky, starlight gold, glass panels ---------- */
:root[data-theme="space"]{
  --desk:#070914; --sheet:rgba(22,27,48,.72); --sheet-2:rgba(38,45,74,.62);
  --ink:#ECEBF5; --ink-2:#A6ABC8; --ink-3:#6E7497;
  --line:rgba(150,160,220,.18); --line-2:rgba(150,160,220,.10);
  --accent:#E3C27A; --accent-2:#F1D595; --on-accent:#14121C;
  --caution:#F2B84B; --on-caution:#14121C;
  --danger:#F07A8A; --ok:#6FD6B0; --info:#8FB4FF; --violet:#B39DFF;
  --stock:#E9E6F2; --stock-ink:#12142A;
  --btn-ink-bg:#ECEBF5; --btn-ink-fg:#0B0E1C;
  --scrim:rgba(3,4,12,.7);
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  color-scheme:dark;
}
:root[data-theme="space"] body{
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(120,90,220,.20), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(40,110,200,.18), transparent 60%),
    radial-gradient(600px 400px at 50% 50%, rgba(227,194,122,.05), transparent 70%),
    #070914;
  background-attachment:fixed;
}
/* Two star layers, tiled; the second twinkles slowly. */
:root[data-theme="space"] body::before,:root[data-theme="space"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
:root[data-theme="space"] body::before{
  background-image:
    radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 140px 90px,rgba(255,255,255,.8),transparent),
    radial-gradient(1px 1px at 260px 20px,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 330px 160px,#fff,transparent),
    radial-gradient(1px 1px at 90px 210px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 210px 260px,rgba(210,220,255,.8),transparent),
    radial-gradient(1px 1px at 380px 300px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 40px 340px,rgba(255,240,210,.7),transparent);
  background-size:400px 360px;animation:pv-twinkle 4.7s ease-in-out infinite alternate;animation-delay:-2s}
:root[data-theme="space"] body::after{
  background-image:
    radial-gradient(1.5px 1.5px at 70px 120px,#fff,transparent),radial-gradient(2px 2px at 300px 60px,rgba(241,213,149,.9),transparent),
    radial-gradient(1.5px 1.5px at 520px 240px,rgba(200,215,255,.9),transparent),radial-gradient(1px 1px at 180px 420px,#fff,transparent),
    radial-gradient(2px 2px at 620px 460px,#fff,transparent),radial-gradient(1.5px 1.5px at 420px 520px,rgba(255,255,255,.8),transparent);
  background-size:700px 600px;animation:pv-twinkle 3.1s ease-in-out infinite alternate}
/* Two more layers on <html>, each on its own rhythm, so stars sparkle out of step. */
:root[data-theme="space"]::before,:root[data-theme="space"]::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
:root[data-theme="space"]::before{
  background-image:
    radial-gradient(2px 2px at 110px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 350px 190px,rgba(255,236,200,.95),transparent),
    radial-gradient(1px 1px at 230px 330px,#fff,transparent),radial-gradient(2px 2px at 470px 410px,rgba(200,215,255,1),transparent),
    radial-gradient(1.5px 1.5px at 30px 470px,#fff,transparent);
  background-size:520px 520px;animation:pv-twinkle 2.3s ease-in-out infinite alternate;animation-delay:-1.1s}
/* A few bright stars with a soft glow that flare slowly. */
:root[data-theme="space"]::after{
  background-image:
    radial-gradient(circle at 160px 140px,#fff 0 1.5px,rgba(241,213,149,.35) 2px,transparent 7px),
    radial-gradient(circle at 690px 380px,#fff 0 1.5px,rgba(180,200,255,.35) 2px,transparent 7px),
    radial-gradient(circle at 420px 700px,#fff 0 1.5px,rgba(255,255,255,.3) 2px,transparent 6px);
  background-size:900px 820px;animation:pv-flare 5.9s ease-in-out infinite;animation-delay:-3s}
@keyframes pv-twinkle{0%{opacity:.08}45%{opacity:.9}55%{opacity:1}100%{opacity:.2}}
@keyframes pv-flare{0%,100%{opacity:.15}50%{opacity:1}}
:root[data-theme="space"] #app{position:relative;z-index:1}
/* Glass panels */
:root[data-theme="space"] .slip,:root[data-theme="space"] .stat,:root[data-theme="space"] .panelbox,:root[data-theme="space"] .btn,:root[data-theme="space"] .chip,
:root[data-theme="space"] .panel,:root[data-theme="space"] .topbar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-theme="space"] .slip:hover{border-color:rgba(227,194,122,.35);box-shadow:0 0 0 1px rgba(227,194,122,.08),0 8px 30px rgba(0,0,0,.35)}
:root[data-theme="space"] .btn-primary{box-shadow:0 0 18px rgba(227,194,122,.25)}
:root[data-theme="space"] .chip[aria-pressed="true"]{box-shadow:0 0 14px rgba(227,194,122,.3)}
/* Timeless type for headings */
:root[data-theme="space"] .wordmark,:root[data-theme="space"] .view-title,:root[data-theme="space"] .set-title,
:root[data-theme="space"] .panel-head h2,:root[data-theme="space"] .empty h2{font-family:var(--serif);font-stretch:100%;font-weight:700;letter-spacing:.01em}
:root[data-theme="space"] .view-title{font-size:calc(34px*var(--fs))}
:root[data-theme="space"] .topbar .wordmark{font-size:calc(24px*var(--fs))}
:root[data-theme="space"] .stat-n{font-family:var(--serif);font-stretch:100%;font-size:calc(34px*var(--fs))}
/* Lock screen: a dark glass card instead of the paper label */
:root[data-theme="space"] .lock-label{background:rgba(18,22,42,.72);color:var(--ink);border:1px solid rgba(227,194,122,.35);border-radius:14px;
  box-shadow:0 0 60px rgba(120,90,220,.18),inset 0 1px 0 rgba(255,255,255,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-theme="space"] .lock-label .wordmark{font-size:calc(46px*var(--fs));color:var(--accent)}
:root[data-theme="space"] .lock-label p{color:var(--ink-2)}
:root[data-theme="space"] .lock-label .field label{color:var(--ink)}
:root[data-theme="space"] .lock-label input{color:var(--ink);border-color:var(--line)}
:root[data-theme="space"] .lock-rule{background:linear-gradient(90deg,transparent,rgba(227,194,122,.6),transparent)!important;border:0!important;height:1px!important}
:root[data-theme="space"] *::-webkit-scrollbar-thumb{border-color:#070914}
/* Store marks keep their brand colors; the order status colors stay readable on glass. */
:root[data-theme="space"] .ostage-shipped{background:#2B3F7A}
:root[data-theme="space"] .topbar{background:rgba(7,9,20,.72)}
:root[data-theme="space"] .panel{background:#121630;border-left:1px solid var(--line)}
:root[data-theme="space"] .field input,:root[data-theme="space"] .field select,:root[data-theme="space"] .field textarea,:root[data-theme="space"] .search input{background:rgba(10,13,30,.7)}
:root[data-theme="space"] select option{background:#121630}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
@media (max-width:700px){:root{--fs:1}}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:calc(15px*var(--fs));line-height:1.45}
*::-webkit-scrollbar{width:12px;height:12px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--desk)}*::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;font-size:calc(14px*var(--fs));white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ink{background:var(--btn-ink-bg);color:var(--btn-ink-fg);border-color:var(--btn-ink-bg)}
.btn-quiet{background:transparent;border-color:transparent}
.btn-quiet:hover{background:var(--sheet-2);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-sm{min-height:32px;padding:0 10px;font-size:calc(13px*var(--fs))}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--sheet-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.link-danger{color:var(--danger)}

/* lock screen */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.lock-inner{width:100%;max-width:420px}
.lock-label{background:var(--stock);color:var(--stock-ink);border:3px solid #000;border-radius:3px;padding:24px}
.wordmark{font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1}
.lock-label .wordmark{font-size:calc(36px*var(--fs));margin:0 0 6px}
.lock-rule{height:6px;background:#000;margin:16px -24px 20px}
.lock-label p{margin:0 0 16px;color:#333}
.lock-label .field label{color:#000}
.lock-label input,.lock-label .field input{background:#fff;color:#000;border-color:#000}
.lock-foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;margin-top:16px;font-size:calc(14px*var(--fs))}
.lock-msg{margin:0 0 12px;padding:10px 12px;background:var(--sheet);border-left:4px solid var(--caution);font-size:calc(14px*var(--fs))}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--desk);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:10px 20px}
.topbar .wordmark{font-size:calc(19px*var(--fs));white-space:nowrap}
.search{position:relative;max-width:460px;width:100%}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--sheet-2);padding:0 12px 0 36px;font-size:calc(16px*var(--fs))}
.top-actions{display:flex;gap:4px;align-items:center}
.top-update{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,52,47,.5)}50%{box-shadow:0 0 0 5px rgba(228,52,47,0)}}
.has-dot{position:relative}
.has-dot .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--desk)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);padding:18px 12px 24px 16px;max-height:calc(100vh - 59px);overflow:auto}
.nav-item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;border:0;background:transparent;cursor:pointer;text-align:left;font-weight:600;font-size:calc(15px*var(--fs))}
.nav-item:hover{background:var(--sheet-2)}
.nav-item[aria-current="true"]{background:var(--sheet-2);box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 1px var(--line);color:var(--ink)}
.nav-item .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500;font-size:calc(13px*var(--fs))}
.groups{margin:2px 0 14px 10px;padding-left:8px;border-left:1px solid var(--line)}
.groups .nav-item{font-weight:500;font-size:calc(14px*var(--fs));padding:6px 10px}
.side-note{margin-top:22px;padding:12px;font-size:calc(13px*var(--fs));color:var(--ink-2);border-top:1px solid var(--line)}
.side-note strong{display:block;color:var(--ink);font-weight:600}
.main{padding:20px 24px 120px;min-width:0}
.mnav{display:none}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.view-title{margin:0;font-size:calc(26px*var(--fs));font-stretch:112%;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.view-sub{margin:4px 0 0;color:var(--ink-2);font-size:calc(14px*var(--fs))}
.view-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.selall{display:inline-flex;align-items:center;gap:8px;font-size:calc(14px*var(--fs));color:var(--ink-2);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:-4px 0 14px}
.chips-inbox{align-items:center;margin:0 0 14px}
.chips-label{display:inline-flex;align-items:center;gap:6px;flex:none;margin-right:4px;font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chips-label svg{width:15px;height:15px}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:calc(13px*var(--fs));font-weight:600;cursor:pointer}
.chip-store{display:inline-flex;align-items:center;gap:7px}
.chip-n{font-size:calc(12px*var(--fs));font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2)}
.chip[aria-pressed="true"] .chip-n{background:rgba(0,0,0,.25);color:inherit}
.smark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-size:calc(11px*var(--fs));font-weight:800;letter-spacing:.02em;flex:none}
/* License card (Settings) and key input */
.lic-card{border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:18px 20px;max-width:640px}
.lic-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.lic-title{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.lic-title svg{width:18px;height:18px;color:var(--accent)}
.lic-key{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet-2);padding:8px 8px 8px 14px}
.lic-key code{font-family:ui-monospace,Consolas,Menlo,monospace;font-weight:700;letter-spacing:.06em;font-size:calc(15px*var(--fs))}
.lic-input{font-family:ui-monospace,Consolas,Menlo,monospace!important;text-transform:uppercase;letter-spacing:.06em}
/* Order photo, with the store's mark as a small badge in the corner */
.othumb{position:relative;flex:none;width:44px;height:44px;border-radius:9px;background:#fff;display:grid;place-items:center}
.othumb img{width:100%;height:100%;object-fit:contain;border-radius:9px;padding:2px}
.othumb .smark{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:5px;font-size:calc(8px*var(--fs));box-shadow:0 0 0 2px var(--sheet)}
.othumb.is-broken{width:auto;height:auto;background:none}
.othumb.is-broken img{display:none}
.othumb.is-broken .smark{position:static;width:26px;height:26px;border-radius:7px;font-size:calc(11px*var(--fs));box-shadow:none}
.smark-lg{width:34px;height:34px;font-size:calc(13px*var(--fs));border-radius:9px}
.ret-pick{display:flex;flex-wrap:wrap;gap:8px}
.spick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px 5px 6px;font-size:calc(14px*var(--fs));font-weight:600;cursor:pointer}
.spick:hover{border-color:var(--ink-3)}
.spick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sheet-2)}
.spick-new{border-style:dashed;padding-left:10px}
.spick-new svg{width:16px;height:16px}
.spick .pill{font-size:calc(11px*var(--fs));padding:0 6px}
.ret-add{margin-top:10px}
.ret-add select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:0 11px;font-size:calc(15px*var(--fs))}
.ret-cfgs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ret-cfg{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.ret-cfg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ret-cfg-head strong{flex:1;min-width:0}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}

/* profile slip */
.slip{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slip.is-sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slip-head{display:flex;align-items:center;gap:10px;min-width:0}
.slip-head input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent);margin:0}
.slip-name{flex:1;min-width:0;font-weight:700;font-size:calc(16px*var(--fs));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.slip-name:hover{text-decoration:underline;text-underline-offset:3px}
.tag{flex:none;font-size:calc(12px*var(--fs));font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slip-meta{display:flex;flex-direction:column;gap:4px;font-size:calc(13px*var(--fs));color:var(--ink-2);min-width:0}
.slip-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardline{display:flex;align-items:center;gap:8px;font-size:calc(14px*var(--fs));font-weight:600;font-variant-numeric:tabular-nums}
.swatch{width:30px;height:19px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}
.expired{color:var(--danger);font-weight:600}
.missing{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px dashed var(--line);border-radius:3px;padding:10px 12px;color:var(--ink-2);font-size:calc(14px*var(--fs))}

/* printed label: the signature object */
.label{background:var(--stock);color:var(--stock-ink);border:2px solid #000;border-radius:4px;padding:10px 12px;font-stretch:78%;font-weight:700;text-transform:uppercase;line-height:1.22;font-size:calc(15px*var(--fs));letter-spacing:.01em;min-width:0}
.label .l-name{font-size:calc(18px*var(--fs));font-weight:800;margin-bottom:3px;overflow-wrap:anywhere}
.label div{overflow-wrap:anywhere}
.label-lg{padding:16px 18px;font-size:calc(17px*var(--fs));border-width:3px}
.label-lg .l-name{font-size:calc(22px*var(--fs))}
.label .l-bar{height:5px;background:#000;margin:10px -12px 8px}
.label-lg .l-bar{margin:12px -18px 10px}
.label .l-foot{font-size:calc(12px*var(--fs));font-weight:600;text-transform:none;font-stretch:100%;display:flex;justify-content:space-between;gap:8px}
.label.is-empty{color:#8a8a8a}

.item{display:flex;flex-direction:column;gap:10px;min-width:0}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.item-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:calc(13px*var(--fs));color:var(--ink-2)}
.item-actions{display:flex;gap:2px;flex:none}

/* credit card object */
.cc{position:relative;aspect-ratio:1.586;border-radius:11px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cc.light{color:#1a1a1a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc-nick{font-size:calc(13px*var(--fs));font-weight:600;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-brand{font-stretch:125%;font-weight:800;font-size:calc(16px*var(--fs));letter-spacing:.02em;white-space:nowrap}
.cc-tag{display:inline-block;padding:1px 6px;border-radius:999px;font-size:calc(10px*var(--fs));font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.22);vertical-align:1px}
.cc.light .cc-tag{background:rgba(0,0,0,.14)}
.cc-chip{width:38px;height:28px;border-radius:5px;background:linear-gradient(135deg,#d8c690,#b39a58);position:relative}
.cc-chip::after{content:"";position:absolute;inset:6px 0;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.cc-num{font-variant-numeric:tabular-nums;font-size:clamp(16px,5.2cqi,21px);letter-spacing:.09em;font-weight:600;white-space:nowrap}
.cc-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:calc(13px*var(--fs))}
.cc-bottom small{display:block;font-size:calc(10px*var(--fs));opacity:.7;font-weight:600}
.cc-holder{text-transform:uppercase;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cc-wrap{container-type:inline-size}
.cc-pick{position:relative}
.cc-pick > input[type=checkbox]{position:absolute;top:10px;left:10px;z-index:2;width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer;border-radius:5px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.item.is-sel .cc{outline:2px solid var(--accent);outline-offset:2px}
.cc-pick .cc-top{padding-left:30px}

/* empty state */
.empty{border:2px dashed var(--line);border-radius:8px;padding:40px 24px;text-align:center;max-width:620px}
.empty h2{margin:0 0 6px;font-size:calc(20px*var(--fs));font-weight:800;font-stretch:112%}
.empty p{margin:0 auto 18px;color:var(--ink-2);max-width:46ch}

/* bulk bar */
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bulk-inner{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--btn-ink-bg);color:var(--btn-ink-fg);border-radius:10px;padding:8px 8px 8px 16px;box-shadow:0 12px 30px -8px rgba(0,0,0,.45)}
.bulk-inner .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.45)}
.bulk-inner select{height:32px;border-radius:6px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;padding:0 8px;font-size:calc(13px*var(--fs))}
.bulk-inner select option{color:#000;background:#fff}
.bulk-count{font-weight:700;margin-right:6px;font-size:calc(14px*var(--fs))}

/* layers */
.layer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .18s}
.layer.is-open .scrim{opacity:1}
.panel{position:absolute;background:var(--sheet);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 20px 60px -16px rgba(0,0,0,.5);max-height:100%}
.layer-modal .panel{left:50%;top:50%;width:min(560px,calc(100vw - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:10px;transform:translate(-50%,-48%);opacity:0;transition:transform .18s,opacity .18s}
.layer-modal.is-open .panel{transform:translate(-50%,-50%);opacity:1}
.layer-modal.is-small .panel{width:min(420px,calc(100vw - 24px))}
.layer-drawer .panel{top:0;right:0;bottom:0;width:min(540px,100vw);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.layer-drawer.is-open .panel{transform:none}
.layer-drawer.is-wide .panel{width:min(1120px,100vw)}
.pe{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.pe-right{position:sticky;top:0}
.pe-sec{padding-top:18px;border-top:1px solid var(--line-2)}
.pe .preview .cc{max-width:none}
.check-box{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
.check-box:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:900px){.pe{grid-template-columns:minmax(0,1fr)}.pe-right{position:static}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.panel-head h2{margin:0;font-size:calc(20px*var(--fs));font-weight:800;font-stretch:112%}
.panel-body{padding:18px 20px;overflow:auto;flex:1;min-height:0}
.panel-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2)}
.panel-foot .spacer{flex:1}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 12px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink)}
.field .opt{font-weight:400;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--sheet-2);padding:8px 11px;font-size:calc(16px*var(--fs))}
.field textarea{min-height:120px;font-size:calc(13px*var(--fs));font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field .hint{font-size:calc(12px*var(--fs));color:var(--ink-3)}
.field .err{font-size:calc(12px*var(--fs));color:var(--danger);font-weight:600}
.field.has-err input,.field.has-err select{border-color:var(--danger)}
.input-affix{position:relative}
.input-affix .affix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:calc(12px*var(--fs));font-weight:700;color:var(--ink-2);pointer-events:none}
.section{margin:0 0 22px}
.section:last-child{margin-bottom:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.section-head h3{margin:0;font-size:calc(16px*var(--fs));font-weight:800}
.picker{display:flex;gap:8px;align-items:stretch}
.picker select{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;font-size:calc(14px*var(--fs));cursor:pointer;margin:0 0 10px}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:calc(14px*var(--fs))}
.radio:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.radio input{accent-color:var(--accent);margin:0}
.radio small{color:var(--ink-3);margin-left:auto}
.note{padding:10px 12px;border-radius:6px;background:var(--sheet-2);font-size:calc(13px*var(--fs));color:var(--ink-2)}
.note-warn{border-left:4px solid var(--caution);color:var(--ink)}
.swatches{display:flex;gap:8px}
.swatches button{width:34px;height:24px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.preview{margin-bottom:18px}
.preview .cc{max-width:340px;margin:0 auto}
.panelbox{border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:18px;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:16px 16px;background:var(--sheet-2);display:flex;flex-direction:column;gap:2px}
.stat-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.stat-ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none}
.stat-ic svg{width:17px;height:17px;stroke-width:1.9}
.stat-ic-accent{background:rgba(226,59,54,.16);color:var(--accent-2)}
.stat-ic-info{background:rgba(74,157,240,.16);color:var(--info)}
.stat-ic-violet{background:rgba(139,123,240,.16);color:var(--violet)}
.stat-ic-ok{background:rgba(67,197,131,.16);color:var(--ok)}
.stat-label{font-size:calc(11px*var(--fs));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat-n{font-size:calc(28px*var(--fs));font-weight:800;font-stretch:110%;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat-sub{font-size:calc(12px*var(--fs));color:var(--ink-3)}
.submit-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.store{border:1px solid var(--line);border-radius:12px;background:var(--sheet);margin:0 0 14px;overflow:hidden}
.store.is-full{box-shadow:inset 3px 0 0 var(--accent)}
.store-head{display:flex;align-items:center;gap:12px;padding:12px 14px}
.store-title{font-size:calc(19px*var(--fs));font-weight:800;font-stretch:112%;line-height:1.2}
.store-right{text-align:right;flex:none}
.store-count{font-size:calc(15px*var(--fs));font-variant-numeric:tabular-nums}
.store-count strong{font-size:calc(20px*var(--fs))}
.store-right .chips-row{justify-content:flex-end;margin-top:4px}
.store-body{padding:0 14px 14px;border-top:1px solid var(--line-2)}
.store-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.grid-slots{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.slot{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--sheet)}
.slot.is-on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot-top{display:flex;align-items:center;gap:10px}
.slot-name{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-meta{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:calc(13px*var(--fs));color:var(--ink-2)}
.slot-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:calc(12px*var(--fs));font-weight:600;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill-on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill-warn{background:var(--caution);border-color:#000;color:#000}
.sw{flex:none;display:inline-block;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw-track{display:block;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked + .sw-track{background:var(--ok)}
.sw input:checked + .sw-track::after{transform:translateX(18px)}
.sw input:focus-visible + .sw-track{outline:2px solid var(--ink);outline-offset:2px}
.store-name{font-stretch:118%;font-weight:800;font-size:calc(19px*var(--fs));line-height:1.15}
.slip.login{border-top:4px solid var(--ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:calc(14px*var(--fs))}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.co .slip-head{align-items:flex-start}
.order .slip-head{align-items:flex-start;gap:8px}
/* Compact order cards */
.grid-orders{gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.order{padding:10px 12px;gap:6px;border-radius:10px}
.order .ostage{padding:2px 7px;font-size:calc(11px*var(--fs))}
.order .slip-meta{gap:2px}
.slip-meta .o-line{white-space:normal;overflow:visible}
/* Edit/delete appear over the status pill on hover, so the text keeps the full width */
.order{position:relative}
.order .item-actions{position:absolute;top:8px;right:8px;padding:2px;border-radius:8px;background:var(--sheet-2);opacity:0;pointer-events:none;transition:opacity .12s}
.order:hover .item-actions,.order:focus-within .item-actions{opacity:1;pointer-events:auto}
.order .icon-btn{width:28px;height:28px}
.order .icon-btn svg{width:15px;height:15px}
@media (hover:none){.order .item-actions{position:static;opacity:1;pointer-events:auto;background:none;align-self:flex-end;margin-top:-4px}}
.trk-link{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--ink-3);display:inline-flex;align-items:center;gap:3px}
.trk-link:hover{color:var(--accent-2);border-bottom-color:var(--accent-2)}
.trk-link svg{width:12px;height:12px}
.trk-line{display:inline-flex;align-items:center;gap:6px}
.trk-line svg{width:14px;height:14px;color:var(--info)}
.trk-line a{color:var(--info);text-decoration:none;font-variant-numeric:tabular-nums}
.trk-line a:hover{text-decoration:underline}
.ostage{flex:none;font-size:calc(12px*var(--fs));font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2)}
.ostage-shipped{background:#1E3A5F;color:#fff}.ostage-arriving{background:var(--caution);color:#000}.ostage-delivered{background:var(--ok);color:#fff}.ostage-canceled{background:var(--danger);color:#fff}
.upd-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding:12px 14px;border-radius:8px;background:var(--sheet);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--accent)}
.upd-banner > div{padding-left:6px}
.upd-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:14px 16px}
.upd-ver{font-weight:800;font-size:calc(17px*var(--fs))}
.where{border:1px solid var(--accent);border-radius:10px;background:var(--sheet);padding:16px 18px;margin:4px 0 22px}
.where-badge{display:inline-block;font-size:calc(12px*var(--fs));font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);margin-bottom:10px}
.where-lead{margin:0 0 10px}
.app-ver{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;font-size:calc(12px*var(--fs));font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;pointer-events:none}
@media (max-width:899px){.app-ver{display:none}}
.clean-bar{display:grid;grid-template-columns:minmax(0,1fr) 170px 140px auto;gap:12px;align-items:end}
.clean-bar .field{margin:0}
.clean-busy{display:flex;align-items:center;gap:10px;font-weight:600}
.clean-sum{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.clean-list{display:flex;flex-direction:column;gap:6px}
.clean-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.clean-row input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.clean-main{display:flex;flex-direction:column;min-width:0}
.clean-sender{font-weight:700}
.clean-subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.clean-side{display:flex;align-items:center;gap:10px}
.clean-kept{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.kchip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);font-size:calc(13px*var(--fs))}
.kchip button{border:0;background:transparent;color:var(--ink-3);cursor:pointer;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%}
.kchip button:hover{color:var(--ink);background:var(--sheet-2)}
.kchip svg{width:13px;height:13px}
.clean-n{font-weight:800;font-variant-numeric:tabular-nums;background:var(--sheet-2);border-radius:999px;padding:2px 10px}
.clean-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 0;background:var(--desk)}
@media (max-width:760px){.clean-bar{grid-template-columns:1fr}}
.how-card{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:16px 18px;margin:0 0 18px}
.how-card .how{margin-bottom:14px}
.ibx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.ibx-list{display:flex;flex-direction:column;gap:8px}
.ibx{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--sheet)}
.ibx-email{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibx-main .item-sub{overflow:hidden;text-overflow:ellipsis}
.ibx-auto{display:flex;align-items:center;gap:6px;cursor:pointer}
.pill-err{background:var(--danger);border-color:var(--danger);color:#fff}
.pill-busy{display:inline-flex;align-items:center;gap:6px;background:var(--sheet-2)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.adv{margin-top:22px;border-top:1px solid var(--line-2);padding-top:14px}
.adv summary{cursor:pointer;font-weight:700;font-size:calc(15px*var(--fs));color:var(--ink-2)}
.adv summary:hover{color:var(--ink)}
.adv-body{padding-top:12px}
@media (max-width:760px){.ibx{grid-template-columns:minmax(0,1fr) auto}.ibx-status{grid-column:1/-1;order:3}.ibx-auto{order:4}.ibx .item-actions{grid-column:1/-1;order:5;justify-content:flex-start}}
.set-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
.set-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:2px}
.set-link{text-align:left;border:0;background:transparent;padding:8px 12px;border-radius:6px;font-weight:600;font-size:calc(15px*var(--fs));cursor:pointer;color:var(--ink-2)}
.set-link[aria-current="true"]{background:var(--sheet-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 1px var(--line)}
.set-sec{margin:0 0 40px;scroll-margin-top:80px;max-width:640px}
.set-eyebrow{font-size:calc(13px*var(--fs));font-weight:700;color:var(--ink-3);margin-bottom:4px}
.set-title{margin:0 0 6px;font-size:calc(24px*var(--fs));font-weight:800;font-stretch:112%}
.set-lead{margin:0 0 16px;color:var(--ink-2)}
.set-sub{margin:22px 0 8px;font-size:calc(16px*var(--fs));font-weight:800}

.menu button:hover,.menu button:focus-visible{background:var(--sheet-2)}
.menu button svg{width:16px;height:16px}
.menu .danger{color:var(--danger)}

.toasts{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px calc(78px + env(safe-area-inset-bottom,0px));pointer-events:none}

@keyframes tin{from{transform:translateY(8px);opacity:0}}

  .view-title{font-size:calc(22px*var(--fs))}

  .layer-modal .panel{left:0;right:0;top:auto;bottom:0;width:100%;transform:translateY(100%);border-radius:12px 12px 0 0;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .layer-modal.is-open .panel{transform:none}
  .layer-modal.is-small .panel{width:100%}

  .c2.keep{grid-column:span 2}
  .c3.keep3{grid-column:span 3}
  .grid{grid-template-columns:minmax(0,1fr)}
}

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const STORE_KEY = "profile-vault/v1";
const ITER = 600000;
const FINISHES = [
  {bg:"#23272E", light:false, name:"Graphite"},
  {bg:"#1E3A5F", light:false, name:"Navy"},

];
const COUNTRIES = [["US","United States"],["CA","Canada"],["GB","United Kingdom"],["IE","Ireland"],["AU","Australia"],["NZ","New Zealand"],["DE","Germany"],["FR","France"],["IT","Italy"],["ES","Spain"],["PT","Portugal"],["NL","Netherlands"],["BE","Belgium"],["LU","Luxembourg"],["AT","Austria"],["CH","Switzerland"],["SE","Sweden"],["NO","Norway"],["DK","Denmark"],["FI","Finland"],["PL","Poland"],["CZ","Czechia"],["SK","Slovakia"],["HU","Hungary"],["RO","Romania"],["BG","Bulgaria"],["GR","Greece"],["HR","Croatia"],["SI","Slovenia"],["EE","Estonia"],["LV","Latvia"],["LT","Lithuania"],["JP","Japan"],["KR","South Korea"],["CN","China"],["HK","Hong Kong"],["TW","Taiwan"],["SG","Singapore"],["MY","Malaysia"],["TH","Thailand"],["PH","Philippines"],["ID","Indonesia"],["VN","Vietnam"],["IN","India"],["AE","United Arab Emirates"],["SA","Saudi Arabia"],["IL","Israel"],["TR","Türkiye"],["ZA","South Africa"],["MX","Mexico"],["BR","Brazil"],["AR","Argentina"],["CL","Chile"],["CO","Colombia"]];
const US_STATES = [["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"],["PR","Puerto Rico"],["GU","Guam"],["VI","U.S. Virgin Islands"],["AS","American Samoa"],["MP","Northern Mariana Islands"],["AA","Armed Forces Americas"],["AE","Armed Forces Europe"],["AP","Armed Forces Pacific"]];
const CA_PROVINCES = [["AB","Alberta"],["BC","British Columbia"],["MB","Manitoba"],["NB","New Brunswick"],["NL","Newfoundland and Labrador"],["NS","Nova Scotia"],["NT","Northwest Territories"],["NU","Nunavut"],["ON","Ontario"],["PE","Prince Edward Island"],["QC","Quebec"],["SK","Saskatchewan"],["YT","Yukon"]];

/* ---------- icons ---------- */
const P = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  imp:'<path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  exp:'<path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/><path d="M14 11v6M11 14h6"/>',
  check:'<path d="m5 13 4 4L19 7"/>',
  box:'<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  truck:'<path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/>',
  store:'<path d="M4 9h16l-1-4H5z"/><path d="M5 9v10h14V9"/><path d="M9 19v-5h6v5"/>',
  dollar:'<path d="M12 2v20M16 6a4 3 0 0 0-4-2c-2.2 0-4 1.2-4 3s1.8 3 4 3 4 1.2 4 3-1.8 3-4 3a4 3 0 0 1-4-2"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  chevR:'<path d="m9 6 6 6-6 6"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4"/>'
};
/* ---------- theme (kept outside the vault so the lock screen uses it too) ---------- */
const currentTheme = () => document.documentElement.getAttribute("data-theme") || "default";
function setTheme(t){
  if (t === "default") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("pv-theme", t); } catch(e){}
}
const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const digits = (s) => String(s || "").replace(/\D/g, "");
const norm = (s) => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
const natural = (a, b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"});
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const enc = new TextEncoder(), dec = new TextDecoder();
const toB64 = (buf) => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (str) => { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };

/* ---------- card helpers ---------- */
function brandOf(num){
  const n = digits(num);
  if (/^4/.test(n)) return "visa";
  if (/^3[47]/.test(n)) return "amex";
  if (/^5[1-5]/.test(n)) return "mastercard";
  const f4 = parseInt(n.slice(0,4), 10);
  if (n.length >= 4 && f4 >= 2221 && f4 <= 2720) return "mastercard";
  if (/^(6011|65|64[4-9]|622)/.test(n)) return "discover";
  if (/^35(2[89]|[3-8])/.test(n)) return "jcb";
  if (/^3(0[0-5]|[68])/.test(n)) return "diners";
  if (/^62/.test(n)) return "unionpay";
  return "";
}
function cardBrand(c){ return c && c.redcard ? "RedCard" : BRAND_NAME[brandOf(c && c.number)]; }
const BRAND_NAME = {visa:"Visa", mastercard:"Mastercard", amex:"Amex", discover:"Discover", jcb:"JCB", diners:"Diners", unionpay:"UnionPay", "":"Card"};
function luhn(num){
  const n = digits(num); if (n.length < 12) return false;
  let sum = 0, alt = false;
  for (let i = n.length - 1; i >= 0; i--){ let d = +n[i]; if (alt){ d *= 2; if (d > 9) d -= 9; } sum += d; alt = !alt; }
  return sum % 10 === 0;
}
function formatNum(num){
  const n = digits(num);
  if (brandOf(n) === "amex") return [n.slice(0,4), n.slice(4,10), n.slice(10,15)].filter(Boolean).join(" ");
  return n.replace(/(.{4})/g, "$1 ").trim();
}
const last4 = (num) => digits(num).slice(-4);
function isExpired(c){
  if (!c || !c.expM || !c.expY) return false;
  const now = new Date();
  const y = +c.expY, m = +c.expM;
  return y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth() + 1);
}
const expStr = (c) => c.expM && c.expY ? `${String(c.expM).padStart(2,"0")}/${String(c.expY).slice(-2)}` : "--/--";

/* ---------- state ---------- */
let S = null;        // decrypted vault
let KEY = null;      // AES key (in memory only while unlocked)
let VAULT = null;    // latest encrypted record
let STORAGE_OK = true;
let DL = null;       // downloads capability
const UI = { view:"orders", group:"all", store:"all", orderStage:"all", q:"", selected:new Set(), cardSel:new Set(), reveal:new Set(), closed:new Set() };
let lastActive = Date.now();

function blankState(){ return { v:1, settings:{autoLockMin:15, keepEmails:true, autoAdd:false}, groups:[], addresses:[], cards:[], profiles:[], logins:[], inboxes:[], checkouts:[], orders:[], caps:{}, slots:[], subs:{}, lastBatch:[], submitTo:null, submitName:"" }; }
function sanitizeState(s){
  const b = blankState();
  if (!s || typeof s !== "object") return b;
  return {
    v:1,
    settings: Object.assign({}, b.settings, s.settings || {}),
    groups: Array.isArray(s.groups) ? s.groups : [],
    addresses: Array.isArray(s.addresses) ? s.addresses : [],
    cards: Array.isArray(s.cards) ? s.cards : [],
    profiles: (Array.isArray(s.profiles) ? s.profiles : []).map(p => {
      if (!Array.isArray(p.stores)){
        const src = Array.isArray(s.logins) ? s.logins : [];
        p.stores = (Array.isArray(p.loginIds) ? p.loginIds : []).map(id => src.find(l => l.id === id)).filter(Boolean)
          .map(l => ({store:l.store, storeName:l.storeName || "", mode:"login", loginId:l.id, email:"", verified:false}));
      }
      delete p.loginIds; return p;
    }),
    logins: Array.isArray(s.logins) ? s.logins : [],
    checkouts: Array.isArray(s.checkouts) ? s.checkouts : [],
    orders: Array.isArray(s.orders) ? s.orders : [],
    caps: s.caps && typeof s.caps === "object" ? s.caps : {},
    slots: Array.isArray(s.slots) ? s.slots : [],
    subs: s.subs && typeof s.subs === "object" ? s.subs : {},
    lastBatch: Array.isArray(s.lastBatch) ? s.lastBatch : [],
    submitTo: s.submitTo && s.submitTo.pub ? s.submitTo : null,
    submitName: typeof s.submitName === "string" ? s.submitName : "",
    inboxes: Array.isArray(s.inboxes) ? s.inboxes : [],
    share: s.share && s.share.pub && s.share.priv ? s.share : null
  };
}

/* ---------- storage + crypto ---------- */
function readStore(){
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ STORAGE_OK = false; return null; }
}
function writeStore(rec){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(rec)); STORAGE_OK = true; return true; }
  catch(e){ STORAGE_OK = false; return false; }
}
function clearStore(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }

async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function sealState(key, meta, state){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(state)));
  return { format:"profile-vault-backup", v:1, kdf:"PBKDF2-SHA256", iter:meta.iter, salt:meta.salt, iv:toB64(iv), ct:toB64(ct), savedAt:new Date().toISOString() };
}
async function openRecord(rec, pw){
  const key = await deriveKey(pw, fromB64(rec.salt), rec.iter || ITER);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(rec.iv)}, key, fromB64(rec.ct));
  return { key, state: sanitizeState(JSON.parse(dec.decode(pt))) };
}
function validRecord(r){ return r && typeof r === "object" && typeof r.salt === "string" && typeof r.iv === "string" && typeof r.ct === "string"; }

let saveChain = Promise.resolve();
function persist(){
  if (!S || !KEY || !VAULT) return;
  const key = KEY, meta = {iter:VAULT.iter, salt:VAULT.salt};
  saveChain = saveChain.then(async () => {
    if (!S || KEY !== key) return;
    const rec = await sealState(key, meta, S);
    VAULT = rec;
    if (!writeStore(rec)) showStorageBanner();
  }).catch(() => toast("Couldn't save changes. Download an encrypted backup from Settings.", "err"));
  return saveChain;
}
function showStorageBanner(){ const b = $("#storage-banner"); if (b) b.hidden = STORAGE_OK; }

/* ---------- downloads capability ---------- */
try {
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(d => { DL = d || null; }).catch(() => { DL = null; });
  }
} catch(e){}
function blobSave(filename, data){
  try {
    const type = /\.csv$/.test(filename) ? "text/csv" : /\.json$/.test(filename) ? "application/json" : "text/plain";
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Saved " + filename); return true;
  } catch(e){ toast("Couldn't save the file. Use Copy instead.", "err"); return false; }
}
const IS_LOCAL = /^file:$/.test(location.protocol) || !window.claude;
async function saveFile(filename, data){
  if (!DL){ if (IS_LOCAL) return blobSave(filename, data); toast("Downloads aren't available here. Use Copy instead.", "err"); return false; }
  try { await DL.save({filename, data}); toast("Downloaded " + filename); return true; }
  catch(e){
    const code = e && e.code;
    if (code === "declined") return false;
    if (code === "rate_limited") { toast("A download prompt is already open."); return false; }
    toast("Couldn't download the file. Use Copy instead.", "err"); return false;
  }
}
async function copyText(text, what){
  try { await navigator.clipboard.writeText(text); toast("Copied " + what); return true; }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove();
    toast(ok ? "Copied " + what : "Copy was blocked by the browser.", ok ? "" : "err");
    return ok;
  }
}

/* ---------- toasts ---------- */
function toast(msg, type){
  const t = document.createElement("div");
  t.className = "toast" + (type === "err" ? " err" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);

/* ================= LOCK SCREEN ================= */
function renderLock(msg){
  closeAllLayers();
  MODE = "vault"; SUB = null;
  const rec = readStore();
  const creating = !validRecord(rec);
  const noCrypto = !(window.crypto && crypto.subtle);
  $("#app").innerHTML = `<main class="lock"><div class="lock-inner">
    ${msg ? `<p class="lock-msg">${esc(msg)}</p>` : ""}
    <form class="lock-label" id="lock-form" autocomplete="on">
      <h1 class="wordmark">Profile Vault</h1>
      <div>Checkout profiles, addresses and cards</div>
      <div class="lock-rule"></div>
      ${noCrypto ? `<p>This browser can't encrypt data on this page, so the vault can't open here. Try a current version of Chrome, Safari, Edge or Firefox.</p>` :
      creating ? `
        <p>Create a master password. Everything you add is encrypted with it and stays on this device. It can't be recovered, so store it in your password manager.</p>
        <input class="sr" type="text" name="username" autocomplete="username" value="Profile Vault" tabindex="-1" aria-hidden="true">
        <div class="field" style="margin-bottom:12px"><label for="pw1">Master password</label><input id="pw1" type="password" autocomplete="new-password" required><span class="hint">Any password you like. Longer ones are harder for someone else to guess.</span></div>
        <div class="field" style="margin-bottom:16px"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required></div>
        <div class="field"><span class="err" id="lock-err" role="alert"></span></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px" id="lock-go">Create vault</button>` : `
        <p>Enter your master password to unlock.</p>
        <input class="sr" type="text" name="username" autocomplete="username" value="Profile Vault" tabindex="-1" aria-hidden="true">
        <div class="field" style="margin-bottom:12px"><label for="pw1">Master password</label><input id="pw1" type="password" autocomplete="current-password" required></div>
        <div class="field"><span class="err" id="lock-err" role="alert"></span></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px" id="lock-go">Unlock</button>`}
    </form>
    ${noCrypto ? "" : `${RT.config && !RT.isOwner ? `<button class="btn btn-primary" type="button" id="lock-inbox" style="width:100%;justify-content:center;margin-top:12px">Send profiles to this vault</button>` : ""}
    <button class="btn" type="button" id="lock-submit" style="width:100%;justify-content:center;margin-top:12px">I was sent a code</button>
    <div class="lock-foot">
      <button class="link" type="button" id="lock-restore">Restore a backup</button>
      ${creating ? "" : `<button class="link link-danger" type="button" id="lock-erase">Forgot it? Erase vault</button>`}
    </div>`}
  </div></main>`;
  if (noCrypto) return;
  const pw1 = $("#pw1"); setTimeout(() => pw1 && pw1.focus(), 30);
  $("#lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (S) return;
    const err = $("#lock-err"), go = $("#lock-go");
    err.textContent = "";
    const pw = pw1.value;
    if (creating){
      if (!pw){ err.textContent = "Enter a password."; return; }
      if (pw !== $("#pw2").value){ err.textContent = "The passwords don't match."; return; }
      go.disabled = true; go.textContent = "Creating…";
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        KEY = await deriveKey(pw, salt, ITER);
        S = blankState();
        VAULT = await sealState(KEY, {iter:ITER, salt:toB64(salt)}, S);
        writeStore(VAULT);
        startApp();
      } catch(ex){ go.disabled = false; go.textContent = "Create vault"; err.textContent = "Couldn't create the vault in this browser."; }
    } else {
      go.disabled = true; go.textContent = "Unlocking…";
      try {
        const r = await openRecord(rec, pw);
        if (S) return; // auto-unlock got there first
        KEY = r.key; S = r.state; VAULT = rec;
        startApp();
      } catch(ex){ if (S) return; go.disabled = false; go.textContent = "Unlock"; err.textContent = "That password doesn't open this vault."; pw1.select(); }
    }
  });
  if (!creating){
    let autoSeq = 0, autoTimer = null;
    const tryAuto = () => {
      clearTimeout(autoTimer);
      const pw = pw1.value;
      if (!pw) return;
      autoTimer = setTimeout(async () => {
        const seq = ++autoSeq;
        try {
          const r = await openRecord(rec, pw);
          // Ignore results for text that's no longer in the box, or if already open.
          if (seq !== autoSeq || pw1.value !== pw || S) return;
          KEY = r.key; S = r.state; VAULT = rec;
          startApp();
        } catch(ex){ /* wrong so far: stay quiet while typing */ }
      }, 300);
    };
    pw1.addEventListener("input", tryAuto);
    // Browser or password-manager autofill may fill the box before we're listening.
    if (pw1.value) tryAuto();
  }
  $("#lock-restore").addEventListener("click", () => openRestore(false));
  $("#lock-submit").addEventListener("click", openSubmitStart);
  const li = $("#lock-inbox");
  if (li) li.addEventListener("click", () => startSubmit({pub:RT.config.pub, keyId:RT.config.keyId, viaDb:true}));
  const er = $("#lock-erase");
  if (er) er.addEventListener("click", async () => {
    const ok = await confirmDialog({title:"Erase vault?", body:"This deletes every profile, address and card stored on this device. It can't be undone.", confirm:"Erase vault", danger:true, typeWord:"ERASE"});
    if (ok){ clearStore(); renderLock("Vault erased. Create a new master password to start over."); }
  });
}

function lock(msg){
  S = null; KEY = null; UI.selected.clear(); UI.reveal.clear(); UI.q = "";
  renderLock(msg || "Locked.");
}

    const SAMPLE = new Set(["bb9bcb89", "29154d1f", "bc669c59", "de79dc26", "1118ea27", "908b1f8a", "402a362f"]);

/* ================= LAYERS ================= */
const stack = [];
function openLayer(o){
  const el = document.createElement("div");
  el.className = `layer layer-${o.kind || "modal"}${o.small ? " is-small" : ""}${o.wide ? " is-wide" : ""}`;
  const tid = "t" + uid().slice(0,8);
  el.innerHTML = `<div class="scrim"></div><section class="panel" role="dialog" aria-modal="true" aria-labelledby="${tid}">
    <div class="panel-head"><h2 id="${tid}">${esc(o.title)}</h2><button class="icon-btn" data-close aria-label="Close">${ic("x")}</button></div>
    <div class="panel-body">${o.body || ""}</div>
    ${o.foot ? `<div class="panel-foot">${o.foot}</div>` : ""}
  </section>`;
  $("#layers").appendChild(el);
  const entry = { el, prev: document.activeElement, onClose: o.onClose, dismiss: o.dismiss !== false };
  stack.push(entry);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("is-open")));
  const close = (val) => {
    const i = stack.indexOf(entry); if (i === -1) return;
    stack.splice(i, 1);
    el.classList.remove("is-open");
    setTimeout(() => el.remove(), 200);
    if (entry.prev && entry.prev.focus && document.contains(entry.prev)) entry.prev.focus();
    if (entry.onClose) entry.onClose(val);
  };
  entry.close = close;
  el.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) close();
    else if (e.target.classList.contains("scrim") && entry.dismiss) close();
  });
  const panel = $(".panel", el);
  if (o.mount) o.mount(panel, close);
  setTimeout(() => {
    const f = $("[autofocus]", panel) || $("input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea", panel) || $(".panel-foot .btn-primary", panel) || $("[data-close]", panel);
    if (f) f.focus();
  }, 60);
  return { el, panel, close };
}
function closeAllLayers(){ while (stack.length) stack[stack.length-1].close(); closeMenu(); }

function confirmDialog(o){
  return new Promise((resolve) => {
    let done = false;
    openLayer({
      title:o.title, small:true,
      body:`<p style="margin:0 0 ${o.typeWord ? "14px" : "0"};color:var(--ink-2)">${esc(o.body)}</p>${o.typeWord ? `<div class="field"><label for="cw">Type ${esc(o.typeWord)} to confirm</label><input id="cw" autocomplete="off"></div>` : ""}`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn ${o.danger ? "btn-danger-solid" : "btn-primary"}" id="cf-go" ${o.typeWord ? "disabled" : ""}>${esc(o.confirm || "Confirm")}</button>`,
      onClose:() => { if (!done) resolve(false); },
      mount:(panel, close) => {
        const go = $("#cf-go", panel), cw = $("#cw", panel);
        if (cw) cw.addEventListener("input", () => { go.disabled = cw.value.trim() !== o.typeWord; });

}

/* ---------- menu ---------- */
let menuEl = null;
function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } }
function openMenu(anchor, items){
  closeMenu();
  menuEl = document.createElement("div");
  menuEl.className = "menu"; menuEl.setAttribute("role","menu");
  menuEl.innerHTML = items.map((it, i) => `<button role="menuitem" data-i="${i}" class="${it.danger ? "danger" : ""}">${ic(it.icon)}${esc(it.label)}</button>`).join("");
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let left = Math.min(r.right - mw, window.innerWidth - mw - 8); left = Math.max(8, left);
  let top = r.bottom + 4; if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menuEl.style.left = left + "px"; menuEl.style.top = top + "px";
  menuEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const it = items[+b.dataset.i]; closeMenu(); it.run();
  });
  const first = $("button", menuEl); if (first) first.focus();
}

function parseCardLines(text){
  const rows = [], bad = [];
  String(text || "").split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const n = i + 1;
    let cells = (parseCSV(line)[0] || []).map(x => x.trim());
    if (cells.length < 2) cells = line.split(/[|:\t]/).map(x => x.trim());
    if (i === 0 && cells.some(x => /card ?num|pan/i.test(x)) && !/^\d[\d ]{10,}$/.test(cells[0])) return;
    const numIx = cells.findIndex(x => digits(x).length >= 12 && digits(x).length <= 19 && /^[\d \-]+$/.test(x));
    if (numIx === -1){ bad.push(n); return; }
    const number = digits(cells[numIx]);
    const rest = cells.filter((x, k) => k !== numIx);
    let expM = "", expY = "", cvv = "", nick = "";
    rest.forEach(x => {
      const m = x.replace(/\s/g, "").match(/^(\d{1,2})[\/\-.](\d{2}|\d{4})$/);
      if (m && !expM){ expM = String(+m[1]).padStart(2,"0"); expY = m[2].length === 2 ? "20" + m[2] : m[2]; return; }
      if (/^\d{3,4}$/.test(x) && !cvv && !(m)){ cvv = x; return; }
      if (!/^\d+$/.test(x) && !nick) nick = x;
    });
    if (!expM){
      const mo = rest.find(x => /^\d{1,2}$/.test(x) && +x >= 1 && +x <= 12);
      const yr = rest.find(x => /^(20)?\d{2}$/.test(x) && +x.slice(-2) > 25);
      if (mo && yr){ expM = String(+mo).padStart(2,"0"); expY = yr.length === 2 ? "20" + yr : yr; }
    }
    if (!expM || !expY || !cvv){ bad.push(n); return; }
    rows.push({number, expM, expY, cvv, nick, line:n});
  });
  return {rows, bad};
}

const CARD_TYPE = {visa:"Visa", mastercard:"Mastercard", amex:"American Express", discover:"Discover", jcb:"JCB", diners:"Diners Club", unionpay:"UnionPay"};
const CARD_CSV_COLS = ["Category","Provider","Provider Card","Card Description","Name on Card","Card Number","Expiration Month","Expiration Year","Card CVV","Card Type","Website","Source","Notes","Card State"];
function toCardsCSV(cards){
  const cell = (v) => { const t = String(v == null ? "" : v); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const rows = cards.map(c => {
    const users = S.profiles.filter(p => p.cardId === c.id).map(p => p.name).join("; ");
    return [
      c.virtual ? "Virtual" : "Physical",
      c.virtual ? vcName(c.vprovider) : "",
      c.vfunding || "",
      c.nick || "",
      c.holder || "",
      digits(c.number),
      c.expM ? String(+c.expM) : "",
      c.expY || "",
      c.cvv || "",
      c.redcard ? "Target RedCard" : (CARD_TYPE[brandOf(c.number)] || ""),
      c.vmerchant || "",
      users,
      c.vlimit ? "Limit " + c.vlimit : "",
      isExpired(c) ? "Expired" : "Active"
    ].map(cell).join(",");
  });
  return [CARD_CSV_COLS.join(",")].concat(rows).join("\r\n");
}

function nextProfileName(){
  const names = new Set(S.profiles.map(p => norm(p.name)));
  let n = S.profiles.length + 1;
  while (names.has(norm("Profile " + n))) n++;
  return "Profile " + n;
}
const ADDR_F = ["first","last","line1","line2","city","state","zip","country"];
const addrKey = (x) => ADDR_F.map(k => norm(x[k])).join("|");
const cardKey = (x) => [digits(x.number), String(+x.expM || ""), String(x.expY || ""), norm(x.holder), digits(x.cvv), x.redcard ? 1 : 0].join("|");
function parseExp(s){
  const m = String(s || "").trim().match(/^(\d{1,2})\s*\/\s*(\d{2}|\d{4})$/);
  if (!m) return null;
  const mo = +m[1]; if (mo < 1 || mo > 12) return null;
  return { expM:String(mo).padStart(2,"0"), expY:m[2].length === 2 ? "20" + m[2] : m[2] };
}
function validateCard(c){
  const err = {};
  const b = brandOf(c.number);
  if (!c.number) err.number = "Enter the card number.";
  else if (c.redcard){ if (c.number.length < 12) err.number = "This number looks too short."; }
  else if (!["visa","mastercard","amex","discover"].includes(b)) err.number = "Use a Visa, Mastercard, Amex or Discover card.";
  else if (!luhn(c.number)) err.number = "This number doesn't look right. Check for a typo.";
  const cl = b === "amex" && !c.redcard ? 4 : 3;
  if (c.redcard){ if (c.cvv && !/^\d{3,4}$/.test(c.cvv)) err.cvv = "Use 3 or 4 digits, or leave it blank."; }
  else if (c.cvv.length !== cl) err.cvv = `Enter ${cl} digits.`;
  return err;
}
function attachNumberFormat(num){
  num.addEventListener("input", () => {
    const pos = num.selectionStart || 0;
    const before = digits(num.value.slice(0, pos)).length;
    const f = formatNum(digits(num.value).slice(0, 19)); num.value = f;
    let p = 0, seen = 0; while (p < f.length && seen < before){ if (/\d/.test(f[p])) seen++; p++; }
    try { num.setSelectionRange(p, p); } catch(e){}
  });
}

function readAddrP(panel, pfx){ const a = {}; ADDR_F.forEach(k => a[k] = val(panel, pfx + k)); return a; }
function checkAddrP(panel, pfx, a){
  let bad = false;
  const need = {first:"Enter a first name.", last:"Enter a last name.", line1:"Enter a street address.", city:"Enter a city."};
  Object.keys(need).forEach(k => { const e = a[k] ? "" : need[k]; setErr(panel, pfx + k, e); if (e) bad = true; });
  if ((a.country === "US" || a.country === "CA") && !a.state){ setErr(panel, pfx + "state", "Choose one."); bad = true; } else setErr(panel, pfx + "state", "");
  let ze = "";
  if (!a.zip && a.country !== "HK" && a.country !== "AE") ze = "Enter a ZIP or postal code.";
  else if (a.country === "US" && a.zip && !/^\d{5}(-?\d{4})?$/.test(a.zip)) ze = "Use 5 digits, or ZIP+4.";
  setErr(panel, pfx + "zip", ze); if (ze) bad = true;
  return bad;
}
function resolveAddr(fields, linkedId, selfId, avoidId){
  const k = addrKey(fields);
  const match = S.addresses.find(x => addrKey(x) === k);
  if (match) return match.id;
  const linked = addrById(linkedId);
  if (linked && linkedId !== avoidId && !S.profiles.some(q => q.id !== selfId && (q.shipId === linkedId || (!q.billSame && q.billId === linkedId)))){
    ADDR_F.forEach(x => linked[x] = fields[x]); return linked.id;
  }
  const a = Object.assign({id:uid(), createdAt:Date.now(), nick:""}, fields); S.addresses.push(a); return a.id;
}
function resolveCard(fields, linkedId, selfId){
  const k = cardKey(fields);
  const match = S.cards.find(x => cardKey(x) === k);
  if (match){ match.finish = fields.finish; if (fields.nick) match.nick = fields.nick; return match.id; }
  const linked = cardById(linkedId);
  if (linked && !S.profiles.some(q => q.id !== selfId && q.cardId === linkedId)){ Object.assign(linked, fields); return linked.id; }
  const c = Object.assign({id:uid(), createdAt:Date.now()}, fields); S.cards.push(c); return c.id;
}

function duplicateProfile(p){

  else { name = p.name + " copy"; let i = 2; while (names.has(norm(name))) name = `${p.name} copy ${i++}`; }

const CSV_COLS = ["profile_name","group","email","phone","ship_nickname","ship_first_name","ship_last_name","ship_address1","ship_address2","ship_city","ship_state","ship_zip","ship_country","billing_same_as_shipping","bill_nickname","bill_first_name","bill_last_name","bill_address1","bill_address2","bill_city","bill_state","bill_zip","bill_country","card_nickname","card_holder","card_number","card_exp_month","card_exp_year","card_cvv","card_is_redcard"];
const ADDR_KEYS = ["nickname","firstName","lastName","address1","address2","city","state","zip","country"];
const CSV_ADDR = ["nickname","first_name","last_name","address1","address2","city","state","zip","country"];
function toCSV(list){
  const cell = (v) => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const slugOf = (lg) => lg.storeId && lg.storeId !== "other" ? lg.storeId : (norm(lg.store).replace(/[^a-z0-9]+/g, "") || "other");
  const slugs = [];
  list.forEach(f => (f.logins || []).forEach(lg => { const x = slugOf(lg); if (!slugs.includes(x)) slugs.push(x); }));
  const LC = ["store","account_label","account_email","account_password","imap_email","imap_password","imap_provider","imap_host","imap_port"];
  const rows = list.map(f => {
    const s = f.shipping || {}, b = f.billing || {}, c = f.card || {};
    const lcells = [].concat(...slugs.map(x => { const lg = (f.logins || []).find(y => slugOf(y) === x); if (!lg) return LC.map(() => ""); const i = lg.imap || {}; return [lg.store, lg.label, lg.email, lg.password, i.email, i.password, i.provider, i.host, i.port]; }));
    return [f.name, f.group, f.email, f.phone].concat(ADDR_KEYS.map(k => s[k]||""), [f.billingSameAsShipping ? "true" : "false"], ADDR_KEYS.map(k => b[k]||""), [c.nickname, c.holder, c.number, c.expMonth, c.expYear, c.cvv, c.isRedCard ? "true" : "false"], lcells).map(cell).join(",");
  });
  return [CSV_COLS.concat(...slugs.map(x => LC.map(k => x + "_" + k))).join(",")].concat(rows).join("\r\n");
}
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
