    if (!o || !o.email) return null;
    const st = STORES.find(x => x[0] !== "other" && (x[0] === o.storeId || norm(x[1]) === norm(o.store)));
    const l = {store:st ? st[0] : "other", storeName:st ? "" : String(o.store || o.storeId || "Other").trim(), label:String(o.label || "").trim(), email:String(o.email).trim(), password:String(o.password || "")};
    const k = storeKeyOf(l) + "|" + norm(l.email);
    if (loginMap.has(k)) return loginMap.get(k);
    l.inboxId = mkInbox(o.imap); l.id = uid(); l.createdAt = Date.now(); loginMap.set(k, l.id); plan.logins.push(l); return l.id;
  };
  const mkAddr = (o) => {
    if (!o) return null;
    const a = {nick:String(o.nickname||"").trim(), first:String(o.firstName||"").trim(), last:String(o.lastName||"").trim(), line1:String(o.address1||"").trim(), line2:String(o.address2||"").trim(), city:String(o.city||"").trim(), state:String(o.state||"").trim(), zip:String(o.zip||"").trim(), country:String(o.country||"US").trim().toUpperCase() || "US"};
    const CAL = {"USA":"US","UNITED STATES OF AMERICA":"US","U.S.":"US","U.S.A.":"US","UK":"GB","GREAT BRITAIN":"GB","ENGLAND":"GB","SCOTLAND":"GB","WALES":"GB"};
    if (CAL[a.country]) a.country = CAL[a.country];
    if (a.country.length !== 2){ const m = COUNTRIES.find(c => norm(c[1]) === norm(a.country)); a.country = m ? m[0] : "US"; }
    if ((a.country === "US" || a.country === "CA") && a.state.length > 2){ const m = (a.country === "US" ? US_STATES : CA_PROVINCES).find(s => norm(s[1]) === norm(a.state)); if (m) a.state = m[0]; }
    else if (a.state.length === 2) a.state = a.state.toUpperCase();
    if (!a.line1) return null;
    const k = aKey(a);
    if (addrMap.has(k)) return addrMap.get(k);
    a.id = uid(); a.createdAt = Date.now(); addrMap.set(k, a.id); plan.addresses.push(a); return a.id;
  };
  const mkCard = (o) => {
    if (!o || !digits(o.number)) return null;
    if (/e\+?\d/i.test(String(o.number))){ plan.rounded++; return null; }
    let y = String(o.expYear||"").trim(); if (/^\d{2}$/.test(y)) y = "20" + y;
    const c = {nick:String(o.nickname||"").trim(), holder:String(o.holder||o.name||"").trim(), number:digits(o.number), expM:String(+o.expMonth||"").padStart(2,"0").replace(/^0*$/, ""), expY:y, cvv:digits(o.cvv), redcard:!!(o.isRedCard || o.redcard || o.brand === "redcard"), virtual:!!o.virtual, vprovider:VC_PROVIDERS.some(p => p[0] === o.vProvider) ? o.vProvider : (o.virtual ? "other" : ""), vfunding:String(o.vFunding || ""), vmerchant:String(o.vMerchant || ""), vlimit:String(o.vLimit || ""), finish:(S.cards.length + plan.cards.length) % FINISHES.length};
    const k = cKey(c);
    if (cardMap.has(k)) return cardMap.get(k);
    c.id = uid(); c.createdAt = Date.now(); cardMap.set(k, c.id); plan.cards.push(c); return c.id;
  };
  const existing = new Set(S.profiles.map(p => [norm(p.name), p.shipId, p.cardId].join("|")));
  let autoN = S.profiles.length;
  flat.forEach(f => {
    if (!f || typeof f !== "object" || (!String(f.name||"").trim() && !f.shipping && !f.card)){ plan.invalid++; return; }
    if (!String(f.name||"").trim()){
      const sn = f.shipping ? [f.shipping.firstName, f.shipping.lastName].filter(Boolean).join(" ") : "";
      f.name = sn || "Profile " + (++autoN); plan.named++;
    }
    if (f.card && !String(f.card.holder || "").trim() && f.shipping) f.card = Object.assign({}, f.card, {holder:[f.shipping.firstName, f.shipping.lastName].filter(Boolean).join(" ")});
    const shipId = mkAddr(f.shipping);
    const billSame = f.billingSameAsShipping !== false || !f.billing;
    const billId = billSame ? null : mkAddr(f.billing);
    const cardId = mkCard(f.card);
    const seenStore = new Set(), stores = [];
    const addStore = (o, mode, email, verified) => {
      const st = STORES.find(x => x[0] !== "other" && (x[0] === o.storeId || norm(x[1]) === norm(o.store)));
      const e = {store:st ? st[0] : "other", storeName:st ? "" : String(o.store || o.storeId || "Other").trim()};
      const k = storeKeyOf(e); if (seenStore.has(k)) return null;
      seenStore.add(k);
      e.mode = mode || defaultMode(k); e.loginId = null; e.email = email || ""; e.verified = !!verified;
      stores.push(e); return e;
    };
    (Array.isArray(f.retailers) ? f.retailers : []).forEach(r => {
      if (!r || typeof r !== "object") return;
      const e = addStore(r, r.mode, r.email, r.verified); if (!e) return;
      if (e.mode !== "email") e.loginId = mkLogin(r.login || null);
    });
    (Array.isArray(f.logins) ? f.logins : []).forEach(lg => {
      if (!lg || typeof lg !== "object") return;
      const e = addStore(lg, "login"); if (!e) return;
      e.loginId = mkLogin(lg);
    });
    stores.forEach(e => { if (e.mode === "login" && !e.loginId) e.mode = defaultMode(storeKeyOf(e)); if (e.mode === "email" && !e.email) e.email = String(f.email || "").trim(); });
    let groupId = null;
    const gn = String(f.group||"").trim();
    if (gn){ const k = norm(gn); if (!groupMap.has(k)){ const g = {id:uid(), name:gn}; groupMap.set(k, g.id); plan.groups.push(g); } groupId = groupMap.get(k); }
    const name = String(f.name).trim();
    const sig = [norm(name), shipId, cardId].join("|");
    if (existing.has(sig)){ plan.skipped++; return; }
    existing.add(sig);
    const pid = uid();
    (Array.isArray(f.checkouts) ? f.checkouts : []).forEach(co => {
      if (!co || typeof co !== "object") return;
      const st = STORES.find(x => x[0] !== "other" && (x[0] === co.storeId || norm(x[1]) === norm(co.store)));
      plan.checkouts.push({id:uid(), createdAt:Date.now(), profileId:pid, profileName:name,
        store:st ? st[0] : "other", storeName:st ? "" : String(co.store || co.storeId || "Other").trim(),
        item:String(co.item || ""), qty:String(co.qty || "1"), price:String(co.price || ""), at:String(co.date || co.at || ""), orderNo:String(co.orderNo || ""), note:String(co.note || "")});
    });
    plan.profiles.push({id:pid, name, groupId, email:String(f.email||"").trim(), phone:String(f.phone||"").trim(), shipId, billSame, billId, cardId, stores, createdAt:Date.now(), updatedAt:Date.now()});
  });
  return plan;
}

/* ================= BULK ACCOUNTS ================= */
const isEmailish = (s) => /^[^\s@:,]+@[^\s@:,]+\.[^\s@:,]+$/.test(String(s || "").trim());
function parseAccountLines(text){
  const rows = [], bad = [];
  String(text || "").split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const n = i + 1;
    const parts = line.split(":");
    if (parts.length >= 4 && isEmailish(parts[0])){
      for (let k = 2; k < parts.length - 1; k++){
        if (isEmailish(parts[k])){
          const pw = parts.slice(1, k).join(":"), ip = parts.slice(k + 1).join(":");
          if (pw && ip){ rows.push({email:parts[0].trim(), password:pw, imapEmail:parts[k].trim(), imapPassword:ip, line:n}); return; }
          break;
        }
      }
    }
    const cells = (parseCSV(line)[0] || []).map(c => c.trim());
    if (i === 0 && /^e-?mail/i.test(cells[0] || "") && !isEmailish(cells[0])) return;
    if (cells.length >= 2 && isEmailish(cells[0]) && cells[1]){
      if (!cells[2] && !cells[3]){ rows.push({email:cells[0], password:cells[1], line:n}); return; }
      if (isEmailish(cells[2]) && cells[3]){ rows.push({email:cells[0], password:cells[1], imapEmail:cells[2], imapPassword:cells[3], line:n}); return; }
    }
    bad.push(n);
  });
  return {rows, bad};
}
function lineList(ns){ return ns.length > 8 ? ns.slice(0, 8).join(", ") + ` and ${ns.length - 8} more` : ns.join(", "); }

/* ================= AYCD + SPREADSHEET PROFILES ================= */
function aycdAddr(a){
  if (!a || typeof a !== "object") return null;
  const nm = String(a.name || "").trim().split(/\s+/);
  const first = a.firstName || nm.shift() || "", last = a.lastName || nm.join(" ");
  const o = {nickname:"", firstName:first, lastName:last, address1:a.line1 || a.address1 || a.address || "", address2:[a.line2 || a.address2, a.line3].filter(Boolean).join(" "), city:a.city || "", state:a.state || a.province || "", zip:a.postCode || a.zip || a.zipCode || a.postalCode || "", country:a.country || a.countryCode || ""};
  return (o.address1 || o.firstName) ? o : null;
}
function aycdToFlat(list){
  return list.map(x => {
    if (!x || typeof x !== "object") return null;
    const sh = aycdAddr(x.shippingAddress), bi = aycdAddr(x.billingAddress), pd = x.paymentDetails || {};
    const ship = sh || bi;
    const same = x.sameBillingAndShippingAddress === true || !bi || !sh;
    const src = x.shippingAddress || x.billingAddress || {};
    return {
      name:x.name || x.profileName || "", group:x.profileGroup || x.group || "",
      email:src.email || (x.billingAddress || {}).email || x.email || "", phone:src.phone || (x.billingAddress || {}).phone || x.phone || "",
      shipping:ship, billingSameAsShipping:same, billing:same ? null : bi,
      card:pd.cardNumber ? {holder:pd.nameOnCard || "", number:String(pd.cardNumber), expMonth:pd.cardExpMonth, expYear:pd.cardExpYear, cvv:pd.cardCvv, isRedCard:/redcard/i.test(pd.cardType || "")} : null
    };
  }).filter(Boolean);
}
const AYCD_TYPE = {visa:"Visa", mastercard:"MasterCard", amex:"Amex", discover:"Discover", jcb:"JCB", diners:"Diners Club", unionpay:"UnionPay"};
function toAycd(list){
  const place = (a) => {
    if (!a) return {name:"", email:"", phone:"", line1:"", line2:"", line3:"", postCode:"", city:"", country:"", state:""};
    const cn = (COUNTRIES.find(c => c[0] === a.country) || [a.country, a.country])[1];
    const sl = a.country === "US" ? US_STATES : a.country === "CA" ? CA_PROVINCES : null;
    const stn = sl ? (sl.find(x => x[0] === a.state) || [a.state, a.state])[1] : a.state;
    return {name:[a.firstName, a.lastName].filter(Boolean).join(" "), email:"", phone:"", line1:a.address1 || "", line2:a.address2 || "", line3:"", postCode:a.zip || "", city:a.city || "", country:cn || "", state:stn || ""};
  };
  return list.map(f => {
    const s = place(f.shipping), b = place(f.billingSameAsShipping ? f.shipping : f.billing), c = f.card || {};
    [s, b].forEach(x => { x.email = f.email || ""; x.phone = f.phone || ""; });
    return {name:f.name, size:"", profileGroup:f.group || "", billingAddress:b, shippingAddress:s,
      paymentDetails:{nameOnCard:c.holder || "", cardType:c.isRedCard ? "RedCard" : (AYCD_TYPE[c.brand] || ""), cardNumber:c.number || "", cardExpMonth:c.expMonth || "", cardExpYear:c.expYear || "", cardCvv:c.cvv || ""},
      sameBillingAndShippingAddress:!!f.billingSameAsShipping, onlyCheckoutOnce:false, matchNameOnCardAndAddress:false};
  });
}

const nh = (h) => String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const A_AL = {nickname:["nickname","label"], first:["firstname","fname","first","givenname"], last:["lastname","lname","last","surname","familyname"], full:["name","fullname"], line1:["address1","addressline1","address","line1","street","streetaddress","addr1","addr"], line2:["address2","addressline2","line2","apt","suite","unit","addr2","aptsuite"], line3:["address3","addressline3","line3"], city:["city","town"], state:["state","province","region","stateprovince","statecode"], zip:["zip","zipcode","postcode","postalcode","postal"], country:["country","countrycode"], email:["email","emailaddress"], phone:["phone","phonenumber","mobile","tel","telephone"]};
const C_AL = {nickname:["nickname","label"], number:["number","cardnumber","ccnumber","num","no","creditcard","creditcardnumber"], holder:["holder","name","nameoncard","cardholder","holdername","cardholdername","cardname"], expM:["expmonth","expirationmonth","month","expm","mm","expirymonth"], expY:["expyear","expirationyear","year","expy","yy","yyyy","expiryyear"], exp:["exp","expiration","expiry","expdate","expirationdate","expires","expirydate"], cvv:["cvv","cvc","cvv2","ccv","securitycode","code","csc"], type:["type","brand"], redcard:["isredcard","redcard"]};
const G_AL = {name:["profilename","profile","profiletitle","title"], group:["group","profilegroup","tag","category","folder"], email:["email","emailaddress"], phone:["phone","phonenumber","mobile","tel","telephone"], same:["billingsameasshipping","sameasshipping","samebilling","billingsame","samebillingandshippingaddress","sameaddress"]};
const C_LOOSE = new Set(["name","holder","nickname","label","type","no","num","number","code","month","year","mm","yy","yyyy"]);
const findAl = (T, h, skip) => { for (const k in T) for (const a of T[k]) if (a === h && !(skip && skip.has(a))) return k; return null; };
function mapHeader(raw){
  const low = String(raw || "").trim().toLowerCase();
  if (/_(account_email|account_password|account_label|imap_email|imap_password|imap_provider|imap_host|imap_port|store)$/.test(low)) return null;
  const h = nh(raw); if (!h) return null;
  let f = findAl(G_AL, h); if (f) return {sec:"g", f};
  if (h === "name" || h === "fullname") return {sec:"gname"};
  for (const [p, sec] of [["shipping","s"],["ship","s"],["delivery","s"],["billing","b"],["bill","b"],["payment","c"],["card","c"],["cc","c"],["credit","c"]]){
    if (h.startsWith(p) && h.length > p.length){
      const rest = h.slice(p.length);
      f = findAl(sec === "c" ? C_AL : A_AL, rest) || findAl(sec === "c" ? C_AL : A_AL, h);
      if (f) return {sec, f};
    }
  }
  f = findAl(C_AL, h, C_LOOSE); if (f) return {sec:"c", f};
  f = findAl(A_AL, h); if (f) return {sec:"s", f};
  return null;
}
function csvToFlat(text){
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("The CSV needs a header row and at least one profile.");
  const headRaw = rows[0], head = headRaw.map(h => h.trim().toLowerCase());
  const maps = headRaw.map(mapHeader);
  const ix = (k) => head.indexOf(k);
  const get = (r, k) => { const i = ix(k); return i === -1 ? "" : (r[i] || "").trim(); };
  const pfx = head.filter(h => h.endsWith("_account_email")).map(h => h.slice(0, -"_account_email".length));
  const logins = (r) => pfx.map(x => get(r, x + "_account_email") ? {store:get(r, x + "_store") || x, storeId:x, label:get(r, x + "_account_label"), email:get(r, x + "_account_email"), password:get(r, x + "_account_password"),
    imap: get(r, x + "_imap_email") ? {email:get(r, x + "_imap_email"), password:get(r, x + "_imap_password"), provider:get(r, x + "_imap_provider"), host:get(r, x + "_imap_host"), port:get(r, x + "_imap_port")} : null} : null).filter(Boolean);
  const has = (sec, f) => maps.some(m => m && m.sec === sec && (!f || m.f === f));
  if (!has("s","line1") && !has("b","line1") && !has("c","number")) throw new Error("Couldn't find address or card columns. The first row should have column names like Address 1, City, Zip and Card Number.");
  const hasPName = has("g","name"), hasFirst = has("s","first") || has("s","full");
  const flat = rows.slice(1).map(r => {
    const g = {}, s = {}, b = {}, c = {};
    maps.forEach((m, i) => {
      if (!m) return; const v = (r[i] || "").trim(); if (!v) return;
      if (m.sec === "gname"){ if (hasPName || hasFirst) s.full = s.full || v; else { g.name = g.name || v; s.full = s.full || v; } }
      else ({g, s, b, c})[m.sec][m.f] = ({g, s, b, c})[m.sec][m.f] || v;
    });
    const addr = (a) => {
      if (!a.line1 && !a.first && !a.full) return null;
      let first = a.first || "", last = a.last || "";
      if (!first && a.full){ const p = a.full.split(/\s+/); first = p.shift(); last = last || p.join(" "); }
      return {nickname:a.nickname || "", firstName:first, lastName:last, address1:a.line1 || "", address2:[a.line2, a.line3].filter(Boolean).join(" "), city:a.city || "", state:a.state || "", zip:a.zip || "", country:a.country || ""};
    };
    const ship = addr(s), bill = addr(b);
    let same = g.same != null ? !/^(false|no|n|0)$/i.test(g.same) : (!bill || !ship || addrKey({first:ship.firstName,last:ship.lastName,line1:ship.address1,line2:ship.address2,city:ship.city,state:ship.state,zip:ship.zip,country:ship.country}) === addrKey({first:bill.firstName,last:bill.lastName,line1:bill.address1,line2:bill.address2,city:bill.city,state:bill.state,zip:bill.zip,country:bill.country}));
    let expM = c.expM, expY = c.expY;
    if ((!expM || !expY) && c.exp){ const m = c.exp.replace(/\s/g, "").match(/^(\d{1,2})[\/\-.]?(\d{2}|\d{4})$/); if (m){ expM = m[1]; expY = m[2]; } }
    return {
      name:g.name || "", group:g.group || "", email:g.email || s.email || b.email || "", phone:g.phone || s.phone || b.phone || "",
      shipping:ship || bill, billingSameAsShipping:ship ? same : true, billing:ship && !same ? bill : null,
      card:c.number ? {nickname:c.nickname || "", holder:c.holder || "", number:c.number, expMonth:expM, expYear:expY, cvv:c.cvv || "", isRedCard:/^(true|yes|1)$/i.test(c.redcard || "") || /redcard/i.test(c.type || "")} : null,
      logins:logins(r)
    };
  });
  flat.used = headRaw.filter((h, i) => maps[i] || /_account_email$|_account_password$|_account_label$|_imap_\w+$|_store$/.test(head[i])).map(h => h.trim());
  flat.ignored = headRaw.filter((h, i) => !maps[i] && !flat.used.includes(h.trim()) && h.trim()).map(h => h.trim());
  flat.format = pfx.length || head.includes("profile_name") ? "Profile Vault CSV" : "CSV";
  return flat;
}
function jsonToFlat(text){
  let data; try { data = JSON.parse(text); } catch(e){ throw new Error("This isn't valid JSON."); }
  if (data && data.format === "profile-vault-backup") throw new Error("This is an encrypted backup. Restore it from Settings instead.");
  let list = Array.isArray(data) ? data : data && Array.isArray(data.profiles) ? data.profiles : null;
  if (!list && data && typeof data === "object"){ const vals = Object.values(data); if (vals.length && vals.every(v => v && typeof v === "object" && (v.paymentDetails || v.shippingAddress || v.billingAddress))) list = vals; }
  if (!list) throw new Error("Expected AYCD profiles or a Profile Vault export.");
  if (list.some(x => x && typeof x === "object" && (x.paymentDetails || x.shippingAddress || x.billingAddress))){ const r = aycdToFlat(list); r.format = "AYCD JSON"; return r; }
  list.format = "Profile Vault JSON";
  return list;
}

function openImport(){
  let plan = null;
  openLayer({
    title:"Import profiles",
    body:`<p style="margin:-4px 0 14px;color:var(--ink-2)">CSV (Google Sheets export), AYCD JSON, a Profile Vault export, or codes people sent you. Addresses, cards and logins you already have are reused, not duplicated.</p>
      <div class="dz dz-drop" id="im-dz" tabindex="0" role="button" aria-label="Choose a file to import">
        <input type="file" id="im-file" accept=".json,.csv,.txt,application/json,text/csv,text/plain" class="sr" tabindex="-1">
        ${ic("imp").replace("<svg", '<svg style="width:30px;height:30px"')}

        <div class="dz-sub">.csv and .json (AYCD or Profile Vault)</div>

        <span style="color:var(--ink-2)">Need a file to fill in? <button class="link" type="button" data-tpl="csv">CSV template</button> or <button class="link" type="button" data-tpl="aycd">AYCD JSON template</button></span>
      </div>
      <div class="field" id="im-paste" hidden style="margin-top:10px"><label for="im-text">Paste here</label><textarea id="im-text" spellcheck="false" placeholder="PVSUB1.…, AYCD JSON, or CSV with a header row"></textarea></div>
      <div class="section pe-sec" style="margin-top:18px"><div class="section-head"><h3>Retailers <span class="opt" style="font-weight:400;color:var(--ink-3);font-size:calc(14px*var(--fs))">(optional)</span></h3></div>
        <p class="item-sub" style="margin:-4px 0 10px">Pick stores to put every imported profile on. Profiles that already name their retailers keep them.</p>
        <div id="im-pills">${storePillsHTML(new Set(), {tagEmail:true})}</div>
      </div>
      <p class="err-line" id="im-err" role="alert"></p>
      <div id="im-sum"></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="im-go" disabled>Import</button>`,
    mount:(panel, close) => {
      const ta = $("#im-text", panel), go = $("#im-go", panel), err = $("#im-err", panel), sum = $("#im-sum", panel), dz = $("#im-dz", panel), fi = $("#im-file", panel);
      let seq = 0;
      const analyze = async () => {
        const my = ++seq;
        err.textContent = ""; sum.innerHTML = ""; plan = null; go.disabled = true; go.textContent = "Import";
        const t = ta.value.trim(); if (!t) return;
        try {
          let flat, senders = [], format;
          const codes = t.match(/PVSUB1\.[A-Za-z0-9_.-]+/g);
          if (codes){
            if (!S.share) throw new Error("Set up collecting in Settings, then send people your invite. Codes made for a different vault can't be opened here.");
            flat = [];
            for (const code of codes){
              const pl = await openSubmission(code, S.share.priv);
              if (pl.from && !senders.includes(pl.from)) senders.push(pl.from);
              (pl.profiles || []).forEach(f => { if (f && pl.from && !f.group) f.group = pl.from; flat.push(f); });
            }
            format = plural(codes.length, "code");
          } else { flat = /^[\[{]/.test(t) ? jsonToFlat(t) : csvToFlat(t); format = flat.format; }
          if (my !== seq) return;
          plan = planImport(flat);
          if (picked.length) plan.profiles.forEach(p => {
            if (p.stores && p.stores.length) return;
            p.stores = picked.map(o => { const k = storeKeyOf(o); const m = defaultMode(k);
              return {store:o.store, storeName:o.storeName || "", mode:m, loginId:null, email:m === "email" ? (p.email || "") : "", verified:false}; });
          });
          const n = plan.profiles.length;
          sum.innerHTML = `<div class="note" style="margin-top:12px"><strong style="color:var(--ink)">${n ? `Ready to import ${plural(n,"profile")}` : "Nothing new to import"}</strong> <span>from ${esc(format)}</span><ul class="summary-list">
            ${senders.length ? `<li>From ${esc(senders.join(", "))}, added to ${senders.length === 1 ? "a group" : "groups"} with their name</li>` : ""}
            <li>${plural(plan.addresses.length, "new address", "new addresses")}, ${plural(plan.cards.length, "new card")}${plan.logins.length ? `, ${plural(plan.logins.length, "new store login")}` : ""}${plan.inboxes.length ? `, ${plural(plan.inboxes.length, "new inbox", "new inboxes")}` : ""}${plan.checkouts.length ? `, ${plural(plan.checkouts.length, "checkout")}` : ""}${plan.groups.length ? `, ${plural(plan.groups.length, "new group")}` : ""}</li>
            ${picked.length ? `<li>Put on ${esc(picked.map(storeLabel).join(", "))} unless the file names its own retailers</li>` : ""}
            ${plan.named ? `<li>${plural(plan.named, "profile")} had no name and ${plan.named === 1 ? "was" : "were"} named after the shipping name</li>` : ""}
            ${plan.rounded ? `<li style="color:var(--danger)">${plural(plan.rounded, "card number")} ${plan.rounded === 1 ? "was" : "were"} rounded by the spreadsheet and left out. Format the card column as plain text and export again.</li>` : ""}
            ${plan.skipped ? `<li>${plural(plan.skipped, "profile")} already here, skipped</li>` : ""}
            ${plan.invalid ? `<li>${plural(plan.invalid, "row")} with no address or card, skipped</li>` : ""}
            ${flat.ignored && flat.ignored.length ? `<li>Columns not used: ${esc(flat.ignored.join(", "))}</li>` : ""}
          </ul></div>`;
          go.disabled = !n; if (n) go.textContent = `Import ${plural(n, "profile")}`;
        } catch(e){ if (my === seq) err.textContent = e.message || "Couldn't read that."; }
      };
      const loadFile = (f) => {
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { ta.value = String(r.result || ""); $("#im-fname", panel).textContent = f.name; analyze(); };
        r.onerror = () => { err.textContent = "Couldn't read that file."; };
        r.readAsText(f);
      };
      const imPills = $("#im-pills", panel);
      let picked = [];
      const drawPills = () => { imPills.innerHTML = storePillsHTML(new Set(picked.map(storeKeyOf)), {tagEmail:true, extra:picked}); };
      imPills.addEventListener("click", (e) => {
        const b = e.target.closest("[data-pick]"); if (!b) return;
        if (b.dataset.pick === "__new"){ askStoreName().then(o => { if (o && !picked.some(x => storeKeyOf(x) === storeKeyOf(o))){ picked.push(o); drawPills(); } }); return; }
        const o = {store:b.dataset.store, storeName:b.dataset.sname || ""}, k = storeKeyOf(o);
        picked = picked.some(x => storeKeyOf(x) === k) ? picked.filter(x => storeKeyOf(x) !== k) : picked.concat([o]);
        drawPills(); analyze();
      });
      let t0; ta.addEventListener("input", () => { clearTimeout(t0); t0 = setTimeout(analyze, 250); });
      dz.addEventListener("click", () => fi.click());
      dz.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fi.click(); } });
      fi.addEventListener("click", (e) => e.stopPropagation());
      fi.addEventListener("change", (e) => loadFile(e.target.files && e.target.files[0]));
      dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("is-over"); });
      dz.addEventListener("dragleave", () => dz.classList.remove("is-over"));
      dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("is-over"); loadFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
      $$("[data-tpl]", panel).forEach(bt => bt.addEventListener("click", () => {
        const sample = {name:"Profile 1", group:"Main", email:"jane@example.com", phone:"5550000000",
          shipping:{nickname:"", firstName:"Jane", lastName:"Doe", address1:"123 Main St", address2:"Apt 4", city:"Tampa", state:"FL", zip:"33601", country:"US"},
          billingSameAsShipping:true, billing:null,
          card:{nickname:"", holder:"Jane Doe", number:"4242424242424242", expMonth:"08", expYear:"2029", cvv:"123", brand:"visa", isRedCard:false},
          logins:[{store:"Target", storeId:"target", label:"Main", email:"jane@example.com", password:"account-password", imap:{email:"jane.codes@gmail.com", password:"app-password", provider:"gmail", host:"imap.gmail.com", port:"993"}}]};
        const csv = bt.dataset.tpl === "csv";
        const text = csv ? toCSV([sample]) : JSON.stringify(toAycd([sample]), null, 2);
        const name = csv ? "profile-vault-template.csv" : "aycd-profiles-template.json";
        if (DL) saveFile(name, text); else copyText(text, csv ? "CSV template" : "AYCD template");
      }));
      $("#im-ptog", panel).addEventListener("click", () => { const p = $("#im-paste", panel); p.hidden = !p.hidden; if (!p.hidden) ta.focus(); });
      go.addEventListener("click", () => {
        if (!plan || !plan.profiles.length) return;
        S.groups.push(...plan.groups); S.addresses.push(...plan.addresses); S.cards.push(...plan.cards); S.inboxes.push(...plan.inboxes); S.logins.push(...plan.logins); S.profiles.push(...plan.profiles); S.checkouts.push(...plan.checkouts);
        persist(); UI.view = "profiles"; UI.group = "all"; render();
        toast(`Imported ${plural(plan.profiles.length, "profile")}`); close();
      });
    }
  });
}

        ${fieldHTML({type:"select", name:"autolock", label:"Lock automatically after", options:opt([["5","5 minutes idle"],["15","15 minutes idle"],["30","30 minutes idle"],["60","1 hour idle"],["0","Never"]], String(S.settings.autoLockMin)), showOpt:false})}

        const on = !!RT.config;
        if (RT.db) box.insertAdjacentHTML("beforeend", `<div class="hazard" style="margin-top:14px"><h3>Inbox ${on ? "is on" : "is off"}</h3>
          <p>${on ? "People you share this page with see a Send button, and what they send lands in your Inbox, encrypted so only you can open it." : "Turn it on so people can send profiles straight to you, with no code to paste."} Share the page as \u201CCan interact\u201D; they need to be signed in to claude.ai.</p>

          const salt = crypto.getRandomValues(new Uint8Array(16));

function openRestore(unlocked){
  openLayer({
    title:"Restore a backup", dismiss:false,
    body:`<p style="margin:0 0 14px;color:var(--ink-2)">${unlocked ? "Restoring replaces everything in this vault with the backup. " : ""}Unlock it with the master password it was made with.</p>
      <div class="dz"><input type="file" id="rs-file" accept=".json,application/json" class="sr"><button class="btn" type="button" id="rs-pick">${ic("imp")}Choose backup file</button><div style="margin-top:8px" id="rs-fname">or paste it below</div></div>
      <div class="field" style="margin-top:14px"><label for="rs-text">Backup contents</label><textarea id="rs-text" spellcheck="false" placeholder='{"format":"profile-vault-backup", ...}'></textarea></div>
      <form id="rs-form" class="field" style="margin-top:12px"><label for="rs-pw">Backup's master password</label><input id="rs-pw" type="password" autocomplete="current-password"><span class="err" id="rs-err" role="alert"></span></form>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rs-go">Restore backup</button>`,
    mount:(panel, close) => {
      const ta = $("#rs-text", panel), err = $("#rs-err", panel), go = $("#rs-go", panel);
      $("#rs-pick", panel).addEventListener("click", () => $("#rs-file", panel).click());
      $("#rs-file", panel).addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const r = new FileReader(); r.onload = () => { ta.value = String(r.result || ""); $("#rs-fname", panel).textContent = f.name; $("#rs-pw", panel).focus(); }; r.readAsText(f);
      });
      const run = async () => {
        err.textContent = "";
        let rec; try { rec = JSON.parse(ta.value.trim()); } catch(e){ err.textContent = "Paste or choose a backup file first."; return; }
        if (!validRecord(rec)){ err.textContent = rec && Array.isArray(rec.profiles) ? "That's a plain export. Use Import instead." : "That isn't a Profile Vault backup."; return; }
        if (unlocked && !(await confirmDialog({title:"Replace this vault?", body:`Everything here (${plural(S.profiles.length,"profile")}) will be replaced by the backup.`, confirm:"Replace vault", danger:true}))) return;
        go.disabled = true; go.textContent = "Restoring…";
        try {
          const r = await openRecord(rec, $("#rs-pw", panel).value);
          KEY = r.key; S = r.state; VAULT = rec; writeStore(rec);
          UI.selected.clear(); UI.view = "profiles"; UI.group = "all";
          closeAllLayers(); startApp(); toast(`Restored ${plural(S.profiles.length, "profile")}`);
        } catch(e){ go.disabled = false; go.textContent = "Restore backup"; err.textContent = "That password doesn't open this backup."; }
      };
      go.addEventListener("click", run);
      $("#rs-form", panel).addEventListener("submit", (e) => { e.preventDefault(); run(); });
    }
  });
}

/* ================= STORE LOGINS + INBOXES ================= */
const STORES = [["target","Target"],["walmart","Walmart"],["bestbuy","Best Buy"],["amazon","Amazon"],["gamestop","GameStop"],["pokemoncenter","Pokémon Center"],["costco","Costco"],["samsclub","Sam's Club"],["nike","Nike"],["other","Other store…"]];
const PROVIDERS = [["gmail","Gmail","imap.gmail.com"],["outlook","Outlook / Hotmail","outlook.office365.com"],["yahoo","Yahoo","imap.mail.yahoo.com"],["icloud","iCloud","imap.mail.me.com"],["aol","AOL","imap.aol.com"],["zoho","Zoho","imap.zoho.com"],["custom","Other (custom IMAP server)",""]];
const PROVIDER_BY_DOMAIN = {"gmail.com":"gmail","googlemail.com":"gmail","outlook.com":"outlook","hotmail.com":"outlook","live.com":"outlook","msn.com":"outlook","yahoo.com":"yahoo","ymail.com":"yahoo","icloud.com":"icloud","me.com":"icloud","mac.com":"icloud","aol.com":"aol","zoho.com":"zoho"};
const loginById = (id) => (S.logins || []).find(l => l.id === id) || null;
const inboxById = (id) => (S.inboxes || []).find(i => i.id === id) || null;
const storeLabel = (l) => l.store === "other" ? (l.storeName || "Other store") : ((STORES.find(s => s[0] === l.store) || [0, l.store])[1]);
const storeKeyOf = (l) => l.store === "other" ? "other:" + norm(l.storeName) : l.store;
const storeSlug = (l) => l.store === "other" ? norm(l.storeName).replace(/[^a-z0-9]+/g, "") || "other" : l.store;
const providerName = (id) => (PROVIDERS.find(p => p[0] === id) || [0, "IMAP"])[1];
const inboxUses = (id) => S.logins.filter(l => l.inboxId === id).length;
const loginTitle = (l) => storeLabel(l) + (l.label ? " — " + l.label : "");
const STORE_MODE = {pokemoncenter:"email"};
const defaultMode = (k) => STORE_MODE[String(k).split(":")[0]] || "login";
const storeOf = (e) => ({store:e.store, storeName:e.storeName || ""});
const profileStores = (p) => Array.isArray(p.stores) ? p.stores : [];
const storeEntry = (p, k) => profileStores(p).find(e => storeKeyOf(e) === k) || null;
const profileLogins = (p) => profileStores(p).map(e => loginById(e.loginId)).filter(Boolean);
const loginProfiles = (id) => S.profiles.filter(p => profileStores(p).some(e => e.loginId === id));
const storeName = (e) => storeLabel(e);
function allStoreOptions(){
  const seen = new Map();
  STORES.filter(x => x[0] !== "other").forEach(([id, name]) => seen.set(id, {store:id, storeName:"", name}));
  const add = (o) => { const k = storeKeyOf(o); if (!seen.has(k)) seen.set(k, {store:o.store, storeName:o.storeName || "", name:storeLabel(o)}); };
  S.logins.forEach(add); S.profiles.forEach(p => profileStores(p).forEach(add));
  return Array.from(seen.values()).sort((a, b) => natural(a.name, b.name));
}
function linkLogin(p, l){
  const k = storeKeyOf(l);
  p.stores = profileStores(p).filter(e => storeKeyOf(e) !== k);
  p.stores.push({store:l.store, storeName:l.storeName || "", mode:"login", loginId:l.id, email:"", verified:false});
}
function unlinkLogin(p, id){ profileStores(p).forEach(e => { if (e.loginId === id){ e.loginId = null; } }); }
const STORE_TINT = {target:"#CC0000", walmart:"#0071CE", bestbuy:"#FFE000", amazon:"#232F3E", gamestop:"#E4000F", pokemoncenter:"#EE2A24", costco:"#005DAA", samsclub:"#0067A0", nike:"#111111", other:"#6B7280"};

}

function wireImap(panel){
  const em = $('[name="i_email"]', panel), pv = $('[name="i_provider"]', panel), custom = $("#i-custom", panel);
  let touched = !!pv.value;
  pv.addEventListener("change", () => { touched = true; custom.style.display = pv.value === "custom" ? "contents" : "none"; });
  em.addEventListener("input", () => {
    if (touched) return;
    const d = (em.value.split("@")[1] || "").toLowerCase().trim();
    if (PROVIDER_BY_DOMAIN[d]){ pv.value = PROVIDER_BY_DOMAIN[d]; custom.style.display = "none"; }

function readImap(panel, existingPw){
  const i = { email:val(panel,"i_email"), password:$('[name="i_password"]', panel).value, provider:val(panel,"i_provider"), host:val(panel,"i_host"), port:val(panel,"i_port") };
  let bad = false;
  const any = i.email || i.password;
  if (!any) return {inbox:null, bad:false, empty:true};
  let e = !i.email ? "Enter the IMAP email." : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i.email) ? "Check the email address." : ""; setErr(panel,"i_email",e); if (e) bad = true;
  e = !i.password && !existingPw ? "Enter the IMAP password." : ""; setErr(panel,"i_password",e); if (e) bad = true;
  e = !i.provider ? "Choose your mail provider." : ""; setErr(panel,"i_provider",e); if (e) bad = true;
  if (i.provider === "custom"){
    e = i.host ? "" : "Enter the IMAP server."; setErr(panel,"i_host",e); if (e) bad = true;
    e = /^\d{1,5}$/.test(i.port) ? "" : "Enter a port, usually 993."; setErr(panel,"i_port",e); if (e) bad = true;
  } else { const p = PROVIDERS.find(x => x[0] === i.provider); i.host = p ? p[2] : ""; i.port = "993"; }
  if (!i.password) i.password = existingPw || "";
  return {inbox:i, bad};
}

function openInboxEditor(existing){

    foot:`<button class="btn" data-close>Cancel</button>${DESK ? `<button class="btn" id="i-test">Test</button>` : ""}<button class="btn btn-primary" id="i-save">${isNew && DESK ? "Save and sync" : "Save inbox"}</button>`,
    mount:(panel, close) => {
      wireImap(panel);

        const r = readImap(panel, existing.password);
        if (!r.inbox){ setErr(panel,"i_email","Enter the IMAP email."); return; }
        if (r.bad) return;
        if (S.inboxes.some(i => i.id !== existing.id && norm(i.email) === norm(r.inbox.email))){ setErr(panel,"i_email","You already saved this inbox."); return; }
        let saved;
        if (isNew){ saved = Object.assign({id:uid(), createdAt:Date.now(), auto:true}, r.inbox); S.inboxes.push(saved); } else { Object.assign(existing, r.inbox, {syncError:""}); saved = existing; }
        persist(); render(); toast(isNew ? "Inbox added" : "Inbox saved"); close();
        if (DESK && isNew) syncOneInbox(saved, false);
      };
      const tb = $("#i-test", panel);

        const out = $("#i-test-out", panel); out.hidden = false; out.className = "note"; out.textContent = "Signing in…"; tb.disabled = true;

        out.className = res.ok ? "note" : "note note-warn";

      });
      $("#i-save", panel).addEventListener("click", save);
      $("#i-form", panel).addEventListener("submit", (e) => { e.preventDefault(); save(); });
    }
  });
}

/* ================= ORDER TRACKER ================= */
const orderMoney = (v) => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const orderById = (id) => (S.orders || []).find(o => o.id === id) || null;
const ORDER_STAGES = [["placed","Placed"],["shipped","Shipped"],["arriving","Arriving"],["delivered","Delivered"],["canceled","Canceled"]];
const stageLabel = (k) => (ORDER_STAGES.find(s => s[0] === k) || [0,"Placed"])[1];
const orderStoreLabel = (o) => o.store === "other" ? (o.storeName || "Other") : ((STORES.find(s => s[0] === o.store) || [0, o.storeName || o.store])[1]);
// Same store + same order number = same order. Item text only matters when there's no order number.
function orderKey(o){ const st = o.store === "other" ? "other:" + norm(o.storeName) : o.store; return o.orderNo ? st + "|#" + norm(o.orderNo) : st + "||" + norm(o.item) + "|" + (o.at || ""); }

/* -- email parsing (mirrors the watcher, runs in-app on pasted text) -- */
const EMAIL_STORE_DOMAINS = [["target.com","target"],["walmart.com","walmart"],["bestbuy.com","bestbuy"],["amazon.com","amazon"],["gamestop.com","gamestop"],["pokemoncenter.com","pokemoncenter"],["pokemon.com","pokemoncenter"],["costco.com","costco"],["samsclub.com","samsclub"],["nike.com","nike"],["p-bandai.com","other"]];
const CONFIRM_RE = /(thanks?\s+for\s+(your\s+order|shopping)|here'?s\s+your\s+order|order\s+confirmation|thank\s+you\s+for\s+(your\s+order|placing|shopping))/i;
const NOT_CONFIRM_RE = /(cancel|refund|return|shipped|delivered|on\s+its\s+way|arrives\s+t|out\s+for\s+delivery|prescription|survey|review\s+your)/i;
function storeFromText(text){
  const low = String(text || "").toLowerCase();
  for (const [dom, id] of EMAIL_STORE_DOMAINS) if (low.includes(dom)) return id;
  if (/pok[eé]mon\s*center/i.test(low)) return "pokemoncenter";
  if (/\btarget\b/.test(low)) return "target";
  if (/\bwalmart\b/.test(low)) return "walmart";
  if (/best\s*buy/.test(low)) return "bestbuy";
  return "";
}
function parseOrderEmail(text){
  if (!CONFIRM_RE.test(text)) return null;
  const store = storeFromText(text);
  if (!store) return null;
  const pick = (re, g) => { const m = text.match(re); return m && m[g||1] ? m[g||1].trim() : ""; };
  // Order numbers always contain a digit, so words like "Number" or "Details" never match.
  const orderNo = pick(/order\s*(?:#|no\.?|number|id)?\s*[:#]?\s*#?\s*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9\-]{5,25})/i).replace(/^(\d{8,})[A-Za-z]+$/, "$1");
  let total = pick(/(?:order\s+total|grand\s+total)[\s:|]*\$?\s*([\d,]+\.\d{2})/i) || pick(/\btotal[\s:|]*\$?\s*([\d,]+\.\d{2})/i);
  const buyer = pick(/thank[s]?\s+for\s+your\s+order,\s*([A-Za-z][A-Za-z .'-]{1,40}?)[!\.]/i) || pick(/hello,\s*([A-Za-z][A-Za-z .'-]{1,40}?)[!\.\n]/i);
  const shipTo = pick(/delivers?\s+to:\s*\n?\s*([A-Za-z][A-Za-z .'-]{1,40}?),/i) || pick(/[Ss]hipping\s+[Aa]ddress:\s*\n?\s*([A-Za-z][A-Za-z'-]*(?:\s+[A-Z][A-Za-z'-]*){1,3})(?=\s+\d|\s*\n|\s*\|)/);
    const cardBrandM = text.match(/(Visa|Mastercard|American Express|Amex|Discover)\s*\*+\s*(\d{4})/i);
  const cardStr = cardBrandM ? `${cardBrandM[1]} ••${cardBrandM[2]}` : "";
  let item = pick(/Arrives[^\n]*\n+/i) ? "" : "";
  // item: the product line usually appears right before "Qty:"
  const qtyIdx = text.search(/\bQty\s*:\s*\d/i);
  if (qtyIdx > -1){
    // Table-style emails put "SKU ... Qty" on one line, so strip pipes and skip SKU/price lines.
    const before = text.slice(Math.max(0, qtyIdx - 400), qtyIdx).split("\n").map(s => s.replace(/\|/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
    for (let i = before.length - 1; i >= 0; i--){ const ln = before[i]; if (ln.length > 8 && !/^https?:|order|summary|delivers|shipping|billing|^\$|^sku\b|^price\b/i.test(ln) && !/^[\d\s#:.-]+$/.test(ln)){ item = ln; break; } }
  }
  if (!item){ const im = text.match(/\n([A-Z][^\n]{10,90}?)\n\s*SKU/i); if (im) item = im[1].trim(); }
  const qty = pick(/\bQty\s*:\s*(\d+)/i) || "1";
  const priceEach = pick(/\$([\d,]+\.\d{2})\s*\/\s*ea/i);
  const arrives = pick(/Arrives[^\n]*?([A-Z][a-z]{2},?\s+[A-Z][a-z]{2}\s+\d{1,2})/);
  return { store, orderNo, total, buyer, shipTo, card:cardStr, item:item.replace(/\s+/g," ").slice(0,120), qty, priceEach, arrives };
}
function parseOrdersBlob(text){
  // split a paste of several emails on the common "From: ... Subject:" or "Order #" boundaries
  const chunks = String(text || "").split(/(?=^_{5,}\s*\nFrom:|\nFrom:\s|\n-{5,}\s*Forwarded)/m).filter(c => c.trim().length > 40);
  const list = chunks.length > 1 ? chunks : [text];
  const rows = [], seen = new Set();
  list.forEach((c, i) => {
    const r = parseOrderEmail(c);
    if (!r) return;
    r.line = i + 1;
    const k = [r.store, r.orderNo, r.item].join("|");
    if (seen.has(k)) return; seen.add(k);
    rows.push(r);
  });
  return rows;
}

      ${fieldHTML({name:"image", label:"Image link", value:o.image, cls:"c6", placeholder:"https://… (found automatically from order emails)"})}
      ${fieldHTML({type:"select", name:"trkc", label:"Carrier", options:opt([["auto","Detect automatically"]].concat(Object.keys(CARRIERS).filter(k => k !== "other").map(k => [k, CARRIERS[k].name])).concat([["other","Other"]]), (o.tracking && o.tracking[0] && o.tracking[0].manual) ? o.tracking[0].carrier : "auto"), cls:"c2 keep", showOpt:false})}
    </div></form>`,
    foot:`${existing ? `<button class="btn btn-quiet btn-danger" id="o-del">${ic("trash")}Delete</button><span class="spacer"></span>` : ""}<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="o-save">${existing ? "Save" : "Add order"}</button>`,
    mount:(panel, close) => {
      const store = $('[name="store"]', panel), sName = $('[name="storeName"]', panel), pills = $("#o-pills", panel);
      pills.addEventListener("click", (e) => {
        const b = e.target.closest("[data-pick]"); if (!b) return;

        if (b.dataset.pick === "__new"){ askStoreName().then(x => { if (x) apply(x); }); return; }
        apply({store:b.dataset.store, storeName:b.dataset.sname || ""});
      });
      const save = () => {

function planOrderImport(rows){
  const have = new Set((S.orders || []).map(orderKey));
  const seen = new Set(), add = [], dupes = [];
  rows.forEach(r => {
    const st = STORES.find(x => x[0] !== "other" && x[0] === r.store);
    const o = {id:uid(), createdAt:Date.now(), store:st ? st[0] : (r.store || "other"), storeName:st ? "" : (r.storeName || r.store || "Other"),
      item:r.item || "Order", orderNo:r.orderNo || "", qty:String(r.qty || "1"), total:r.total || "", priceEach:r.priceEach || "",
      at:r.at || todayISO(), shipTo:r.shipTo || "", card:r.card || "", arrives:r.arrives || "", buyer:r.buyer || "", stage:r.stage || "placed", inbox:r.inboxEmail || "", image:r.image || ""};
    if (r.imageAlt && (/^order$/i.test(o.item) || looksLikeCode(o.item)) && r.imageAlt.length >= 6 && !GENERIC_ALT.test(r.imageAlt)) o.item = r.imageAlt;
    const k = orderKey(o);
    if (have.has(k) || seen.has(k)){ dupes.push(r.line || 0); return; }
    seen.add(k); add.push(o);
  });
  return {add, dupes};
}

function openEmailImport(){
  let plan = null;
  openLayer({
    title:"Add orders from email", dismiss:false,
    body:`<p style="margin:0 0 14px;color:var(--ink-2)">Paste one or more order-confirmation emails. Copy the whole email body; several at once is fine. Each becomes an order. Anything that isn't an order confirmation is skipped.</p>
      <div class="field" data-field="blob"><label for="oe-text">Email text</label><textarea id="oe-text" spellcheck="false" style="min-height:150px" placeholder="Paste order emails here…"></textarea><span class="err"></span></div>
      <div id="oe-sum"></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="oe-go" disabled>${ic("plus")}Add orders</button>`,
    mount:(panel, close) => {
      const ta = $("#oe-text", panel), go = $("#oe-go", panel), sum = $("#oe-sum", panel);
      let t0;
      ta.addEventListener("input", () => { clearTimeout(t0); t0 = setTimeout(() => {
        plan = null; go.disabled = true; sum.innerHTML = "";
        const t = ta.value.trim(); if (!t) return;
        const rows = parseOrdersBlob(t);
        if (!rows.length){ sum.innerHTML = `<p class="note note-warn" style="margin-top:12px">No order confirmations found in that text. Make sure you copied the full email, including the store name and order number.</p>`; return; }
        plan = planOrderImport(rows);
        sum.innerHTML = `<div class="note" style="margin-top:12px"><strong style="color:var(--ink)">${plan.add.length ? `${plural(plan.add.length,"order")} ready` : "Nothing new"}</strong><ul class="summary-list">
          ${plan.add.slice(0,6).map(o => `<li>${esc(orderStoreLabel(o))}: ${esc(o.item)}${o.total ? " — " + fmtMoney(orderMoney(o.total)) : ""}</li>`).join("")}
          ${plan.add.length > 6 ? `<li>and ${plan.add.length - 6} more</li>` : ""}
          ${plan.dupes.length ? `<li>${plural(plan.dupes.length,"order")} already in your tracker, skipped</li>` : ""}
        </ul></div>`;
        go.disabled = !plan.add.length; if (plan.add.length) go.innerHTML = `${ic("plus")}Add ${plural(plan.add.length,"order")}`;
      }, 250); });
      go.addEventListener("click", () => {
        if (!plan || !plan.add.length) return;
        S.orders.push(...plan.add); persist(); UI.view = "orders"; render();
        toast(`Added ${plural(plan.add.length,"order")}`); close();
      });
    }
  });
}

function renderOrders(){
  const q = norm(UI.q);
  // Inbox filter: which email the orders came from. Stats and store counts follow it.
  const inboxList = Array.from(new Set((S.inboxes || []).map(i => i.email).concat((S.orders || []).map(o => o.inbox).filter(Boolean))));
  if (UI.orderInbox && UI.orderInbox !== "all" && UI.orderInbox !== "none" && !inboxList.includes(UI.orderInbox)) UI.orderInbox = "all";
  const inboxOf = (o) => o.inbox || "none";
  const byInbox = (S.orders || []).filter(o => !UI.orderInbox || UI.orderInbox === "all" || inboxOf(o) === UI.orderInbox);
  let list = byInbox.slice();
  if (UI.store !== "all") list = list.filter(o => storeKeyOf(o) === UI.store);
  if (UI.orderStage && UI.orderStage !== "all") list = list.filter(o => (o.stage || "placed") === UI.orderStage);
  if (q) list = list.filter(o => norm([orderStoreLabel(o), o.item, o.orderNo, o.shipTo, o.buyer, o.card].join(" ")).includes(q));
  list.sort((a,b) => (b.at || "").localeCompare(a.at || "") || (b.createdAt||0) - (a.createdAt||0));
  const all = byInbox;
  const spend = all.filter(o => (o.stage || "placed") !== "canceled").reduce((n,o) => n + orderMoney(o.total), 0);
  const active = all.filter(o => !["delivered","canceled"].includes(o.stage || "placed")).length;
  const stat = (label,n,sub,icon,tone) => `<div class="stat"><div class="stat-top">${icon?`<span class="stat-ic stat-ic-${tone||"accent"}">${ic(icon)}</span>`:""}<div class="stat-label">${label}</div></div><div class="stat-n">${n}</div><div class="stat-sub">${sub}</div></div>`;
  const stores = allStoreOptions().map(x => [storeKeyOf(x), x.name, all.filter(o => storeKeyOf(o) === storeKeyOf(x)).length]).filter(x => x[2]);
  const head = `<div class="view-head"><div><h1 class="view-title">Orders</h1><p class="view-sub">Purchases pulled from your order emails</p></div>
    <div class="view-tools">${ordersSyncBtnHTML()}<button class="btn" data-act="email-import">${ic("imp")}Add from email</button><button class="btn btn-primary" data-act="new-order">${ic("plus")}Add order</button></div></div>`;
  if (!(S.orders || []).length) return head + `<div class="empty"><h2>No orders yet</h2><p>Connect an inbox in Settings and paste your order emails, or add one by hand. Every confirmation becomes a tracked order.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="settings">Open settings</button><button class="btn btn-primary" data-act="email-import">${ic("imp")}Add from email</button></div></div>`;
  const stageChip = (k,n) => `<button class="chip" data-act="order-stage" data-id="${k}" aria-pressed="${(UI.orderStage||"all")===k}">${k==="all"?"All":stageLabel(k)}${n!=null?` <span class="chip-n">${n}</span>`:""}</button>`;
  const stageCounts = {}; ORDER_STAGES.forEach(([k]) => stageCounts[k] = all.filter(o => (o.stage||"placed")===k).length);
  const body = list.length ? `<div class="grid grid-orders">${list.map(o => {
    const st = o.stage || "placed";
    return `<article class="slip order">
      <div class="slip-head">${orderThumb(o)}<div style="flex:1;min-width:0"><div class="item-title">${esc(o.item || "Order")}</div>
        <div class="item-sub">${esc(orderStoreLabel(o))}${o.orderNo ? " · " + ((o.tracking && o.tracking.length) ? `<a class="trk-link" href="${esc(trackUrl(o.tracking[0]))}" target="_blank" rel="noopener" title="Track with ${esc(carrierName(o.tracking[0]))}">#${esc(o.orderNo)}${ic("ext")}</a>` : "#" + esc(o.orderNo)) : ""}</div></div>
        <span class="ostage ostage-${st}">${esc(stageLabel(st))}</span></div>
      <div class="slip-meta">
        <span class="o-line">${esc(coDateLabel(o.at))}${(+o.qty||1)>1?` · ×${esc(o.qty)}`:""}${o.total?` · ${esc(fmtMoney(orderMoney(o.total)))}`:""}${o.arrives?` · Arrives ${esc(o.arrives)}`:""}</span>
        ${o.shipTo || o.card ? `<span class="o-line">${[o.shipTo ? "To " + esc(o.shipTo) : "", o.card ? esc(o.card) : ""].filter(Boolean).join(" · ")}</span>` : ""}
        ${(o.tracking || []).map(tr => `<span class="trk-line">${ic("truck")}<a href="${esc(trackUrl(tr))}" target="_blank" rel="noopener">${esc(carrierName(tr))} ${esc(tr.number)}</a></span>`).join("")}
      </div>
      <div class="item-actions"><button class="icon-btn" data-act="edit-order" data-id="${o.id}" aria-label="Edit">${ic("edit")}</button><button class="icon-btn" data-act="delete-order" data-id="${o.id}" aria-label="Delete">${ic("trash")}</button></div>

/* ================= SYNC SERVER (your Cloudflare Worker) ================= */
const serverCfg = () => (S && S.settings && S.settings.server) || {};
const serverReady = () => { const c = serverCfg(); return !!(c.url && c.token); };
const ON_CLAUDE = !!window.claude && !/^file:$/.test(location.protocol);
async function serverCall(path, method){
  const c = serverCfg();
  const url = c.url.replace(/\/+$/, "") + path;
  let r;
  try { r = await fetch(url, {method:method || "GET", headers:{Authorization:"Bearer " + c.token}}); }
  catch(e){ throw new Error(ON_CLAUDE ? "This claude.ai page isn't allowed to reach outside sites. Use the desktop app or your own domain for server sync." : "Couldn't reach the server. Check the URL and your connection."); }
  if (r.status === 401) throw new Error("The server rejected that token.");
  if (r.status === 403) throw new Error("That token is read-only, so it can pull orders but not start a sync.");
  if (!r.ok) throw new Error("The server answered " + r.status + ".");
  return r.json();
}
async function pullFromServer(opts){
  opts = opts || {};
  if (!serverReady()) throw new Error("Add your server URL and token first.");
  if (opts.syncFirst){ try { await serverCall("/sync", "POST"); } catch(e){ if (!/read-only/.test(e.message)) throw e; } }
  const data = await serverCall("/orders", "GET");
  const rows = (data.orders || []).map((o, i) => Object.assign({line:i+1}, o));
  const plan = planOrderImport(rows);
  if (plan.add.length){ S.orders.push(...plan.add); }
  S.settings.server.lastPull = new Date().toISOString();
  S.settings.server.lastSync = data.lastSync || null;
  persist();
  return {added:plan.add.length, total:rows.length, lastSync:data.lastSync};
}
let autoPullTimer = null;
function scheduleAutoPull(){
  clearInterval(autoPullTimer);

  const run = () => pullFromServer().then(r => { if (r.added){ render(); toast(`${plural(r.added, "new order")} from your server`); } }).catch(() => {});
  run();
  autoPullTimer = setInterval(() => { if (S) run(); }, 15 * 60 * 1000);
}

/* -- package tracking: carriers, detection, links -- */
const CARRIERS = {
  ups:    {name:"UPS",    url:n => `https://www.ups.com/track?tracknum=${encodeURIComponent(n)}`},
  fedex:  {name:"FedEx",  url:n => `https://www.fedex.com/fedextrack/?trknbr=${encodeURIComponent(n)}`},
  usps:   {name:"USPS",   url:n => `https://tools.usps.com/go/TrackConfirmAction?tLabels=${encodeURIComponent(n)}`},
  dhl:    {name:"DHL",    url:n => `https://www.dhl.com/us-en/home/tracking/tracking-express.html?submit=1&tracking-id=${encodeURIComponent(n)}`},
  ontrac: {name:"OnTrac", url:n => `https://www.ontrac.com/tracking/?number=${encodeURIComponent(n)}`},
  amazon: {name:"Amazon", url:n => `https://track.amazon.com/tracking/${encodeURIComponent(n)}`},
  other:  {name:"Carrier",url:n => `https://www.google.com/search?q=${encodeURIComponent(n + " tracking")}`}
};
function detectCarrier(num, context){
  const n = String(num || "").toUpperCase().replace(/\s+/g, "");
  if (/^1Z[0-9A-Z]{16}$/.test(n)) return "ups";
  if (/^TBA\d{9,15}$/.test(n)) return "amazon";
  if (/^[A-Z]{2}\d{9}US$/.test(n)) return "usps";
  if (/^9[1-5]\d{18,24}$/.test(n) || /^420\d{5}9[1-5]\d{18,24}$/.test(n)) return "usps";
  if (/^[CD]\d{14}$/.test(n) || /^1LS[0-9A-Z]{10,}$/.test(n)) return "ontrac";
  const ctx = String(context || "").toLowerCase();
  if (/united\s+parcel|\bups\b/.test(ctx)) return "ups";
  if (/fed\s*ex|federal\s+express/.test(ctx)) return "fedex";
  if (/\busps\b|postal\s+service|u\.?s\.?\s+mail/.test(ctx)) return "usps";
  if (/\bdhl\b/.test(ctx)) return "dhl";
  if (/ontrac/.test(ctx)) return "ontrac";
  if (/^(\d{12}|\d{15}|\d{20}|\d{22})$/.test(n)) return "fedex";
  if (/^\d{10}$/.test(n)) return "dhl";
  return "other";
}
function trackingFromEmail(text){
  const t = String(text || "");
  const found = new Map();
  const add = (num, ctx) => {
    const n = String(num).toUpperCase().replace(/\s+/g, "");
    if (n.length < 10 || n.length > 34 || !/\d{4}/.test(n) || found.has(n)) return;
    found.set(n, {number:n, carrier:detectCarrier(n, ctx)});
  };
  const re = /track(?:ing)?\s*(?:number|no\.?|#|id)?\s*(?:is|:|#)?\s*[:#]?\s*([A-Z0-9]{10,34})/gi;
  let m;
  while ((m = re.exec(t))) add(m[1], t.slice(Math.max(0, m.index - 90), m.index + m[0].length + 20));
  // UPS numbers are unmistakable wherever they appear.
  (t.match(/\b1Z[0-9A-Z]{16}\b/gi) || []).forEach(n => add(n, "ups"));
  return Array.from(found.values());
}
const trackUrl = (tr) => (CARRIERS[tr.carrier] || CARRIERS.other).url(tr.number);
const carrierName = (tr) => (CARRIERS[tr.carrier] || CARRIERS.other).name;
function mergeTracking(o, list){
  if (!list || !list.length) return 0;
  const have = new Set((o.tracking || []).map(x => x.number));
  let added = 0;
  o.tracking = (o.tracking || []).slice();
  list.forEach(tr => { if (!have.has(tr.number)){ o.tracking.push(tr); have.add(tr.number); added++; } });
  return added;
}
// Product name from a shipping/status email (used to repair orders named after a SKU code).
function itemFromEmailText(text){
  const lines = String(text || "").split("\n").map(s => s.replace(/\|/g, " ").replace(/\[[^\]]*\]\([^)]*\)/g, "").replace(/\s+/g, " ").trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++){
    if (/^sku\b/i.test(lines[i]) || /\bqty\s*:/i.test(lines[i])){
      for (let j = i - 1; j >= Math.max(0, i - 3); j--){
        const ln = lines[j].replace(/^\[|\]$/g, "");
        if (ln.length > 8 && !/^[\d\s#:.-]+$/.test(ln) && !/order|summary|shipping|billing|details|address|^https?:/i.test(ln)) return ln.slice(0, 120);
      }
    }
  }
  return "";
}
const looksLikeCode = (s) => /^[\d\s#:.\-]{6,}$/.test(String(s || "").trim());

/* -- product photos from order emails -- */
// Where stores keep real product photos (vs. their banners and illustrations).
const PRODUCT_IMG = /(scene7\.com\/is\/image\/Target\/(GUEST_|\d{6,})|walmartimages\.com\/(asr|seo)\/|bbystatic\.com\/image2\/BestBuy_US\/images\/products|media-amazon\.com\/images\/I\/|images-amazon\.com\/images\/I\/|pokemoncenter[^"]*\/(products?|product-images?)\/)/i;
const DECOR_IMG = /(walmartimages\.com\/dfw\/|scene7\.com\/is\/image\/Target\/(?!GUEST_|\d{6,})|[?&]fmt=(gif|png)-alpha)/i;
const RETAIL_CDN = /(scene7\.com|walmartimages\.com|pokemoncenter|bbystatic\.com|media-amazon\.com|images-amazon\.com|costco|gamestop|samsclub)/i;
const GENERIC_ALT = /^(order|item|product|image|photo|view|shop|img|picture|\d+)?$/i;
const NAME_STOP = new Set(["order","orders","item","items","your","with","from","this","that","target","walmart","pack","each"]);
// Best product photo in an email for this item, or null.
function pickProductImage(images, item){
  const words = new Set((String(item || "").toLowerCase().match(/[a-z0-9]{4,}/g) || []).filter(w => !NAME_STOP.has(w)));
  let best = null, bestScore = 0;
  (images || []).forEach((im, i) => {
    if (DECOR_IMG.test(im.src)) return;
    const alt = String(im.alt || "").toLowerCase();
    let s = PRODUCT_IMG.test(im.src) ? 5 : RETAIL_CDN.test(im.src) ? 1 : 0;
    (alt.match(/[a-z0-9]{4,}/g) || []).forEach(w => { if (words.has(w)) s += 1; });
    s -= i * 0.05; // earlier photos are usually the first item in the order
    if (s > bestScore){ best = im; bestScore = s; }
  });
  return bestScore >= 2 ? best : null;
}
// Give an order a photo (and a real name when it only says "Order") from an email's images.
function applyEmailImage(o, images){
  if (!o || o.image) return false;
  const im = pickProductImage(images, o.item);
  if (!im) return false;
  o.image = im.src;
  const alt = String(im.alt || "").trim();
  if ((!o.item || /^order$/i.test(o.item) || looksLikeCode(o.item)) && alt.length >= 6 && !GENERIC_ALT.test(alt)) o.item = alt;
  o.updatedAt = Date.now();
  return true;
}
function orderThumb(o){
  if (!o.image) return storeMark(o);
  return `<span class="othumb"><img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('is-broken')">${storeMark(o)}</span>`;
}

/* -- order status updates from email (canceled / shipped / arriving / delivered) -- */
const STAGE_RANK = {placed:0, shipped:1, arriving:2, delivered:3, canceled:3};
function statusFromEmail(subject, text){
  const subj = String(subject || "");
  const head = String(text || "").slice(0, 3000);
  const both = subj + "\n" + head;
  // Order confirmations are handled elsewhere; this only reads status changes.
  if (/cancel(l?ed|lation)|has\s+been\s+cancel|we\s+(had|have)\s+to\s+cancel|couldn'?t\s+be\s+processed/i.test(subj) || /(order|item\(s\)|items?)\s+[^.\n]{0,60}(has|have)\s+been\s+cancel/i.test(head)) return "canceled";
  if (/\bdelivered\b|was\s+delivered|has\s+been\s+delivered/i.test(subj)) return "delivered";
  if (/out\s+for\s+delivery|arriv(es|ing)\s+(today|tomorrow)/i.test(subj)) return "arriving";
  if (/\bshipped\b|has\s+shipped|on\s+(its|the)\s+way|shipping\s+confirm|about\s+to\s+ship|ready\s+to\s+ship|label\s+(has\s+been\s+)?created|shipment/i.test(subj)) return "shipped";
  return null;
}
function orderNoFrom(text){
  const m = String(text || "").match(/order\s*(?:#|no\.?|number|id)?\s*[:#]?\s*#?\s*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9\-]{5,25})/i);
  if (!m) return "";
  // Some emails glue the next word on: "#912003773992809are" -> 912003773992809
  return m[1].trim().toUpperCase().replace(/^(\d{8,})[A-Z]+$/, "$1");
}
// Apply status emails to orders already in the tracker. Never downgrades
// (a delivered order stays delivered), and never creates orders from them.
function applyStatusEmails(emails){
  const byNo = new Map();
  (S.orders || []).forEach(o => { if (o.orderNo) byNo.set(String(o.orderNo).toUpperCase(), o); });
  const changed = {canceled:0, shipped:0, arriving:0, delivered:0}; let unmatched = 0;
  const sorted = (emails || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  for (const e of sorted){
    const stage = statusFromEmail(e.subject, e.text);
    if (!stage) continue;
    const no = orderNoFrom([e.subject, e.text].join("\n"));
    const o = no && byNo.get(no);
    if (!o){ unmatched++; continue; }
    if (mergeTracking(o, trackingFromEmail(e.text))) { changed.tracking = (changed.tracking || 0) + 1; o.updatedAt = Date.now(); }
    if (looksLikeCode(o.item)){ const nm = itemFromEmailText(e.text); if (nm){ o.item = nm; o.updatedAt = Date.now(); } }
    const cur = o.stage || "placed";
    if (cur === stage) continue;
    if (cur === "delivered" || (cur === "canceled" && stage !== "delivered")) continue;
    if (stage !== "canceled" && STAGE_RANK[stage] < STAGE_RANK[cur]) continue;
    o.stage = stage; o.statusAt = String(e.date || "").slice(0, 10); o.updatedAt = Date.now();
    changed[stage]++;
  }
  const tracking = changed.tracking || 0; delete changed.tracking;
  return {changed, unmatched, tracking, total:Object.values(changed).reduce((a, b) => a + b, 0)};
}

function emailsToRows(emails, inbox){
  const rows = [];
  (emails || []).forEach((e, i) => {
    if (statusFromEmail(e.subject, e.text)) return;
    const r = parseOrderEmail([e.subject, e.from, e.text].join("\n"));
    if (!r) return;
    const im = pickProductImage(e.images, r.item);
    rows.push(Object.assign(r, { line:i+1, at:String(e.date || "").slice(0, 10) || todayISO(), buyer:r.buyer || "", inboxEmail:inbox.email, image:im ? im.src : "", imageAlt:im ? im.alt : "" }));
  });
  return rows;
}

async function syncOneInbox(inbox, quiet){
  if (!DESK || !inbox || SYNCING.has(inbox.id)) return {added:0};
  if (!inbox.password){ if (!quiet) toast(`Add the app password for ${inbox.email} first.`, "err"); return {added:0}; }
  const syncViews = () => { if (UI.view === "settings-view" || UI.view === "orders") renderMain(); };
  SYNCING.set(inbox.id, "Connecting…"); syncViews();
  // First sync looks back 90 days; after that, just since the last one (plus a margin).
  // Also look back 90 days once to label existing orders with the inbox they came from.
  const statusEngine = (window.pvDesktop && window.pvDesktop.version >= 4);
  const imageEngine = (window.pvDesktop && window.pvDesktop.version >= 6);
  const needsBackfill = !inbox.inboxTagged || (imageEngine && !inbox.imagesBackfilled) || (statusEngine && (!inbox.statusBackfilled || !inbox.trackingBackfilled));
  const days = inbox.lastSync && !needsBackfill ? Math.min(90, Math.ceil((Date.now() - inbox.lastSync) / 86400000) + 3) : 90;
  let res;
  try { res = await window.pvDesktop.syncInbox({id:inbox.id, email:inbox.email, password:inbox.password, host:inbox.host, port:inbox.port, days}); }
  catch(e){ res = {ok:false, error:"The sync stopped unexpectedly."}; }
  SYNCING.delete(inbox.id);
  const live = inboxById(inbox.id) || inbox;
  if (!res.ok){
    live.syncError = res.error; persist();
    syncViews();
    if (!quiet) toast(`${inbox.email}: ${res.error}`, "err");
    return {added:0, error:res.error};
  }
  const rows = emailsToRows(res.emails, inbox);
  const plan = planOrderImport(rows);
  if (plan.add.length) S.orders.push(...plan.add);
  const st = applyStatusEmails(res.emails);
  // Label orders that don't know their inbox yet (added before this was tracked).
  const byNo = new Map((S.orders || []).filter(o => o.orderNo && !o.inbox).map(o => [String(o.orderNo).toUpperCase(), o]));
  if (byNo.size) (res.emails || []).forEach(e => { const o = byNo.get(orderNoFrom([e.subject, e.text].join("\n"))); if (o) o.inbox = inbox.email; });
  live.inboxTagged = true;
  // Product photos for orders that don't have one yet (from confirmations or status emails).
  let pictured = 0;
  const noImg = new Map((S.orders || []).filter(o => o.orderNo && !o.image).map(o => [String(o.orderNo).toUpperCase(), o]));
  if (noImg.size) (res.emails || []).forEach(e => {
    if (!e.images || !e.images.length) return;
    const o = noImg.get(orderNoFrom([e.subject, e.text].join("\n")));
    if (o && applyEmailImage(o, e.images)){ pictured++; noImg.delete(String(o.orderNo).toUpperCase()); }
  });
  if (imageEngine) live.imagesBackfilled = true;
  live.lastSync = Date.now(); live.syncError = "";
  if (statusEngine){ live.statusBackfilled = true; live.trackingBackfilled = true; }
  live.lastResult = {scanned:res.scanned, found:rows.length, added:plan.add.length, updated:st.total};
  persist(); render();
  const bits = [];
  if (plan.add.length) bits.push(plural(plan.add.length, "new order"));
  if (st.changed.canceled) bits.push(`${st.changed.canceled} canceled`);
  if (st.changed.shipped) bits.push(`${st.changed.shipped} shipped`);
  if (st.changed.arriving) bits.push(`${st.changed.arriving} arriving`);
  if (st.changed.delivered) bits.push(`${st.changed.delivered} delivered`);
  if (st.tracking) bits.push(`tracking for ${plural(st.tracking, "order")}`);
  if (pictured) bits.push(`photos for ${plural(pictured, "order")}`);
  if (!quiet || bits.length) toast(bits.length ? `${inbox.email}: ${bits.join(", ")}` : `${inbox.email}: up to date`);
  return {added:plan.add.length, updated:st.total};
}

  if (!list.length){ if (!quiet) toast("Add an inbox first."); return; }

function inboxRowHTML(i){
  const busy = SYNCING.get(i.id);
  let status;
  if (busy) status = `<span class="pill pill-busy"><span class="spin" aria-hidden="true"></span><span data-sync-status="${i.id}">${esc(busy)}</span></span>`;
  else if (i.syncError) status = `<span class="pill pill-err">Needs attention</span>`;

/* ================= LICENSE (desktop app) ================= */
// Keys are made only with tools/license.mjs, which holds the private key. The app
// downloads a list of SHA-256 hashes of valid keys, signed with that key, and
// accepts a key only if the signature checks out and its hash is on the list.
const LICENSE_PUB = {kty:"EC", crv:"P-256", x:"GjzaSqmKaFThaxR29wozcPQcaifNz3hZKgzGK9fWNec", y:"v1TXigdCJwtUiUgGUvt9BR6p_mTC3Bk-gy9u6u_bEmk"};
const LICENSE_URL = "https://raw.githubusercontent.com/dolamv-coder/profile-vault-updates/main/licenses.json";
const LICENSE_GRACE_DAYS = 30;   // works offline this long after the last successful check
const LIC_STORE = "pv-license";
const licNorm = (k) => String(k || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const licFormat = (k) => { const n = licNorm(k); return /^PVLT[A-Z0-9]{16}$/.test(n) ? "PVLT-" + n.slice(4).match(/.{4}/g).join("-") : String(k || "").trim().toUpperCase(); };
function licRead(){ try { return JSON.parse(localStorage.getItem(LIC_STORE) || "null"); } catch(e){ return null; } }
function licWrite(v){ try { if (v) localStorage.setItem(LIC_STORE, JSON.stringify(v)); else localStorage.removeItem(LIC_STORE); } catch(e){} }
async function licHash(k){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("pvlt:" + licNorm(k)));
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}
let LIC_KEY_OBJ = null;
async function licVerify(list){
  try {
    if (!list || typeof list.body !== "string" || typeof list.sig !== "string") return null;
    LIC_KEY_OBJ = LIC_KEY_OBJ || await crypto.subtle.importKey("jwk", LICENSE_PUB, {name:"ECDSA", namedCurve:"P-256"}, false, ["verify"]);
    const sig = Uint8Array.from(atob(list.sig), c => c.charCodeAt(0));
    const ok = await crypto.subtle.verify({name:"ECDSA", hash:"SHA-256"}, LIC_KEY_OBJ, sig, new TextEncoder().encode(list.body));
    return ok ? JSON.parse(list.body) : null;
  } catch(e){ return null; }
}
async function licFetch(){
  const r = await fetch(LICENSE_URL + "?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
// {st:"ok"|"off"|"expired"|"bad", exp, issued}
async function licCheck(key, list){
  const body = await licVerify(list);
  if (!body) return {st:"bad"};
  const h = await licHash(key);
  const e = (body.keys || []).find(x => x.h === h);
  if (!e) return {st:"off", issued:body.issued};
  if (e.exp && new Date(e.exp) < new Date()) return {st:"expired", exp:e.exp, issued:body.issued};
  return {st:"ok", exp:e.exp || "", issued:body.issued};
}
const licMsg = (st) => st === "expired" ? "This license key has expired. Contact the seller to renew it."
  : st === "off" ? "This license key isn't active anymore. Contact the seller for help."
  : "Profile Vault couldn't verify its license list. Try again in a moment.";

// Runs before the lock screen. Resolves true when the app may open.
async function licenseGate(){
  if (!DESK || !(window.crypto && crypto.subtle)) return true;
  const L = licRead();
  if (!L || !L.key){ renderLicense(); return false; }
  const cached = L.list ? await licCheck(L.key, L.list) : {st:"bad"};
  const fresh = Date.now() - (L.checkedAt || 0) < LICENSE_GRACE_DAYS * 86400000;
  if (cached.st === "ok" && fresh){ licRefresh(); return true; }
  // The saved key is kept no matter what; only a key that was turned off or
  // expired asks for a new one. Anything else (offline, a bad download) retries.
  let r, list = null;
  try { list = await licFetch(); r = await licCheck(L.key, list); } catch(e){ r = {st:"offline"}; }
  // A cached copy older than what we already trust can't turn a key off.
  if ((r.st === "off" || r.st === "expired") && cached.st === "ok" && r.issued && cached.issued && r.issued < cached.issued) r = {st:"offline"};
  if (r.st === "ok"){ licWrite(Object.assign(L, {list, checkedAt:Date.now(), exp:r.exp || ""})); return true; }
  if (r.st === "off" || r.st === "expired"){ renderLicense(licMsg(r.st)); return false; }
  renderLicenseRetry(r.st === "offline" ? "Connect to the internet so Profile Vault can confirm your license." : licMsg("bad"));
  return false;
}
// Shown when a saved key just needs to be re-checked: no typing, just retry.
function renderLicenseRetry(msg){
  closeAllLayers();
  const L = licRead() || {};
  $("#app").innerHTML = `<main class="lock"><div class="lock-inner">
    <div class="lock-label">
      <h1 class="wordmark">Profile Vault</h1>
      <div>Checkout profiles, addresses and cards</div>
      <div class="lock-rule"></div>
      <p>${esc(msg)}</p>
      <p class="item-sub" style="margin:0 0 16px">Saved key: <strong style="font-family:ui-monospace,Consolas,monospace">${esc(L.key || "")}</strong></p>
      <button class="btn btn-primary" type="button" id="lic-retry" style="width:100%;justify-content:center">Try again</button>
    </div>
  </div></main>`;
  $("#lic-retry").addEventListener("click", async (e) => {
    e.target.disabled = true; e.target.textContent = "Checking…";
    if (await licenseGate()) renderLock();
  });
}
// Background re-check (on unlock and every 6 hours). Locks the app if the key was turned off.
async function licRefresh(){
  const L = licRead(); if (!DESK || !L || !L.key) return;
  let list; try { list = await licFetch(); } catch(e){ return; }
  const r = await licCheck(L.key, list);
  if (r.st === "bad") return;
  // Ignore a list older than the one we already trust (stale cache or a replayed file).
  const old = L.list ? await licVerify(L.list) : null;
  if (old && r.issued && old.issued && r.issued < old.issued) return;
  licWrite(Object.assign(L, {list, checkedAt:Date.now(), exp:r.exp || ""}));
  if (r.st !== "ok"){ S = null; KEY = null; renderLicense(licMsg(r.st)); }
}
setInterval(licRefresh, 6 * 60 * 60 * 1000);

function renderLicense(msg){
  closeAllLayers();
  $("#app").innerHTML = `<main class="lock"><div class="lock-inner">
    ${msg ? `<p class="lock-msg">${esc(msg)}</p>` : ""}
    <form class="lock-label" id="lic-form" autocomplete="off">
      <h1 class="wordmark">Profile Vault</h1>
      <div>Checkout profiles, addresses and cards</div>
      <div class="lock-rule"></div>
      <p>Enter your license key to activate Profile Vault on this computer.</p>
      <div class="field" style="margin-bottom:12px"><label for="lic-key">License key</label><input id="lic-key" spellcheck="false" placeholder="PVLT-XXXX-XXXX-XXXX-XXXX" class="lic-input" required></div>
      <div class="field"><span class="err" id="lic-err" role="alert"></span></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px" id="lic-go">Activate</button>
    </form>
  </div></main>`;
  const inp = $("#lic-key"); setTimeout(() => inp && inp.focus(), 30);
  $("#lic-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#lic-err"), go = $("#lic-go");
    const key = licFormat(inp.value);
    err.textContent = "";
    if (!/^PVLT(-[A-Z0-9]{4}){4}$/.test(key)){ err.textContent = "That doesn't look like a license key. It starts with PVLT-."; return; }
    go.disabled = true; go.textContent = "Checking…";
    let list;
    try { list = await licFetch(); }
    catch(ex){ go.disabled = false; go.textContent = "Activate"; err.textContent = "Couldn't reach the license server. Check your internet connection."; return; }
    const r = await licCheck(key, list);
    if (r.st !== "ok"){ go.disabled = false; go.textContent = "Activate"; err.textContent = r.st === "off" ? "That key isn't valid." : licMsg(r.st); inp.select(); return; }
    licWrite({key, list, checkedAt:Date.now(), activatedAt:Date.now(), exp:r.exp || ""});
    renderLock();
    toast("License activated");
  });
}

  if (CLEAN.phase) CLEAN.progress = CLEAN.phase + ": " + CLEAN.progress;
  const el = document.getElementById("clean-progress"); if (el) el.textContent = CLEAN.progress;
});
// Important mail the cleaner must never offer, checked on every group's subject.
// Wider than the app's built-in list, and shipped with the page so it updates on its own.
const CLEAN_PROTECT = /(remind(er)?\s+to\s+pay|pay\s+(your|now|the|by|online|bill)|payment|\bbill(s|ing|ed)?\b|invoice|\bdue\b|past[\s-]?due|overdue|auto[\s-]?pay|balance|statement|polic(y|ies)|premium|renew(al|s|ing)?|insurance|coverage|\bclaim|deductible|\baccount\b|security|\balert|fraud|suspicious|unusual\s+activity|\btax(es)?\b|\bw-?2\b|\b1099\b|\birs\b|\bbank|deposit|withdraw|transfer|direct\s+deposit|credit\s+(card|limit|score)|\bloan|mortgage|\brent\b|lease|utilit(y|ies)|electric|water\s+bill|appointment|reservation|booking|itinerar|flight|boarding|check[\s-]?in|ticket|prescription|pharmacy|medical|doctor|dental|lab\s+result|test\s+result|(?<!pre-)(?<!pre)\border\b(?!s\s+(over|of)\b)|\bhas\s+shipped|\bshipped\b|shipping\s+(confirm|update|notice|label)|out\s+for\s+delivery|\bdelivered\b|delivery\s+(update|attempt|scheduled|confirm|notice)|your\s+package|\btrack(ing)?\b|receipt|refund|\breturn|cancel|verif|\bcode\b|passcode|password|sign[\s-]?in|log[\s-]?in|two[\s-]?factor|2-?step|\bpaycheck|payroll|pay\s*stub|benefit|enroll|court|jury|dmv|registration|license|permit|school|tuition|lease|contract|signature|sign\s+(your|the)|document)/i;
const cleanKeepList = () => (S && S.settings && Array.isArray(S.settings.cleanKeep)) ? S.settings.cleanKeep : [];
function applyCleanSafety(r){
  const keep = new Set(cleanKeepList().map(a => String(a).toLowerCase()));
  const safe = [], hidden = [];
  for (const g of r.groups){
    if (keep.has(String(g.senderAddr).toLowerCase()) || CLEAN_PROTECT.test(g.subject || "")) hidden.push(g); else safe.push(g);
  }
  r.groups = safe;
  r.protectedCount = (r.protectedCount || 0) + hidden.reduce((n, g) => n + g.uids.length, 0);
  r.total = safe.reduce((n, g) => n + g.uids.length, 0);
  return r;
}
