const FOLDER_NAME = {inbox:"Inbox", spam:"Spam"};
function cleanFolders(){
  if (CLEAN.folder === "all") return CAN_CLEAN_SPAM ? ["inbox", "spam"] : ["inbox"];
  return [CLEAN.folder];
}
async function cleanScan(){
  const ib = cleanInbox(); if (!ib) return;
  const folders = cleanFolders();
  CLEAN.inboxId = ib.id; CLEAN.busy = "scan"; CLEAN.progress = "Connecting…"; CLEAN.result = null; renderMain();
  const merged = new Map(); const uv = {}; const scanned = []; const skipped = [];
  let protectedCount = 0, failed = null;
  for (const folder of folders){
    CLEAN.phase = folders.length > 1 ? FOLDER_NAME[folder] : "";
    let r;
    try { r = await window.pvDesktop.scanPromos({id:ib.id, email:ib.email, password:ib.password, host:ib.host, port:ib.port, days:CLEAN.days, folder}); }
    catch(e){ r = {ok:false, error:"The scan stopped unexpectedly."}; }
    if (!r.ok){
      // No Spam folder on this account: just skip it when scanning both.
      if (folder === "spam" && folders.length > 1 && /spam folder/i.test(r.error || "")){ skipped.push("Spam"); continue; }
      failed = r.error; break;
    }
    uv[folder] = r.uidValidity; scanned.push(folder); protectedCount += r.protectedCount || 0;
    for (const g of r.groups){
      let m = merged.get(g.key);
      if (!m){ m = {key:g.key, sender:g.sender, senderAddr:g.senderAddr, subject:g.subject, uids:[], parts:{}}; merged.set(g.key, m); }
      m.parts[folder] = (m.parts[folder] || []).concat(g.uids);
      m.uids = m.uids.concat(g.uids.map(u => folder + ":" + u));
    }
  }
  CLEAN.busy = ""; CLEAN.progress = ""; CLEAN.phase = "";
  if (failed){ toast(failed, "err"); renderMain(); return; }
  const groups = Array.from(merged.values()).sort((a, b) => b.uids.length - a.uids.length);
  const r = {groups, uidValidity:uv, folders:scanned, protectedCount, total:groups.reduce((n, g) => n + g.uids.length, 0)};
  CLEAN.result = applyCleanSafety(r); CLEAN.sel = new Set(CLEAN.result.groups.map(g => g.key));
  if (skipped.length) toast("This account has no Spam folder, so only the Inbox was checked.");
  renderMain();
}
async function cleanTrash(){
  const ib = cleanInbox(), r = CLEAN.result; if (!ib || !r) return;
  const groups = r.groups.filter(g => CLEAN.sel.has(g.key));
  const byFolder = {};
  groups.forEach(g => Object.entries(g.parts || {}).forEach(([f, list]) => { byFolder[f] = (byFolder[f] || []).concat(list); }));
  const count = Object.values(byFolder).reduce((n, l) => n + l.length, 0);
  if (!count) return;
  const where = Object.keys(byFolder).map(f => FOLDER_NAME[f]).join(" and ");
  if (!(await confirmDialog({title:`Move ${plural(count, "email")} to Trash?`, body:`From ${plural(groups.length, "sender group")} in ${ib.email}'s ${where}. You can restore them from Trash for 30 days.`, confirm:"Move to Trash"}))) return;
  CLEAN.busy = "trash"; CLEAN.progress = "Moving to Trash…"; renderMain();
  let moved = 0, err = null;
  for (const [folder, uids] of Object.entries(byFolder)){
    let res;
    try { res = await window.pvDesktop.trashPromos({id:ib.id, email:ib.email, password:ib.password, host:ib.host, port:ib.port, folder}, uids, r.uidValidity[folder]); }
    catch(e){ res = {ok:false, error:"Moving stopped unexpectedly."}; }
    if (!res.ok){ err = `${FOLDER_NAME[folder]}: ${res.error}`; break; }
    moved += res.moved || 0;
    // Drop what was moved from this folder, keep anything still waiting in the other one.
    groups.forEach(g => { if (g.parts) delete g.parts[folder]; });
  }
  CLEAN.busy = ""; CLEAN.progress = "";
  r.groups = r.groups.filter(g => !(CLEAN.sel.has(g.key) && !Object.keys(g.parts || {}).length));
  r.groups.forEach(g => { g.uids = Object.entries(g.parts || {}).flatMap(([f, l]) => l.map(u => f + ":" + u)); });
  r.total = r.groups.reduce((n, g) => n + g.uids.length, 0);
  CLEAN.sel = new Set(r.groups.map(g => g.key));
  if (err) toast((moved ? `Moved ${plural(moved, "email")}, then stopped. ` : "") + err, "err");
  else toast(`Moved ${plural(moved, "email")} to Trash`);
  renderMain();
}

// Auto-clean: while the vault is unlocked, scan the chosen inbox every 10 minutes
// and move promo emails to Trash. Same safety filters as a manual scan.
const autoCleanCfg = () => (S && S.settings && S.settings.autoClean) || {on:false};
let autoCleanTimer = null, autoCleanRunning = false;
function scheduleAutoClean(){
  clearInterval(autoCleanTimer); autoCleanTimer = null;
  if (!DESK || !CAN_CLEAN || !S || !autoCleanCfg().on) return;
  // Show the auto-clean inbox and folder in the pickers.
  if (!CLEAN.inboxId) CLEAN.inboxId = autoCleanCfg().inboxId || "";
  if (autoCleanCfg().folder) CLEAN.folder = autoCleanCfg().folder;
  setTimeout(() => { if (S) runAutoClean(); }, 20000);
  autoCleanTimer = setInterval(() => { if (S) runAutoClean(); }, 10 * 60 * 1000);
}
async function runAutoClean(){
  const cfg = autoCleanCfg();
  if (!S || !cfg.on || autoCleanRunning || CLEAN.busy) return;
  const ib = inboxById(cfg.inboxId) || S.inboxes.find(i => i.password);
  if (!ib || !ib.password) return;
  autoCleanRunning = true;
  const folders = cfg.folder === "all" || !cfg.folder ? (CAN_CLEAN_SPAM ? ["inbox", "spam"] : ["inbox"]) : [cfg.folder];
  let moved = 0, err = "";
  try {
    for (const folder of folders){
      // Only recent mail: anything older was handled by an earlier run.
      const r = await window.pvDesktop.scanPromos({id:ib.id, email:ib.email, password:ib.password, host:ib.host, port:ib.port, days:3, folder});
      if (!r.ok){ if (folder === "spam" && /spam folder/i.test(r.error || "")) continue; err = r.error; break; }
      applyCleanSafety(r);
      const uids = r.groups.flatMap(g => g.uids);
      if (!uids.length) continue;
      const res = await window.pvDesktop.trashPromos({id:ib.id, email:ib.email, password:ib.password, host:ib.host, port:ib.port, folder}, uids, r.uidValidity);
      if (!res.ok){ err = res.error; break; }
      moved += res.moved || 0;
    }
  } catch(e){ err = "Auto-clean stopped unexpectedly."; }
  autoCleanRunning = false;
  if (!S) return;
  S.settings.autoClean = Object.assign({}, autoCleanCfg(), {lastRun:Date.now(), lastMoved:moved, lastError:err, total:(autoCleanCfg().total || 0) + moved});
  persist();
  if (moved){ CLEAN.result = null; toast(`Auto-clean moved ${plural(moved, "email")} to Trash`); }
  if (UI.view === "clean" && !CLEAN.busy) renderMain();
}
function autoCleanHTML(){
  const c = autoCleanCfg();
  const last = !c.on ? "" : c.lastError ? `<span class="err">Last run failed: ${esc(c.lastError)}</span>`
    : c.lastRun ? `Last run ${new Date(c.lastRun).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}: moved ${plural(c.lastMoved || 0, "email")}. ${plural(c.total || 0, "email")} cleared so far.`
    : "First run starts in a few seconds.";
  return `<label class="check check-box" style="margin:0 0 14px"><input type="checkbox" id="cl-auto" ${c.on ? "checked" : ""}><span><strong>Auto-clean every 10 minutes</strong><br><span class="item-sub">Uses the inbox and folder picked above. Runs while the app is open and unlocked. ${last}</span></span></label>`;
}

function ordersCSV(){

function jsonOrdersToRows(text){

  if (!list) return null;
  return list.map((c, i) => {
    const st = STORES.find(x => x[0] !== "other" && (x[0] === c.storeId || norm(x[1]) === norm(c.store)));
    return { line:i+1, store:st ? st[0] : "other", storeName:st ? "" : (c.store || "Other"),

      card:c.card || "", arrives:c.arrives || "", buyer:c.buyer || c.accountEmail || "" };
  });
}

/* ================= SHARED INBOX (runtime db) ================= */
const RT = {ready:false, db:null, user:null, isOwner:false, canWrite:null, uid:"", config:null};
let INBOX = [];
async function initRuntime(){
  try {
    if (!window.claude || typeof claude.use !== "function"){ RT.ready = true; return; }
    const [db, user] = await Promise.all([
      claude.use("db").catch(() => null),
      claude.use("user").catch(() => null)
    ]);
    RT.db = db || null; RT.user = user || null;
    if (user){
      try { RT.isOwner = await user.isOwner(); } catch(e){}
      try { RT.canWrite = await user.can("data.write"); } catch(e){}
      try { RT.uid = await user.id(); } catch(e){}
    }
    if (RT.db){
      try { const d = await RT.db.doc("inbox/config").get(); RT.config = d.exists ? d.data() : null; } catch(e){}
    }
    RT.ready = true;
    if (S) render(); else renderLock();
  } catch(e){ RT.ready = true; }
}
async function publishInboxKey(){
  if (!RT.db || !S.share) return false;
  const keyId = await keyIdOf(S.share.pub);
  await RT.db.doc("inbox/config").set({pub:S.share.pub, keyId, at:new Date().toISOString()});
  RT.config = {pub:S.share.pub, keyId};
  return true;
}
async function inboxOff(){
  if (!RT.db) return;
  try { await RT.db.doc("inbox/config").delete(); } catch(e){}
  RT.config = null;
}
async function loadInbox(){
  INBOX = [];
  if (!RT.db || !S.share) return;
  const snap = await RT.db.collection("submissions").get();
  for (const d of snap.docs){
    const body = d.data() || {};
    const items = Array.isArray(body.items) ? body.items : [];
    for (const it of items){
      const row = {docId:d.id, id:it.id, at:it.at, ok:false, from:"", profiles:[], slots:[]};
      try {
        const pl = await openSubmission(it.payload, S.share.priv);
        row.ok = true; row.from = pl.from || ""; row.profiles = pl.profiles || []; row.slots = pl.slots || [];
      } catch(e){ row.err = "Encrypted for a different vault key."; }
      INBOX.push(row);
    }
  }
  INBOX.sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
}
async function dropSubmission(row){
  const ref = RT.db.doc("submissions/" + row.docId);
  const d = await ref.get();
  const items = ((d.data() || {}).items || []).filter(x => x.id !== row.id);
  if (items.length) await ref.set({items, updatedAt:new Date().toISOString()});
  else await ref.delete();
}
async function sendToInbox(payload, from){
  const code = await sealSubmission(RT.config.pub, payload);
  const ref = RT.db.doc("submissions/" + (RT.uid || "anon"));
  let items = [];
  try { const d = await ref.get(); if (d.exists) items = (d.data() || {}).items || []; } catch(e){}
  items.push({id:uid(), at:new Date().toISOString(), from, payload:code});
  await ref.set({items:items.slice(-25), updatedAt:new Date().toISOString()});
  return code;
}

function renderInbox(){
  const head = `<div class="view-head"><div><h1 class="view-title">Inbox</h1><p class="view-sub">Profiles people sent straight to this vault. Only you can open them.</p></div>

  if (!RT.db) return head + `<div class="empty"><h2>The inbox isn't available here</h2><p>Open the published page on claude.ai while signed in. On a downloaded copy of the file there's no shared storage, so use the invite-code route instead.</p></div>`;

  return head + `<div class="grid">${rows}</div>`;
}

/* ================= SUBMIT SLOTS ================= */
const DEFAULT_CAP = 3;
const capOf = (k) => { const c = (S.caps || {})[k]; return c == null ? DEFAULT_CAP : c; };
const slotKey = (pid, k) => pid + "@" + k;
const isSel = (pid, k) => (S.slots || []).includes(slotKey(pid, k));
const isSub = (pid, k) => !!(S.subs || {})[slotKey(pid, k)];
function setSel(pid, k, on){
  S.slots = S.slots || [];
  const key = slotKey(pid, k);
  if (on){ if (!S.slots.includes(key)) S.slots.push(key); }
  else S.slots = S.slots.filter(x => x !== key);
}
function storeGroups(){
  const map = new Map();
  S.profiles.forEach(p => profileStores(p).forEach(e => {
    const k = storeKeyOf(e);
    if (!map.has(k)) map.set(k, {key:k, name:storeLabel(e), rows:[]});
    map.get(k).rows.push({p, e, l:loginById(e.loginId)});
  }));
  const out = Array.from(map.values());
  out.forEach(g => {
    g.rows.sort((a, b) => natural(a.p.name, b.p.name));
    g.cap = capOf(g.key);
    g.sel = g.rows.filter(r => isSel(r.p.id, g.key));
    g.sub = g.rows.filter(r => isSub(r.p.id, g.key));
    g.fresh = g.sel.filter(r => !isSub(r.p.id, g.key));
  });
  return out.sort((a, b) => natural(a.name, b.name));
}
const running = () => (S.lastBatch || []).filter(k => (S.subs || {})[k]).length;

function submitRowHTML(r, g){
  const sel = isSel(r.p.id, g.key), sub = isSub(r.p.id, g.key), c = cardById(r.p.cardId);
  const done = (S.subs || {})[slotKey(r.p.id, g.key)];
  return `<article class="slot ${sel ? "is-on" : ""}">
    <div class="slot-top"><div class="slot-name">${esc(r.p.name)}</div>
      <label class="sw"><input type="checkbox" data-act="slot" data-id="${r.p.id}" data-store="${esc(g.key)}" ${sel ? "checked" : ""} aria-label="Select ${esc(r.p.name)} for ${esc(g.name)}"><span class="sw-track"></span></label></div>
    <div class="slot-meta">
      <span>${c ? `${esc(cardBrand(c))} •• ${esc(last4(c.number))}` : `<span class="expired">No card</span>`}${sub ? ` <span class="pill pill-on">Submitted</span>` : sel ? ` <span class="pill">Staged</span>` : ""}</span>
      <span>${ic("lock").replace("<svg", '<svg style="width:13px;height:13px;vertical-align:-2px;margin-right:4px"')}${r.l ? esc(r.l.email) : r.e.email ? `${esc(r.e.email)} ${r.e.verified ? `<span class="pill pill-on">Verified</span>` : `<span class="pill pill-warn">Not verified</span>`}` : `<span class="expired">No login</span>`}</span>
      ${done ? `<span>Sent ${esc(new Date(done.at).toLocaleDateString(undefined, {month:"short", day:"numeric"}))}${done.to ? " to " + esc(done.to) : ""}</span>` : ""}
    </div>
  </article>`;
}
function renderSubmit(){

  const body = groups.map(g => {

        <div class="store-tools"><button class="btn btn-sm" data-act="sel-store" data-id="${esc(g.key)}" ${full ? "disabled" : ""}>Select all</button><button class="btn btn-sm" data-act="desel-store" data-id="${esc(g.key)}" ${!g.sel.length ? "disabled" : ""}>Deselect all</button><span class="item-sub">Select all fills up to your ${g.cap} cap.</span></div>
        ${rows.length ? `<div class="grid grid-slots">${rows.map(r => submitRowHTML(r, g)).join("")}</div>` : `<p class="item-sub" style="margin:0">No profiles match "${esc(UI.q)}".</p>`}
      </div>` : ""}
    </section>`;
  }).join("");
  const to = S.submitTo;
  return `<div class="view-head"><div><h1 class="view-title">Submit</h1><p class="view-sub">Stage profiles per store, then send them in one encrypted batch</p></div></div>
    <div class="panelbox">
      <div class="stats">${stat("Profiles", S.profiles.length, "saved in your library")}${stat("Selected", selN, "staged for this run")}${stat("Submitted", subN, "already sent")}${stat("Running", running(), "in the latest batch")}</div>
      <div class="submit-bar">
        <p class="item-sub" style="margin:0;flex:1;min-width:220px">Toggle profiles on, then submit. Only new picks are sent, so nothing is ever sent twice.${to ? ` Going to <strong>${esc(to.keyId)}</strong>. <button class="link" data-act="submit-to" style="font-size:calc(13px*var(--fs))">Change</button>` : ` <button class="link" data-act="submit-to" style="font-size:calc(13px*var(--fs))">Set who receives them</button>`}</p>
        <button class="btn btn-primary" data-act="submit-slots" ${freshN ? "" : "disabled"}>${ic("exp")}Submit ${freshN ? plural(freshN, "slot") : "slots"}</button>
      </div>
    </div>
    <p class="note" style="margin:0 0 16px">Selecting a profile only stages it, so toggle freely. Each store has its own cap; at the cap, selecting another asks which to swap out.</p>
    ${body}`;
}

function openSubmitTo(){
  openLayer({
    title:"Who receives your slots", small:true,
    body:`<p style="margin:0 0 14px;color:var(--ink-2)">Paste the invite code they sent you. Your slots are encrypted so only they can open them. Leave it empty to download a plain file instead.</p>
      <div class="field"><label for="st-code">Invite code</label><textarea id="st-code" spellcheck="false" style="min-height:80px" placeholder="PVKEY1.…">${esc(S.submitTo ? "PVKEY1." + S.submitTo.pub : "")}</textarea><span class="err" id="st-err" role="alert"></span></div>
      <p class="note" id="st-id" hidden style="margin:12px 0 0"></p>`,
    foot:`${S.submitTo ? `<button class="btn btn-quiet btn-danger" id="st-clear">Remove</button><span class="spacer"></span>` : ""}<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="st-save">Save</button>`,
    mount:(panel, close) => {
      const ta = $("#st-code", panel), err = $("#st-err", panel), idp = $("#st-id", panel);
      let found = S.submitTo || null, seq = 0;
      const check = async () => {
        const my = ++seq; err.textContent = ""; idp.hidden = true; found = null;
        const m = ta.value.match(/PVKEY1\.([A-Za-z0-9_-]{40,})/);
        if (!m){ if (ta.value.trim()) err.textContent = "Couldn't find a code starting with PVKEY1."; return; }
        try { await importOwnerPub(m[1]); const id = await keyIdOf(m[1]); if (my !== seq) return; found = {pub:m[1], keyId:id}; idp.hidden = false; idp.textContent = `Key ID ${id}. Check it matches the one in their invite.`; }
        catch(e){ if (my === seq) err.textContent = "That code is damaged. Ask for it again."; }
      };
      ta.addEventListener("input", check); check();
      const cl = $("#st-clear", panel);
      if (cl) cl.addEventListener("click", () => { S.submitTo = null; persist(); render(); close(); });
      $("#st-save", panel).addEventListener("click", () => {
        if (!ta.value.trim()){ S.submitTo = null; persist(); render(); close(); return; }
        if (!found){ err.textContent = err.textContent || "Paste a valid invite code."; return; }
        S.submitTo = found; persist(); render(); toast("Recipient saved"); close();
      });
    }
  });
}

async function chooseSwap(g, incoming){
  return new Promise((resolve) => {
    let done = false;
    openLayer({
      title:`${g.name} is at its ${g.cap}-slot cap`, small:true,
      body:`<p style="margin:0 0 14px;color:var(--ink-2)">Pick one to swap out for ${esc(incoming.name)}, or raise the cap.</p>
        <div class="radios">${g.sel.map((r, i) => `<label class="radio"><input type="radio" name="swap" value="${r.p.id}" ${i === 0 ? "checked" : ""}>${esc(r.p.name)}${isSub(r.p.id, g.key) ? `<small>Already submitted</small>` : ""}</label>`).join("")}</div>`,
      foot:`<button class="btn btn-quiet" id="sw-cap">Raise cap</button><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="sw-go">Swap</button>`,
      onClose:() => { if (!done) resolve(null); },

async function toggleSlot(pid, k, on, cb){
  const g = storeGroups().find(x => x.key === k); if (!g) return;
  if (!on){ setSel(pid, k, false); persist(); renderMain(); return; }
  if (g.sel.length >= g.cap){
    const p = S.profiles.find(x => x.id === pid);
    const r = await chooseSwap(g, p);
    if (!r){ if (cb) cb.checked = false; return; }
    if (r.raise){ const c = await promptCap(k, g.cap + 1); if (c == null){ if (cb) cb.checked = false; return; } }
    else setSel(r.out, k, false);
  }
  setSel(pid, k, true); persist(); renderMain();
}
async function promptCap(k, suggested){

const APP_URL = "https://claude.ai/artifact/4cZrwMaJ8DFgpsZWoyt2iB";
let MODE = "vault", SUB = null, SENT = false;
const b64u = (buf) => toB64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const fromB64u = (s) => fromB64(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length + 3) % 4));
const ECDH = {name:"ECDH", namedCurve:"P-256"};
const SUB_INFO = enc.encode("profile-vault-submission-v1");
async function keyIdOf(pubB64u){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", fromB64u(pubB64u)));
  const hex = Array.from(h.slice(0,4)).map(x => x.toString(16).padStart(2,"0")).join("");
  return (hex.slice(0,4) + "-" + hex.slice(4)).toUpperCase();
}
async function subKey(priv, pub, salt, usage){
  const bits = await crypto.subtle.deriveBits({name:"ECDH", public:pub}, priv, 256);
  const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt, info:SUB_INFO}, hk, {name:"AES-GCM", length:256}, false, [usage]);
}
async function importOwnerPub(pubB64u){ return crypto.subtle.importKey("raw", fromB64u(pubB64u), ECDH, false, []); }
async function sealSubmission(pubB64u, payload){
  const pub = await importOwnerPub(pubB64u);
  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveBits"]);
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const key = await subKey(eph.privateKey, pub, epk, "encrypt");
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(payload)));
  return "PVSUB1." + [b64u(epk), b64u(iv), b64u(ct)].join(".");
}
async function openSubmission(code, jwk){
  const parts = code.replace(/\.+$/, "").split(".");
  if (parts.length !== 4 || parts[0] !== "PVSUB1") throw new Error("One of the codes is incomplete. Ask the sender to copy it again.");
  try {
    const priv = await crypto.subtle.importKey("jwk", jwk, ECDH, false, ["deriveBits"]);
    const epkRaw = fromB64u(parts[1]);
    const epk = await crypto.subtle.importKey("raw", epkRaw, ECDH, false, []);
    const key = await subKey(priv, epk, epkRaw, "decrypt");
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64u(parts[2])}, key, fromB64u(parts[3]));
    return JSON.parse(dec.decode(pt));
  } catch(e){ throw new Error("A code wasn't made for this vault, or it was cut off when copied."); }
}
async function setupCollecting(){
  const kp = await crypto.subtle.generateKey(ECDH, true, ["deriveBits"]);
  S.share = { pub:b64u(await crypto.subtle.exportKey("raw", kp.publicKey)), priv:await crypto.subtle.exportKey("jwk", kp.privateKey), createdAt:Date.now() };
  await persist();
}

      if (await confirmDialog({title:`Import ${plural(plan.profiles.length, "profile")}?`, body:`From ${r.from || "this sender"}. They'll go into a group with their name.`, confirm:"Import"})){
        S.groups.push(...plan.groups); S.addresses.push(...plan.addresses); S.cards.push(...plan.cards); S.inboxes.push(...plan.inboxes); S.logins.push(...plan.logins); S.profiles.push(...plan.profiles); S.checkouts.push(...plan.checkouts);
        try { await dropSubmission(r); } catch(e){}
        try { await loadInbox(); } catch(e){}
        persist(); UI.view = "profiles"; render();
        toast(`Imported ${plural(plan.profiles.length, "profile")}`);
      } break; }
    case "inbox-drop": { const r = INBOX[+id]; if (!r) break;
      if (await confirmDialog({title:"Delete this submission?", body:`From ${r.from || "this sender"}. It can't be recovered.`, confirm:"Delete", danger:true})){
        try { await dropSubmission(r); await loadInbox(); render(); toast("Deleted"); } catch(e){ toast("Couldn't delete it.", "err"); }
      } break; }
    case "clean-scan": cleanScan(); break;
    case "clean-keep": {
      const addr = String(id || "").toLowerCase(); if (!addr) break;
      const list = cleanKeepList().slice(); if (!list.includes(addr)) list.push(addr);
      S.settings.cleanKeep = list; persist();
      if (CLEAN.result){ applyCleanSafety(CLEAN.result); CLEAN.sel = new Set(CLEAN.result.groups.filter(g => CLEAN.sel.has(g.key)).map(g => g.key)); }
      toast(`Emails from ${addr} will always be kept`); renderMain(); break; }
    case "clean-unkeep": {
      S.settings.cleanKeep = cleanKeepList().filter(a => a !== id); persist();
      toast(`${id} is no longer always kept. Scan again to see its emails.`); renderMain(); break; }
    case "clean-trash": cleanTrash(); break;
    case "clean-all": if (CLEAN.result){ CLEAN.sel = new Set(CLEAN.result.groups.map(g => g.key)); renderMain(); } break;
    case "clean-none": CLEAN.sel = new Set(); renderMain(); break;
    case "clean-pick": if (t.checked) CLEAN.sel.add(id); else CLEAN.sel.delete(id); renderMain(); break;
    case "export-cards": openExportCards(); break;
    case "new-order": openOrderEditor(null); break;
    case "edit-order": { const o = orderById(id); if (o) openOrderEditor(o); break; }
    case "delete-order": { const o = orderById(id); if (!o) break;
      if (await confirmDialog({title:"Delete order?", body:`${o.item || "This order"} will be removed.`, confirm:"Delete", danger:true})){
        S.orders = S.orders.filter(x => x.id !== id); persist(); render(); toast("Order deleted");
      } break; }
    case "order-stage": UI.orderStage = id; renderMain(); break;
    case "order-inbox": UI.orderInbox = id; UI.store = "all"; renderMain(); break;
    case "orders-sync": ordersSync(); break;
    case "email-import": openEmailImport(); break;
    case "upd-check": { if (!CAN_UPDATE) break; t.disabled = true; const st = await window.pvDesktop.checkForUpdates(); UPD.status = st; updateBanner(); await refreshUpdateInfo();
      if (st.state === "current") toast("You're on the latest version."); else if (st.state === "error") toast(st.error, "err"); else if (st.state === "not-configured") toast("Add the update address first.", "err"); break; }
    case "upd-restart": if (CAN_UPDATE) window.pvDesktop.restartToUpdate(); break;
    case "upd-save": { if (!CAN_UPDATE) break; const u = (($('[name="upd-url"]') || {}).value || "").trim();
      const r = await window.pvDesktop.setUpdateSource(u);
      if (!r.ok){ toast(r.error, "err"); break; }
      toast(u ? "Update address saved" : "Update address cleared"); await refreshUpdateInfo();
      if (u){ const st = await window.pvDesktop.checkForUpdates(); UPD.status = st; updateBanner(); await refreshUpdateInfo(); if (st.state === "error") toast(st.error, "err"); else if (st.state === "current") toast("You're on the latest version."); }
      break; }
    case "ibx-sync": { const i = inboxById(id); if (i) syncOneInbox(i, false); break; }
    case "ibx-auto": { const i = inboxById(id); if (i){ i.auto = t.checked; persist(); toast(t.checked ? `Auto-sync on for ${i.email}` : `Auto-sync off for ${i.email}`); } break; }
    case "app-pw-help": openAppPasswordHelp(); break;
    case "sync-all": if (DESK){ syncAllInboxes(false); break; } if (serverReady() && !ON_CLAUDE){ try { const r = await pullFromServer({syncFirst:true}); render(); toast(r.added ? `Synced ${plural(r.added, "new order")}` : "Up to date, no new orders"); } catch(e){ toast(e.message, "err"); } } else openSyncInbox(null); break;
    case "sync-inbox": if (serverReady() && !ON_CLAUDE){ try { const r = await pullFromServer({syncFirst:true}); render(); toast(r.added ? `Synced ${plural(r.added, "new order")}` : "Up to date, no new orders"); } catch(e){ toast(e.message, "err"); } } else openSyncInbox(inboxById(id)); break;
    case "srv-save": case "srv-test": case "srv-pull": {
      const url = (($('[name="srv-url"]') || {}).value || "").trim(), token = (($('[name="srv-token"]') || {}).value || "").trim();
      if (url && !/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/i.test(url)){ toast("The server URL should start with https://", "err"); break; }
      S.settings.server = Object.assign({}, serverCfg(), {url, token}); persist();
      if (act === "srv-save"){ toast("Server saved"); renderMain(); scheduleAutoPull(); break; }
      t.disabled = true;
      try {
        if (act === "srv-test"){ const d = await serverCall("/orders", "GET"); S.settings.server.lastPull = new Date().toISOString(); S.settings.server.lastSync = d.lastSync || null; persist(); toast(`Connected. The server holds ${plural((d.orders || []).length, "order")}.`); }
        else { const r = await pullFromServer({syncFirst:true}); toast(r.added ? `Added ${plural(r.added, "new order")}` : "Up to date, no new orders"); }
      } catch(e){ toast(e.message, "err"); }
      render(); break; }
    case "watcher-guide": openWatcherGuide(); break;
    case "set-jump": { const el = document.getElementById(id); if (el){ el.scrollIntoView({behavior:"smooth", block:"start"}); $$(".set-link").forEach(x => x.setAttribute("aria-current", x.dataset.id === id)); } break; }
    case "new-inbox-only": openInboxEditor({id:uid(), createdAt:Date.now(), email:"", provider:"", host:"", port:"993", password:"", _new:true}); break;
    case "orders-csv": { if (DL || IS_LOCAL) saveFile(`orders-${new Date().toISOString().slice(0,10)}.csv`, ordersCSV()); else copyText(ordersCSV(), "orders CSV"); break; }
    case "settings-backup": { await saveChain; saveFile(`profile-vault-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(VAULT)); break; }
    case "settings-backup-copy": { await saveChain; copyText(JSON.stringify(VAULT), "encrypted backup"); break; }
    case "settings-restore": openRestore(true); break;
    case "settings-erase": { if (await confirmDialog({title:"Erase vault?", body:"This deletes everything on this device. It can't be undone.", confirm:"Erase vault", danger:true, typeWord:"ERASE"})){ clearStore(); VAULT=null; S=null; KEY=null; renderLock("Vault erased. Create a new master password to start over."); } break; }
    case "new-checkout": openCheckoutEditor(null); break;
    case "edit-checkout": { const c = (S.checkouts || []).find(x => x.id === id); if (c) openCheckoutEditor(c); break; }
    case "delete-checkout": { const c = (S.checkouts || []).find(x => x.id === id); if (!c) break;
      if (await confirmDialog({title:"Delete this checkout?", body:`${c.item || "This checkout"} will be removed from the log.`, confirm:"Delete", danger:true})){
        S.checkouts = S.checkouts.filter(x => x.id !== id); persist(); render(); toast("Checkout deleted");
      } break; }
    case "new-card": openCardEditor(null); break;
    case "import-cards": openBulkCards(); break;
    case "edit-card": { const c = cardById(id); if (c) openCardEditor(c); break; }
    case "reveal": if (UI.reveal.has(id)) UI.reveal.delete(id); else UI.reveal.add(id); renderMain(); break;
    case "copy-card": { const c = cardById(id); if (c) copyText(digits(c.number), "card number"); break; }
    case "delete-card": { const c = cardById(id); if (!c) break; const n = cardUses(id);
      if (await confirmDialog({title:"Delete card?", body: n ? `It's used by ${plural(n,"profile")}. They'll need a new card before you export them.` : `"${cardTitle(c)}" will be removed.`, confirm:"Delete card", danger:true})){
        S.profiles.forEach(p => { if (p.cardId === id) p.cardId = null; });
        S.cards = S.cards.filter(x => x.id !== id); UI.reveal.delete(id); persist(); render(); toast("Card deleted");
      } break; }
    case "import": openImport(); break;
    case "export": if (!S.profiles.length) toast("Add a profile first, then export it."); else openExport(); break;
    case "settings": UI.view = "settings-view"; UI.q = ""; { const q = $("#q"); if (q) q.value = ""; } render(); window.scrollTo(0, 0); break;
    case "settings-more": openSettings(); break;
    case "lock": lock("Locked. Enter your master password to continue."); break;
    case "send": openSend(); break;
    case "exit-submit":
      if (!S.profiles.length || SENT || await confirmDialog({title:"Leave without sending?", body:"The profiles you added here will be cleared.", confirm:"Leave", danger:true})){ S = null; UI.selected.clear(); renderLock(); }
      break;
  }
});

["input","change"].forEach(ev => document.addEventListener(ev, (e) => {
  if (S && (e.target.id === "cl-inbox" || e.target.id === "cl-folder") && autoCleanCfg().on){
    S.settings.autoClean = Object.assign({}, autoCleanCfg(), e.target.id === "cl-inbox" ? {inboxId:e.target.value} : {folder:e.target.value}); persist();
  }
  if (S && e.target.id === "cl-inbox"){ CLEAN.inboxId = e.target.value; CLEAN.result = null; renderMain(); }
  if (S && e.target.id === "cl-days"){ CLEAN.days = +e.target.value; }
  if (S && e.target.id === "cl-auto" && e.type === "change"){
    const ib = cleanInbox();
    S.settings.autoClean = Object.assign({}, autoCleanCfg(), {on:e.target.checked, inboxId:ib ? ib.id : "", folder:CLEAN.folder, lastRun:0, lastError:""});
    persist(); scheduleAutoClean(); renderMain();
    toast(e.target.checked ? `Auto-clean on for ${ib ? ib.email : "your inbox"}` : "Auto-clean off");
  }
  if (S && e.target.id === "cl-folder"){ CLEAN.folder = e.target.value; CLEAN.result = null; renderMain(); }
  if (S && e.target.name === "set-keep"){ S.settings.keepEmails = e.target.checked; persist(); }
  if (S && e.target.name === "srv-auto"){ S.settings.server = Object.assign({}, serverCfg(), {auto:e.target.checked}); persist(); scheduleAutoPull(); }
  if (S && e.target.name === "set-auto"){ S.settings.autoAdd = e.target.checked; persist(); }
  if (S && e.target.name === "set-theme" && e.type === "change") setTheme(e.target.value);
  if (S && e.target.name === "set-autolock"){ S.settings.autoLockMin = +e.target.value; persist(); renderSide(); }
  const fd = e.target.closest && e.target.closest(".field.has-err");
  if (fd){ fd.classList.remove("has-err"); const er = fd.querySelector(".err"); if (er) er.textContent = ""; }
}, true));
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if (menuEl){ closeMenu(); return; }
    if (stack.length){ stack[stack.length-1].close(); return; }
  }
  if (e.key === "Tab" && stack.length){
    const panel = $(".panel", stack[stack.length-1].el);
    const f = $$('button:not([disabled]):not([hidden]),input:not([disabled]):not(.sr),select,textarea,[tabindex]:not([tabindex="-1"])', panel).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
  if (e.key === "/" && S && !stack.length && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); const q = $("#q"); if (q) q.focus(); }
});

["pointerdown","keydown","wheel","touchstart"].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, {passive:true}));
function checkIdle(){
  if (!S) return;
  const m = MODE === "submit" ? 30 : S.settings.autoLockMin;
  if (m && Date.now() - lastActive > m * 60000) lock(MODE === "submit" ? "Cleared after 30 minutes without activity. Nothing was saved or sent." : `Locked after ${m} minutes without activity.`);
}
setInterval(checkIdle, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkIdle(); });
window.matchMedia("(max-width:900px)").addEventListener("change", () => { if (S) renderMain(); });

initRuntime();
licenseGate().then(ok => { if (ok) renderLock(); }, () => renderLock());
// Tell the updater this page started, whether or not the app is licensed yet.
try { if (window.pvDesktop && window.pvDesktop.appReady) window.pvDesktop.appReady(); } catch(e){}
})();
</script>
</body>
