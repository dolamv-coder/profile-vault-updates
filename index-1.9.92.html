function blankState(){ return { v:1, settings:{autoLockMin:15, keepEmails:true, autoAdd:false}, groups:[], cardGroups:[], addresses:[], cards:[], profiles:[], logins:[], inboxes:[], checkouts:[], orders:[], deletedOrders:{}, caps:{}, slots:[], subs:{}, lastBatch:[], pulls:[], submitTo:null, submitName:"" }; }
function sanitizeState(s){
  const b = blankState();
  if (!s || typeof s !== "object") return b;
  return {
    v:1,
    settings: Object.assign({}, b.settings, s.settings || {}),
    groups: Array.isArray(s.groups) ? s.groups : [],
    cardGroups: Array.isArray(s.cardGroups) ? s.cardGroups : [],
    addresses: Array.isArray(s.addresses) ? s.addresses : [],
    cards: Array.isArray(s.cards) ? s.cards : [],
    profiles: (Array.isArray(s.profiles) ? s.profiles : []).map(p => {
      if (!Array.isArray(p.stores)){
        const src = Array.isArray(s.logins) ? s.logins : [];
        p.stores = (Array.isArray(p.loginIds) ? p.loginIds : []).map(id => src.find(l => l.id === id)).filter(Boolean)
          .map(l => ({store:l.store, storeName:l.storeName || "", mode:"login", loginId:l.id, email:"", verified:false}));

      p.stores.forEach(e => { if (e && typeof e === "object") fixMode(e, p.email, e.loginId && Array.isArray(s.logins) ? s.logins.find(l => l && l.id === e.loginId) : null); });

    deletedOrders: s.deletedOrders && typeof s.deletedOrders === "object" && !Array.isArray(s.deletedOrders) ? s.deletedOrders : {},
    caps: s.caps && typeof s.caps === "object" ? s.caps : {},
    slots: Array.isArray(s.slots) ? s.slots : [],
    // A submitted slot stays switched on until it's pulled. One that's off was switched off before
    // pulling cleared its Submitted mark (1.9.49 and earlier), so it counts as not submitted.
    subs: s.subs && typeof s.subs === "object" ? Object.fromEntries(Object.entries(s.subs).filter(([k]) => Array.isArray(s.slots) && s.slots.includes(k))) : {},
    lastBatch: Array.isArray(s.lastBatch) ? s.lastBatch.filter(k => Array.isArray(s.slots) && s.slots.includes(k)) : [],
    pulls: Array.isArray(s.pulls) ? s.pulls : [],

/* ---------- storage + crypto ---------- */
function readStore(){
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ STORAGE_OK = false; return null; }
}
function writeStore(rec){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(rec)); STORAGE_OK = true; return true; }
  catch(e){ STORAGE_OK = false; return false; }
}
function clearStore(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }

// The vault key and the sync token (1.9.65+) come from one PBKDF2 run: the key is its 256 bits, the
// same key deriveKey made before, and the token an HMAC of them, which the sync service can check
// without being able to work back to the key.
async function deriveKeys(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, 256);
  const key = await crypto.subtle.importKey("raw", bits, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
  const mac = await crypto.subtle.importKey("raw", bits, {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const auth = toB64(await crypto.subtle.sign("HMAC", mac, enc.encode("orbit-sync-auth"))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return { key, auth };
}
async function deriveKey(pw, salt, iter){ return (await deriveKeys(pw, salt, iter)).key; }
async function sealState(key, meta, state){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(state)));
  return { format:"profile-vault-backup", v:1, kdf:"PBKDF2-SHA256", iter:meta.iter, salt:meta.salt, iv:toB64(iv), ct:toB64(ct), savedAt:new Date().toISOString() };
}
async function openRecord(rec, pw){
  const { key, auth } = await deriveKeys(pw, fromB64(rec.salt), rec.iter || ITER);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(rec.iv)}, key, fromB64(rec.ct));
  return { key, auth, state: sanitizeState(JSON.parse(dec.decode(pt))) };
}
function validRecord(r){ return r && typeof r === "object" && typeof r.salt === "string" && typeof r.iv === "string" && typeof r.ct === "string"; }

let saveChain = Promise.resolve();
function persist(){
  if (!S || !KEY || !VAULT) return;
  const key = KEY, meta = {iter:VAULT.iter, salt:VAULT.salt};
  saveChain = saveChain.then(async () => {
    if (!S || KEY !== key) return;
    const rec = await sealState(key, meta, S);
    if (KEY !== key) return;   // the password changed meanwhile: a later save writes it with the new key
    VAULT = rec;
    if (!writeStore(rec)) showStorageBanner();
  }).catch(() => toast("Couldn't save changes. Download an encrypted backup from Settings.", "err"));
  if (typeof schedulePhonePush === "function") schedulePhonePush();
  if (typeof syncTouched === "function") syncTouched();
  return saveChain;
}

function blobSave(filename, data){

    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();

  } catch(e){ toast("Couldn't save the file. Use Copy instead.", "err"); return false; }
}
const IS_LOCAL = /^file:$/.test(location.protocol) || !window.claude;
async function saveFile(filename, data){

  try { await DL.save({filename, data}); toast("Downloaded " + filename); return true; }
  catch(e){
    const code = e && e.code;

  // An action (e.g. Undo) keeps the toast up longer and runs once.

function renderLock(msg){

  const noCrypto = !(window.crypto && crypto.subtle);

      <div class="lock-rule"></div>
      ${noCrypto ? `<p>This browser can't encrypt data on this page, so the vault can't open here. Try a current version of Chrome, Safari, Edge or Firefox.</p>` :
      creating ? `
        <p>Create a master password. Everything you add is encrypted with it and stays on this device. It can't be recovered, so store it in your password manager.</p>
        <input class="sr" type="text" name="username" autocomplete="username" value="Profile Vault" tabindex="-1" aria-hidden="true">
        <div class="field" style="margin-bottom:12px"><label for="pw1">Master password</label><input id="pw1" type="password" autocomplete="new-password" required><span class="hint">Any password you like. Longer ones are harder for someone else to guess.</span></div>
        <div class="field" style="margin-bottom:16px"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required></div>
        <div class="field"><span class="err" id="lock-err" role="alert"></span></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px" id="lock-go">Create vault</button>` : `
        <p>Enter your master password to unlock.</p>
        <input class="sr" type="text" name="username" autocomplete="username" value="Profile Vault" tabindex="-1" aria-hidden="true">
        <div class="field" style="margin-bottom:12px"><label for="pw1">Master password</label><input id="pw1" type="password" autocomplete="current-password" required></div>
        <div class="field"><span class="err" id="lock-err" role="alert"></span></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px" id="lock-go">Unlock</button>`}
    </form>
    ${noCrypto ? "" : `${RT.config && !RT.isOwner ? `<button class="btn btn-primary" type="button" id="lock-inbox" style="width:100%;justify-content:center;margin-top:12px">Send profiles to this vault</button>` : ""}
    ${creating ? `<div class="lic-sep"><span>Use FAFO on another device?</span></div><button class="btn" type="button" id="lock-sync" style="width:100%;justify-content:center">${ic("refresh")}Open my synced vault</button>` : ""}
    <button class="btn" type="button" id="lock-submit" style="width:100%;justify-content:center;margin-top:12px">I was sent a code</button>
    <div class="lock-foot">
      <button class="link" type="button" id="lock-restore">Restore a backup</button>
      ${creating ? "" : `<button class="link link-danger" type="button" id="lock-erase">Forgot it? Erase vault</button>`}
    </div>`}
  </div></main>`;
  if (typeof setUpdateIndicators === "function") setUpdateIndicators();
  // The app's click handler only runs when unlocked, so the lock banner handles its own buttons.
  $("#lock-upd").addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b) updAction(b.dataset.act); });
  if (noCrypto) return;
  const pw1 = $("#pw1"); setTimeout(() => pw1 && pw1.focus(), 30);
  $("#lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (S) return;
    const err = $("#lock-err"), go = $("#lock-go");
    err.textContent = "";
    const pw = pw1.value;
    if (creating){
      if (!pw){ err.textContent = "Enter a password."; return; }
      if (pw !== $("#pw2").value){ err.textContent = "The passwords don't match."; return; }
      go.disabled = true; go.textContent = "Creating…";
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const dk = await deriveKeys(pw, salt, ITER);
        KEY = dk.key; SYNC_AUTH = dk.auth;
        S = blankState();
        VAULT = await sealState(KEY, {iter:ITER, salt:toB64(salt)}, S);
        writeStore(VAULT);
        startApp();
      } catch(ex){ go.disabled = false; go.textContent = "Create vault"; err.textContent = "Couldn't create the vault in this browser."; }
    } else {
      go.disabled = true; go.textContent = "Unlocking…";

    const tryAuto = () => {
      clearTimeout(autoTimer);
      const pw = pw1.value;
      if (!pw) return;
      autoTimer = setTimeout(async () => {
        const seq = ++autoSeq;
        try {
          const r = await openRecord(rec, pw);
          // Ignore results for text that's no longer in the box, or if already open.
          if (seq !== autoSeq || pw1.value !== pw || S) return;
          KEY = r.key; SYNC_AUTH = r.auth; S = r.state; VAULT = rec;
          startApp();
        } catch(ex){ /* wrong so far: stay quiet while typing */ }
      }, 300);
    };
    pw1.addEventListener("input", tryAuto);
    // Browser or password-manager autofill may fill the box before we're listening.
    if (pw1.value) tryAuto();
  }
  $("#lock-restore").addEventListener("click", () => openRestore(false));
  $("#lock-submit").addEventListener("click", openSubmitStart);
  const ls = $("#lock-sync"); if (ls) ls.addEventListener("click", openSyncSignIn);
  const li = $("#lock-inbox");
  if (li) li.addEventListener("click", () => startSubmit({pub:RT.config.pub, keyId:RT.config.keyId, viaDb:true}));
  const er = $("#lock-erase");
  if (er) er.addEventListener("click", async () => {
    const ok = await confirmDialog({title:"Erase vault?", body:"This deletes every profile, address and card stored on this device. It can't be undone.", confirm:"Erase vault", danger:true, typeWord:"ERASE"});
    if (ok){ clearStore(); syncHintWrite(null); renderLock("Vault erased. Create a new master password to start over."); }
  });
}

function editCardNote(btn, id){
  const c = cardById(id); if (!c || !btn.isConnected) return;

// Searching cards (1.9.86+): every word typed has to match. Digits match any part of the card number (spaces and

// group, the virtual card's provider, funding card and merchant, and the names of the profiles using it.
function cardMatches(c, terms){
  if (!terms.length) return true;
  const num = digits(c.number), y = String(c.expY || ""), mo = c.expM ? String(+c.expM) : "", mm = mo.padStart(2, "0");
  const exps = mo && y ? [mm + "/" + y.slice(-2), mm + "/" + y, mo + "/" + y.slice(-2), mo + "/" + y] : [];
  const text = norm([c.nick, c.holder, cardBrand(c), CARD_TYPE[brandOf(c.number)], (cardGroupById(c.groupId) || {}).name, c.virtual ? "virtual " + vcName(c.vprovider) : "",
    c.vfunding, c.vmerchant, c.note, S.profiles.filter(p => p.cardId === c.id).map(p => p.name).join(" ")].filter(Boolean).join(" "));
  return terms.every(t => /^\d{1,2}\/(\d{2}|\d{4})$/.test(t) ? exps.includes(t) || exps.includes(t.replace(/^0/, ""))
    : /^[\d-]+$/.test(t) ? num.includes(t.replace(/-/g, "")) || (t.length === 4 && exps.some(x => x.length === 5 && x.replace("/", "") === t))
    : text.includes(t));
}

/* ================= LAYERS ================= */
const stack = [];
function openLayer(o){
  const el = document.createElement("div");
  el.className = `layer layer-${o.kind || "modal"}${o.small ? " is-small" : ""}${o.wide ? " is-wide" : ""}`;
  const tid = "t" + uid().slice(0,8);
  el.innerHTML = `<div class="scrim"></div><section class="panel" role="dialog" aria-modal="true" aria-labelledby="${tid}">
    <div class="panel-head"><h2 id="${tid}">${esc(o.title)}</h2><button class="icon-btn" data-close aria-label="Close">${ic("x")}</button></div>
    <div class="panel-body">${o.body || ""}</div>
    ${o.foot ? `<div class="panel-foot">${o.foot}</div>` : ""}
  </section>`;
  $("#layers").appendChild(el);
  const entry = { el, prev: document.activeElement, onClose: o.onClose, dismiss: o.dismiss !== false };
  stack.push(entry);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("is-open")));
  const close = (val) => {
    const i = stack.indexOf(entry); if (i === -1) return;
    stack.splice(i, 1);
    el.classList.remove("is-open");
    setTimeout(() => el.remove(), 200);
    if (entry.prev && entry.prev.focus && document.contains(entry.prev)) entry.prev.focus();
    if (entry.onClose) entry.onClose(val);
    if (!stack.length && SYNC.waiting) syncSoon(300);   // changes from another device waited for this window
  };
  entry.close = close;
  el.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) close();
    else if (e.target.classList.contains("scrim") && entry.dismiss) close();
  });
  const panel = $(".panel", el);
  if (o.mount) o.mount(panel, close);
  setTimeout(() => {
    const f = $("[autofocus]", panel) || $("input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea", panel) || $(".panel-foot .btn-primary", panel) || $("[data-close]", panel);
    if (f) f.focus();

let menuEl = null, menuBack = null;

// at: {x, y} opens the menu there (where a right-click was) instead of under the anchor.
// noFocus: leave focus where it is (a touch-and-hold, so a phone keyboard doesn't jump).
function openMenu(anchor, items, at, noFocus){
  closeMenu();
  menuBack = anchor;
  const el = menuEl = document.createElement("div");
  menuEl.className = "menu"; menuEl.setAttribute("role","menu");
  menuEl.innerHTML = items.map((it, i) => `<button role="menuitem" data-i="${i}" class="${it.danger ? "danger" : ""}">${ic(it.icon)}${esc(it.label)}</button>`).join("");
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let left = at ? at.x : r.right - mw, top = at ? at.y : r.bottom + 4;
  if (top + mh > window.innerHeight - 8) top = at ? at.y - mh : r.top - mh - 4;
  left = Math.max(8, Math.min(left, window.innerWidth - mw - 8)); top = Math.max(8, top);
  menuEl.style.left = left + "px"; menuEl.style.top = top + "px";
  menuEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const it = items[+b.dataset.i]; closeMenu(); it.run();
  });
  // Tabbing (or clicking) out of the menu closes it; a click on its padding keeps focus inside.
  menuEl.addEventListener("focusout", (e) => { if (menuEl === el && !el.contains(e.relatedTarget)) closeMenu(); });
  menuEl.addEventListener("mousedown", (e) => { if (!e.target.closest("button")) e.preventDefault(); });
  const first = $("button", menuEl); if (first && !noFocus) first.focus({preventScroll:true});
}

// Edit names (1.9.84+): the name on every selected card at once. The first and the last name each stay as they
// are on each card unless ticked; then they're what's typed, or New random first (or last) names, each card its
// own. A name splits at its last word (Mary Ann | Smith). A card with its name in capitals gets capitals; one
// without a name follows most of the others. Undo puts the names back.
const cardNameParts = (h) => { const w = String(h || "").trim().split(/\s+/).filter(Boolean); return w.length > 1 ? {first:w.slice(0, -1).join(" "), last:w[w.length - 1]} : {first:w[0] || "", last:""}; };
const allCaps = (s) => /[A-Za-z]/.test(s) && s === s.toUpperCase();
const capsLike = (was, name) => allCaps(String(was || "")) ? String(name || "").toUpperCase() : name;   // 1.9.86+
function cardNamesPlan(cards, r, cache){
  const errs = [];
  if (r.first.on && !r.first.rnd && !r.first.text) errs.push(["cn_first", "Enter a first name."]);
  if (r.last.on && !r.last.rnd && !r.last.text) errs.push(["cn_last", "Enter a last name."]);
  const named = cards.filter(c => String(c.holder || "").trim()), capsMost = named.filter(c => allCaps(c.holder)).length * 2 > named.length;
  // Random parts, rolled once per set of cards (Shuffle rolls again): each card's own where the lists allow.
  const roll = (k) => { const key = k + "|" + cards.map(c => c.id).join(","); let list = cache.get(key);
    if (!list){ const seen = new Set(); list = cards.map(() => { let x, t = 0; do { x = genName("any")[k]; } while (seen.has(x) && ++t < 40); seen.add(x); return x; }); cache.set(key, list); }
    return list; };
  const rf = r.first.on && r.first.rnd ? roll("first") : null, rl = r.last.on && r.last.rnd ? roll("last") : null;
  const rows = cards.map((c, i) => {
    const now = String(c.holder || ""), p = cardNameParts(now);
    const first = rf ? rf[i] : r.first.on ? r.first.text : p.first, last = rl ? rl[i] : r.last.on ? r.last.text : p.last;
    let name = [first, last].filter(Boolean).join(" ");
    if (now.trim() ? allCaps(now) : capsMost) name = name.toUpperCase();
    return {c, now, name, changed:name !== now, half:!!name && !(first && last)};
  });
  return {rows, errs, touched:r.first.on || r.last.on};
}
function openCardNames(ids){
  const set = new Set(ids), shown = visibleCards().filter(c => set.has(c.id));
  const cards = shown.concat(S.cards.filter(c => set.has(c.id) && !shown.includes(c)));
  if (!cards.length) return;
  const n = cards.length, cache = new Map(), rnd = {first:false, last:false};
  const part = (k, label) => `<div class="field c3 me-f" data-field="cn_${k}">
    <div class="me-lab"><label class="me-tick"><input type="checkbox" data-cn-tick="${k}" aria-label="Change the ${label.toLowerCase()}"><span>${label}</span></label><button type="button" class="link me-jig" data-cn-rnd="${k}">New random ${label.toLowerCase()}s</button></div>
    <div class="dm-ctrl"><input name="cn_${k}" aria-label="${label}" autocomplete="off" maxlength="40"></div>
    <div class="dm-rnd" data-cn-box="${k}" hidden>${ic("refresh")}<span>New random ${label.toLowerCase()}s: each card gets its own</span><button type="button" class="link" data-cn-shuffle="${k}">Shuffle</button><button type="button" class="icon-btn" data-cn-stop="${k}" aria-label="Stop: New random ${label.toLowerCase()}s" title="Stop">${ic("x")}</button></div>

  openLayer({
    title:`Name on ${plural(n, "card")}`, wide:true, dismiss:false,
    body:`<p style="margin:-4px 0 16px;color:var(--ink-2)">Tick the first or last name to change it on all ${plural(n, "selected card")}. A part you don't tick stays as it is on each card.</p>
    <form id="cn-form" class="form-grid" novalidate>${part("first", "First name")}${part("last", "Last name")}</form>
    <div id="cn-sum"></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="cn-go" disabled>Change ${plural(n, "card")}</button>`,
    mount:(panel, close) => {
      const form = $("#cn-form", panel), go = $("#cn-go", panel), sum = $("#cn-sum", panel);
      let plan = null;
      const tickEl = (k) => $(`[data-cn-tick="${k}"]`, panel);
      const tick = (k, on) => { tickEl(k).checked = !!on; tickEl(k).closest(".me-f").classList.toggle("is-on", !!on); };
      const text = (k) => $(`[name="cn_${k}"]`, panel).value.trim();
      const setRnd = (k, on) => {
        rnd[k] = on; const f = $(`[data-field="cn_${k}"]`, panel);
        $(".dm-ctrl", f).hidden = on; $(`[data-cn-box="${k}"]`, f).hidden = !on; $(`[data-cn-rnd="${k}"]`, f).hidden = on;
        [...cache.keys()].forEach(x => { if (x.startsWith(k)) cache.delete(x); });
        tick(k, on || text(k) !== "");
      };
      const draw = () => {
        ["first", "last"].forEach(k => setErr(panel, "cn_" + k, ""));
        const r = {first:{on:tickEl("first").checked, text:text("first"), rnd:rnd.first}, last:{on:tickEl("last").checked, text:text("last"), rnd:rnd.last}};
        plan = cardNamesPlan(cards, r, cache);
        plan.errs.forEach(([k, msg]) => setErr(panel, k, msg));
        const changed = plan.rows.filter(x => x.changed), MAX = 100;
        sum.innerHTML = !plan.touched ? `<div class="note" style="margin-top:14px">Tick the first or last name to change it.</div>`
          : `<div class="note" style="margin-top:14px"><strong style="color:var(--ink)">${plan.errs.length ? "Fix what's marked to go on" : changed.length ? `Preview: changes ${plural(changed.length, "card")}` : "Nothing changes"}</strong>
          ${plan.errs.length ? "" : `<div class="dm-wrap"><table class="dm-prev"><thead><tr><th>Card</th><th>Name on card now</th><th>New name</th></tr></thead>
            <tbody>${plan.rows.slice(0, MAX).map(x => `<tr><td>${esc(cardTitle(x.c))}</td><td class="dm-same">${esc(x.now) || "—"}</td><td class="${x.changed ? "" : "dm-same"}">${esc(x.name) || "—"}</td></tr>`).join("")}</tbody></table></div>
            ${plan.rows.length > MAX ? `<p class="item-sub" style="margin:6px 0 0">And ${plan.rows.length - MAX} more</p>` : ""}
            ${plan.rows.some(x => x.changed && allCaps(x.name)) ? `<p class="item-sub" style="margin:6px 0 0">Cards with their name in capitals keep capitals.</p>` : ""}
            ${(() => { const h = plan.rows.filter(x => x.changed && x.half).length; return h ? `<p class="item-sub" style="margin:6px 0 0;color:var(--caution)">${plural(h, "card")} would have only one name, as ${h === 1 ? "it has" : "they have"} no other part now. Tick both to give ${h === 1 ? "it" : "them"} a full name.</p>` : ""; })()}`}</div>`;
        go.disabled = !changed.length || plan.errs.length > 0;
        go.textContent = changed.length ? `Change ${plural(changed.length, "card")}` : `Change ${plural(n, "card")}`;
      };
      form.addEventListener("input", (e) => { const k = e.target.name && e.target.name.replace(/^cn_/, ""); if (k === "first" || k === "last") tick(k, e.target.value.trim() !== ""); draw(); });
      form.addEventListener("change", (e) => { const k = e.target.dataset && e.target.dataset.cnTick; if (!k) return; if (!e.target.checked && rnd[k]) setRnd(k, false); tick(k, e.target.checked); draw(); });
      panel.addEventListener("click", (e) => {
        const b = e.target.closest("[data-cn-rnd],[data-cn-shuffle],[data-cn-stop]"); if (!b) return;
        if (b.dataset.cnRnd) setRnd(b.dataset.cnRnd, true);
        else if (b.dataset.cnShuffle) [...cache.keys()].forEach(x => { if (x.startsWith(b.dataset.cnShuffle)) cache.delete(x); });
        else { setRnd(b.dataset.cnStop, false); }
        draw();
      });
      go.addEventListener("click", () => {
        if (!plan || plan.errs.length) return;
        const changed = plan.rows.filter(x => x.changed); if (!changed.length) return;
        const before = new Map(changed.map(x => [x.c.id, x.c.holder]));
        changed.forEach(x => { x.c.holder = x.name; });
        persist(); render(); renderBulk(); close();
        toast(`Changed the name on ${plural(changed.length, "card")}`, "", {label:"Undo", run:() => {
          before.forEach((h, id) => { const c = cardById(id); if (c) c.holder = h; });
          persist(); render(); renderBulk(); toast("Names put back");
        }});
      });
      draw();
    }
  });
}

        e = c.holder ? "" : "Enter the name on the card."; setErr(panel, "holder", e); if (e) bad = true;
        e = c.expM ? "" : "Pick a month."; setErr(panel, "expM", e); if (e) bad = true;

        persist(); render();
        toast(existing ? "Card saved" : "Card added");
        close();

    }
  });
}

function validateCard(c){

  if (!c.number) err.number = "Enter the card number.";
  else if (c.redcard){ if (c.number.length < 12) err.number = "This number looks too short."; }
  else if (!["visa","mastercard","amex","discover"].includes(b)) err.number = "Use a Visa, Mastercard, Amex or Discover card.";
  else if (!luhn(c.number)) err.number = "This number doesn't look right. Check for a typo.";
  const cl = b === "amex" && !c.redcard ? 4 : 3;
  if (c.redcard){ if (c.cvv && !/^\d{3,4}$/.test(c.cvv)) err.cvv = "Use 3 or 4 digits, or leave it blank."; }
  else if (c.cvv.length !== cl) err.cvv = `Enter ${cl} digits.`;

const USPS_SUFFIX = {STREET:"ST",STR:"ST",ST:"ST",AVENUE:"AVE",AVE:"AVE",AV:"AVE",ROAD:"RD",RD:"RD",DRIVE:"DR",DR:"DR",BOULEVARD:"BLVD",BLVD:"BLVD",LANE:"LN",LN:"LN",

  RIDGE:"RDG",RUN:"RUN",PATH:"PATH",PLAZA:"PLZ",CENTER:"CTR",CREEK:"CRK",GROVE:"GRV",HARBOR:"HBR",HILL:"HL",HILLS:"HLS",LAKE:"LK",LANDING:"LNDG",MEADOW:"MDW",
  MEADOWS:"MDWS",PARK:"PARK",STATION:"STA",TURNPIKE:"TPKE",VALLEY:"VLY",VIEW:"VW",VILLAGE:"VLG",VISTA:"VIS",WALK:"WALK",COVE:"CV",GLEN:"GLN",BEND:"BND"};
const USPS_DIR = {NORTH:"N",SOUTH:"S",EAST:"E",WEST:"W",NORTHEAST:"NE",NORTHWEST:"NW",SOUTHEAST:"SE",SOUTHWEST:"SW",N:"N",S:"S",E:"E",W:"W",NE:"NE",NW:"NW",SE:"SE",SW:"SW"};
const USPS_UNIT = {APARTMENT:"APT",APT:"APT",SUITE:"STE",STE:"STE",UNIT:"UNIT",BUILDING:"BLDG",BLDG:"BLDG",FLOOR:"FL",FL:"FL",ROOM:"RM",RM:"RM",DEPARTMENT:"DEPT",

function uspsLine(s){
  const t = String(s || "").replace(/[.,]/g, " ").replace(/\s+/g, " ").trim().toUpperCase().split(" ").filter(Boolean);
  if (!t.length) return "";
  let u = t.findIndex((w, i) => i >= 1 && (USPS_UNIT[w] || w.startsWith("#")));
  if (USPS_UNIT[t[0]]) u = 0;                       // a line 2 like "Apartment 4B"
  const street = u < 0 ? t : t.slice(0, u), unit = u < 0 ? [] : t.slice(u);
  if (street.length > 2 && USPS_DIR[street[1]] && /^\d/.test(street[0])) street[1] = USPS_DIR[street[1]];
  let last = street.length - 1;
  if (last > 1 && USPS_DIR[street[last]]){ street[last] = USPS_DIR[street[last]]; last--; }
  if (last > 1 && USPS_SUFFIX[street[last]]) street[last] = USPS_SUFFIX[street[last]];
  if (unit.length && USPS_UNIT[unit[0]]) unit[0] = USPS_UNIT[unit[0]];
  return street.concat(unit).join(" ");
}

function zipStateWarning(zip, state, country){
  if ((country || "US") !== "US" || !state || !/^\d{5}/.test(String(zip || ""))) return "";

function resolveAddr(fields, linkedId, selfId, avoidId){

// Asks how to delete a group: "group" (its items move to Ungrouped, the default), "all" (they're

function askDeleteGroup(kind, g, list){

          + choice("all", `Delete group and its ${plural(n, K.noun)}`, kind === "card"
            ? (used ? `${plural(used, "profile")} using ${one ? "it" : "them"} will need a new card.` : `No profiles use ${one ? "it" : "them"}.`)
            : `${one ? "Its address and card stay" : "Their addresses and cards stay"} saved.`, "gdel-danger")
        : choice("group", "Delete group", "It's empty, so nothing else changes.", "is-default")}</div>`,

async function deleteGroup(kind, id){
  const K = groupKind(kind), g = K.groups().find(x => x.id === id); if (!g) return;
  const list = K.items().filter(x => x.groupId === id), n = list.length;
  const how = await askDeleteGroup(kind, g, list);
  if (!how || !K.groups().includes(g)) return;
  // Keep what Undo needs: where the group and each deleted item were, and cards taken off profiles.
  const vault = S, gi = K.groups().indexOf(g), ids = new Set(list.map(x => x.id));
  const pos = new Map(K.items().map((x, i) => [x.id, i]));
  const shown = () => kind === "card" ? UI.cardGroup : UI.group, show = (v) => { if (kind === "card") UI.cardGroup = v; else UI.group = v; };
  const viewing = shown() === id;
  const cardless = [];
  K.groups().splice(gi, 1);
  if (how === "all" && kind === "card"){
    S.profiles.forEach(p => { if (ids.has(p.cardId)){ cardless.push([p, p.cardId]); p.cardId = null; } });
    S.cards = S.cards.filter(c => !ids.has(c.id));
    ids.forEach(x => { UI.reveal.delete(x); UI.cardSel.delete(x); });
  } else if (how === "all"){
    (S.checkouts || []).forEach(c => { if (ids.has(c.profileId)) c.profileName = list.find(p => p.id === c.profileId).name; });
    S.profiles = S.profiles.filter(p => !ids.has(p.id));
    ids.forEach(x => UI.selected.delete(x));
  } else list.forEach(x => { x.groupId = null; });
  if (viewing) show("all");
  persist(); render();
  const undo = () => {
    if (S !== vault || K.groups().some(x => x.id === g.id)) return;
    K.groups().splice(Math.min(gi, K.groups().length), 0, g);
    if (how === "all"){
      const have = new Set(K.items().map(x => x.id));
      list.forEach(x => { if (!have.has(x.id)) K.items().splice(Math.min(pos.get(x.id), K.items().length), 0, x); });
      cardless.forEach(([p, cid]) => { if (!p.cardId) p.cardId = cid; });
    } else list.forEach(x => { if (x.groupId == null) x.groupId = g.id; });
    if (viewing && shown() === "all") show(g.id);
    persist(); render(); toast(`Restored ${g.name}`);
  };
  toast(how === "all" ? `Deleted ${g.name} and its ${plural(n, K.noun)}` : n ? `Deleted ${g.name}. ${plural(n, K.noun)} moved to Ungrouped.` : `Deleted ${g.name}`, "", {label:"Undo", run:undo});
}

const CSV_COLS = ["profile_name","group","email","phone","ship_nickname","ship_first_name","ship_last_name","ship_address1","ship_address2","ship_city","ship_state","ship_zip","ship_country","billing_same_as_shipping","bill_nickname","bill_first_name","bill_last_name","bill_address1","bill_address2","bill_city","bill_state","bill_zip","bill_country","card_nickname","card_holder","card_number","card_exp_month","card_exp_year","card_cvv","card_is_redcard"];
const ADDR_KEYS = ["nickname","firstName","lastName","address1","address2","city","state","zip","country"];
const CSV_ADDR = ["nickname","first_name","last_name","address1","address2","city","state","zip","country"];
function toCSV(list){
  const cell = (v) => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const slugOf = (lg) => lg.storeId && lg.storeId !== "other" ? lg.storeId : (norm(lg.store).replace(/[^a-z0-9]+/g, "") || "other");

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }

// A cell written as ="…" (or ="…"&"…") is Excel text: the license server sends slot files' card numbers,

    if (!o) return null;
    const a = {nick:String(o.nickname||"").trim(), first:String(o.firstName||"").trim(), last:String(o.lastName||"").trim(), line1:String(o.address1||"").trim(), line2:String(o.address2||"").trim(), city:String(o.city||"").trim(), state:String(o.state||"").trim(), zip:String(o.zip||"").trim(), country:String(o.country||"US").trim().toUpperCase() || "US"};
    const CAL = {"USA":"US","UNITED STATES OF AMERICA":"US","U.S.":"US","U.S.A.":"US","UK":"GB","GREAT BRITAIN":"GB","ENGLAND":"GB","SCOTLAND":"GB","WALES":"GB"};
    if (CAL[a.country]) a.country = CAL[a.country];
    if (a.country.length !== 2){ const m = COUNTRIES.find(c => norm(c[1]) === norm(a.country)); a.country = m ? m[0] : "US"; }
    if ((a.country === "US" || a.country === "CA") && a.state.length > 2){ const m = (a.country === "US" ? US_STATES : CA_PROVINCES).find(s => norm(s[1]) === norm(a.state)); if (m) a.state = m[0]; }
    else if (a.state.length === 2) a.state = a.state.toUpperCase();
    if (!a.line1) return null;
    const k = aKey(a);
    if (addrMap.has(k)) return addrMap.get(k);
    a.id = uid(); a.createdAt = Date.now(); addrMap.set(k, a.id); plan.addresses.push(a); return a.id;
  };
  const mkCard = (o) => {
    if (!o || !digits(o.number)) return null;
    if (/e\+?\d/i.test(String(o.number))){ plan.rounded++; return null; }
    let y = String(o.expYear||"").trim(); if (/^\d{2}$/.test(y)) y = "20" + y;
    const c = {nick:String(o.nickname||"").trim(), holder:String(o.holder||o.name||"").trim(), number:digits(o.number), expM:String(+o.expMonth||"").padStart(2,"0").replace(/^0*$/, ""), expY:y, cvv:digits(o.cvv), redcard:!!(o.isRedCard || o.redcard || o.brand === "redcard"), virtual:!!o.virtual, vprovider:VC_PROVIDERS.some(p => p[0] === o.vProvider) ? o.vProvider : (o.virtual ? "other" : ""), vfunding:String(o.vFunding || ""), vmerchant:String(o.vMerchant || ""), vlimit:String(o.vLimit || ""), finish:(S.cards.length + plan.cards.length) % FINISHES.length};
    const k = cKey(c);
    if (cardMap.has(k)) return cardMap.get(k);
    c.id = uid(); c.createdAt = Date.now(); cardMap.set(k, c.id); plan.cards.push(c); return c.id;
  };
  const existing = new Set(S.profiles.map(p => [norm(p.name), p.shipId, p.cardId].join("|")));
  let autoN = S.profiles.length;
  flat.forEach(f => {
    if (!f || typeof f !== "object" || (!String(f.name||"").trim() && !f.shipping && !f.card)){ plan.invalid++; return; }
    if (!String(f.name||"").trim()){
      const sn = f.shipping ? [f.shipping.firstName, f.shipping.lastName].filter(Boolean).join(" ") : "";
      f.name = sn || "Profile " + (++autoN); plan.named++;
    }
    if (f.card && !String(f.card.holder || "").trim() && f.shipping) f.card = Object.assign({}, f.card, {holder:[f.shipping.firstName, f.shipping.lastName].filter(Boolean).join(" ")});
    const shipId = mkAddr(f.shipping);
    const billSame = f.billingSameAsShipping !== false || !f.billing;
    const billId = billSame ? null : mkAddr(f.billing);
    const cardId = mkCard(f.card);
    const seenStore = new Set(), stores = [];
    const addStore = (o, mode, email, verified) => {
      const st = STORES.find(x => x[0] !== "other" && (x[0] === o.storeId || norm(x[1]) === norm(o.store)));
      const e = {store:st ? st[0] : "other", storeName:st ? "" : String(o.store || o.storeId || "Other").trim()};
      const k = storeKeyOf(e); if (seenStore.has(k)) return null;
      seenStore.add(k);
      e.mode = mode === "login" || mode === "email" || mode === "seller" ? mode : defaultMode(k); e.loginId = null; e.email = email || ""; e.verified = !!verified;
      stores.push(e); return e;
    };
    // A login in the file is saved even where it can't be linked (Pokémon Center, which checks out on
    // an email); modes older versions offered are moved to this version's (fixMode).
    (Array.isArray(f.retailers) ? f.retailers : []).forEach(r => {
      if (!r || typeof r !== "object") return;
      const e = addStore(r, r.mode, r.email, r.verified); if (!e) return;
      const lid = mkLogin(r.login || null);
      if (e.mode === "login" && !emailOnly(storeKeyOf(e))) e.loginId = lid; else fixMode(e, f.email, r.login || null);
      // A submitted slot that asks the seller for an account waits for one of this vault's logins, or at
      // Pokémon Center for an email to check out with.
      if (e.mode === "seller" && f.fromSubmission){ if (emailOnly(storeKeyOf(e))){ e.mode = "email"; e.email = ""; } else e.mode = "login"; plan.asks.push(e); }
    });
    (Array.isArray(f.logins) ? f.logins : []).forEach(lg => {
      if (!lg || typeof lg !== "object") return;
      const e = addStore(lg, "login"); if (!e) return;
      const lid = mkLogin(lg);
      if (emailOnly(storeKeyOf(e))) fixMode(e, f.email, lg); else e.loginId = lid;
    });
    stores.forEach(e => { if (e.mode === "email" && !e.email && !plan.asks.includes(e)) e.email = String(f.email || "").trim(); });
    let groupId = null;
    const gn = String(f.group||"").trim();
    if (gn){ const k = norm(gn); if (!groupMap.has(k)){ const g = {id:uid(), name:gn}; groupMap.set(k, g.id); plan.groups.push(g); } groupId = groupMap.get(k); }
    const name = String(f.name).trim();
    const sig = [norm(name), shipId, cardId].join("|");
    if (existing.has(sig)){ plan.skipped++; return; }
    existing.add(sig);
    const pid = uid();
    (Array.isArray(f.checkouts) ? f.checkouts : []).forEach(co => {
      if (!co || typeof co !== "object") return;
      const st = STORES.find(x => x[0] !== "other" && (x[0] === co.storeId || norm(x[1]) === norm(co.store)));
      plan.checkouts.push({id:uid(), createdAt:Date.now(), profileId:pid, profileName:name,
        store:st ? st[0] : "other", storeName:st ? "" : String(co.store || co.storeId || "Other").trim(),
        item:String(co.item || ""), qty:String(co.qty || "1"), price:String(co.price || ""), at:String(co.date || co.at || ""), orderNo:String(co.orderNo || ""), note:String(co.note || "")});
    });
    plan.profiles.push({id:pid, name, groupId, email:String(f.email||"").trim(), phone:String(f.phone||"").trim(), size:String(f.size||"").trim(), oneCheckout:!!f.onlyCheckoutOnce, shipId, billSame, billId, cardId, stores, createdAt:Date.now(), updatedAt:Date.now()});
  });
  return plan;
}

/* ================= BULK ACCOUNTS ================= */
const isEmailish = (s) => /^[^\s@:,]+@[^\s@:,]+\.[^\s@:,]+$/.test(String(s || "").trim());
function parseAccountLines(text){
  const rows = [], bad = [];
  String(text || "").split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const n = i + 1;
    const parts = line.split(":");
    if (parts.length >= 4 && isEmailish(parts[0])){
      for (let k = 2; k < parts.length - 1; k++){
        if (isEmailish(parts[k])){
          const pw = parts.slice(1, k).join(":"), ip = parts.slice(k + 1).join(":");
          if (pw && ip){ rows.push({email:parts[0].trim(), password:pw, imapEmail:parts[k].trim(), imapPassword:ip, line:n}); return; }
          break;
        }
      }
    }
    const cells = (parseCSV(line)[0] || []).map(c => c.trim());
    if (i === 0 && /^e-?mail/i.test(cells[0] || "") && !isEmailish(cells[0]) && !line.includes("@")) return;
    if (cells.length >= 2 && isEmailish(cells[0]) && cells[1]){
      if (!cells[2] && !cells[3]){ rows.push({email:cells[0], password:cells[1], line:n}); return; }
      if (isEmailish(cells[2]) && cells[3]){ rows.push({email:cells[0], password:cells[1], imapEmail:cells[2], imapPassword:cells[3], line:n}); return; }
    }
    // email:password with no inbox. Only exactly two fields: a four-field line with a
    // part missing or mistyped is reported, not saved with the rest as its password.
    // A password that contains a colon needs the CSV form.
    if (parts.length === 2 && isEmailish(parts[0]) && parts[1].trim()){ rows.push({email:parts[0].trim(), password:parts[1].trim(), line:n}); return; }
    bad.push(n);
  });
  return {rows, bad};
}
function lineList(ns){ return ns.length > 8 ? ns.slice(0, 8).join(", ") + ` and ${ns.length - 8} more` : ns.join(", "); }

            ${dupes.length ? `<li>Line ${lineList(dupes)} ${dupes.length === 1 ? "is" : "are"} already saved or repeated, skipped</li>` : ""}
            ${problems.map(x => `<li style="color:var(--ink)">${esc(x)}</li>`).join("")}

        if (logins.length && !problems.length){ plan = {logins, inboxes, pairs, linkedN, notLinkedN}; go.disabled = false; go.innerHTML = `${ic("plus")}Import ${plural(logins.length, "account")}`; }
        else go.innerHTML = `${ic("plus")}Import accounts`;
      };
      let t0;
      form.addEventListener("input", () => { clearTimeout(t0); t0 = setTimeout(analyze, 200); });
      form.addEventListener("change", analyze);
      go.addEventListener("click", () => {
        if (!plan) return;
        S.inboxes.push(...plan.inboxes); S.logins.push(...plan.logins);
        plan.pairs.forEach(([p, l]) => linkLogin(p, l));
        persist(); UI.view = "logins"; render();
        toast(`Imported ${plural(plan.logins.length, "account")}${plan.linkedN ? `, ${plan.linkedN} linked` : ""}${plan.notLinkedN ? `, ${plan.notLinkedN} not linked` : ""}`); close();
      });
    }
  });

/* ================= AYCD + SPREADSHEET PROFILES ================= */
function aycdAddr(a){
  if (!a || typeof a !== "object") return null;
  const nm = String(a.name || "").trim().split(/\s+/);
  const first = a.firstName || nm.shift() || "", last = a.lastName || nm.join(" ");
  const o = {nickname:"", firstName:first, lastName:last, address1:a.line1 || a.address1 || a.address || "", address2:[a.line2 || a.address2, a.line3].filter(Boolean).join(" "), city:a.city || "", state:a.state || a.province || "", zip:a.postCode || a.zip || a.zipCode || a.postalCode || "", country:a.country || a.countryCode || ""};
  return (o.address1 || o.firstName) ? o : null;
}
function aycdToFlat(list){
  return list.map(x => {

const nh = (h) => String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");

const findAl = (T, h, skip) => { for (const k in T) for (const a of T[k]) if (a === h && !(skip && skip.has(a))) return k; return null; };
function mapHeader(raw){
  const low = String(raw || "").trim().toLowerCase();
  if (/_(account_email|account_password|account_label|imap_email|imap_password|imap_provider|imap_host|imap_port|store)$/.test(low)) return null;
  const h = nh(raw); if (!h) return null;
  let f = findAl(G_AL, h); if (f) return {sec:"g", f};
  if (h === "name" || h === "fullname") return {sec:"gname"};
  for (const [p, sec] of [["shipping","s"],["ship","s"],["delivery","s"],["billing","b"],["bill","b"],["payment","c"],["card","c"],["cc","c"],["credit","c"]]){
    if (h.startsWith(p) && h.length > p.length){

function csvToFlat(text){
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("The CSV needs a header row and at least one profile.");
  const headRaw = rows[0], head = headRaw.map(h => h.trim().toLowerCase());
  const maps = headRaw.map(mapHeader);
  const ix = (k) => head.indexOf(k);
  const get = (r, k) => { const i = ix(k); return i === -1 ? "" : (r[i] || "").trim(); };
  const pfx = head.filter(h => h.endsWith("_account_email")).map(h => h.slice(0, -"_account_email".length));
  const logins = (r) => pfx.map(x => get(r, x + "_account_email") ? {store:get(r, x + "_store") || x, storeId:x, label:get(r, x + "_account_label"), email:get(r, x + "_account_email"), password:get(r, x + "_account_password"),

  const has = (sec, f) => maps.some(m => m && m.sec === sec && (!f || m.f === f));
  if (!has("s","line1") && !has("b","line1") && !has("c","number")) throw new Error("Couldn't find address or card columns. The first row should have column names like Address 1, City, Zip and Card Number.");

    const g = {}, s = {}, b = {}, c = {};
    maps.forEach((m, i) => {
      if (!m) return; const v = (r[i] || "").trim(); if (!v) return;
      if (m.sec === "gname"){ if (hasPName || hasFirst) s.full = s.full || v; else { g.name = g.name || v; s.full = s.full || v; } }
      else ({g, s, b, c})[m.sec][m.f] = ({g, s, b, c})[m.sec][m.f] || v;
    });
    const addr = (a) => {
      if (!a.line1 && !a.first && !a.full) return null;
      let first = a.first || "", last = a.last || "";
      if (!first && a.full){ const p = a.full.split(/\s+/); first = p.shift(); last = last || p.join(" "); }
      return {nickname:a.nickname || "", firstName:first, lastName:last, address1:a.line1 || "", address2:[a.line2, a.line3].filter(Boolean).join(" "), city:a.city || "", state:a.state || "", zip:a.zip || "", country:a.country || ""};
    };
    const ship = addr(s), bill = addr(b);
    let same = g.same != null ? !/^(false|no|n|0)$/i.test(g.same) : (!bill || !ship || addrKey({first:ship.firstName,last:ship.lastName,line1:ship.address1,line2:ship.address2,city:ship.city,state:ship.state,zip:ship.zip,country:ship.country}) === addrKey({first:bill.firstName,last:bill.lastName,line1:bill.address1,line2:bill.address2,city:bill.city,state:bill.state,zip:bill.zip,country:bill.country}));
    let expM = c.expM, expY = c.expY;
    if ((!expM || !expY) && c.exp){ const m = c.exp.replace(/\s/g, "").match(/^(\d{1,2})[\/\-.]?(\d{2}|\d{4})$/); if (m){ expM = m[1]; expY = m[2]; } }

      shipping:ship || bill, billingSameAsShipping:ship ? same : true, billing:ship && !same ? bill : null,
      card:c.number ? {nickname:c.nickname || "", holder:c.holder || "", number:c.number, expMonth:expM, expYear:expY, cvv:c.cvv || "", isRedCard:/^(true|yes|1)$/i.test(c.redcard || "") || /redcard/i.test(c.type || "")} : null,

  flat.ignored = headRaw.filter((h, i) => !maps[i] && !flat.used.includes(h.trim()) && h.trim()).map(h => h.trim());

function jsonToFlat(text){
  let data; try { data = JSON.parse(text); } catch(e){ throw new Error("This isn't valid JSON."); }

const GEN_MAX = 500;
const genRand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const genPick = (list) => list[genRand(list.length)];
function genName(gender){
  const g = gender === "female" || gender === "male" ? gender : (genRand(2) ? "female" : "male");
  return {first:genPick(g === "female" ? GEN_FEMALE : GEN_MALE), last:genPick(GEN_LAST)};
}
// Ten digits: one of the state's area codes (any state's for military addresses), then an exchange that
// isn't N11 or 555.
function genPhone(state){
  const codes = GEN_AREA[state] || Object.values(GEN_AREA).flat();
  let ex;
  do { ex = String(2 + genRand(8)) + genRand(10) + genRand(10); } while (ex.slice(1) === "11" || ex === "555");
  return genPick(codes) + ex + String(genRand(10000)).padStart(4, "0");
}
const genDrafts = () => { const m = S.settings.genDrafts; return m && typeof m === "object" && !Array.isArray(m) ? m : {}; };
const draftList = () => Object.values(genDrafts()).filter(d => d && typeof d === "object" && typeof d.id === "string" && d.id)
  .sort((a, b) => (a.n || 0) - (b.n || 0) || natural(String(a.name || ""), String(b.name || "")));
function setDrafts(m){ if (Object.keys(m).length) S.settings.genDrafts = m; else delete S.settings.genDrafts; persist(); }
const draftHay = (d) => norm([d.name, d.group, d.first, d.last, d.line1, d.line2, d.city, d.state, d.zip, d.email, d.phone].join(" "));
const visibleDrafts = () => { const q = norm(UI.q); return draftList().filter(d => !q || draftHay(d).includes(q)); };
const draftAddrKey = (d) => [d.line1, d.line2, d.city, d.state, d.zip].map(norm).join("|");
const draftAddrLine = (d) => [[d.line1, d.line2].filter(Boolean).join(", "), d.city, [d.state, d.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
const draftLabel = (d) => ({first:d.first, last:d.last, line1:d.line1, line2:d.line2, city:d.city, state:d.state, zip:d.zip, country:"US"});
const fmtPhone = (p) => { const d = digits(p); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : String(p || ""); };
const genZipOk = (z) => /^\d{5}(-?\d{4})?$/.test(z);
// The first free number for "<prefix> #n" among profiles and drafts (but those in skip, being renamed: drafts, or
// from 1.9.90 profiles in Mass edit).
function genNextNumber(prefix, skip){
  const re = new RegExp("^" + String(prefix).trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + " #(\\d+)$", "i");
  let max = 0;
  S.profiles.concat(draftList()).filter(x => !skip || !skip.has(x.id)).forEach(x => { const m = re.exec(String(x.name || "").trim()); if (m) max = Math.max(max, +m[1]); });
  return max + 1;
}
// Emails from pasted lines: the first word of each line, so email:password lines work too.
function genEmails(text){
  const seen = new Set(), list = [], bad = [];
  let dup = 0;
  String(text || "").split(/\r?\n/).forEach(raw => {
    const line = raw.trim(); if (!line) return;
    const em = line.split(/[\s,;:|]+/)[0];
    if (!isEmailish(em)){ bad.push(line); return; }
    const k = norm(em);
    if (seen.has(k)){ dup++; return; }
    seen.add(k); list.push(em);
  });
  return {list, bad, dup};
}

function draftTableHTML(list, same){

    <tbody>${rows}</tbody></table></div>`;
}
function deleteDrafts(ids){
  const m = Object.assign({}, genDrafts()), gone = ids.map(x => m[x]).filter(Boolean);
  if (!gone.length) return;
  gone.forEach(d => { delete m[d.id]; UI.genSel.delete(d.id); });
  setDrafts(m); render();
  toast(gone.length === 1 ? `Deleted ${gone[0].name}` : `Deleted ${plural(gone.length, "draft")}`, "", {label:"Undo", run:() => {
    const back = Object.assign({}, genDrafts()); gone.forEach(d => { back[d.id] = d; }); setDrafts(back); render();
  }});
}

    <div id="gp-sum"></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="gp-go">Generate</button>`,
    mount:(panel, close) => {
      const form = $("#gp-form", panel), go = $("#gp-go", panel), sum = $("#gp-sum", panel), ta = $("#gp-emails", panel);
      const qty = $('[name="gp_qty"]', panel), phoneField = $('[data-field="gp_phone"]', panel);
      let qtyTouched = false;
      const read = () => {
        const r = {group:val(panel, "gp_group"), name:val(panel, "gp_name"), qtyRaw:val(panel, "gp_qty"), gender:val(panel, "gp_gender") || "any",
          line1:val(panel, "gp_line1"), line2:val(panel, "gp_line2"), city:val(panel, "gp_city"), state:val(panel, "gp_state"), zip:val(panel, "gp_zip"),
          pmode:($('[name="gp_pmode"]:checked', panel) || {}).value || "random", phone:digits(val(panel, "gp_phone"))};
        r.emails = genEmails(ta.value);
        r.qty = /^\d+$/.test(r.qtyRaw) ? +r.qtyRaw : 0;
        return r;
      };
      const draw = () => {
        const r = read(), st = US_STATES.find(s => s[0] === r.state), area = st && GEN_AREA[r.state] ? ` with ${st[1]} area codes` : "";

        $("#gp-rnd", panel).textContent = "Random numbers" + area;
        const n = r.qty, start = r.name ? genNextNumber(r.name) : 1, ne = r.emails.list.length;
        const taken = new Set(S.profiles.map(p => norm(p.email)).concat(draftList().map(d => norm(d.email))).filter(Boolean));
        const used = r.emails.list.slice(0, n || ne).filter(e => taken.has(norm(e))).length;
        const li = [];
        if (n && r.name) li.push(esc(n === 1 ? `${r.name} #${start}` : `${r.name} #${start} to ${r.name} #${start + n - 1}`) + (r.group ? ` in ${esc(r.group)}${S.groups.some(g => norm(g.name) === norm(r.group)) ? "" : " (a new group)"}` : ""));
        if (r.line1 && r.city && r.state && r.zip) li.push(`All at ${esc(draftAddrLine(r))}`);
        li.push(`Random ${r.gender === "any" ? "" : r.gender + " "}first names and last names`);

        const warn = [];
        if (r.emails.bad.length) warn.push(`${plural(r.emails.bad.length, "line")} ${r.emails.bad.length === 1 ? "isn't an email" : "aren't emails"} and ${r.emails.bad.length === 1 ? "is" : "are"} left out: ${esc(r.emails.bad.slice(0, 3).join(", "))}${r.emails.bad.length > 3 ? "…" : ""}`);
        if (r.emails.dup) warn.push(`${plural(r.emails.dup, "repeated email")} used once`);
        if (used) warn.push(`${plural(used, "email")} ${used === 1 ? "is" : "are"} already on a profile or draft`);

        }

      });
      const make = () => {
        const r = read();
        let bad = false;
        const err = (k, msg) => { setErr(panel, k, msg); if (msg) bad = true; };

        err("gp_line1", r.line1 ? "" : "Enter a street address.");
        err("gp_city", r.city ? "" : "Enter a city.");
        err("gp_state", r.state ? "" : "Choose one.");
        err("gp_zip", !r.zip ? "Enter a ZIP code." : genZipOk(r.zip) ? "" : "Use 5 digits, or ZIP+4.");
        err("gp_phone", r.pmode === "one" && r.phone && r.phone.length < 7 ? "Enter a phone number, or leave it blank." : "");
        if (bad){ const f = $(".has-err input,.has-err select,.has-err textarea", panel); if (f) f.focus(); return; }
        const start = genNextNumber(r.name), now = Date.now(), m = Object.assign({}, genDrafts());

        for (let i = 0; i < r.qty; i++){
          let nm, tries = 0;
          do { nm = genName(r.gender); } while (names.has(norm(nm.first + " " + nm.last)) && ++tries < 30);
          names.add(norm(nm.first + " " + nm.last));
          const id = uid();
          m[id] = {id, n:++seq, name:`${r.name} #${start + i}`, group:r.group, first:nm.first, last:nm.last, line1:r.line1, line2:r.line2,
            city:r.city, state:r.state, zip:r.zip, email:r.emails.list[i] || "", phone:r.pmode === "random" ? genPhone(r.state) : r.phone, createdAt:now, updatedAt:now,
            billTo:{line1:r.line1, line2:r.line2, city:r.city, state:r.state, zip:r.zip}};
        }
        setDrafts(m);
        UI.view = "generate"; UI.q = ""; { const q = $("#q"); if (q) q.value = ""; } UI.genSel.clear();
        close(); render(); window.scrollTo(0, 0);
        toast(r.qty > 1 ? `Made ${plural(r.qty, "draft")}. Select them and use Jig addresses to give each its own.` : "Made 1 draft");
      };
      go.addEventListener("click", make);
      form.addEventListener("submit", (e) => { e.preventDefault(); make(); });
      draw();
    }
  });
}

          } else {
            $(`[name="gd_${k}"]`, panel).value = v; shown[k].add(norm(v));
            const nm = {first:k === "first" ? v : d.first, last:k === "last" ? v : d.last}, real = {first:String(b0.first || ""), last:String(b0.last || "")};

      form.addEventListener("submit", (e) => { e.preventDefault(); save(!!next); });
      $("#gd-del", panel).addEventListener("click", () => { close(); deleteDrafts([id]); });
      refresh();
    }
  });
}

// The address a draft was generated at, as typed in the Generate window (1.9.75+; older drafts have none).
// Jig never changes it; a street, city, state or ZIP typed in Mass edit corrects it.
const draftBillTo = (d) => d && d.billTo && typeof d.billTo === "object" && String(d.billTo.line1 || "").trim() ? d.billTo : null;
// Drafts as new profiles on the stores picked: each with a shipping address of its own, no card, Pokémon
// Center on the draft's email, the other stores waiting for a store login (linked by email). Billing
// (bill): "typed" is the address the draft was generated at, for regular cards, since the bank checks it;
// "jig" is the same as the jigged shipping address, for virtual cards. A draft that wasn't jigged, or was
// made before FAFO kept the typed address (older), bills to its shipping address. From 1.9.86 "other" is one
// address for all of them (other: {line1, line2, city, state, zip}), typed or picked in the Import window, for
// cards that bill somewhere else; each profile has it with its own name, like the typed address.
const billAddrOk = (o) => { const a = o && typeof o === "object" ? o : {}, s = (k) => String(a[k] || "").trim();
  return s("line1") && s("city") && s("state") && genZipOk(s("zip")) ? {line1:s("line1"), line2:s("line2"), city:s("city"), state:s("state"), zip:s("zip")} : null; };
function planDraftImport(ids, picked, bill, other){
  const m = genDrafts(), groupMap = new Map(S.groups.map(g => [norm(g.name), g.id]));
  const plan = {groups:[], addresses:[], profiles:[], drafts:[], billed:0, older:0, billTo:new Set(), otherLine:"", otherBad:false}, now = Date.now();
  const o = bill === "other" ? billAddrOk(other) : null;
  if (bill === "other"){ if (o) plan.otherLine = draftAddrLine(o); else plan.otherBad = true; }
  ids.map(x => m[x]).filter(Boolean).sort((a, b) => (a.n || 0) - (b.n || 0)).forEach(d => {
    let groupId = null;
    const gn = String(d.group || "").trim();
    if (gn){ const k = norm(gn); if (!groupMap.has(k)){ const g = {id:uid(), name:gn}; groupMap.set(k, g.id); plan.groups.push(g); } groupId = groupMap.get(k); }
    const a = {id:uid(), createdAt:now, nick:"", first:String(d.first || ""), last:String(d.last || ""), line1:String(d.line1 || ""), line2:String(d.line2 || ""),
      city:String(d.city || ""), state:String(d.state || ""), zip:String(d.zip || ""), country:"US"};
    const email = String(d.email || "").trim();
    const stores = picked.map(o => { const md = defaultMode(storeKeyOf(o)); return {store:o.store, storeName:o.storeName || "", mode:md, loginId:null, email:md === "email" ? email : "", verified:false}; });
    plan.addresses.push(a); plan.drafts.push(d);
    // Jig for Pokémon Center (1.9.80+): billing gets the real name, and a draft without a typed address the
    // address it had before that Jig.
    const real = pkcBase(d), realNamed = String(real.first || "") !== a.first || String(real.last || "") !== a.last;
    const t = bill === "typed" ? draftBillTo(d) || (draftAddrKey(real) !== draftAddrKey(d) ? real : null) : bill === "other" ? o : null;
    let billId = null;
    if (bill === "typed" && !t) plan.older++;
    if (t){
      plan.billTo.add(draftAddrLine(t));
      if (draftAddrKey(t) !== draftAddrKey(d) || realNamed){
        const b = {id:uid(), createdAt:now, nick:"", first:String(real.first || ""), last:String(real.last || ""), line1:String(t.line1 || ""), line2:String(t.line2 || ""), city:String(t.city || ""), state:String(t.state || ""), zip:String(t.zip || ""), country:"US"};
        const hit = S.addresses.find(x => addrKey(x) === addrKey(b)) || plan.addresses.find(x => addrKey(x) === addrKey(b));
        if (hit) billId = hit.id; else { plan.addresses.push(b); billId = b.id; }
        plan.billed++;
      }
    }
    plan.profiles.push({id:uid(), name:String(d.name || "").trim() || "Profile", groupId, email, phone:digits(d.phone), size:"", oneCheckout:false, shipId:a.id, billSame:!billId, billId, cardId:null, stores, createdAt:now, updatedAt:now});
  });

}
function openDraftImport(ids){

          ${fieldHTML({name:"di_line2", label:"Address line 2", value:other.line2, ac:"address-line2", placeholder:"Apt, suite, unit"})}

      </div>
      <div id="di-sum"></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="di-go" disabled>Import</button>`,
    mount:(panel, close) => {

        const linked = linkByEmail(plan.profiles);
        const waiting = plan.profiles.filter(p => p.stores.some(e => e.mode === "login" && !e.loginId)).length;

      go.addEventListener("click", () => {

        close(); render(); window.scrollTo(0, 0);

    }
  });
