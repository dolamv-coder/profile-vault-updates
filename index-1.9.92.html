  const fld = (k, label, ctrl, o = {}) => `<div class="field ${o.cls || "c6"} me-f" data-field="pm_${k}">
    <div class="me-lab"><label class="me-tick"><input type="checkbox" data-pm-tick="${k}" aria-label="Change ${esc(label)}"><span>${esc(label)}</span></label>${o.link ? `<button type="button" class="link me-jig" data-pm-mode="${o.mode}">${esc(o.link)}</button>` : ""}</div>
    <div class="dm-ctrl">${ctrl}</div>${o.link ? `<div class="dm-rnd" data-pm-box="${o.mode}" hidden>${ic("refresh")}<span title="${esc(o.tip || o.box)}">${esc(o.box)}</span><button type="button" class="link" data-pm-shuffle="${o.mode}">Shuffle</button><button type="button" class="icon-btn" data-pm-stop="${o.mode}" aria-label="Stop: ${esc(o.link)}" title="Stop">${ic("x")}</button></div>` : ""}
    ${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ""}<span class="err"></span></div>`;
  const text = (k, label, o = {}) => fld(k, label, `<input name="pm_${k}" aria-label="${esc(label)}" autocomplete="off" ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} ${o.attrs || ""}>`, o);
  const select = (k, label, options, o = {}) => fld(k, label, `<select name="pm_${k}" aria-label="${esc(label)}">${options}</select>`, o);
  const sub = (k, label, cls, o = {}) => fieldHTML(Object.assign({name:"pm_" + k, label, cls, showOpt:false}, o));
  const pills = (set) => storePillsHTML(set, {noNew:true});
  openLayer({
    title:`Mass edit ${plural(n0, "profile")}`, wide:true, dismiss:false,
    body:`<p style="margin:-4px 0 16px;color:var(--ink-2)">Tick a field to change it on all ${plural(n0, "selected profile")}. Fields you don't tick stay as they are on each one.</p>
    <form id="pm-form" class="form-grid" novalidate>
      <h3 class="pm-head c6">Profile</h3>
      ${text("group", "Group", {cls:"c3", ph:"Leave blank for no group", attrs:'list="pm-groups" maxlength="60"'})}
      ${text("name", "Profile name", {cls:"c3", ph:"e.g. Lam", attrs:'maxlength="60"', hint:"Numbered in the order shown: Lam #1, Lam #2…"})}
      ${text("phone", "Phone", {cls:"c2", attrs:'inputmode="tel"', ph:"5550000000", link:"Random", mode:"phone", box:"New random numbers", tip:"New random numbers, with each profile's state's area codes"})}
      ${text("size", "Size", {cls:"c2", ph:"e.g. 10, M, OS", attrs:'maxlength="20"'})}
      ${select("once", "Only one checkout", opt([["yes", "Yes"], ["no", "No"]], "", "Pick one"), {cls:"c2"})}
      <div class="field c6 me-f" data-field="pm_stores">
        <div class="me-lab"><label class="me-tick"><input type="checkbox" data-pm-tick="stores" aria-label="Change stores"><span>Stores</span></label></div>
        <div class="pm-st"><span class="pm-sub">Add</span><div id="pm-add">${pills(add)}</div></div>
        <div class="pm-st"><label class="pm-sub" for="pm-way">Checks out with</label><select id="pm-way" name="pm_way">${opt([["login", "Store login"], ["seller", ASSIGNED]], "login")}</select></div>
        <div class="pm-st"><span class="pm-sub">Remove</span><div id="pm-rem">${pills(rem)}</div></div>
        <span class="hint">On Store login, Pokémon Center checks out with the profile's email, and other stores get the saved login with that email. A store a profile already has switches to the way picked.</span><span class="err"></span></div>
      <h3 class="pm-head c6">Shipping address</h3>
      ${text("first", "First name", {cls:"c3", link:"New random first names", mode:"rfirst", box:"New random first names", tip:"New random first names: each profile gets its own"})}
      ${text("last", "Last name", {cls:"c3", link:"New random last names", mode:"rlast", box:"New random last names", tip:"New random last names: each profile gets its own"})}
      ${text("line1", "Address line 1", {cls:"c3", ph:"Street and number"})}
      ${text("line2", "Address line 2", {cls:"c3", ph:"Apt, suite, unit"})}
      ${text("city", "City", {cls:"c2"})}
      ${select("state", "State", opt(US_STATES, "", "Select a state"), {cls:"c2"})}
      ${text("zip", "ZIP code", {cls:"c2", attrs:'inputmode="numeric" maxlength="10"'})}
      <h3 class="pm-head c6">Billing address</h3>
      ${select("bill", "Bills to", opt([["same", "Their shipping address"], ["other", "A different address"]], "", "Pick one"), {hint:"The bank checks the billing address against the card: bill to the shipping address only with a virtual credit card."})}
      <div class="c6 form-grid pm-billto" hidden>
        ${sub("bline1", "Address line 1", "c3", {placeholder:"Street and number"})}
        ${sub("bline2", "Address line 2", "c3", {placeholder:"Apt, suite, unit"})}
        ${sub("bcity", "City", "c2")}
        ${sub("bstate", "State", "c2", {type:"select", options:opt(US_STATES, "", "Select a state")})}
        ${sub("bzip", "ZIP code", "c2", {attrs:'inputmode="numeric" maxlength="10"'})}
      </div>
    </form>${groupNamesList("pm-groups")}
    <div id="pm-sum"></div>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pm-go" disabled>Change ${plural(n0, "profile")}</button>`,
    mount:(panel, close) => {
      const form = $("#pm-form", panel), go = $("#pm-go", panel), sum = $("#pm-sum", panel), billTo = $(".pm-billto", panel);
      const modes = new Set(), cache = new Map(), MODE_FIELD = {rfirst:"first", rlast:"last", phone:"phone"};
      let plan = null;
      // Shuffle (or switching a mode) forgets its random results, so the next preview rolls new ones.
      const forget = (m) => [...cache.keys()].forEach(x => { if (x.startsWith(m + "|")) cache.delete(x); });
      const tick = (k, on) => { const c = $(`[data-pm-tick="${k}"]`, panel); if (c) c.checked = !!on; const f = c && c.closest(".me-f"); if (f) f.classList.toggle("is-on", !!on); };
      const ticked = (k) => { const c = $(`[data-pm-tick="${k}"]`, panel); return !!(c && c.checked); };
      const v = (k) => { const el = $(`[name="pm_${k}"]`, panel); return el ? el.value.trim() : ""; };
      const modeOn = (k) => Object.keys(MODE_FIELD).some(m => MODE_FIELD[m] === k && modes.has(m));
      const setMode = (m, on) => {
        if (on) modes.add(m); else modes.delete(m);
        const k = MODE_FIELD[m], f = $(`[data-field="pm_${k}"]`, panel);
        $(".dm-ctrl", f).hidden = on; $(`[data-pm-box="${m}"]`, f).hidden = !on; $(`[data-pm-mode="${m}"]`, f).hidden = on;
        tick(k, on || v(k) !== "");
        forget(m);
      };
      const read = () => {
        const r = {set:{}, modes:new Set(modes), add:[...add], rem:[...rem], way:v("way") || "login", stores:ticked("stores"),
          billTo:{line1:v("bline1"), line2:v("bline2"), city:v("bcity"), state:v("bstate"), zip:v("bzip")}};
        PM_FIELDS.forEach(k => { if (k !== "stores" && ticked(k) && !modeOn(k)) r.set[k] = v(k); });
        return r;
      };
      const draw = () => {
        PM_FIELDS.forEach(k => setErr(panel, "pm_" + k, ""));
        plan = pmPlan(rows0.map(p => p.id), read(), cache);
        plan.errs.forEach(([k, msg]) => setErr(panel, k, msg));
        const changed = plan.rows.filter(x => x.ch.size), cols = plan.cols, MAX = 100;
        const cell = (x, c) => `<td class="${x.ch.has(c.key) ? "" : "dm-same"}">${esc(c.show(x.after)) || "—"}</td>`;
        sum.innerHTML = !plan.touched ? `<div class="note" style="margin-top:14px">Tick a field to change it.</div>`
          : `<div class="note" style="margin-top:14px"><strong style="color:var(--ink)">${plan.errs.length ? "Fix what's marked to go on" : changed.length ? `Preview: changes ${plural(changed.length, "profile")}` : "Nothing changes"}</strong>
          ${cols.length && !plan.errs.length ? `<div class="dm-wrap"><table class="dm-prev"><thead><tr><th>Profile</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead>
            <tbody>${plan.rows.slice(0, MAX).map(x => `<tr><td>${esc(x.after.name)}${x.ch.has("name") ? `<span class="pm-was">was ${esc(x.was)}</span>` : ""}</td>${cols.map(c => cell(x, c)).join("")}</tr>`).join("")}</tbody></table></div>
            ${plan.rows.length > MAX ? `<p class="item-sub" style="margin:6px 0 0">And ${plan.rows.length - MAX} more</p>` : ""}` : ""}
          ${plan.lines.length + plan.warns.length + plan.errs.length ? `<ul class="summary-list" style="margin-top:8px">${plan.lines.map(x => `<li>${x}</li>`).join("")}${plan.warns.map(x => `<li style="color:var(--caution)">${x}</li>`).join("")}${plan.errs.map(([, msg]) => `<li style="color:var(--danger)">${esc(msg)}</li>`).join("")}</ul>` : ""}</div>`;
        go.disabled = !changed.length || plan.errs.length > 0;
        go.textContent = `Change ${plural(changed.length || n0, "profile")}`;
      };
      form.addEventListener("input", (e) => {
        const n = e.target.name || "", k = n.replace(/^pm_/, "");
        // Typing a billing address picks A different address.
        if (/^b(line1|line2|city|state|zip)$/.test(k)){ const b = $('[name="pm_bill"]', panel); b.value = "other"; billTo.hidden = false; tick("bill", true); }
        else if (PM_FIELDS.includes(k)) tick(k, e.target.value.trim() !== "" || e.target.tagName === "SELECT");
        if (k === "bill") billTo.hidden = e.target.value !== "other";
        draw();
      });
      form.addEventListener("change", (e) => {
        const t = e.target; if (!t.dataset || !t.dataset.pmTick) return;
        const k = t.dataset.pmTick, m = Object.keys(MODE_FIELD).find(x => MODE_FIELD[x] === k && modes.has(x));
        if (m && !t.checked){ setMode(m, false); tick(k, false); } else tick(k, t.checked);
        draw();
      });
      panel.addEventListener("click", (e) => {
        const md = e.target.closest("[data-pm-mode]"); if (md){ setMode(md.dataset.pmMode, true); draw(); return; }
        const sh = e.target.closest("[data-pm-shuffle]"); if (sh){ forget(sh.dataset.pmShuffle); draw(); return; }
        const st = e.target.closest("[data-pm-stop]"); if (st){ setMode(st.dataset.pmStop, false); draw(); return; }
        const pk = e.target.closest("[data-pick]");
        if (pk && pk.closest(".pm-st")){
          const inAdd = !!pk.closest("#pm-add"), k = pk.dataset.pick, mine = inAdd ? add : rem, other = inAdd ? rem : add;
          if (mine.has(k)) mine.delete(k); else { mine.add(k); other.delete(k); }
          $("#pm-add", panel).innerHTML = pills(add); $("#pm-rem", panel).innerHTML = pills(rem);
          tick("stores", add.size + rem.size > 0); draw();
        }
      });
      form.addEventListener("submit", (e) => e.preventDefault());
      go.addEventListener("click", () => {
        if (!plan || plan.errs.length || !plan.rows.some(x => x.ch.size)) return;
        const done = pmApply(plan);
        close();
        toast(`Changed ${plural(done.count, "profile")}`, "", {label:"Undo", run:() => { pmUndo(done.undo); toast("Mass edit undone"); }});
      });
      draw();
    }
  });
}

// What a mass edit (r: {set: typed values by field, modes, stores, add, rem, way, billTo}) would make of each
// profile, without changing anything: rows [{id, was, after, ch: what changes}], the preview's columns, cards whose
// name follows (cards: id -> name), and lines, warnings and errors ([field, message]). cache keeps random names
// and numbers while what they depend on stays the same.
function pmPlan(ids, r, cache){
  const rows = profilesInOrder(ids), s = r.set, M = r.modes, sel = new Set(rows.map(p => p.id));
  const plan = {rows:[], cols:[], lines:[], warns:[], errs:[], cards:new Map(), touched:Object.keys(s).length > 0 || M.size > 0 || !!r.stores};
  if (!rows.length) return plan;
  const before = rows.map(pmState), after = rows.map(pmState);
  if ("group" in s){
    const g = S.groups.find(x => norm(x.name) === norm(s.group));
    after.forEach(a => { a.group = g ? g.name : s.group; });
    if (s.group && !g) plan.lines.push(`${esc(s.group)} is a new group`);
  }
  if ("name" in s){
    if (!s.name) plan.errs.push(["pm_name", "Enter a name."]);
    else {
      const m = /^(.*\S)\s*#(\d+)$/.exec(s.name), base = m ? m[1] : s.name, from = m ? +m[2] : genNextNumber(base, sel);
      after.forEach((a, i) => { a.name = `${base} #${from + i}`; });
      const taken = new Set(S.profiles.filter(p => !sel.has(p.id)).map(p => norm(p.name))), same = after.filter(a => taken.has(norm(a.name))).map(a => a.name);
      if (same.length) plan.warns.push(`${esc(same.slice(0, 3).join(", "))}${same.length > 3 ? "…" : ""}: another profile has ${same.length === 1 ? "that name" : "those names"}`);
    }
  }
  if ("phone" in s){
    const d = (s.phone.startsWith("+") ? "+" : "") + digits(s.phone);
    if (digits(d).length < 7) plan.errs.push(["pm_phone", "Enter a phone number."]);
    after.forEach(a => { a.phone = d; });
  }
  if ("size" in s) after.forEach(a => { a.size = s.size; });
  if ("once" in s){ if (!s.once) plan.errs.push(["pm_once", "Pick one."]); else after.forEach(a => { a.once = s.once === "yes"; }); }
  // Shipping address: what's typed, then New random first and last names (each profile its own, with a full name no
  // other profile has where the lists allow; rolled once per set of profiles).
  const need = {first:"Enter a first name.", last:"Enter a last name.", line1:"Enter a street address.", city:"Enter a city.", state:"Choose one."};
  Object.keys(need).forEach(k => { if (k in s && !s[k]) plan.errs.push(["pm_" + k, need[k]]); });
  if ("zip" in s && !genZipOk(s.zip)) plan.errs.push(["pm_zip", s.zip ? "Use 5 digits, or ZIP+4." : "Enter a ZIP code."]);
  PM_SHIP.forEach(k => { if (k in s) after.forEach(a => { if (a.ship) a.ship[k] = s[k]; }); });
  if (M.has("rfirst") || M.has("rlast")){
    const namesUsed = new Set(S.profiles.filter(p => !sel.has(p.id)).map(p => norm(pmFull(addrById(p.shipId)))).filter(Boolean));
    for (const [m, k] of [["rfirst", "first"], ["rlast", "last"]]){
      if (!M.has(m)) continue;
      const key = m + "|" + rows.map(p => p.id).join(",");
      let list = cache.get(key);
      if (!list){
        const seen = new Set(), taken = new Set(namesUsed);
        list = after.map(a => { const sh = a.ship || {first:"", last:""}; let x, full, t = 0;
          do { x = genName("any")[k]; full = norm(k === "first" ? x + " " + sh.last : sh.first + " " + x); } while ((seen.has(x) || taken.has(full)) && ++t < 40);
          seen.add(x); taken.add(full); return x; });
        cache.set(key, list);
      }
      after.forEach((a, i) => { if (a.ship) a.ship[k] = list[i]; });
    }
  }
  const noShip = PM_SHIP.some(k => k in s) || M.has("rfirst") || M.has("rlast") ? before.filter(b => !b.ship).length : 0;
  if (noShip) plan.warns.push(`${plural(noShip, "profile")} ${noShip === 1 ? "has" : "have"} no shipping address yet, so ${noShip === 1 ? "its" : "their"} address isn't changed`);
  // New random phone numbers, with the area codes of each profile's state (as it will be).
  if (M.has("phone")){
    const key = "phone|" + after.map(a => a.ship ? a.ship.state : "").join(",");
    let list = cache.get(key);
    if (!list){ const used = new Set(); list = after.map(a => { let p, t = 0; do { p = genPhone(a.ship ? a.ship.state : ""); } while (used.has(p) && ++t < 30); used.add(p); return p; }); cache.set(key, list); }
    after.forEach((a, i) => { a.phone = list[i]; });
  }
  // Billing: their shipping address, or one address for all of them, each in its own shipping name (as Import's A
  // different billing address, 1.9.86+). Left alone, a billing address of its own in the old shipping name takes the new.
  if ("bill" in s){
    const o = s.bill === "other" ? billAddrOk(r.billTo) : null;
    if (!s.bill) plan.errs.push(["pm_bill", "Pick one."]);
    else if (s.bill === "other" && !o) plan.errs.push(["pm_bill", "Enter the billing address's street, city, state and ZIP code."]);
    else after.forEach(a => {
      if (s.bill === "same"){ a.billSame = true; a.bill = null; }
      else { a.billSame = false; a.bill = Object.assign({first:a.ship ? a.ship.first : "", last:a.ship ? a.ship.last : ""}, o, {country:"US"}); }
    });
    if (o) plan.lines.push(`Each bills to ${esc(draftAddrLine(o))}, in its own name`);
    if (s.bill === "same"){ const k = before.filter(b => !b.billSame).length; if (k) plan.warns.push(`${plural(k, "profile")} will bill to ${k === 1 ? "its" : "their"} shipping address. Keep a regular card's billing on the address its bank has; this is for virtual credit cards.`); }
  } else after.forEach((a, i) => {
    const was = pmFull(before[i].ship);
    if (!a.billSame && a.bill && a.ship && norm(pmFull(a.bill)) === norm(was) && norm(pmFull(a.ship)) !== norm(was)){ a.bill.first = a.ship.first; a.bill.last = a.ship.last; }
  });
  // A card in the old shipping name (or with none) takes the new one, as in the profile editor, when every profile
  // using it goes the same way; otherwise it keeps its name.
  const byCard = new Map();
  rows.forEach((p, i) => {
    const c = cardById(p.cardId), was = pmFull(before[i].ship), now = pmFull(after[i].ship);
    if (!c || !before[i].ship || norm(was) === norm(now) || (String(c.holder || "").trim() && norm(c.holder) !== norm(was))) return;
    if (!byCard.has(c.id)) byCard.set(c.id, []);
    byCard.get(c.id).push(capsLike(c.holder, now));
  });
  let kept = 0;
  byCard.forEach((names, id) => {
    const users = S.profiles.filter(q => q.cardId === id);
    if (names.length === users.length && users.every(q => sel.has(q.id)) && new Set(names.map(norm)).size === 1) plan.cards.set(id, names[0]); else kept++;
  });
  after.forEach((a, i) => { if (plan.cards.has(rows[i].cardId)) a.holder = plan.cards.get(rows[i].cardId); });
  if (kept) plan.warns.push(`${plural(kept, "card")} ${kept === 1 ? "keeps its" : "keep their"} name, as profiles with another name use ${kept === 1 ? "it" : "them"} too. Edit names on Cards changes ${kept === 1 ? "it" : "them"}.`);
  // Stores: one added checks out the way picked (r.way: "login", Pokémon Center on the profile's email, or "seller",
  // Use Assigned Account), and one a profile already has switches to it. A store login is linked by the profile's
  // email, as the editor does; one with none waits for a login (the alert on Profiles). The email follows the stores.
  if (r.stores){
    if (!r.add.length && !r.rem.length) plan.errs.push(["pm_stores", "Pick a store to add or remove."]);
    const claimed = new Set(), none = [];
    let waiting = 0, noEmail = 0;
    after.forEach((a, i) => {
      const p = rows[i], st = a.stores.filter(e => !r.rem.includes(storeKeyOf(e))), mine = [];
      r.add.forEach(k => {
        const md = r.way === "seller" ? "seller" : defaultMode(k), cur = st.find(e => storeKeyOf(e) === k);
        if (cur){ if (modeOf(cur) !== md){ Object.assign(cur, {mode:md, loginId:null, email:"", verified:false}); mine.push(cur); } return; }
        const o = allStoreOptions().find(z => storeKeyOf(z) === k) || {store:"other", storeName:k.replace(/^other:/, "")};
        const e = {store:o.store, storeName:o.storeName || "", mode:md, loginId:null, email:"", verified:false};
        st.push(e); mine.push(e);
      });
      mine.forEach(e => {
        if (e.mode === "email"){ e.email = a.email; if (!emailOk(e.email)) noEmail++; }
        if (e.mode !== "login") return;
        const k = storeKeyOf(e), em = norm(a.email);
        const hits = em ? S.logins.filter(l => storeKeyOf(l) === k && norm(l.email) === em).sort((x, y) => natural(loginTitle(x), loginTitle(y))) : [];
        const l = hits.find(x => !claimed.has(x.id) && loginProfiles(x.id).every(q => q === p)) || hits[0];
        if (l){ e.loginId = l.id; claimed.add(l.id); } else waiting++;
      });
      if (!st.length) none.push(p.name);
      a.stores = st;
      a.email = pmEmail(a);
    });
    if (none.length) plan.errs.push(["pm_stores", `That leaves ${none.length === 1 ? none[0] : plural(none.length, "profile")} with no store. A profile needs one.`]);
    const name = (k) => storeLabel(allStoreOptions().find(o => storeKeyOf(o) === k) || {store:k});
    if (r.add.length) plan.lines.push(`Adds ${esc(r.add.map(name).join(", "))}${r.way === "seller" ? ` on ${ASSIGNED}` : ""}, or switches ${r.add.length === 1 ? "it" : "them"} to that where a profile has ${r.add.length === 1 ? "it" : "them"}`);
    if (r.rem.length) plan.lines.push(`Removes ${esc(r.rem.map(name).join(", "))}`);
    if (waiting) plan.warns.push(`${plural(waiting, "store")} will wait for a store login: none saved has the profile's email. Link ${waiting === 1 ? "it" : "them"} from the alert on Profiles.`);
    if (noEmail) plan.warns.push(`${plural(noEmail, "profile")} ${noEmail === 1 ? "has" : "have"} no email for Pokémon Center to check out with yet`);
  }
  const addrSame = (x, y) => !x === !y && (!x || ADDR_F.every(k => String(x[k] || "") === String(y[k] || "")));
  const stKey = (list) => JSON.stringify(list.map(e => [storeKeyOf(e), modeOf(e), e.loginId || "", e.email || ""]));
  plan.rows = rows.map((p, i) => {
    const b = before[i], a = after[i], ch = new Set();
    ["name", "group", "phone", "size", "once", "email"].forEach(k => { if (a[k] !== b[k]) ch.add(k); });
    if (stKey(a.stores) !== stKey(b.stores)) ch.add("stores");
    if (!addrSame(a.ship, b.ship)) ch.add("ship");
    if (a.billSame !== b.billSame || !addrSame(a.bill, b.bill)) ch.add("bill");
    if (a.holder !== b.holder) ch.add("card");
    return {id:p.id, was:p.name, after:a, ch};
  });
  // An address other profiles share stays theirs: these get one of their own (resolveAddr).
  const shared = plan.rows.filter(x => x.ch.has("ship") || x.ch.has("bill")).map(x => rows.find(p => p.id === x.id))
    .filter(p => S.profiles.some(q => !sel.has(q.id) && [q.shipId, q.billSame ? null : q.billId].some(id => id && (id === p.shipId || (!p.billSame && id === p.billId))))).length;
  if (shared) plan.lines.push(`${plural(shared, "profile")} ${shared === 1 ? "shares its" : "share their"} address with profiles you didn't select, which keep it as it is`);
  const COLS = [
    {label:"Group", key:"group", show:(a) => a.group || "No group"},
    {label:"Phone", key:"phone", show:(a) => fmtPhone(a.phone)},
    {label:"Size", key:"size", show:(a) => a.size},
    {label:"One checkout", key:"once", show:(a) => a.once ? "Yes" : "No"},
    {label:"Stores", key:"stores", show:(a) => a.stores.map(e => storeLabel(e) + (modeOf(e) === "seller" ? " (assigned)" : modeOf(e) === "login" && !loginById(e.loginId) ? " (no login yet)" : "")).join(", ")},
    {label:"Email", key:"email", show:(a) => a.email},
    {label:"Shipping", key:"ship", show:(a) => a.ship ? [pmFull(a.ship), streetLine(a.ship)].filter(Boolean).join(", ") : ""},
    {label:"Billing", key:"bill", show:(a) => a.billSame ? "Same as shipping" : a.bill ? [pmFull(a.bill), streetLine(a.bill)].filter(Boolean).join(", ") : ""},
    {label:"Name on card", key:"card", show:(a) => a.holder || ""}];
  plan.cols = COLS.filter(c => plan.rows.some(x => x.ch.has(c.key)));
  return plan;
}
// Does what the plan says; returns how many profiles changed and what Undo needs.
function pmApply(plan){
  const vault = S, now = Date.now(), before = {profiles:new Map(), cards:new Map(), addresses:new Map(S.addresses.map(a => [a.id, JSON.stringify(a)])), groups:new Set(S.groups.map(g => g.id))};
  let count = 0;
  plan.rows.forEach(x => {
    const p = S.profiles.find(q => q.id === x.id), a = x.after, ch = x.ch; if (!p || !ch.size) return;
    before.profiles.set(p.id, JSON.stringify(p));
    if (ch.has("group")){ let g = null; if (a.group){ g = S.groups.find(q => norm(q.name) === norm(a.group)); if (!g){ g = {id:uid(), name:a.group}; S.groups.push(g); } } p.groupId = g ? g.id : null; }
    if (ch.has("name")) p.name = a.name;
    if (ch.has("phone")) p.phone = a.phone;
    if (ch.has("size")) p.size = a.size;
    if (ch.has("once")) p.oneCheckout = a.once;
    if (ch.has("stores")) p.stores = a.stores.map(e => Object.assign({}, e));
    if (ch.has("email")) p.email = a.email;
    if (ch.has("ship") && a.ship) p.shipId = resolveAddr(a.ship, p.shipId, p.id, p.billSame ? null : p.billId);
    if (ch.has("bill")){
      if (a.billSame){ p.billSame = true; p.billId = null; }
      else if (a.bill){ p.billId = resolveAddr(a.bill, p.billSame ? null : p.billId, p.id, p.shipId); p.billSame = false; }
    }
    p.updatedAt = now; count++;
  });
  plan.cards.forEach((holder, id) => { const c = cardById(id); if (c && c.holder !== holder){ before.cards.set(id, JSON.stringify(c)); c.holder = holder; } });
  const undo = {vault, profiles:before.profiles, cards:before.cards,
    addresses:new Map(S.addresses.filter(a => before.addresses.get(a.id) !== JSON.stringify(a)).map(a => [a.id, before.addresses.get(a.id) || null])),
    groups:S.groups.filter(g => !before.groups.has(g.id)).map(g => g.id)};
  persist(); render();
  return {count, undo};
}
function pmUndo(u){
  if (S !== u.vault) return;
  const put = (o, json) => { Object.keys(o).forEach(k => delete o[k]); Object.assign(o, JSON.parse(json)); };
  S.profiles.forEach(p => { const j = u.profiles.get(p.id); if (j) put(p, j); });
  const used = (id) => S.profiles.some(p => p.shipId === id || (!p.billSame && p.billId === id));
  S.addresses = S.addresses.filter(a => !(u.addresses.has(a.id) && u.addresses.get(a.id) === null && !used(a.id)));
  S.addresses.forEach(a => { const j = u.addresses.get(a.id); if (j) put(a, j); });
  S.cards.forEach(c => { const j = u.cards.get(c.id); if (j) put(c, j); });
  S.groups = S.groups.filter(g => !u.groups.includes(g.id) || S.profiles.some(p => p.groupId === g.id));
  persist(); render();
}

      let ready = [];

        catch(e){ read(); toast("Couldn't reach the license server. Check your connection and try again.", "err"); return; }
        if (!r.ok){ read(); toast(r.status === 503 ? "The Discord channel isn't set up on the license server yet." : r.status === 429 ? "Too many tries today. Try again tomorrow." : r.status === 401 ? "Your license wasn't recognized." : "The license server didn't accept these accounts.", "err"); return; }

      });
    }
  });

      const backupText = async () => { await saveChain; return JSON.stringify(VAULT); };
      const bd = $("#st-backup", panel); if (!DL && !IS_LOCAL) bd.hidden = true;

function openRestore(unlocked){
  openLayer({
    title:"Restore a backup", dismiss:false,
    body:`<p style="margin:0 0 14px;color:var(--ink-2)">${unlocked ? "Restoring replaces everything in this vault with the backup. " : ""}Unlock it with the master password it was made with.</p>
      <div class="dz"><input type="file" id="rs-file" accept=".json,application/json" class="sr"><button class="btn" type="button" id="rs-pick">${ic("imp")}Choose backup file</button><div style="margin-top:8px" id="rs-fname">or paste it below</div></div>
      <div class="field" style="margin-top:14px"><label for="rs-text">Backup contents</label><textarea id="rs-text" spellcheck="false" placeholder='{"format":"profile-vault-backup", ...}'></textarea></div>
      <form id="rs-form" class="field" style="margin-top:12px"><label for="rs-pw">Backup's master password</label><input id="rs-pw" type="password" autocomplete="current-password"><span class="err" id="rs-err" role="alert"></span></form>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rs-go">Restore backup</button>`,
    mount:(panel, close) => {
      const ta = $("#rs-text", panel), err = $("#rs-err", panel), go = $("#rs-go", panel);
      $("#rs-pick", panel).addEventListener("click", () => $("#rs-file", panel).click());
      $("#rs-file", panel).addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const r = new FileReader(); r.onload = () => { ta.value = String(r.result || ""); $("#rs-fname", panel).textContent = f.name; $("#rs-pw", panel).focus(); }; r.readAsText(f);
      });
      const run = async () => {
        err.textContent = "";
        let rec; try { rec = JSON.parse(ta.value.trim()); } catch(e){ err.textContent = "Paste or choose a backup file first."; return; }
        if (!validRecord(rec)){ err.textContent = rec && Array.isArray(rec.profiles) ? "That's a plain export. Use Import instead." : "That isn't a FAFO backup."; return; }
        if (unlocked && !(await confirmDialog({title:"Replace this vault?", body:`Everything here (${plural(S.profiles.length,"profile")}) will be replaced by the backup.`, confirm:"Replace vault", danger:true}))) return;
        go.disabled = true; go.textContent = "Restoring…";
        try {
          const r = await openRecord(rec, $("#rs-pw", panel).value);
          // A restored vault doesn't sync until it's turned on again, which then merges it with the
          // online copy or replaces it (what the backup knew about syncing is out of date).
          const wasOn = syncOn();
          if (r.state._local){ delete r.state._local; rec = await sealState(r.key, {iter:rec.iter || ITER, salt:rec.salt}, r.state); }
          KEY = r.key; SYNC_AUTH = r.auth; S = r.state; VAULT = rec; writeStore(rec); syncHintWrite(null);
          if (wasOn) setTimeout(() => toast("Sync is off for the restored vault. Turn it on in Settings to merge it with the online copy, or replace it."), 900);
          UI.selected.clear(); UI.view = "profiles"; UI.group = "all";
          closeAllLayers(); startApp(); toast(`Restored ${plural(S.profiles.length, "profile")}`);
        } catch(e){ go.disabled = false; go.textContent = "Restore backup"; err.textContent = "That password doesn't open this backup."; }
      };
      go.addEventListener("click", run);
      $("#rs-form", panel).addEventListener("submit", (e) => { e.preventDefault(); run(); });
    }
  });
}

// Mail servers turn down a wrong password in many different words; say what to do instead.
// kind: "auth" (password refused), "net" (couldn't reach the server, timed out, or a temporary
// problem on its side) or "" (anything else, shown as the server said it).
// Timeouts and temporary failures often mention authentication too, so they're checked first.
// The desktop app refuses a mail server it can't verify, before any password is sent. From its version
// 11 it trusts the certificates Windows trusts (antivirus, VPNs and work networks add theirs there) and
// adds what it saw: who issued the certificate, dates that don't match this computer's clock, or
// another server's name. Older versions only say the certificate couldn't be verified.
const DESK_TRUSTS_WINDOWS = !!(window.pvDesktop && window.pvDesktop.version >= 11);
// The app is FAFO.exe from desktop 12 (the 1.9.76 download); older downloads are Orbit.exe.
const DESK_EXE = window.pvDesktop && window.pvDesktop.version >= 12 ? "FAFO.exe" : "Orbit.exe";
function certAdvice(provider, raw, name){
  const who = provider === "custom" || name === "Your email provider" ? "the mail server" : name;
  const issuer = (raw.match(/issued by “([^”]+)”/) || [])[1];
  const clock = raw.match(/valid from (.+?) to (.+?), but this computer's clock says (.+?)\./);
  const other = raw.match(/It's for (.+?), not (\S+?)\. Check the server name/);
  const lead = `This isn't about your password: FAFO checks it's really talking to ${who} before signing in, and that check failed, so the password wasn't sent.`;
  let text;
  if (clock) text = `${lead} The certificate is valid from ${clock[1]} to ${clock[2]}, but this computer's clock says ${clock[3]}. Set the date and time automatically (Windows Settings → Time & language → Date & time), then Sync again.`;
  else if (other) text = `${lead} The certificate is for ${other[1]}, not ${other[2]}. Check the server name in this inbox's settings.`;
  else if (issuer || /self-signed/i.test(raw)) text = `${lead} The connection is being checked by ${issuer ? `“${issuer}”` : "a program on this computer or network"}: usually antivirus email scanning, a VPN or a work network. Turn off its email or SSL scanning, or add ${DESK_EXE} as an exception, then Sync again.`;
  else text = `${lead} Usually antivirus email scanning (Avast, AVG, ESET, Kaspersky, Bitdefender…), a VPN or a work network is checking secure connections, or this computer's date and time are wrong. Turn off the email or SSL scanning or add ${DESK_EXE} as an exception, check the clock, then Sync again.`;
  const download = !DESK_TRUSTS_WINDOWS && !clock && !other;
  if (download) text += " The newest FAFO download trusts the same certificates Windows does, which fixes this for most antivirus programs.";
  return {kind:"cert", raw, text, download, short:`Couldn't connect to ${who} securely, so your password wasn't sent. Settings → Your inboxes says how to fix it.`};
}
function mailError(provider, err, email){
  const raw = String(err || "").trim();

  // First: the app's explanation mentions a VPN or work "network", which the check below would take.
  if (/security certificate|self-signed certificate|certificate (has expired|is not yet valid)|unable to verify the first certificate|certificate's altnames/i.test(raw)) return certAdvice(provider, raw, name);
  if (/timed? ?out|timeout|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|getaddrinfo|ECONNREFUSED|ECONNRESET|socket hang up|network|offline|temporar|UNAVAILABLE|try again later|too many (simultaneous )?connections/i.test(raw)){
    return {kind:"net", raw, text:provider === "custom" ? "Couldn't reach the mail server, or it had a temporary problem. Check the server name and port and your internet connection, then try again."

  }
  if (/PRIVACYREQUIRED|plaintext|non-secure|STARTTLS|(TLS|SSL) required/i.test(raw)){
    return {kind:"", raw, text:"The mail server only accepts secure connections. Use port 993, or the SSL/TLS port your provider lists."};
  }

    const who = email || "this address";
    const text = provider === "outlook" ? `${name} didn't accept the password. Check two-step verification is on and use an app password. If Microsoft doesn't offer one, forward your order emails to a Gmail address and add that inbox instead.`
      : APP_PW[provider] && APP_PW[provider].strip ? `${name} didn't accept the password for ${who}. Use an app password (not your normal password) made while signed in as ${who}, and paste all of it.`
      : `${name} didn't accept the email or password. Check both and try again.`;
    return {kind:"auth", text, raw};
  }
  return {kind:"", text:raw, raw};
}

  if (!a.first || !a.last) out.push(!a.first && !a.last ? "name missing" : !a.first ? "first name missing" : "last name missing");
  if (!a.line1) out.push("street missing");
  if (!a.city) out.push("city missing");
  if ((c === "US" || c === "CA") && !a.state) out.push("state missing");
  if (!a.zip && c !== "HK" && c !== "AE") out.push("ZIP code missing");

}

  if (e.number) out.push(!digits(c.number) ? "card number missing" : /Use a Visa/.test(e.number) ? "card type isn't supported" : "card number isn't valid");
  if (!c.expM || !c.expY) out.push("expiry date missing"); else if (isExpired(c)) out.push(`card expired ${expStr(c)}`);
  if (e.cvv) out.push(c.cvv ? "CVV isn't the right length" : "CVV missing");

function openInboxEditor(existing){
  const isNew = existing._new;
  openLayer({
    title: isNew ? "Add inbox" : "Edit inbox", small:false, dismiss:false,
    body:`<p style="margin:0 0 16px;color:var(--ink-2)">${isNew ? "Enter your email and an app password. Your provider is detected from the address." : "Leave the password blank to keep the current one."}</p>${!isNew && existing.syncError ? `<p class="note note-warn" style="margin:0 0 16px">${esc(mailError(existing.provider, existing.syncError, existing.email).text)}</p>` : ""}<form id="i-form" novalidate>${imapFields(isNew ? {} : existing, isNew)}</form><p class="note" id="i-test-out" hidden style="margin:12px 0 0"></p>`,
    foot:`<button class="btn" data-close>Cancel</button>${DESK ? `<button class="btn" id="i-test">Test</button>` : ""}<button class="btn btn-primary" id="i-save">${isNew && DESK ? "Save and sync" : "Save inbox"}</button>`,
    mount:(panel, close) => {
      wireImap(panel);
      const save = () => {
        const r = readImap(panel, existing.password);
        if (!r.inbox){ setErr(panel,"i_email","Enter the IMAP email."); return; }
        if (r.bad) return;
        if (S.inboxes.some(i => i.id !== existing.id && norm(i.email) === norm(r.inbox.email))){ setErr(panel,"i_email","You already saved this inbox."); return; }
        let saved;
        const newPw = !isNew && r.inbox.password !== existing.password;
        if (isNew){ saved = Object.assign({id:uid(), createdAt:Date.now(), auto:true}, r.inbox); S.inboxes.push(saved); } else { Object.assign(existing, r.inbox, {syncError:""}); saved = existing; }
        persist(); render(); toast(isNew ? "Inbox added" : "Inbox saved"); close();
        if (DESK && (isNew || newPw)) syncOneInbox(saved, false);
      };
      const tb = $("#i-test", panel);
      if (tb) tb.addEventListener("click", async () => {
        const r = readImap(panel, existing.password); if (!r.inbox || r.bad) return;
        const out = $("#i-test-out", panel); out.hidden = false; out.className = "note"; out.textContent = "Signing in…"; tb.disabled = true;
        out.scrollIntoView({block:"nearest"});
        const res = await window.pvDesktop.testInbox({email:r.inbox.email, password:r.inbox.password, host:r.inbox.host, port:r.inbox.port});
        tb.disabled = false;
        out.className = res.ok ? "note" : "note note-warn";
        const m = res.ok ? null : mailError(r.inbox.provider, res.error, r.inbox.email);
        out.textContent = res.ok ? `Signed in. Your inbox has ${res.messages.toLocaleString()} emails.` : m.text + (m.text !== m.raw && m.raw && m.kind !== "cert" ? ` (Details: ${m.raw})` : "");
        out.scrollIntoView({block:"nearest"});
      });
      $("#i-save", panel).addEventListener("click", save);
      $("#i-form", panel).addEventListener("submit", (e) => { e.preventDefault(); save(); });
    }
  });
}

/* ================= ORDER TRACKER ================= */
const orderMoney = (v) => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const orderById = (id) => (S.orders || []).find(o => o.id === id) || null;
const ORDER_STAGES = [["placed","Placed"],["shipped","Shipped"],["arriving","Arriving"],["delivered","Delivered"],["canceled","Canceled"]];
const stageLabel = (k) => (ORDER_STAGES.find(s => s[0] === k) || [0,"Placed"])[1];
const orderStoreLabel = (o) => o.store === "other" ? (o.storeName || "Other") : ((STORES.find(s => s[0] === o.store) || [0, o.storeName || o.store])[1]);
// Same store + same order number = same order. Item text only matters when there's no order number.
function orderKey(o){ const st = o.store === "other" ? "other:" + norm(o.storeName) : o.store; return o.orderNo ? st + "|#" + norm(o.orderNo) : st + "||" + norm(o.item) + "|" + (o.at || ""); }

/* -- email parsing (mirrors the watcher, runs in-app on pasted text) -- */
const EMAIL_STORE_DOMAINS = [["target.com","target"],["walmart.com","walmart"],["bestbuy.com","bestbuy"],["amazon.com","amazon"],["gamestop.com","gamestop"],["pokemoncenter.com","pokemoncenter"],["pokemon.com","pokemoncenter"],["costco.com","costco"],["samsclub.com","samsclub"],["nike.com","nike"],["p-bandai.com","other"]];
const CONFIRM_RE = /(thanks?\s+for\s+(your\s+order|shopping)|here'?s\s+your\s+order|order\s+confirmation|thank\s+you\s+for\s+(your\s+order|placing|shopping))/i;
const NOT_CONFIRM_RE = /(cancel|refund|return|shipped|delivered|on\s+its\s+way|arrives\s+t|out\s+for\s+delivery|prescription|survey|review\s+your)/i;
function storeFromText(text){
  const low = String(text || "").toLowerCase();
  for (const [dom, id] of EMAIL_STORE_DOMAINS) if (low.includes(dom)) return id;
  if (/pok[eé]mon\s*center/i.test(low)) return "pokemoncenter";
  if (/\btarget\b/.test(low)) return "target";
  if (/\bwalmart\b/.test(low)) return "walmart";
  if (/best\s*buy/.test(low)) return "bestbuy";
  return "";
}
function parseOrderEmail(text){
  if (!CONFIRM_RE.test(text)) return null;
  const store = storeFromText(text);
  if (!store) return null;
  const pick = (re, g) => { const m = text.match(re); return m && m[g||1] ? m[g||1].trim() : ""; };
  // Order numbers always contain a digit, so words like "Number" or "Details" never match.
  const orderNo = pick(/order\s*(?:#|no\.?|number|id)?\s*[:#]?\s*#?\s*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9\-]{5,25})/i).replace(/^(\d{8,})[A-Za-z]+$/, "$1");
  let total = pick(/(?:order\s+total|grand\s+total)[\s:|]*\$?\s*([\d,]+\.\d{2})/i) || pick(/\btotal[\s:|]*\$?\s*([\d,]+\.\d{2})/i);
  const buyer = pick(/thank[s]?\s+for\s+your\s+order,\s*([A-Za-z][A-Za-z .'-]{1,40}?)[!\.]/i) || pick(/hello,\s*([A-Za-z][A-Za-z .'-]{1,40}?)[!\.\n]/i);
  const shipTo = pick(/delivers?\s+to:\s*\n?\s*([A-Za-z][A-Za-z .'-]{1,40}?),/i) || pick(/[Ss]hipping\s+[Aa]ddress:\s*\n?\s*([A-Za-z][A-Za-z'-]*(?:\s+[A-Z][A-Za-z'-]*){1,3})(?=\s+\d|\s*\n|\s*\|)/);
    const cardBrandM = text.match(/(Visa|Mastercard|American Express|Amex|Discover)\s*\*+\s*(\d{4})/i);
  const cardStr = cardBrandM ? `${cardBrandM[1]} ••${cardBrandM[2]}` : "";
  let item = pick(/Arrives[^\n]*\n+/i) ? "" : "";
  // item: the product line usually appears right before "Qty:"
  const qtyIdx = text.search(/\bQty\s*:\s*\d/i);
  if (qtyIdx > -1){
    // Table-style emails put "SKU ... Qty" on one line, so strip pipes and skip SKU/price lines.
    const before = text.slice(Math.max(0, qtyIdx - 400), qtyIdx).split("\n").map(s => s.replace(/\|/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
    for (let i = before.length - 1; i >= 0; i--){ const ln = before[i]; if (ln.length > 8 && !/^https?:|order|summary|delivers|shipping|billing|^\$|^sku\b|^price\b/i.test(ln) && !/^[\d\s#:.-]+$/.test(ln)){ item = ln; break; } }
  }
  if (!item){ const im = text.match(/\n([A-Z][^\n]{10,90}?)\n\s*SKU/i); if (im) item = im[1].trim(); }
  const qty = pick(/\bQty\s*:\s*(\d+)/i) || "1";
  const priceEach = pick(/\$([\d,]+\.\d{2})\s*\/\s*ea/i);
  const arrives = pick(/Arrives[^\n]*?([A-Z][a-z]{2},?\s+[A-Z][a-z]{2}\s+\d{1,2})/);
  return { store, orderNo, total, buyer, shipTo, shipAddr:shipAddrFrom(text), card:cardStr, item:item.replace(/\s+/g," ").slice(0,120), qty, priceEach, arrives };
}
// The street address after the recipient's name, e.g. Target's
// "Delivers to:\nAva Hayes, 501 Oak Ave N, Unit 5, Saint Paul, MN 55101".
// Only kept when it ends in a state and ZIP, so stray text never becomes an address.
function shipAddrFrom(text){
  const ok = (s) => /\b[A-Z]{2}\s+\d{5}(-\d{4})?\s*$/.test(s) ? s.replace(/\s+/g, " ").trim().slice(0, 160) : "";
  const dl = String(text || "").match(/delivers?\s+to:\s*\n?\s*([^\n]{5,200})/i);
  if (dl){ const parts = dl[1].split(","); if (parts.length > 1){ const a = ok(parts.slice(1).join(",").trim()); if (a) return a; } }
  // Block style: "Shipping address" / "Ship to", then name, street and "City, ST 12345" on their own lines.
  const bl = String(text || "").match(/(?:ship(?:ping)?\s+(?:to|address)|deliver(?:y|ing)?\s+(?:to|address))\s*:?\s*\n\s*[A-Za-z][^\n]{1,60}\n\s*([^\n]{3,80})\n\s*(?:([^\n]{3,80})\n\s*)?([^\n]{3,60}\b[A-Z]{2}\s+\d{5}(?:-\d{4})?)/i);
  if (bl) return ok([bl[1], bl[2], bl[3]].filter(Boolean).join(", "));
  return "";
}
function parseOrdersBlob(text){
  // split a paste of several emails on the common "From: ... Subject:" or "Order #" boundaries
  const chunks = String(text || "").split(/(?=^_{5,}\s*\nFrom:|\nFrom:\s|\n-{5,}\s*Forwarded)/m).filter(c => c.trim().length > 40);
  const list = chunks.length > 1 ? chunks : [text];
  const rows = [], seen = new Set();
  list.forEach((c, i) => {
    const r = parseOrderEmail(c);
    if (!r) return;
    r.line = i + 1;
    const k = [r.store, r.orderNo, r.item].join("|");
    if (seen.has(k)) return; seen.add(k);
    rows.push(r);
  });
  return rows;
}

// Deleted orders leave their key behind (for 120 days, longer than any sync looks back),
// so syncing the same emails again doesn't re-add them. Adding one by hand clears it.
function forgetOrders(ids){
  const gone = (S.orders || []).filter(o => ids.has(o.id));
  if (!gone.length) return [];
  S.deletedOrders = S.deletedOrders || {};
  const now = Date.now();
  gone.forEach(o => { S.deletedOrders[orderKey(o)] = now; });
  for (const [k, t] of Object.entries(S.deletedOrders)) if (now - t > 120 * 86400000) delete S.deletedOrders[k];
  S.orders = S.orders.filter(o => !ids.has(o.id));
  ids.forEach(id => UI.orderSel.delete(id));
  return gone;
}
function unforgetOrders(list){
  if (!S.deletedOrders) return;
  list.forEach(o => { delete S.deletedOrders[orderKey(o)]; });
}
function restoreOrders(list){
  unforgetOrders(list);
  const have = new Set((S.orders || []).map(o => o.id));
  S.orders.push(...list.filter(o => !have.has(o.id)));
  persist(); render(); toast(`Restored ${plural(list.length, "order")}`);
}
async function deleteSelectedOrders(){
  const ids = new Set(UI.orderSel); if (!ids.size) return;
  const n = ids.size;
  if (!await confirmDialog({title:`Delete ${plural(n, "order")}?`, body:`${n === 1 ? "It" : "They"}'ll be removed from your tracker and won't come back when your inboxes sync.`, confirm:`Delete ${plural(n, "order")}`, danger:true})) return;
  const gone = forgetOrders(ids);
  persist(); render();
  toast(`Deleted ${plural(gone.length, "order")}`, "", {label:"Undo", run:() => restoreOrders(gone)});
}
function planOrderImport(rows, opts){
  const have = new Set((S.orders || []).map(orderKey));
  const deleted = (opts && opts.skipDeleted && S.deletedOrders) || {};
  const seen = new Set(), add = [], dupes = [];
  rows.forEach(r => {
    const st = STORES.find(x => x[0] !== "other" && x[0] === r.store);
    const o = {id:uid(), createdAt:Date.now(), store:st ? st[0] : (r.store || "other"), storeName:st ? "" : (r.storeName || r.store || "Other"),
      item:r.item || "Order", orderNo:r.orderNo || "", qty:String(r.qty || "1"), total:r.total || "", priceEach:r.priceEach || "",
      at:r.at || todayISO(), shipTo:r.shipTo || "", shipAddr:r.shipAddr || "", card:r.card || "", arrives:r.arrives || "", buyer:r.buyer || "", stage:r.stage || "placed", inbox:r.inboxEmail || "", image:r.image || ""};
    if (r.sentTo) o.sentTo = r.sentTo;
    if (r.imageAlt && (/^order$/i.test(o.item) || looksLikeCode(o.item)) && r.imageAlt.length >= 6 && !GENERIC_ALT.test(r.imageAlt)) o.item = r.imageAlt;
    const k = orderKey(o);
    if (have.has(k) || seen.has(k) || deleted[k]){ dupes.push(r.line || 0); return; }
    seen.add(k); add.push(o);
  });
  return {add, dupes};
}

/* ================= ORDERS: SHOWING (period) ================= */
// Which days the Orders page covers: its stats, chips and list all follow it. Kept in the vault's settings.
// "This billing week" starts on the weekday picked beside it (Monday unless changed); "Last week" is the
// billing week before it. Days are local, like the order dates (o.at, YYYY-MM-DD).
const ORDER_PERIODS = [["all","All time"],["today","Today"],["yesterday","Yesterday"],["bweek","This billing week"],["lastweek","Last week"],["7","Last 7 days"],["30","Last 30 days"],["90","Last 90 days"],["custom","A day, or between two dates…"]];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const orderPeriodCfg = () => Object.assign({p:"all", from:"", to:""}, (S && S.settings && S.settings.orderPeriod) || {});
const billingWeekStart = () => { const n = S && S.settings && S.settings.billingWeekStart; return Number.isInteger(n) && n >= 0 && n <= 6 ? n : 1; };
// {from, to}, both "" for all time.
function orderPeriodRange(c){
  c = c || orderPeriodCfg();
  const day = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return localISO(d); };
  switch (c.p){
    case "today": return {from:day(0), to:day(0)};
    case "yesterday": return {from:day(1), to:day(1)};
    case "7": case "30": case "90": return {from:day(+c.p - 1), to:day(0)};
    case "bweek": case "lastweek": {
      const back = (new Date().getDay() - billingWeekStart() + 7) % 7 + (c.p === "lastweek" ? 7 : 0);
      return {from:day(back), to:day(back - 6)};
    }
    case "custom": if (c.from && c.to) return {from:c.from, to:c.to};
  }
  return {from:"", to:""};
}
// "Mon, Sep 28 – Sun, Oct 4", with the year when it isn't this year.
function orderPeriodLabel(r){
  if (!r.from) return "";
  const f = (iso) => { const d = coDate(iso); return d.toLocaleDateString(undefined, Object.assign({weekday:"short", month:"short", day:"numeric"}, d.getFullYear() !== new Date().getFullYear() ? {year:"numeric"} : {})); };
  return r.from === r.to ? f(r.from) : f(r.from) + " – " + f(r.to);
}
function orderPeriodHTML(){
  const c = orderPeriodCfg(), r = orderPeriodRange(c), today = todayISO();
  return `<div class="o-period">
    <label for="o-period">Showing</label>
    <select id="o-period">${ORDER_PERIODS.map(([v, l]) => `<option value="${v}" ${c.p === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
    ${c.p === "custom" ? `<span class="o-period-dates"><label class="sr" for="o-from">From</label><input type="date" id="o-from" value="${esc(r.from)}" max="${esc(today)}"><span aria-hidden="true">–</span><label class="sr" for="o-to">To</label><input type="date" id="o-to" value="${esc(r.to)}" max="${esc(today)}"></span>`
      : r.from ? `<span class="o-period-range">${esc(orderPeriodLabel(r))}</span>` : ""}
    ${c.p === "bweek" || c.p === "lastweek" ? `<label class="o-wk">Week starts <select id="o-wkstart">${WEEKDAYS.map((d, i) => `<option value="${i}" ${billingWeekStart() === i ? "selected" : ""}>${d}</option>`).join("")}</select></label>` : ""}
  </div>`;
}

function renderOrders(){
  const q = norm(UI.q);
  // Inbox filter: which email the orders came from. Stats and store counts follow it, and the Showing period.

  const inboxOf = (o) => o.inbox || "none";
  const rng = orderPeriodRange();
  const inPeriod = (o) => !rng.from || (!!o.at && o.at >= rng.from && o.at <= rng.to);

  if (!(S.orders || []).length) return head + `<div class="empty"><h2>No orders yet</h2><p>Connect an inbox in Settings and paste your order emails, or add one by hand. Every confirmation becomes a tracked order.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="settings">Open settings</button><button class="btn btn-primary" data-act="email-import">${ic("imp")}Add from email</button></div></div>`;
  const stageChip = (k,n) => `<button class="chip" data-act="order-stage" data-id="${k}" aria-pressed="${(UI.orderStage||"all")===k}">${k==="all"?"All":stageLabel(k)}${n!=null?` <span class="chip-n">${n}</span>`:""}</button>`;
  const stageCounts = {}; ORDER_STAGES.forEach(([k]) => stageCounts[k] = all.filter(o => (o.stage||"placed")===k).length);
  const body = list.length ? `<div class="grid grid-orders">${list.map(o => {

  return `${head}

function inboxChipsHTML(inboxList, keep){

  const orders = (S.orders || []).filter(keep || (() => true));
  const none = orders.filter(o => !o.inbox).length;

/* ================= ALERTS: stuck orders and cancellations ================= */
const alertCfg = () => Object.assign({cancel:true, shipOn:true, shipDays:5, deliverOn:true, deliverDays:10}, (S && S.settings && S.settings.alerts) || {});
const daysSince = (v) => { if (!v) return -1; const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? coDate(v) : new Date(v); return isNaN(d) ? -1 : Math.floor((Date.now() - d.getTime()) / 86400000); };
// Why an order is stuck, or null: not shipped N days after ordering, or not delivered N days after shipping.
// Past 30 days it's most likely a pickup or an order whose emails never came, so it stops counting.
const STUCK_MAX = 30;
function orderStuck(o){
  const a = alertCfg(), st = o.stage || "placed";
  if (st === "placed" && a.shipOn){ const n = daysSince(o.at); if (n >= a.shipDays && n <= STUCK_MAX) return {key:"ship", text:`Not shipped · ${n} days`}; }
  if ((st === "shipped" || st === "arriving") && a.deliverOn){
    const n = daysSince((o.dates && (o.dates.shipped || o.dates.arriving)) || o.statusAt || o.at);
    if (n >= a.deliverDays && n <= STUCK_MAX) return {key:"deliver", text:`Not delivered · ${n} days since shipping`};
  }

}
// Canceled in the last 7 days (orders canceled before dates were recorded don't count).
const recentlyCanceled = (o) => { if (o.stage !== "canceled") return false; const n = daysSince((o.dates && o.dates.canceled) || o.statusAt); return n >= 0 && n <= 7; };
const needsAttention = (o) => !!orderStuck(o) || recentlyCanceled(o);

// Shows a Windows notification (and flashes the taskbar) plus sends the same alert to the phone app.
function sendAlert(title, body, tag){
  try {
    if ("Notification" in window){
      // Opens Orders on the ones needing attention, over all time, since a shorter Showing period could hide them.
      const show = () => { const n = new Notification(title, {body, tag}); n.onclick = () => { try { window.focus(); if (window.pvDesktop && window.pvDesktop.focusApp) window.pvDesktop.focusApp(); UI.view = "orders"; UI.orderStage = "attention"; if (S && orderPeriodCfg().p !== "all"){ S.settings.orderPeriod = Object.assign(orderPeriodCfg(), {p:"all"}); persist(); } render(); } catch(e){} n.close(); }; };
      if (Notification.permission === "granted") show(); else if (Notification.permission !== "denied") Notification.requestPermission().then(p => { if (p === "granted") show(); });
    }
    if (window.pvDesktop && window.pvDesktop.attention) window.pvDesktop.attention().catch(() => {});
  } catch(e){}
  phoneAlert(title, body, tag).catch(() => {});
}
// Checks every order once per run; each order alerts once per reason. Several at once become one summary.
function runAlerts(){
  if (!S) return;
  const a = alertCfg(), orders = S.orders || [];
  let dirty = false;
  // The first time, don't alert about orders that were already canceled before alerts existed.
  if (!S.settings.alertsSince){ orders.forEach(o => { if (o.stage === "canceled"){ o.alerted = Object.assign({}, o.alerted, {cancel:true}); } }); S.settings.alertsSince = Date.now(); dirty = true; }
  // Only recent cancellations alert (a re-sync can turn up old ones).
  const cx = a.cancel ? orders.filter(o => o.stage === "canceled" && !(o.alerted && o.alerted.cancel) && recentlyCanceled(o)) : [];
  const stuck = orders.map(o => [o, orderStuck(o)]).filter(([o, s]) => s && !(o.alerted && o.alerted[s.key]));
  cx.forEach(o => { o.alerted = Object.assign({}, o.alerted, {cancel:true}); });
  stuck.forEach(([o, s]) => { o.alerted = Object.assign({}, o.alerted, {[s.key]:true}); });
  const item = (o) => `${orderStoreLabel(o)}: ${o.item || "Order"}${(+o.qty || 1) > 1 ? " ×" + o.qty : ""}`;
  if (cx.length){
    const title = cx.length === 1 ? `${orderStoreLabel(cx[0])} order canceled` : `${cx.length} orders canceled`;
    const body = cx.slice(0, 3).map(item).join("\n") + (cx.length > 3 ? `\n+ ${cx.length - 3} more` : "");
    sendAlert(title, body, "pv-cancel"); toast(title); dirty = true;
  }
  if (stuck.length){
    const ns = stuck.filter(([, s]) => s.key === "ship").length, nd = stuck.length - ns;
    const title = stuck.length === 1 ? `Order needs attention` : `${stuck.length} orders need attention`;
    const body = [ns ? `${plural(ns, "order")} not shipped after ${a.shipDays} days` : "", nd ? `${plural(nd, "order")} not delivered ${a.deliverDays} days after shipping` : ""].filter(Boolean).join("\n")
      + (stuck.length === 1 ? "\n" + item(stuck[0][0]) : "");
    sendAlert(title, body, "pv-stuck"); dirty = true;
  }

}
let alertTimer = null;
function scheduleAlerts(){
  clearInterval(alertTimer);

  setTimeout(() => { if (S) runAlerts(); }, 45000);                 // after the first sync

async function reportOrderAlerts(){

    const events = [], marks = [];

      const acct = [o.sentTo, o.inbox].map(x => String(x || "").toLowerCase()).find(x => OALERT.accounts.has(x));
      if (!acct || !OALERT.accounts.get(acct).has(storeKeyOf(o))) continue;

      if (!r.ok){ if (r.status === 403){ OALERT.accounts = null; refreshAlertSender(); } break; }

async function pollSellerAlerts(){
  if (!S || !DESK || !licRead() || sellerBusy) return;
  sellerBusy = true;
  try {
    // From the newest alert seen (settings.sellerSince, shared by the buyer's synced devices), a
    // couple of minutes back: a step seen twice changes nothing. 200 come at a time.
    const was = +S.settings.sellerSince || 0, all = [];
    let since = was;
    for (let page = 0; page < 5; page++){
      const r = await alertApi("/alerts?since=" + Math.max(0, since - (page ? 0 : 120000)));
      if (!r.ok) break;
      const list = (await r.json()).alerts || [];
      all.push(...list);
      since = Math.max(since, ...list.map(a => +a.createdAt || 0));
      if (list.length < 200) break;
    }
    const news = applySellerAlerts(all);
    if (since > was) S.settings.sellerSince = since;
    if (since > was || news.length) persist();
    if (!news.length) return;
    render();
    const what = ([o, a]) => `${a.profile ? a.profile + ": " : ""}${o.item || "Order"}${(+o.qty || 1) > 1 ? " ×" + o.qty : ""}`;
    const head = ([o, a]) => `${orderStoreLabel(o)} ${ALERT_STEP_TEXT[a.stage]}`;
    const title = news.length === 1 ? head(news[0]) : `${news.length} order updates from your seller`;
    sendAlert(title, news.slice(0, 3).map(n => (news.length > 1 ? head(n) + " · " : "") + what(n)).join("\n") + (news.length > 3 ? `\n+ ${news.length - 3} more` : ""), "pv-seller");

// Adds or moves along the orders the alerts are about. Returns [order, alert] for each new order or new

function applySellerAlerts(list){
  const news = [];
  list.filter(a => a && a.oid && a.orderNo && ALERT_STEPS.includes(a.stage) && +a.createdAt > 0).sort((a, b) => a.createdAt - b.createdAt).forEach(a => {
    const st = STORES.find(x => x[0] !== "other" && x[0] === a.store);
    const where = st ? {store:st[0], storeName:""} : {store:"other", storeName:a.storeName || String(a.store).replace(/^other:/, "") || "Other"};
    const key = orderKey(Object.assign({orderNo:a.orderNo}, where)), id = "sa-" + a.oid;
    let o = (S.orders || []).find(x => x.id === id) || (S.orders || []).find(x => orderKey(x) === key), isNew = false;
    if (!o){
      if (S.deletedOrders && S.deletedOrders[key]) return;   // deleted here on purpose
      o = Object.assign({id, createdAt:a.createdAt}, where, {item:a.item || "Order", orderNo:a.orderNo, qty:String(a.qty || "1"), total:a.total || "", priceEach:"",
        at:a.at || new Date(a.createdAt).toISOString().slice(0, 10), shipTo:"", shipAddr:"", card:"", arrives:"", buyer:"", stage:"placed", inbox:"", image:"", fromSeller:true, profile:a.profile || ""});

  });

}

// Address plus when the order shipped and was delivered (from the store's emails).
// A full time shows as "Thu, Sep 24, 3:36 PM"; a date-only value (the carrier's delivery day) as "Thu, Sep 24, 2026".
const orderWhen = (v) => {
  if (/^\d{4}-\d{2}-\d{2}$/.test(v || "")) return coDate(v).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric", year:"numeric"});
  const d = new Date(v); return isNaN(d) ? "" : d.toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
};
function orderDelivered(o){
  const d = o.dates || {};

  // Delivered before dates were recorded: fall back to the day the status changed.
  return (o.stage === "delivered" && o.statusAt) ? coDateLabel(o.statusAt) : "";

function orderDeliveredDay(o){

  return isNaN(d) ? "" : d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});

// A shareable summary of checkouts for a period: counts, items with photos, totals.
// Never includes names, addresses, cards, emails or order numbers.
// The card picks its own store and inbox (default: everything), separate from the Orders page filters.
// By default only orders still marked Placed count; shipped/arriving/delivered and canceled are opt-in.
const SUCC = {period:"today", canceled:false, shipped:false, prices:true, store:"all", inbox:"all"};
const SUCC_PERIODS = [["today","Today"],["yesterday","Yesterday"],["week","Weekly"],["month","Monthly"],["all","All"],["custom","Custom"]];
const localISO = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function successRange(p){
  const back = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return localISO(d); };
  const fmt = (iso) => coDate(iso).toLocaleDateString(undefined, {month:"short", day:"numeric"});
  const today = back(0);
  if (p === "custom"){
    // Your own dates. The card's big label is the range; the year shows when it isn't this year.
    const from = SUCC.from || back(6), to = SUCC.to || today;
    const yr = (iso) => iso.slice(0, 4) !== today.slice(0, 4) ? ", " + iso.slice(0, 4) : "";
    const days = Math.round((coDate(to) - coDate(from)) / 86400000) + 1;
    return {from, to, label:from === to ? fmt(from) + yr(from) : fmt(from) + yr(from) + " – " + fmt(to) + yr(to), range:plural(days, "day")};
  }
  if (p === "today") return {from:today, to:today, label:"Today", range:fmt(today)};
  if (p === "yesterday") return {from:back(1), to:back(1), label:"Yesterday", range:fmt(back(1))};
  if (p === "week") return {from:back(6), to:today, label:"Last 7 days", range:fmt(back(6)) + " – " + fmt(today)};
  if (p === "month") return {from:back(29), to:today, label:"Last 30 days", range:fmt(back(29)) + " – " + fmt(today)};
  return {from:"", to:"", label:"All time", range:""};
}
function successData(){
  const r = successRange(SUCC.period);
  let list = (S.orders || []).filter(o => (SUCC.inbox === "all" || (o.inbox || "none") === SUCC.inbox) && (SUCC.store === "all" || storeKeyOf(o) === SUCC.store));
  if (r.from) list = list.filter(o => o.at && o.at >= r.from && o.at <= r.to);
  list = list.filter(o => {
    const st = o.stage || "placed";
    return st === "placed" || (st === "canceled" ? SUCC.canceled : SUCC.shipped);
  });
  const groups = new Map(), stores = new Map();
  list.forEach(o => {
    const name = String(o.item || "").trim() && !looksLikeCode(o.item) ? String(o.item).trim() : "Order";
    const k = storeKeyOf(o) + "|" + norm(name);
    let g = groups.get(k);
    if (!g){ g = {name, store:orderStoreLabel(o), o, image:"", qty:0, orders:0}; groups.set(k, g); }
    g.qty += (+o.qty || 1); g.orders++; if (!g.image && o.image) g.image = o.image;
    stores.set(orderStoreLabel(o), (stores.get(orderStoreLabel(o)) || 0) + 1);
  });
  return {r, orders:list.length, qty:list.reduce((n, o) => n + (+o.qty || 1), 0), total:list.reduce((n, o) => n + orderMoney(o.total), 0),
    items:Array.from(groups.values()).sort((a, b) => b.qty - a.qty || b.orders - a.orders || a.name.localeCompare(b.name)),
    stores:Array.from(stores.entries()).sort((a, b) => b[1] - a[1])};
}
function successText(d){
  const head = `✅ Success · ${d.r.label}${d.r.range ? " (" + d.r.range + ")" : ""}`;
  const stats = [plural(d.orders, "checkout"), plural(d.qty, "item")].concat(SUCC.prices && d.total ? [fmtMoney(d.total)] : []).join(" · ");
  const lines = d.items.map(g => `• ${g.name} ×${g.qty}${g.orders > 1 ? ` (${g.orders} orders)` : ""} · ${g.store}`);
  return [head, stats, "", ...lines, "", "Stores: " + d.stores.map(([s, n]) => `${s} ${n}`).join(" · ")].join("\n");
}
// Loads a product photo so it can be drawn into the image (the store CDNs allow this).
function loadSuccImg(url){
  return new Promise((ok) => {
    if (!url) return ok(null);
    const im = new Image(); im.crossOrigin = "anonymous"; im.referrerPolicy = "no-referrer";
    const t = setTimeout(() => ok(null), 7000);
    im.onload = () => { clearTimeout(t); ok(im); }; im.onerror = () => { clearTimeout(t); ok(null); };
    im.src = url;
  });
}
// Draws the success card at 1080px wide and resolves a PNG blob.
async function drawSuccess(d){
  try { await Promise.all([document.fonts.load("800 64px Archivo"), document.fonts.load("600 30px Archivo"), document.fonts.load('400 24px "Bruno Ace SC"', "FAFO")]); } catch(e){}
  const W = 1080, P = 64, ROW = 124, ROW2 = 156, MAXROWS = 10, IMG = 96, QTYW = 170;
  const rows = d.items.slice(0, MAXROWS), more = d.items.length - rows.length;
  const cv = document.createElement("canvas"); cv.width = W;
  const x = cv.getContext("2d");
  const F = (w, s) => `${w} ${s}px Archivo, "Helvetica Neue", Arial, sans-serif`;
  const round = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  const fit = (s, maxW) => { if (x.measureText(s).width <= maxW) return s; while (s.length > 1 && x.measureText(s + "…").width > maxW) s = s.slice(0, -1); return s + "…"; };
  // Product names wrap onto a second line so similar names stay tell-apart-able.
  const nameW = W - P - QTYW - (P + IMG + 26);
  const wrap2 = (s) => {
    if (x.measureText(s).width <= nameW) return [s];
    const words = s.split(/\s+/); let line = "";
    for (let i = 0; i < words.length; i++){
      const next = line ? line + " " + words[i] : words[i];
      if (x.measureText(next).width > nameW){ return line ? [line, fit(words.slice(i).join(" "), nameW)] : [fit(s, nameW)]; }
      line = next;
    }
    return [line];
  };
  x.font = F(700, 30);
  const names = rows.map(g => wrap2(g.name));
  const rowH = names.map(n => n.length > 1 ? ROW2 : ROW);
  const H = P + 150 + 190 + (rows.length ? rowH.reduce((a, b) => a + b, 0) : ROW) + (more > 0 ? 60 : 0) + 150;
  cv.height = H;   // (resets the drawing state; fonts are set again below)
  // background
  const bg = x.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#131826"); bg.addColorStop(1, "#0B0E15");
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W * .85, 0, 10, W * .85, 0, 520); glow.addColorStop(0, "rgba(67,197,131,.22)"); glow.addColorStop(1, "rgba(67,197,131,0)");
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
  // header: check badge + SUCCESS + period
  let y = P;
  x.fillStyle = "#43C583"; x.beginPath(); x.arc(P + 28, y + 28, 28, 0, Math.PI * 2); x.fill();
  x.strokeStyle = "#0B2A1B"; x.lineWidth = 6; x.lineCap = "round"; x.lineJoin = "round";
  x.beginPath(); x.moveTo(P + 15, y + 29); x.lineTo(P + 25, y + 39); x.lineTo(P + 42, y + 19); x.stroke();
  x.fillStyle = "#EEF1F5"; x.font = F(800, 50); x.textBaseline = "middle"; x.fillText("Success", P + 76, y + 30);
  x.textAlign = "right"; x.font = F(700, 30); x.fillStyle = "#EEF1F5"; x.fillText(d.r.label, W - P, y + 16);
  if (d.r.range){ x.font = F(500, 24); x.fillStyle = "#9BA3AF"; x.fillText(d.r.range, W - P, y + 50); }
  x.textAlign = "left";
  // stats
  y += 110;
  const stats = [["Checkouts", String(d.orders)], ["Items", String(d.qty)]].concat(SUCC.prices ? [["Spent", fmtMoney(d.total)]] : []);
  const gap = 20, bw = (W - P * 2 - gap * (stats.length - 1)) / stats.length;
  stats.forEach(([label, val], i) => {
    const bx = P + i * (bw + gap);
    x.fillStyle = "rgba(255,255,255,.06)"; round(bx, y, bw, 150, 18); x.fill();
    x.fillStyle = "#9BA3AF"; x.font = F(700, 22); x.fillText(label.toUpperCase(), bx + 26, y + 40);
    x.fillStyle = "#FFFFFF"; x.font = F(800, 56); x.fillText(fit(val, bw - 52), bx + 26, y + 100);
  });
  y += 190;
  // items
  const imgs = await Promise.all(rows.map(g => loadSuccImg(g.image)));
  if (!rows.length){ x.fillStyle = "#9BA3AF"; x.font = F(600, 30); x.fillText("No checkouts in this period.", P, y + 50); }
  let ry = y;
  rows.forEach((g, i) => {
    const s = IMG, two = names[i].length > 1;
    if (i) ry += rowH[i - 1];
    x.fillStyle = "#FFFFFF"; round(P, ry, s, s, 16); x.fill();
    const im = imgs[i];
    if (im){
      const k = Math.min((s - 12) / im.naturalWidth, (s - 12) / im.naturalHeight), iw = im.naturalWidth * k, ih = im.naturalHeight * k;
      x.save(); round(P, ry, s, s, 16); x.clip(); x.drawImage(im, P + (s - iw) / 2, ry + (s - ih) / 2, iw, ih); x.restore();
    } else if (isPokemonCenter(g.o)) drawPokeball(x, P + s / 2, ry + s / 2, s * 0.36);   // on the white tile
    else {
      x.fillStyle = tintOf(g.o); round(P, ry, s, s, 16); x.fill();
      x.fillStyle = /^#(FFE000|FFD100)$/i.test(tintOf(g.o)) ? "#000" : "#fff"; x.font = F(800, 34); x.textAlign = "center";
      x.fillText(g.store.replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""), P + s / 2, ry + s / 2 + 2);
      x.textAlign = "left";
    }
    const tx = P + s + 26;
    x.fillStyle = "#EEF1F5"; x.font = F(700, 30);
    names[i].forEach((line, k) => x.fillText(line, tx, ry + 32 + k * 36));
    x.fillStyle = "#9BA3AF"; x.font = F(500, 24); x.fillText(g.store + " · " + plural(g.orders, "order"), tx, ry + (two ? 106 : 70));
    x.textAlign = "right"; x.fillStyle = "#43C583"; x.font = F(800, 44); x.fillText("×" + g.qty, W - P, ry + (two ? 64 : 50)); x.textAlign = "left";
  });
  y += rows.length ? rowH.reduce((a, b) => a + b, 0) : ROW;
  if (more > 0){ x.fillStyle = "#9BA3AF"; x.font = F(600, 26); x.fillText(`+ ${plural(more, "more item")}`, P, y + 20); y += 60; }
  // footer
  y += 30;
  x.fillStyle = "rgba(255,255,255,.08)"; x.fillRect(P, y, W - P * 2, 2);
  x.fillStyle = "#9BA3AF"; x.font = F(600, 24);
  x.fillText(fit(d.stores.map(([s, n]) => `${s} ${n}`).join("  ·  "), W - P * 2 - 260), P, y + 52);
  x.textAlign = "right"; x.fillStyle = "#6B7482"; x.font = '400 24px "Bruno Ace SC", Archivo, "Helvetica Neue", Arial, sans-serif'; x.fillText("FAFO", W - P, y + 52); x.textAlign = "left";
  return await new Promise(ok => cv.toBlob(b => ok(b), "image/png"));
}

/* ================= SYNC SERVER (your Cloudflare Worker) ================= */
const serverCfg = () => (S && S.settings && S.settings.server) || {};
const serverReady = () => { const c = serverCfg(); return !!(c.url && c.token); };
const ON_CLAUDE = !!window.claude && !/^file:$/.test(location.protocol);
async function serverCall(path, method){
  const c = serverCfg();
  const url = c.url.replace(/\/+$/, "") + path;
  let r;
  try { r = await fetch(url, {method:method || "GET", headers:{Authorization:"Bearer " + c.token}}); }
  catch(e){ throw new Error(ON_CLAUDE ? "This claude.ai page isn't allowed to reach outside sites. Use the desktop app or your own domain for server sync." : "Couldn't reach the server. Check the URL and your connection."); }
  if (r.status === 401) throw new Error("The server rejected that token.");
  if (r.status === 403) throw new Error("That token is read-only, so it can pull orders but not start a sync.");
  if (!r.ok) throw new Error("The server answered " + r.status + ".");
  return r.json();
}
async function pullFromServer(opts){
  opts = opts || {};
  if (!serverReady()) throw new Error("Add your server URL and token first.");
  if (opts.syncFirst){ try { await serverCall("/sync", "POST"); } catch(e){ if (!/read-only/.test(e.message)) throw e; } }
  const data = await serverCall("/orders", "GET");
  const rows = (data.orders || []).map((o, i) => Object.assign({line:i+1}, o));
  const plan = planOrderImport(rows, {skipDeleted:true});
  if (plan.add.length){ S.orders.push(...plan.add); }
  S.settings.server.lastPull = new Date().toISOString();
  S.settings.server.lastSync = data.lastSync || null;
  persist();
  return {added:plan.add.length, total:rows.length, lastSync:data.lastSync};
}
let autoPullTimer = null;
function scheduleAutoPull(){
  clearInterval(autoPullTimer);
  if (!S || !serverReady() || !serverCfg().auto) return;
  const run = () => pullFromServer().then(r => { if (r.added){ render(); toast(`${plural(r.added, "new order")} from your server`); } }).catch(() => {});
  run();
  autoPullTimer = setInterval(() => { if (S) run(); }, 15 * 60 * 1000);
}
