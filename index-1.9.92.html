    return;
  }
  if (e.key === "Tab" && stack.length){
    const panel = $(".panel", stack[stack.length-1].el);
    const f = $$('button:not([disabled]):not([hidden]),input:not([disabled]):not(.sr),select,textarea,[tabindex]:not([tabindex="-1"])', panel).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
  if (e.key === "/" && S && !stack.length && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); const q = $("#q"); if (q) q.focus(); }
  // Ctrl+F (1.9.86+) goes to the search box in the desktop app, which has no find bar of its own.
  if (DESK && S && !stack.length && (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "f"){ e.preventDefault(); const q = $("#q"); if (q){ q.focus(); q.select(); } }
  const ae = document.activeElement, typing = (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "checkbox") || ae.isContentEditable;
  if (S && UI.view === "orders" && !stack.length && !menuEl && !typing){
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "a" && ORDERS_SHOWN.length){ e.preventDefault(); ORDERS_SHOWN.forEach(x => UI.orderSel.add(x)); syncOrderSel(); }
    else if (e.key === "Delete" && UI.orderSel.size){ e.preventDefault(); deleteSelectedOrders(); }
    else if (e.key === "Escape" && UI.orderSel.size){ UI.orderSel.clear(); syncOrderSel(); }
  }
});

/* Drag to select: press on a card or empty space on the Orders page (not a button, link or field)
   and drag a box across cards. Ctrl/Shift adds to what's already selected. Scrolls near the edges. */
(function(){
  let drag = null, raf = 0;
  const SKIP = "a,button,input,select,textarea,label,summary,[contenteditable],.o-drop,.layer,.menu,#bulkbar";
  const box = () => { let b = $("#marquee"); if (!b){ b = document.createElement("div"); b.id = "marquee"; b.className = "marquee"; document.body.appendChild(b); } return b; };
  document.addEventListener("pointerdown", (e) => {
    if (!S || UI.view !== "orders" || e.button !== 0 || e.pointerType !== "mouse" || stack.length) return;
    const main = $("#main"); if (!main || !main.contains(e.target) || e.target.closest(SKIP)) return;
    drag = {x:e.pageX, y:e.pageY, cx:e.clientX, cy:e.clientY, on:false, base:(e.ctrlKey || e.metaKey || e.shiftKey) ? new Set(UI.orderSel) : new Set()};
  });
  function paint(){
    raf = 0; if (!drag || !drag.on) return;
    // Scroll while the pointer is near the top or bottom edge.
    const edge = 48, h = window.innerHeight;
    const dy = drag.cy < edge ? -Math.ceil((edge - drag.cy) / 3) : drag.cy > h - edge ? Math.ceil((drag.cy - (h - edge)) / 3) : 0;
    if (dy) window.scrollBy(0, dy);
    const px = drag.cx + window.scrollX, py = drag.cy + window.scrollY;
    const L = Math.min(drag.x, px), T = Math.min(drag.y, py), R = Math.max(drag.x, px), B = Math.max(drag.y, py);
    Object.assign(box().style, {left:(L - window.scrollX) + "px", top:(T - window.scrollY) + "px", width:(R - L) + "px", height:(B - T) + "px", display:"block"});
    UI.orderSel = new Set(drag.base);
    $$(".order[data-oid]").forEach(el => {
      const r = el.getBoundingClientRect(), l = r.left + window.scrollX, t = r.top + window.scrollY;
      if (l < R && l + r.width > L && t < B && t + r.height > T) UI.orderSel.add(el.dataset.oid);
    });
    syncOrderSel();
    if (dy) raf = requestAnimationFrame(paint);
  }
  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    drag.cx = e.clientX; drag.cy = e.clientY;
    if (!drag.on){
      if (Math.hypot(e.pageX - drag.x, e.pageY - drag.y) < 6) return;
      drag.on = true; document.body.classList.add("is-marquee");
    }
    const sel = window.getSelection && window.getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges();
    if (!raf) raf = requestAnimationFrame(paint);
  });
  function end(){
    if (!drag) return;
    const was = drag.on; drag = null; cancelAnimationFrame(raf); raf = 0;
    const b = $("#marquee"); if (b) b.style.display = "none";
    document.body.classList.remove("is-marquee");
    if (was){
      syncOrderSel();
      // The mouse-up after a drag shouldn't also click whatever it landed on.
      const eat = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      window.addEventListener("click", eat, {capture:true, once:true});
      setTimeout(() => window.removeEventListener("click", eat, {capture:true}), 50);
    }
  }
  document.addEventListener("dragstart", (e) => { if (drag) e.preventDefault(); });   // not the product image
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
  window.addEventListener("blur", end);
})();

/* Group menu (Rename, Duplicate, Delete): right-click a group in the sidebar or its chip on the
   Profiles or Cards page, touch and hold it, or focus it and press Shift+F10 or the menu key.
   All has no menu, and Ungrouped's only renames it (1.9.88+). Escape, a click outside or scrolling closes it. The same opens a
   profile's menu on the Profiles page (from 1.9.72) and a draft's on the Generate page (from 1.9.73),
   for all the selected ones when it's one of them, and a store login's on Store logins (from 1.9.89). */
(function(){
  let hold = null, eatUntil = 0, eatOn = null, quietUntil = 0;
  const target = (el) => { const t = el && el.closest ? el.closest("[data-gmenu],[data-pmenu],[data-dmenu],[data-lmenu]") : null; return t && S && !stack.length ? t : null; };
  const open = (t, at, how) => {
    if (t.dataset.pmenu) profileContextMenu(t.dataset.pmenu, t, at, how);
    else if (t.dataset.dmenu) draftContextMenu(t.dataset.dmenu, t, at, how);
    else if (t.dataset.lmenu) loginContextMenu(t.dataset.lmenu, t, at, how);
    else groupMenu(t.dataset.gmenu, t.dataset.id, t, at, how);
    if (how !== "mouse") quietUntil = Date.now() + 800;   // the browser may send its own contextmenu next
  };
  document.addEventListener("contextmenu", (e) => {
    if (e.target.closest && e.target.closest(".menu")){ e.preventDefault(); return; }
    const t = target(e.target);
    if (!t){ if (menuEl) closeMenu(); return; }
    e.preventDefault();
    if (hold && hold.t === t){ clearTimeout(hold.timer); if (!hold.fired){ hold.fired = true; open(t, null, "touch"); } return; }
    if (Date.now() < quietUntil) return;
    open(t, e.clientX || e.clientY ? {x:e.clientX, y:e.clientY} : null, "mouse");
  });
  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" || !e.isPrimary) return;
    const t = target(e.target); if (!t) return;
    const h = hold = {t, x:e.clientX, y:e.clientY, fired:false};
    h.timer = setTimeout(() => { if (hold === h){ h.fired = true; open(t, null, "touch"); } }, 500);
  });
  document.addEventListener("pointermove", (e) => {
    if (hold && !hold.fired && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 10){ clearTimeout(hold.timer); hold = null; }
  });
  const release = () => {
    if (!hold) return;
    clearTimeout(hold.timer);
    if (hold.fired){ eatUntil = Date.now() + 700; eatOn = hold.t; }
    hold = null;
  };
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);
  // Letting go after a touch-and-hold shouldn't also open the group (or close the menu).
  window.addEventListener("click", (e) => {
    if (Date.now() < eatUntil && eatOn && eatOn.contains(e.target)){ e.stopPropagation(); e.preventDefault(); }
    eatUntil = 0;
  }, true);
  document.addEventListener("keydown", (e) => {
    if (!((e.key === "F10" && e.shiftKey) || e.key === "ContextMenu")) return;
    const t = target(document.activeElement); if (!t) return;
    e.preventDefault(); open(t, null, "key");
  });
  // A menu doesn't move with the page, so scrolling anything closes it.
  document.addEventListener("scroll", () => { if (menuEl) closeMenu(); }, {capture:true, passive:true});
})();

["pointerdown","keydown","wheel","touchstart"].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, {passive:true}));
function checkIdle(){
  if (!S) return;
  const m = MODE === "submit" ? 30 : S.settings.autoLockMin;
  if (m && Date.now() - lastActive > m * 60000) lock(MODE === "submit" ? "Cleared after 30 minutes without activity. Nothing was saved or sent." : `Locked after ${m} minutes without activity.`);
}
setInterval(checkIdle, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkIdle(); });
window.matchMedia("(max-width:900px)").addEventListener("change", () => { if (S) renderMain(); });

initRuntime();
licenseGate().then(ok => { if (ok) renderLock(); }, () => renderLock());

try { if (window.pvDesktop && window.pvDesktop.appReady) window.pvDesktop.appReady(); } catch(e){}
})();
