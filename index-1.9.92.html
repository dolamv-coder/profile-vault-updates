<style>
:root{
  --desk:#111419; --sheet:#1A1E25; --sheet-2:#232833;
  --ink:#EEF1F5; --ink-2:#9BA3AF; --ink-3:#6B7482;
  --line:#2C323C; --line-2:#242a33;
  --accent:#E23B36; --accent-2:#F05650; --on-accent:#FFFFFF;
  --caution:#F5B300; --on-caution:#000000;
  --danger:#F0605A; --ok:#43C583; --info:#4A9DF0; --violet:#8B7BF0;
  --stock:#EDECE7; --stock-ink:#12151A;
  --btn-ink-bg:#EEF1F5; --btn-ink-fg:#12151A;
  --scrim:rgba(6,8,12,.62);
  --fs:.87; /* text size: 1 = original, lower = smaller */
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --desk:#E3E6EA; --sheet:#FFFFFF; --sheet-2:#F2F4F6;
  --ink:#101317; --ink-2:#4A5058; --ink-3:#737A83;
  --line:#D3D8DE; --line-2:#E4E8EC;
  --accent:#D22B26; --accent-2:#B4231F; --on-accent:#FFFFFF;
  --danger:#C4231B; --ok:#1F7A4D;
  --stock:#FFFFFF; --stock-ink:#000;
  --btn-ink-bg:#101317; --btn-ink-fg:#FFFFFF;
  --scrim:rgba(20,22,26,.42);
  color-scheme:light;
}
/* ---------- Space themes: a starry sky in dark (midnight) and light (dawn) ---------- */
:root[data-theme="space"]{
  --desk:#070914; --sheet:rgba(22,27,48,.72); --sheet-2:rgba(38,45,74,.62);
  --ink:#ECEBF5; --ink-2:#A6ABC8; --ink-3:#6E7497;
  --line:rgba(150,160,220,.18); --line-2:rgba(150,160,220,.10);
  --accent:#E3C27A; --accent-2:#F1D595; --on-accent:#14121C;
  --caution:#F2B84B; --on-caution:#14121C;
  --danger:#F07A8A; --ok:#6FD6B0; --info:#8FB4FF; --violet:#B39DFF;
  --stock:#E9E6F2; --stock-ink:#12142A;
  --btn-ink-bg:#ECEBF5; --btn-ink-fg:#0B0E1C;
  --scrim:rgba(3,4,12,.7);
  --sky:radial-gradient(1200px 700px at 85% -10%, rgba(120,90,220,.20), transparent 60%),radial-gradient(900px 600px at -10% 110%, rgba(40,110,200,.18), transparent 60%),radial-gradient(600px 400px at 50% 50%, rgba(227,194,122,.05), transparent 70%),#070914;
  --star:#FFFFFF; --star-cool:#D6E2FF; --star-warm:#F8DFA2;
  --topbar-bg:rgba(7,9,20,.72); --panel-bg:#121630; --input-bg:rgba(10,13,30,.7);
  --glow:227,194,122; --lock-bg:rgba(18,22,42,.72); --lock-glow:rgba(120,90,220,.18); --shipped-bg:#2B3F7A; --hover-shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="space-light"]{
  --desk:#F4F1EA; --sheet:rgba(255,255,255,.74); --sheet-2:rgba(236,234,247,.82);
  --ink:#1B1D33; --ink-2:#4D5170; --ink-3:#7C809C;
  --line:rgba(40,50,110,.14); --line-2:rgba(40,50,110,.08);
  --accent:#8C6210; --accent-2:#734F0B; --on-accent:#FFFFFF;
  --caution:#B57A0E; --on-caution:#FFFFFF;
  --danger:#C2334A; --ok:#1E8A62; --info:#2F5FC4; --violet:#6A55D8;
  --stock:#FFFFFF; --stock-ink:#12142A;
  --btn-ink-bg:#1B1D33; --btn-ink-fg:#FFFFFF;
  --scrim:rgba(20,22,40,.35);
  --sky:radial-gradient(1200px 700px at 85% -10%, rgba(150,130,230,.22), transparent 60%),radial-gradient(900px 600px at -10% 110%, rgba(110,160,230,.20), transparent 60%),radial-gradient(700px 500px at 50% 45%, rgba(227,194,122,.16), transparent 70%),#F4F1EA;
  --star:rgba(40,48,110,.85); --star-cool:rgba(60,90,200,.9); --star-warm:rgba(175,120,20,1);
  --topbar-bg:rgba(244,241,234,.78); --panel-bg:#FBFAF6; --input-bg:rgba(255,255,255,.88);
  --glow:227,194,122; --lock-bg:rgba(255,255,255,.72); --lock-glow:rgba(150,130,230,.22); --shipped-bg:#2F5FC4; --hover-shadow:rgba(40,40,90,.12);
  color-scheme:light;
}
/* Deep space blue: navy sky, blue nebula, icy stars, electric-blue accents */
:root[data-theme="space-blue"]{
  --desk:#040A1C; --sheet:rgba(14,28,64,.64); --sheet-2:rgba(24,44,92,.56);
  --ink:#E6F0FF; --ink-2:#9DB4DA; --ink-3:#6A84B0;
  --line:rgba(110,160,255,.20); --line-2:rgba(110,160,255,.11);
  --accent:#3D9BFF; --accent-2:#6DB6FF; --on-accent:#031027;
  --caution:#FFC857; --on-caution:#1A1200;
  --danger:#FF6B81; --ok:#4BE3B0; --info:#7CC4FF; --violet:#9C8BFF;
  --stock:#E6F0FF; --stock-ink:#071433;
  --btn-ink-bg:#E6F0FF; --btn-ink-fg:#061129;
  --scrim:rgba(1,4,14,.72);
  --sky:radial-gradient(1200px 700px at 80% -10%, rgba(40,110,255,.32), transparent 60%),radial-gradient(900px 700px at -10% 100%, rgba(0,190,255,.20), transparent 60%),radial-gradient(700px 500px at 50% 45%, rgba(90,70,230,.14), transparent 70%),linear-gradient(180deg,#07142F 0%,#030817 100%);
  --star:#FFFFFF; --star-cool:#BFE1FF; --star-warm:#8FD3FF;
  --topbar-bg:rgba(4,10,28,.74); --panel-bg:#0A1736; --input-bg:rgba(3,10,30,.72);
  --glow:61,155,255; --lock-bg:rgba(8,20,48,.74); --lock-glow:rgba(40,110,255,.28); --shipped-bg:#1F4FA8; --hover-shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-stars]{--serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif}
:root[data-stars] body{background:var(--sky);background-attachment:fixed}
/* Four star layers, each twinkling on its own rhythm so they sparkle out of step. */
:root[data-stars] body::before,:root[data-stars] body::after,:root[data-stars]::before,:root[data-stars]::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
:root[data-stars] body::before{
  background-image:
    radial-gradient(1px 1px at 20px 30px,var(--star),transparent),radial-gradient(1px 1px at 140px 90px,var(--star),transparent),
    radial-gradient(1px 1px at 260px 20px,var(--star),transparent),radial-gradient(1.5px 1.5px at 330px 160px,var(--star),transparent),
    radial-gradient(1px 1px at 90px 210px,var(--star),transparent),radial-gradient(1px 1px at 210px 260px,var(--star-cool),transparent),
    radial-gradient(1px 1px at 380px 300px,var(--star),transparent),radial-gradient(1px 1px at 40px 340px,var(--star-warm),transparent);
  background-size:400px 360px;animation:pv-twinkle 4.7s ease-in-out infinite alternate;animation-delay:-2s}
:root[data-stars] body::after{
  background-image:
    radial-gradient(1.5px 1.5px at 70px 120px,var(--star),transparent),radial-gradient(2px 2px at 300px 60px,var(--star-warm),transparent),
    radial-gradient(1.5px 1.5px at 520px 240px,var(--star-cool),transparent),radial-gradient(1px 1px at 180px 420px,var(--star),transparent),
    radial-gradient(2px 2px at 620px 460px,var(--star),transparent),radial-gradient(1.5px 1.5px at 420px 520px,var(--star),transparent);
  background-size:700px 600px;animation:pv-twinkle 3.1s ease-in-out infinite alternate}
:root[data-stars]::before{
  background-image:
    radial-gradient(2px 2px at 110px 60px,var(--star),transparent),radial-gradient(1.5px 1.5px at 350px 190px,var(--star-warm),transparent),
    radial-gradient(1px 1px at 230px 330px,var(--star),transparent),radial-gradient(2px 2px at 470px 410px,var(--star-cool),transparent),
    radial-gradient(1.5px 1.5px at 30px 470px,var(--star),transparent);
  background-size:520px 520px;animation:pv-twinkle 2.3s ease-in-out infinite alternate;animation-delay:-1.1s}
/* A few bright stars with a soft glow that flare slowly. */
:root[data-stars]::after{
  background-image:
    radial-gradient(circle at 160px 140px,var(--star) 0 1.5px,var(--star-warm) 2px,transparent 7px),
    radial-gradient(circle at 690px 380px,var(--star) 0 1.5px,var(--star-cool) 2px,transparent 7px),
    radial-gradient(circle at 420px 700px,var(--star) 0 1.5px,var(--star) 2px,transparent 6px);
  background-size:900px 820px;animation:pv-flare 5.9s ease-in-out infinite;animation-delay:-3s}
/* Two more dense star fields, plus shooting stars */
.sky-fx{display:none}
:root[data-stars] .sky-fx{display:block;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
:root[data-stars] .sky-fx::before,:root[data-stars] .sky-fx::after{content:"";position:absolute;inset:0}
:root[data-stars] .sky-fx::before{
  background-image:
    radial-gradient(1.2px 1.2px at 12px 18px,var(--star),transparent),radial-gradient(1.2px 1.2px at 88px 64px,var(--star),transparent),
    radial-gradient(1.6px 1.6px at 150px 30px,var(--star-cool),transparent),radial-gradient(1.2px 1.2px at 210px 120px,var(--star),transparent),
    radial-gradient(1.2px 1.2px at 40px 150px,var(--star),transparent),radial-gradient(1.6px 1.6px at 250px 200px,var(--star),transparent),
    radial-gradient(1.2px 1.2px at 120px 230px,var(--star-warm),transparent),radial-gradient(1.2px 1.2px at 280px 80px,var(--star),transparent),
    radial-gradient(1.2px 1.2px at 180px 260px,var(--star),transparent),radial-gradient(1.2px 1.2px at 60px 250px,var(--star-cool),transparent);
  background-size:300px 280px;animation:pv-twinkle 3.7s ease-in-out infinite alternate;animation-delay:-.7s}
:root[data-stars] .sky-fx::after{
  background-image:
    radial-gradient(circle at 90px 80px,var(--star) 0 1.8px,var(--star-cool) 2.4px,transparent 6px),
    radial-gradient(circle at 460px 170px,var(--star) 0 1.8px,var(--star-warm) 2.4px,transparent 6px),
    radial-gradient(2px 2px at 300px 380px,var(--star),transparent),radial-gradient(2.4px 2.4px at 540px 470px,var(--star),transparent),
    radial-gradient(1.8px 1.8px at 200px 500px,var(--star-warm),transparent),radial-gradient(2px 2px at 30px 330px,var(--star),transparent);
  background-size:600px 540px;animation:pv-twinkle 2.9s ease-in-out infinite alternate;animation-delay:-1.9s}
/* Each streak waits, flashes across in about a second, and fades; staggered so they're occasional. */
:root[data-stars] .sky-fx i{position:absolute;left:var(--x);top:var(--y);width:var(--len);height:2px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,var(--star),transparent);transform-origin:left center;
  animation:pv-shoot var(--dur) linear infinite;animation-delay:var(--wait)}
:root[data-stars] .sky-fx i::before{content:"";position:absolute;left:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--star);box-shadow:0 0 10px 3px var(--star-cool)}
@keyframes pv-shoot{
  0%{opacity:0;transform:rotate(-32deg) translateX(0)}
  1%{opacity:1}
  9%{opacity:0;transform:rotate(-32deg) translateX(-620px)}
  100%{opacity:0;transform:rotate(-32deg) translateX(-620px)}}
@keyframes pv-twinkle{0%{opacity:.3}45%{opacity:.95}55%{opacity:1}100%{opacity:.4}}
@keyframes pv-flare{0%,100%{opacity:.15}50%{opacity:1}}
:root[data-stars] #app{position:relative;z-index:1}
/* Glass panels */
:root[data-stars] .slip,:root[data-stars] .stat,:root[data-stars] .panelbox,:root[data-stars] .btn,:root[data-stars] .chip,
:root[data-stars] .panel,:root[data-stars] .topbar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-stars] .slip:hover{border-color:rgba(var(--glow),.45);box-shadow:0 0 0 1px rgba(var(--glow),.1),0 8px 30px var(--hover-shadow)}
:root[data-stars] .btn-primary{box-shadow:0 0 18px rgba(var(--glow),.3)}
:root[data-stars] .chip[aria-pressed="true"]{box-shadow:0 0 14px rgba(var(--glow),.35)}
/* Timeless type for headings */
:root[data-stars] .view-title,:root[data-stars] .set-title,
:root[data-stars] .panel-head h2,:root[data-stars] .empty h2{font-family:var(--serif);font-stretch:100%;font-weight:700;letter-spacing:.01em}
:root[data-stars] .view-title{font-size:calc(34px*var(--fs))}
:root[data-stars] .stat-n{font-family:var(--serif);font-stretch:100%;font-size:calc(34px*var(--fs))}
/* Lock screen: a glass card instead of the paper label */
:root[data-stars] .lock-label{background:var(--lock-bg);color:var(--ink);border:1px solid rgba(var(--glow),.45);border-radius:14px;
  box-shadow:0 0 60px var(--lock-glow),inset 0 1px 0 rgba(255,255,255,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-stars] .lock-label .wordmark{color:var(--accent)}
:root[data-stars] .lock-label p{color:var(--ink-2)}
:root[data-stars] .lock-label .field label{color:var(--ink)}
:root[data-stars] .lock-label input,:root[data-stars] .lock-label .field input{color:var(--ink);border-color:var(--line);background:var(--input-bg)}
:root[data-stars] .lock-rule{background:linear-gradient(90deg,transparent,rgba(var(--glow),.7),transparent)!important;border:0!important;height:1px!important}
:root[data-stars] *::-webkit-scrollbar-thumb{border-color:var(--desk)}
:root[data-stars] .ostage-shipped{background:var(--shipped-bg)}
:root[data-stars] .topbar{background:var(--topbar-bg)}
:root[data-stars] .panel{background:var(--panel-bg);border-left:1px solid var(--line)}
:root[data-stars] .field input,:root[data-stars] .field select,:root[data-stars] .field textarea,:root[data-stars] .search input{background:var(--input-bg)}
:root[data-stars] select option{background:var(--panel-bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
@media (max-width:700px){:root{--fs:1}}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:calc(15px*var(--fs));line-height:1.45}
*::-webkit-scrollbar{width:12px;height:12px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--desk)}*::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;font-size:calc(14px*var(--fs));white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ink{background:var(--btn-ink-bg);color:var(--btn-ink-fg);border-color:var(--btn-ink-bg)}
.btn-quiet{background:transparent;border-color:transparent}
.btn-quiet:hover{background:var(--sheet-2);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-sm{min-height:32px;padding:0 10px;font-size:calc(13px*var(--fs))}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--sheet-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.link-danger{color:var(--danger)}

/* lock screen */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.lock-inner{width:100%;max-width:420px}
.lock-label{background:var(--stock);color:var(--stock-ink);border:3px solid #000;border-radius:3px;padding:24px}
/* What's missing on a profile or draft (1.9.78+): a red icon by the name, and its description */
.issue-ic{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;padding:0;margin:0 -2px 0 0;border:0;border-radius:6px;background:none;color:var(--danger);cursor:help}
.issue-ic svg{width:17px;height:17px}
.issue-ic:focus-visible{outline:2px solid var(--danger);outline-offset:1px}
.issue-tip{position:fixed;z-index:300;max-width:min(360px,calc(100vw - 16px));background:#0b0f16;color:#EEF1F5;border:1px solid #2C323C;border-radius:8px;padding:8px 12px;
  font-size:calc(13px*var(--fs));line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none}
.issue-tip b{color:#fff;font-weight:700}
.glist .gl-pn{display:flex;align-items:center;gap:4px;min-width:0}
.glist .gl-pn .gl-open{min-width:0}
/* Duplicate drafts (1.9.77+): the line under each choice */
.dd-sub{color:var(--ink-2);font-size:calc(13px*var(--fs))}
/* The name, FAFO (1.9.76+): Bruno Ace SC, loaded with only those letters */
.wordmark{font-family:"Bruno Ace SC",var(--font);font-weight:400;letter-spacing:.06em;line-height:1}
.lock-label .wordmark{font-size:calc(59px*var(--fs));margin:0 0 6px}
.lock-rule{height:6px;background:#000;margin:16px -24px 20px}
.lock-label p{margin:0 0 16px;color:#333}
.lock-label .field label{color:#000}
.lock-label input,.lock-label .field input{background:#fff;color:#000;border-color:#000}
.lock-foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;margin-top:16px;font-size:calc(14px*var(--fs))}
.lock-msg{margin:0 0 12px;padding:10px 12px;background:var(--sheet);border-left:4px solid var(--caution);font-size:calc(14px*var(--fs))}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--desk);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:10px 20px}
.topbar .wordmark{font-size:calc(30px*var(--fs));white-space:nowrap}
.search{position:relative;max-width:460px;width:100%}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--sheet-2);padding:0 12px 0 36px;font-size:calc(16px*var(--fs))}
.top-actions{display:flex;gap:4px;align-items:center}
.top-update{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,52,47,.5)}50%{box-shadow:0 0 0 5px rgba(228,52,47,0)}}
.has-dot{position:relative}
.has-dot .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--desk)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);padding:18px 12px 24px 16px;max-height:calc(100vh - 59px);overflow:auto}
.nav-item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;border:0;background:transparent;cursor:pointer;text-align:left;font-weight:600;font-size:calc(15px*var(--fs))}
.nav-item:hover{background:var(--sheet-2)}
.nav-item[aria-current="true"]{background:var(--sheet-2);box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 1px var(--line);color:var(--ink)}
.nav-item .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500;font-size:calc(13px*var(--fs))}
.groups{margin:2px 0 14px 10px;padding-left:8px;border-left:1px solid var(--line)}
.groups .nav-item{font-weight:500;font-size:calc(14px*var(--fs));padding:6px 10px}
.side-note{margin-top:22px;padding:12px;font-size:calc(13px*var(--fs));color:var(--ink-2);border-top:1px solid var(--line)}
.side-note strong{display:block;color:var(--ink);font-weight:600}
.side-sync{display:flex;align-items:center;gap:6px;margin:8px 0 0;padding:0;border:0;background:none;color:var(--ink-2);font:inherit;font-size:calc(12.5px*var(--fs));cursor:pointer}
.side-sync svg{width:13px;height:13px;color:var(--ok);flex:none}
.side-sync.is-warn svg{color:var(--caution)}
.side-sync:hover{color:var(--ink)}
.main{padding:20px 24px 120px;min-width:0}
.mnav{display:none}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.view-title{margin:0;font-size:calc(26px*var(--fs));font-stretch:112%;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.view-sub{margin:4px 0 0;color:var(--ink-2);font-size:calc(14px*var(--fs))}
.view-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.selall{display:inline-flex;align-items:center;gap:8px;font-size:calc(14px*var(--fs));color:var(--ink-2);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:-4px 0 14px}
.chips-inbox{align-items:center;margin:0 0 14px}
.chips-label{display:inline-flex;align-items:center;gap:6px;flex:none;margin-right:4px;font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chips-label svg{width:15px;height:15px}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:calc(13px*var(--fs));font-weight:600;cursor:pointer}
.chip-store{display:inline-flex;align-items:center;gap:7px}
.store-mark{width:15px;height:15px;flex:none;margin-left:-3px}
.chip-n{font-size:calc(12px*var(--fs));font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2)}
.chip[aria-pressed="true"] .chip-n{background:rgba(0,0,0,.25);color:inherit}
.smark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-size:calc(11px*var(--fs));font-weight:800;letter-spacing:.02em;flex:none}
/* Pokémon Center's mark is a Pokéball (1.9.90+): round at every size, with no tile behind it */
.smark.smark-ball{background:none;border-radius:50% !important}
.smark-ball .pokeball{display:block;width:100%;height:100%}
/* Order card: expandable address, share */
.o-addr-btn{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;border-bottom:1px dashed var(--ink-3)}
.o-addr-btn:hover{color:var(--ink)}
.o-caret{display:inline-block;font-size:.85em;transition:transform .15s}
.o-addr-btn[aria-expanded="true"] .o-caret{transform:rotate(180deg)}
.o-more{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:2px 10px;border:1px solid var(--accent);border-radius:999px;background:transparent;color:var(--accent);font:inherit;font-size:calc(12px*var(--fs));font-weight:700;cursor:pointer;vertical-align:1px}
.o-more:hover{background:var(--accent);color:var(--on-accent)}
.o-more svg{width:12px;height:12px}
.o-more[aria-expanded="true"] .o-caret{transform:rotate(180deg)}
.slip-meta .o-drop{display:flex;flex-direction:column;gap:8px;white-space:normal;overflow:visible;background:var(--sheet-2);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;margin:4px 0;color:var(--ink)}
.slip-meta .o-drop-addr{display:flex;align-items:flex-start;gap:8px;white-space:normal;overflow:visible}
.slip-meta .o-drop-addr > svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--accent)}
.slip-meta .o-addr-txt{white-space:normal;overflow:visible;flex:1;min-width:0}
.slip-meta .o-tl{display:flex;flex-direction:column;gap:3px;white-space:normal;overflow:visible}
.slip-meta .o-tl-row{display:flex;justify-content:space-between;gap:10px;color:var(--ink-2);white-space:normal;overflow:visible}
.slip-meta .o-tl-row b{color:var(--ink);font-weight:600;text-align:right}
.slip-meta .o-tl-row.is-del b{color:var(--ok)}
.slip-meta .o-del{color:var(--ok);font-weight:600}
.slip-meta .o-warn{color:var(--caution);font-weight:700;white-space:normal;overflow:visible}
.slip-meta .o-warn-x{color:var(--danger)}
.chip-warn{border-color:var(--caution);color:var(--caution)}
.al-row input[type=number]{width:64px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--sheet-2);padding:0 8px;margin:0 4px}
.chip-warn[aria-pressed="true"]{background:var(--caution);color:var(--on-caution);border-color:var(--caution)}
.o-mini{width:24px;height:24px;flex:none;margin:-3px 0 -3px auto}
.o-mini svg{width:14px;height:14px}
.o-share{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 9px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-2);font:inherit;font-size:calc(12px*var(--fs));font-weight:600;cursor:pointer}
.o-share:hover{color:var(--ink);border-color:var(--ink-3)}
.o-share svg{width:12px;height:12px}
/* Auto-clean options */
.auto-clean{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.auto-scope{display:flex;flex-direction:column;gap:4px;min-width:220px}
.auto-scope select{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--sheet-2);padding:0 10px}
/* Generate success */
.sx-opts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 0 12px}
.sx-opts .check{margin:0}
.sx-dates{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.sx-dates[hidden]{display:none}
.sx-dates label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:calc(13px*var(--fs))}
.sx-dates input{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet-2);padding:0 10px}
.sx-opts select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet-2);padding:0 10px;max-width:260px}
.sx-prev{border:1px solid var(--line);border-radius:12px;background:var(--sheet-2);min-height:220px;display:grid;place-items:center;padding:10px;max-height:62vh;overflow:auto}
.sx-prev img{display:block;width:100%;max-width:540px;height:auto;border-radius:10px}
/* Phone tracker QR */
.ph-qr-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ph-qr{width:168px;height:168px;flex:none;border-radius:10px;background:#fff}
.ph-adv summary{cursor:pointer;color:var(--ink-2);font-size:calc(13px*var(--fs));font-weight:600}
/* License card (Settings) and key input */
.lic-card{border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:18px 20px;max-width:640px}
.lic-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.lic-title{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.lic-title svg{width:18px;height:18px;color:var(--accent)}
.lic-key{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet-2);padding:8px 8px 8px 14px}
.lic-key code{font-family:ui-monospace,Consolas,Menlo,monospace;font-weight:700;letter-spacing:.06em;font-size:calc(15px*var(--fs))}
.lic-input{font-family:ui-monospace,Consolas,Menlo,monospace!important;text-transform:uppercase;letter-spacing:.06em}
.lic-sep{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--ink-3);font-size:calc(12px*var(--fs))}
.lic-sep::before,.lic-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.btn-discord{width:100%;justify-content:center;gap:8px;background:#5865F2;border-color:#5865F2;color:#fff}
.btn.btn-discord:hover{background:#4752C4;border-color:#4752C4}
.lic-dc-msg{margin:10px 0 0;font-size:calc(12.5px*var(--fs));color:var(--ink-2)}
.lic-dc-msg.is-ok{color:var(--ok)}
.lic-dc-msg.is-err{color:var(--danger)}
/* Order photo, with the store's mark as a small badge in the corner */
.othumb{position:relative;flex:none;width:44px;height:44px;border-radius:9px;background:#fff;display:grid;place-items:center}
.othumb img{width:100%;height:100%;object-fit:contain;border-radius:9px;padding:2px}
.othumb .smark{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:5px;font-size:calc(8px*var(--fs));box-shadow:0 0 0 2px var(--sheet)}
.othumb.is-broken{width:auto;height:auto;background:none}
.othumb.is-broken img{display:none}
.othumb.is-broken .smark{position:static;width:26px;height:26px;border-radius:7px;font-size:calc(11px*var(--fs));box-shadow:none}
.smark-lg{width:34px;height:34px;font-size:calc(13px*var(--fs));border-radius:9px}
.ret-pick{display:flex;flex-wrap:wrap;gap:8px}
.spick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px 5px 6px;font-size:calc(14px*var(--fs));font-weight:600;cursor:pointer}
.spick:hover{border-color:var(--ink-3)}
.spick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sheet-2)}
.spick-new{border-style:dashed;padding-left:10px}
.spick-new svg{width:16px;height:16px}
.spick .pill{font-size:calc(11px*var(--fs));padding:0 6px}
.ret-add{margin-top:10px}
.ret-add select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:0 11px;font-size:calc(15px*var(--fs))}
.ret-cfgs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pe-stores-err:not(.has-err){display:none}.pe-stores-err{margin-top:10px}
.ret-cfg{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.ret-cfg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ret-cfg-head strong{flex:1;min-width:0}
.ret-auto{margin:-8px 0 0;font-size:calc(12px*var(--fs));color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}

/* Profiles layout toggle */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 11px;font:inherit;font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* Compact profile cards */
.grid-compact{gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.slip.slip-compact{padding:10px 11px;gap:7px;border-radius:10px}
.slip-compact .slip-head{gap:6px}
.slip-compact .slip-head input[type=checkbox]{width:16px;height:16px}
.slip-compact .slip-name{font-size:calc(14px*var(--fs))}
.slip-compact .icon-btn{width:26px;height:26px}
.slip-compact .icon-btn svg{width:15px;height:15px}
.slip-compact .label{padding:6px 8px;border-width:1.5px;font-size:calc(12px*var(--fs));line-height:1.25}
.slip-compact .label .l-name{font-size:calc(13px*var(--fs));margin-bottom:1px}
.slip-compact .label .l-name,.slip-compact .label .l-one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.slip-compact .cardline{font-size:calc(12px*var(--fs));gap:6px;min-width:0}
.slip-compact .swatch{width:22px;height:14px}
.cl-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slip-compact .slip-meta{font-size:calc(12px*var(--fs));gap:2px}
.slip-compact .missing{padding:6px 8px;font-size:calc(12px*var(--fs))}
.s-chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.mini-chip{font-size:calc(11px*var(--fs));font-weight:600;line-height:1.5;padding:0 7px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* A store set to "Use Assigned Account" */
.mini-chip-seller{background:color-mix(in srgb, var(--violet) 18%, var(--sheet-2));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--violet) 50%, transparent)}

/* Profiles list (table) */
.plist-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.plist{width:100%;min-width:860px;table-layout:fixed;border-collapse:collapse;font-size:calc(13px*var(--fs))}
.plist th{text-align:left;font-size:calc(12px*var(--fs));font-weight:700;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.plist td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2);overflow:hidden}
.plist tbody tr:last-child td{border-bottom:0}
.plist tr.is-sel td{background:color-mix(in srgb, var(--accent) 10%, var(--sheet))}
.plist .pl-sel{padding-right:2px}
.plist .pl-sel input{width:16px;height:16px;margin:0;accent-color:var(--accent);vertical-align:middle}
.pl-name{display:flex;align-items:center;gap:6px;min-width:0}
.pl-name .slip-name{font-size:calc(14px*var(--fs))}
/* In the List the group gives way to the name (1.9.79+): it gets shorter, and goes out of sight (onto a
   hidden second line) when it can't show a few letters. Hovering the name shows the group too. */
.pl-name{flex-wrap:wrap;row-gap:40px;height:22px;overflow:clip;overflow-clip-margin:4px}
.pl-name > .slip-nm{flex:0 1 auto;gap:6px}
.pl-name > .tag{flex:1 1 44px;max-width:max-content;min-width:0}
.pl-cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-none{color:var(--ink-3)}
.s-chips.s-one{flex-wrap:nowrap;overflow:hidden}
.s-one .mini-chip{flex:0 1 auto;min-width:24px}
.s-one .mini-more{flex:none;min-width:0}
.plist .pl-act{white-space:nowrap;text-align:right;padding:2px 6px}

/* profile slip */
.slip{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slip.is-sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.order.is-sel{background:color-mix(in srgb, var(--accent) 12%, var(--sheet))}
.order .o-pick{width:16px;height:16px;flex:none;margin:14px 0 0;accent-color:var(--accent);cursor:pointer}
.o-chiprow{display:flex;align-items:center;gap:12px}
.o-chiprow > .chips{flex:1;min-width:0}
.o-period{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 0 12px}
.o-period > label{font-weight:600;color:var(--ink-2)}
.o-period select,.o-period input[type=date]{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--sheet-2);padding:0 10px}
.o-period #o-period{min-width:210px;font-weight:600}
.o-period-range{color:var(--ink-3);font-size:calc(13px*var(--fs))}
.o-period-dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.o-wk{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fs));color:var(--ink-2)}
.o-selall{flex:none;white-space:nowrap;padding:0 4px 6px;font-size:calc(13px*var(--fs))}
.o-selall input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.marquee{position:fixed;display:none;z-index:25;pointer-events:none;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);border-radius:4px}
body.is-marquee,body.is-marquee *{user-select:none!important;-webkit-user-select:none!important}
.toast-act{margin-left:12px;background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;pointer-events:auto}
.slip-head{display:flex;align-items:center;gap:10px;min-width:0}
.slip-head input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent);margin:0}
.slip-name{flex:1;min-width:0;font-weight:700;font-size:calc(16px*var(--fs));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.slip-name:hover{text-decoration:underline;text-underline-offset:3px}
.tag{flex:none;font-size:calc(12px*var(--fs));font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A profile's name comes first (1.9.79+). On a card it takes up to two lines, and its group moves under it
   when both don't fit on one line; the checkbox, icon and buttons line up with its first line. The problem
   icon and the name never part (.slip-nm). */
.slip-nm{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.slip-nm .slip-name{flex:1 1 auto}
.p-head{align-items:flex-start}
.p-head > input[type=checkbox]{margin-top:8px}
.slip-title{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px}
.slip-title > .slip-nm{flex:1 1 auto;align-items:flex-start;min-height:34px}
.slip-title .issue-ic{margin-top:6px}
.slip-title .slip-name{white-space:normal;line-height:1.25;margin-top:calc((34px - 1.25em)/2)}
.slip-title .sn-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.slip-title > .tag{max-width:100%}
.slip-compact .p-head > input[type=checkbox]{margin-top:5px}
.slip-compact .slip-title{column-gap:6px}
.slip-compact .slip-title > .slip-nm{min-height:26px;gap:6px}
.slip-compact .slip-title .issue-ic{margin-top:2px}
.slip-compact .slip-title .slip-name{margin-top:calc((26px - 1.25em)/2)}
.slip-meta{display:flex;flex-direction:column;gap:4px;font-size:calc(13px*var(--fs));color:var(--ink-2);min-width:0}
.slip-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardline{display:flex;align-items:center;gap:8px;font-size:calc(14px*var(--fs));font-weight:600;font-variant-numeric:tabular-nums}
.swatch{width:30px;height:19px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}
.expired{color:var(--danger);font-weight:600}
.missing{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px dashed var(--line);border-radius:3px;padding:10px 12px;color:var(--ink-2);font-size:calc(14px*var(--fs))}

/* printed label: the signature object */
.label{background:var(--stock);color:var(--stock-ink);border:2px solid #000;border-radius:4px;padding:10px 12px;font-stretch:78%;font-weight:700;text-transform:uppercase;line-height:1.22;font-size:calc(15px*var(--fs));letter-spacing:.01em;min-width:0}
.label .l-name{font-size:calc(18px*var(--fs));font-weight:800;margin-bottom:3px;overflow-wrap:anywhere}
.label div{overflow-wrap:anywhere}
.label-lg{padding:16px 18px;font-size:calc(17px*var(--fs));border-width:3px}
.label-lg .l-name{font-size:calc(22px*var(--fs))}
.label .l-bar{height:5px;background:#000;margin:10px -12px 8px}
.label-lg .l-bar{margin:12px -18px 10px}
.label .l-foot{font-size:calc(12px*var(--fs));font-weight:600;text-transform:none;font-stretch:100%;display:flex;justify-content:space-between;gap:8px}
.label.is-empty{color:#8a8a8a}

.item{display:flex;flex-direction:column;gap:10px;min-width:0}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.item-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:calc(13px*var(--fs));color:var(--ink-2)}
.item-actions{display:flex;gap:2px;flex:none}

/* credit card object */
.cc{position:relative;aspect-ratio:1.586;border-radius:11px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cc.light{color:#1a1a1a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc-nick{font-size:calc(13px*var(--fs));font-weight:600;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-brand{font-stretch:125%;font-weight:800;font-size:calc(16px*var(--fs));letter-spacing:.02em;white-space:nowrap}
.cc-tag{display:inline-block;padding:1px 6px;border-radius:999px;font-size:calc(10px*var(--fs));font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.22);vertical-align:1px}
.cc.light .cc-tag{background:rgba(0,0,0,.14)}
.cc-chip{width:38px;height:28px;border-radius:5px;background:linear-gradient(135deg,#d8c690,#b39a58);position:relative}
.cc-chip::after{content:"";position:absolute;inset:6px 0;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.cc-num{font-variant-numeric:tabular-nums;font-size:clamp(16px,5.2cqi,21px);letter-spacing:.09em;font-weight:600;white-space:nowrap}
.cc-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:calc(13px*var(--fs))}
.cc-bottom small{display:block;font-size:calc(10px*var(--fs));opacity:.7;font-weight:600}
.cc-holder{text-transform:uppercase;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cc-wrap{container-type:inline-size}
.cc-pick{position:relative}
.cc-pick > input[type=checkbox]{position:absolute;top:10px;left:10px;z-index:2;width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer;border-radius:5px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.item.is-sel .cc{outline:2px solid var(--accent);outline-offset:2px}
.cc-pick .cc-top{padding-left:30px}

/* Compact cards: the same card at about two-thirds the size */
.grid-cards-compact{gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid-cards-compact .item{gap:6px}
.grid-cards-compact .cc{padding:10px 12px;border-radius:9px}
.grid-cards-compact .cc-brand{font-size:calc(13px*var(--fs))}
.grid-cards-compact .cc-nick{font-size:calc(11px*var(--fs))}
.grid-cards-compact .cc-chip{width:28px;height:20px;border-radius:4px}
.grid-cards-compact .cc-chip::after{inset:4px 0}
.grid-cards-compact .cc-num{font-size:clamp(12px,6.4cqi,16px);letter-spacing:.06em}
.grid-cards-compact .cc-bottom{font-size:calc(11px*var(--fs));gap:6px}
.grid-cards-compact .cc-bottom small{font-size:calc(9px*var(--fs))}
.grid-cards-compact .cc-pick > input[type=checkbox]{top:7px;left:7px;width:17px;height:17px}
.grid-cards-compact .cc-pick .cc-top{padding-left:22px}
.grid-cards-compact .item-title{font-size:calc(14px*var(--fs))}
.grid-cards-compact .item-sub{font-size:calc(12px*var(--fs))}
.grid-cards-compact .icon-btn{width:28px;height:28px}
.grid-cards-compact .icon-btn svg{width:16px;height:16px}

/* Cards list (table), styled like the Profiles list */
.plist.clist{min-width:820px}
.cl-card{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-card .swatch{width:26px;height:17px}
.cl-card .pl-num{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-card .tag{flex:0 1 auto;min-width:0;font-size:calc(11px*var(--fs));padding:1px 7px}
.cl-cvv{flex:none;white-space:nowrap;font-weight:600;color:var(--ink-2)}
.cl-nick{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink-3)}
.cl-card.is-rv{flex-wrap:wrap;row-gap:2px}
.cl-card.is-rv .pl-num{white-space:normal;overflow:visible}
.clist td > .tag{display:inline-block;max-width:100%;vertical-align:middle}
.clist .pl-hold{text-transform:uppercase;font-weight:600}
/* Card notes (1.9.86+): the Cards list's Note column, edited in place; empty, it says Add a note on hover */
.cl-note{display:block;max-width:calc(100% + 8px);margin:-4px -4px -4px -8px;padding:4px 8px;border:0;border-radius:6px;background:none;font:inherit;font-weight:500;color:var(--ink-2);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.cl-note:hover,.cl-note:focus-visible{background:var(--sheet-2);outline:none}
.cl-note.is-empty{color:var(--ink-3);opacity:0}
.clist tr:hover .cl-note.is-empty,.cl-note.is-empty:focus-visible{opacity:1}
@media (hover:none){.cl-note.is-empty{opacity:1}}
.cl-note-in{width:100%;height:30px;min-height:0;border:1px solid var(--accent);border-radius:6px;background:var(--sheet-2);padding:0 8px;font:inherit;font-weight:500;color:var(--ink)}
.cc-note{margin-top:4px;color:var(--ink-2);overflow-wrap:anywhere}
.clist .pl-num{font-variant-numeric:tabular-nums}

/* Store logins: profiles linked to a login are green with a check (the Submitted green);
   a login linked to nothing shows a muted Not linked chip */
.chip-linked{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%;background:var(--ok);border-color:var(--ok);color:#fff}
.chip-linked svg{width:13px;height:13px;flex:none;stroke-width:3}
.chip-linked span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-unlinked{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3)}
.chip-unlinked:hover{color:var(--ink-2);border-color:var(--ink-2)}
button.mini-chip{border:0;font-family:inherit;cursor:pointer}
.mini-chip.chip-linked{gap:3px;padding:0 7px 0 5px}
.mini-chip.chip-linked svg{width:10px;height:10px}
.mini-chip.chip-unlinked{border:1px dashed var(--ink-3);line-height:1.35}
.s-one .mini-chip.chip-linked{min-width:44px}

/* Compact store logins: 4 or 5 to a row on a laptop screen, never more than 5 */
.grid-logins-compact{gap:10px;grid-template-columns:repeat(auto-fill,minmax(max(200px,calc((100% - 40px) / 5)),1fr))}
.slip.login-compact{padding:10px 11px;gap:6px;border-radius:10px;border-top-width:3px}
.login-compact .slip-head{gap:6px}
/* One line: the store, then the label when there's room for a few letters of it (otherwise it
   wraps onto a second line, which is cut off). The tooltip has both. */
.lc-name{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;height:calc(20px*var(--fs));line-height:calc(20px*var(--fs));overflow:hidden}
.lc-name .store-name{flex:0 1 auto;min-width:0;max-width:100%;font-size:calc(15px*var(--fs));line-height:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-name .item-sub{flex:1 1 0;min-width:4em;line-height:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(12px*var(--fs))}
.login-compact .icon-btn{width:26px;height:26px}
.login-compact .icon-btn svg{width:15px;height:15px}
.lc-email{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(13px*var(--fs));font-weight:600}
.lc-inbox{display:flex;align-items:center;gap:5px;min-width:0;font-size:calc(12px*var(--fs));color:var(--ink-3)}
.lc-inbox svg{width:13px;height:13px;flex:none}
.lc-inbox span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Store logins list (table), styled like the Profiles list */
.plist.llist{min-width:600px}
.llist .smark{width:22px;height:22px;border-radius:6px;font-size:calc(10px*var(--fs))}
.ll-sname{display:flex;align-items:center;gap:8px;min-width:0}
.ll-sname strong{color:var(--ink)}
.ll-label{color:var(--ink-3)}
.llist .ll-acct .pl-cell{color:var(--ink)}
.ll-pwbox{display:flex;align-items:center;gap:2px;min-width:0}
.ll-dots{min-width:0;overflow:hidden;white-space:nowrap;letter-spacing:.06em}
.llist .ll-pw .icon-btn{flex:none;width:28px;height:28px}
.llist .ll-pw .icon-btn svg{width:15px;height:15px}
/* Where the table would be squeezed (phones, small tablets, and small windows once the 232px
   sidebar is showing), each row stacks: store and actions, account and password, inbox, profiles */
@media (max-width:760px),(min-width:901px) and (max-width:1039px){
  .plist.llist{min-width:0}
  .llist colgroup,.llist thead{display:none}
  .llist,.llist tbody{display:block}
  .llist tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"store act" "acct pw" "inbox inbox" "prof prof";align-items:center;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .llist tbody tr:last-child{border-bottom:0}
  .llist td{display:block;min-width:0;padding:0;border:0}
  .llist .ll-store{grid-area:store}
  .llist .pl-act{grid-area:act;padding:0}
  .llist .ll-acct{grid-area:acct}
  .llist .ll-pw{grid-area:pw}
  .llist .ll-inbox{grid-area:inbox;display:flex;gap:5px}
  .llist .ll-inbox::before{content:"Inbox";flex:none;color:var(--ink-3)}
  .llist .ll-prof{grid-area:prof;margin-top:4px}
}

/* Generate: the drafts list (table), stacked like Store logins where it would be squeezed */
.gen-tip{margin:-6px 0 14px}
/* Which store Jig is for (1.9.80+): beside the tip, and in the draft and profile editors */
.gen-tipbar{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:-6px 0 14px}
.gen-tipbar .gen-tip{margin:0;flex:1 1 320px}
.jig-for-row{display:flex;align-items:center;gap:8px;flex:none;font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink-2)}
.seg.jig-for button{padding:6px 10px}
.gen-pkc{margin:-6px 0 14px;padding:9px 12px;border-radius:8px;border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line));background:color-mix(in srgb, var(--accent) 8%, var(--sheet));color:var(--ink-2);font-size:calc(13px*var(--fs))}
.gen-pkc strong{color:var(--ink)}
:root:not([data-jigfor="pokemon"]) .pkc-only{display:none!important}
:root[data-jigfor="pokemon"] .target-only{display:none!important}
.plist.glist{min-width:720px}
.glist .gl-open{display:block;max-width:100%;padding:0;border:0;background:none;color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glist .gl-open:hover{text-decoration:underline;text-underline-offset:3px}
.glist .gl-prof .tag{display:inline-block;max-width:100%;margin-top:3px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-same{display:block;margin-top:2px;font-size:calc(12px*var(--fs));color:color-mix(in srgb, var(--caution) 65%, var(--ink))}
.gd-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:-4px;font-size:calc(14px*var(--fs))}
.gp-h{margin:8px 0 -4px}
@media (max-width:760px),(min-width:901px) and (max-width:1039px){
  .plist.glist{min-width:0}
  .glist colgroup,.glist thead{display:none}
  .glist,.glist tbody{display:block}
  .glist tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"sel prof act" ". name name" ". addr addr" ". email phone";align-items:center;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .glist tbody tr:last-child{border-bottom:0}
  .glist td{display:block;min-width:0;padding:0;border:0}
  .glist .pl-sel{grid-area:sel}
  .glist .gl-prof{grid-area:prof}
  .glist .pl-act{grid-area:act;padding:0}
  .glist .gl-name{grid-area:name}
  .glist .gl-addr{grid-area:addr}
  .glist .gl-email{grid-area:email}
  .glist .gl-phone{grid-area:phone;text-align:right}
}

/* Mass edit: three columns (one on narrow screens); a tick before each field */
/* Mass edit for drafts and Jig (1.9.73+): a tick on each field, and a box in place of a field FAFO fills for each draft */
.me-lab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.field .me-tick{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.field .me-tick input[type=checkbox],:root[data-stars] .field .me-tick input[type=checkbox]{flex:none;width:16px;height:16px;min-height:0;margin:0;padding:0;border:0;border-radius:3px;background:none;accent-color:var(--accent)}
.me-f:not(.is-on) .dm-ctrl > input,.me-f:not(.is-on) .dm-ctrl > select{opacity:.6}
.me-jig{font-size:calc(12px*var(--fs))}
/* Import cards (1.9.82+): a CSV file beside the Cards box, or dropped on it */
.bc-pick{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--fs));white-space:nowrap}
.bc-pick svg{width:15px;height:15px;flex:none}
.field textarea.is-over{border-style:dashed;border-color:var(--ink);background:var(--sheet)}
.dm-rnd{display:flex;align-items:center;gap:10px;min-height:42px;padding:5px 5px 5px 11px;border:1px solid var(--accent);border-radius:8px;background:color-mix(in srgb, var(--accent) 12%, var(--sheet-2))}
.dm-rnd svg{width:18px;height:18px;flex:none;color:var(--accent)}
.dm-rnd span{flex:1;min-width:0;font-weight:600;font-size:calc(14px*var(--fs));color:var(--ink)}
.dm-rnd .link{font-size:calc(13px*var(--fs))}
.dm-rnd .icon-btn{width:30px;height:30px;flex:none}
.dm-wrap{max-height:340px;overflow:auto;margin-top:8px}
.dm-prev{width:100%;border-collapse:collapse;font-size:calc(13px*var(--fs))}
.dm-prev th{position:sticky;top:0;background:var(--sheet-2);text-align:left;color:var(--ink-3);font-weight:600;padding:4px 12px 6px 0}
.dm-prev td{padding:5px 12px 5px 0;color:var(--ink);vertical-align:top;overflow-wrap:anywhere}
.dm-prev td:first-child{font-weight:600;white-space:nowrap}
.dm-prev .dm-same{color:var(--ink-3)}
/* Jig in the profile editor (1.9.74+) */
.pe-head-btns{display:inline-flex;align-items:center;gap:6px}
.pe-jig-note{margin:-2px 0 12px}
.pe-bill-kept{margin:8px 0 12px}
/* Mass edit on Profiles (1.9.90+) */
.pm-head{margin:8px 0 -4px;font-size:calc(15px*var(--fs));font-weight:800}
.pm-head:first-child{margin-top:0}
.pm-st{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
.field .pm-sub{flex:none;width:120px;margin:0;padding-top:6px;color:var(--ink-3);font-size:calc(13px*var(--fs));font-weight:600}
.pm-st > div,.pm-st > select{flex:1;min-width:0}
.dm-prev td .pm-was{display:block;font-weight:400;color:var(--ink-3);font-size:calc(12px*var(--fs))}
@media (max-width:640px){.pm-st{flex-direction:column;gap:4px}.field .pm-sub{width:auto;padding-top:0}}

/* empty state */
.empty{border:2px dashed var(--line);border-radius:8px;padding:40px 24px;text-align:center;max-width:620px}
.empty h2{margin:0 0 6px;font-size:calc(20px*var(--fs));font-weight:800;font-stretch:112%}
.empty p{margin:0 auto 18px;color:var(--ink-2);max-width:46ch}

/* bulk bar */
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bulk-inner{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--btn-ink-bg);color:var(--btn-ink-fg);border-radius:10px;padding:8px 8px 8px 16px;box-shadow:0 12px 30px -8px rgba(0,0,0,.45)}
.bulk-inner .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.45)}
.bulk-inner select{height:32px;border-radius:6px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;padding:0 8px;font-size:calc(13px*var(--fs))}
.bulk-inner select option{color:#000;background:#fff}
.bulk-count{font-weight:700;margin-right:6px;font-size:calc(14px*var(--fs))}

/* layers */
.layer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .18s}
.layer.is-open .scrim{opacity:1}
.panel{position:absolute;background:var(--sheet);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 20px 60px -16px rgba(0,0,0,.5);max-height:100%}
.layer-modal .panel{left:50%;top:50%;width:min(560px,calc(100vw - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:10px;transform:translate(-50%,-48%);opacity:0;transition:transform .18s,opacity .18s}
.layer-modal.is-open .panel{transform:translate(-50%,-50%);opacity:1}
.layer-modal.is-small .panel{width:min(420px,calc(100vw - 24px))}
.layer-drawer .panel{top:0;right:0;bottom:0;width:min(540px,100vw);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.layer-drawer.is-open .panel{transform:none}
.layer-drawer.is-wide .panel{width:min(1120px,100vw)}
.layer-modal.is-wide .panel{width:min(760px,calc(100vw - 24px))}
.pe{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.pe-right{position:sticky;top:0}
.pe-sec{padding-top:18px;border-top:1px solid var(--line-2)}
.pe .preview .cc{max-width:none}
.check-box{padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
.check-box:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:900px){.pe{grid-template-columns:minmax(0,1fr)}.pe-right{position:static}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.panel-head h2{margin:0;font-size:calc(20px*var(--fs));font-weight:800;font-stretch:112%}
.panel-body{padding:18px 20px;overflow:auto;flex:1;min-height:0}
.panel-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2)}
.panel-foot .spacer{flex:1}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 12px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink)}
.field .opt{font-weight:400;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--sheet-2);padding:8px 11px;font-size:calc(16px*var(--fs))}
.field textarea{min-height:120px;font-size:calc(13px*var(--fs));font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field .hint{font-size:calc(12px*var(--fs));color:var(--ink-3)}
.field .err{font-size:calc(12px*var(--fs));color:var(--danger);font-weight:600}
.field.has-err input,.field.has-err select{border-color:var(--danger)}
.input-affix{position:relative}
.input-affix .affix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:calc(12px*var(--fs));font-weight:700;color:var(--ink-2);pointer-events:none}
.section{margin:0 0 22px}
.section:last-child{margin-bottom:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.chip-wrap{display:inline-flex;align-items:center;flex:none}
.chip-wrap .chip[aria-pressed="true"]+.chip-more{display:inline-grid}
.chip-more{display:none;place-items:center;width:26px;height:26px;margin-left:2px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);cursor:pointer}
.chip-more:hover{background:var(--sheet-2);color:var(--ink)}
.chip-more svg{width:15px;height:15px}
.pd-sugg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.addr-warn{margin:-4px 0 0;font-size:calc(12px*var(--fs));font-weight:600;color:var(--caution)}
.pe-flag{align-self:end;padding-bottom:10px}
.pe-flag .check{margin:0}
.section-head h3{margin:0;font-size:calc(16px*var(--fs));font-weight:800}
.picker{display:flex;gap:8px;align-items:stretch}
.picker select{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;font-size:calc(14px*var(--fs));cursor:pointer;margin:0 0 10px}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:calc(14px*var(--fs))}
.radio:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.radio input{accent-color:var(--accent);margin:0}
.radio small{color:var(--ink-3);margin-left:auto}
/* Put in profiles: Profiles I pick (1.9.86+) */

@keyframes tin{from{transform:translateY(8px);opacity:0}}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:6px;background:var(--sheet);border-left:4px solid var(--danger);font-size:calc(14px*var(--fs))}
.banner-info{border-left-color:var(--caution)}
.sync-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sync-banner[hidden]{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--sheet-2);border-radius:8px;margin-bottom:16px}
  .mnav button{flex:1;border:0;background:transparent;border-radius:6px;padding:8px 6px;font-weight:600;font-size:calc(14px*var(--fs));cursor:pointer}
  .mnav button[aria-current="true"]{background:var(--sheet-2);box-shadow:inset 0 -2px 0 var(--accent),0 0 0 1px var(--line);color:var(--ink)}
  .mnav .n{color:var(--ink-3);font-weight:500;font-size:calc(12px*var(--fs));margin-left:4px}
  .main{padding:14px 14px 120px}
  .topbar{grid-template-columns:1fr auto;padding:10px 14px;gap:10px}
  .search{grid-column:1 / -1;grid-row:2;max-width:none}
  .top-actions .txt{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .top-actions .btn{padding:0 9px}
  .top-update .txt{position:static!important;width:auto;height:auto;clip:auto}
  .view-title{font-size:calc(22px*var(--fs))}
}
@media (max-width:560px){
  .layer-modal .panel{left:0;right:0;top:auto;bottom:0;width:100%;transform:translateY(100%);border-radius:12px 12px 0 0;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .layer-modal.is-open .panel{transform:none}
  .layer-modal.is-small .panel{width:100%}
  .c3,.c2,.c4{grid-column:span 6}
  .c2.keep{grid-column:span 2}
  .c3.keep3{grid-column:span 3}
  .ret-new{order:1}
  .grid{grid-template-columns:minmax(0,1fr)}
}

</div>

var qrcode = function() {

  // qrcode

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        offset += dcCount;

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {

            index += 1;
          }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {

/* ---------- card helpers ---------- */
function brandOf(num){
  const n = digits(num);
  if (/^4/.test(n)) return "visa";
  if (/^3[47]/.test(n)) return "amex";
  if (/^5[1-5]/.test(n)) return "mastercard";
  const f4 = parseInt(n.slice(0,4), 10);
  if (n.length >= 4 && f4 >= 2221 && f4 <= 2720) return "mastercard";
  if (/^(6011|65|64[4-9]|622)/.test(n)) return "discover";
  if (/^35(2[89]|[3-8])/.test(n)) return "jcb";
  if (/^3(0[0-5]|[68])/.test(n)) return "diners";
  if (/^62/.test(n)) return "unionpay";
  return "";
}
function cardBrand(c){ return c && c.redcard ? "RedCard" : BRAND_NAME[brandOf(c && c.number)]; }
const BRAND_NAME = {visa:"Visa", mastercard:"Mastercard", amex:"Amex", discover:"Discover", jcb:"JCB", diners:"Diners", unionpay:"UnionPay", "":"Card"};
function luhn(num){
  const n = digits(num); if (n.length < 12) return false;
  let sum = 0, alt = false;
  for (let i = n.length - 1; i >= 0; i--){ let d = +n[i]; if (alt){ d *= 2; if (d > 9) d -= 9; } sum += d; alt = !alt; }
  return sum % 10 === 0;
}
function formatNum(num){
  const n = digits(num);
  if (brandOf(n) === "amex") return [n.slice(0,4), n.slice(4,10), n.slice(10,15)].filter(Boolean).join(" ");
  return n.replace(/(.{4})/g, "$1 ").trim();
}
const last4 = (num) => digits(num).slice(-4);
function isExpired(c){
  if (!c || !c.expM || !c.expY) return false;
  const now = new Date();
  const y = +c.expY, m = +c.expM;
  return y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth() + 1);
}
const expStr = (c) => c.expM && c.expY ? `${String(c.expM).padStart(2,"0")}/${String(c.expY).slice(-2)}` : "--/--";
