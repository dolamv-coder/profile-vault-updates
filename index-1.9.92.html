/* -- package tracking: carriers, detection, links -- */
const CARRIERS = {
  ups:    {name:"UPS",    url:n => `https://www.ups.com/track?tracknum=${encodeURIComponent(n)}`},
  fedex:  {name:"FedEx",  url:n => `https://www.fedex.com/fedextrack/?trknbr=${encodeURIComponent(n)}`},
  usps:   {name:"USPS",   url:n => `https://tools.usps.com/go/TrackConfirmAction?tLabels=${encodeURIComponent(n)}`},
  dhl:    {name:"DHL",    url:n => `https://www.dhl.com/us-en/home/tracking/tracking-express.html?submit=1&tracking-id=${encodeURIComponent(n)}`},
  ontrac: {name:"OnTrac", url:n => `https://www.ontrac.com/tracking/?number=${encodeURIComponent(n)}`},
  amazon: {name:"Amazon", url:n => `https://track.amazon.com/tracking/${encodeURIComponent(n)}`},
  other:  {name:"Carrier",url:n => `https://www.google.com/search?q=${encodeURIComponent(n + " tracking")}`}
};
function detectCarrier(num, context){
  const n = String(num || "").toUpperCase().replace(/\s+/g, "");
  if (/^1Z[0-9A-Z]{16}$/.test(n)) return "ups";
  if (/^TBA\d{9,15}$/.test(n)) return "amazon";
  if (/^[A-Z]{2}\d{9}US$/.test(n)) return "usps";
  if (/^9[1-5]\d{18,24}$/.test(n) || /^420\d{5}9[1-5]\d{18,24}$/.test(n)) return "usps";
  if (/^[CD]\d{14}$/.test(n) || /^1LS[0-9A-Z]{10,}$/.test(n)) return "ontrac";
  const ctx = String(context || "").toLowerCase();
  if (/united\s+parcel|\bups\b/.test(ctx)) return "ups";
  if (/fed\s*ex|federal\s+express/.test(ctx)) return "fedex";
  if (/\busps\b|postal\s+service|u\.?s\.?\s+mail/.test(ctx)) return "usps";
  if (/\bdhl\b/.test(ctx)) return "dhl";
  if (/ontrac/.test(ctx)) return "ontrac";
  if (/^(\d{12}|\d{15}|\d{20}|\d{22})$/.test(n)) return "fedex";
  if (/^\d{10}$/.test(n)) return "dhl";
  return "other";
}
function trackingFromEmail(text){
  const t = String(text || "");
  const found = new Map();
  const add = (num, ctx) => {
    const n = String(num).toUpperCase().replace(/\s+/g, "");
    if (n.length < 10 || n.length > 34 || !/\d{4}/.test(n) || found.has(n)) return;
    found.set(n, {number:n, carrier:detectCarrier(n, ctx)});
  };
  const re = /track(?:ing)?\s*(?:number|no\.?|#|id)?\s*(?:is|:|#)?\s*[:#]?\s*([A-Z0-9]{10,34})/gi;
  let m;
  while ((m = re.exec(t))) add(m[1], t.slice(Math.max(0, m.index - 90), m.index + m[0].length + 20));
  // UPS numbers are unmistakable wherever they appear.
  (t.match(/\b1Z[0-9A-Z]{16}\b/gi) || []).forEach(n => add(n, "ups"));
  return Array.from(found.values());
}
const trackUrl = (tr) => (CARRIERS[tr.carrier] || CARRIERS.other).url(tr.number);
const carrierName = (tr) => (CARRIERS[tr.carrier] || CARRIERS.other).name;
function mergeTracking(o, list){
  if (!list || !list.length) return 0;
  const have = new Set((o.tracking || []).map(x => x.number));
  let added = 0;
  o.tracking = (o.tracking || []).slice();
  list.forEach(tr => { if (!have.has(tr.number)){ o.tracking.push(tr); have.add(tr.number); added++; } });
  return added;
}
// Product name from a shipping/status email (used to repair orders named after a SKU code).
function itemFromEmailText(text){
  const lines = String(text || "").split("\n").map(s => s.replace(/\|/g, " ").replace(/\[[^\]]*\]\([^)]*\)/g, "").replace(/\s+/g, " ").trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++){
    if (/^sku\b/i.test(lines[i]) || /\bqty\s*:/i.test(lines[i])){
      for (let j = i - 1; j >= Math.max(0, i - 3); j--){
        const ln = lines[j].replace(/^\[|\]$/g, "");
        if (ln.length > 8 && !/^[\d\s#:.-]+$/.test(ln) && !/order|summary|shipping|billing|details|address|^https?:/i.test(ln)) return ln.slice(0, 120);
      }
    }
  }
  return "";
}
const looksLikeCode = (s) => /^[\d\s#:.\-]{6,}$/.test(String(s || "").trim());

/* -- product photos from order emails -- */
// Where stores keep real product photos (vs. their banners and illustrations).
const PRODUCT_IMG = /(scene7\.com\/is\/image\/Target\/(GUEST_|\d{6,})|walmartimages\.com\/(asr|seo)\/|bbystatic\.com\/image2\/BestBuy_US\/images\/products|media-amazon\.com\/images\/I\/|images-amazon\.com\/images\/I\/|pokemoncenter[^"]*\/(products?|product-images?)\/)/i;
const DECOR_IMG = /(walmartimages\.com\/dfw\/|scene7\.com\/is\/image\/Target\/(?!GUEST_|\d{6,})|[?&]fmt=(gif|png)-alpha)/i;
const RETAIL_CDN = /(scene7\.com|walmartimages\.com|pokemoncenter|bbystatic\.com|media-amazon\.com|images-amazon\.com|costco|gamestop|samsclub)/i;
const GENERIC_ALT = /^(order|item|product|image|photo|view|shop|img|picture|\d+)?$/i;
const NAME_STOP = new Set(["order","orders","item","items","your","with","from","this","that","target","walmart","pack","each"]);
// Best product photo in an email for this item, or null.
function pickProductImage(images, item){
  const words = new Set((String(item || "").toLowerCase().match(/[a-z0-9]{4,}/g) || []).filter(w => !NAME_STOP.has(w)));
  let best = null, bestScore = 0;
  (images || []).forEach((im, i) => {
    if (DECOR_IMG.test(im.src)) return;
    const alt = String(im.alt || "").toLowerCase();
    let s = PRODUCT_IMG.test(im.src) ? 5 : RETAIL_CDN.test(im.src) ? 1 : 0;
    (alt.match(/[a-z0-9]{4,}/g) || []).forEach(w => { if (words.has(w)) s += 1; });
    s -= i * 0.05; // earlier photos are usually the first item in the order
    if (s > bestScore){ best = im; bestScore = s; }
  });
  return bestScore >= 2 ? best : null;
}
// Give an order a photo (and a real name when it only says "Order") from an email's images.
function applyEmailImage(o, images){
  if (!o || o.image) return false;
  const im = pickProductImage(images, o.item);
  if (!im) return false;
  o.image = im.src;
  const alt = String(im.alt || "").trim();
  if ((!o.item || /^order$/i.test(o.item) || looksLikeCode(o.item)) && alt.length >= 6 && !GENERIC_ALT.test(alt)) o.item = alt;
  o.updatedAt = Date.now();
  return true;
}
function orderThumb(o){
  if (!o.image) return storeMark(o);
  return `<span class="othumb"><img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('is-broken')">${storeMark(o)}</span>`;
}

/* -- order status updates from email (canceled / shipped / arriving / delivered) -- */
const STAGE_RANK = {placed:0, shipped:1, arriving:2, delivered:3, canceled:3};
function statusFromEmail(subject, text){
  const subj = String(subject || "");
  const head = String(text || "").slice(0, 3000);
  const both = subj + "\n" + head;
  // Order confirmations are handled elsewhere; this only reads status changes.
  if (/cancel(l?ed|lation)|has\s+been\s+cancel|we\s+(had|have)\s+to\s+cancel|couldn'?t\s+be\s+processed/i.test(subj) || /(order|item\(s\)|items?)\s+[^.\n]{0,60}(has|have)\s+been\s+cancel/i.test(head)) return "canceled";
  // "Items have arrived from order #…" (Target) is a delivery notice, not a new order.
  if (/\bdelivered\b|was\s+delivered|has\s+been\s+delivered|ha(ve|s)\s+arrived|\barrived\s+(from|at|to)\b/i.test(subj)) return "delivered";
  if (/out\s+for\s+delivery|arriv(es|ing)\s+(today|tomorrow)/i.test(subj)) return "arriving";
  if (/\bshipped\b|has\s+shipped|on\s+(its|the)\s+way|shipping\s+confirm|about\s+to\s+ship|ready\s+to\s+ship|label\s+(has\s+been\s+)?created|shipment/i.test(subj)) return "shipped";
  return null;
}
/* -- dates from email text -- */
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const monNum = (s) => MONTHS[String(s || "").toLowerCase().slice(0, 4)] || MONTHS[String(s || "").toLowerCase().slice(0, 3)] || 0;
const pad2 = (n) => String(n).padStart(2, "0");
// The original send time inside a forwarded email, e.g. Outlook's
// "Sent: Thursday, September 24, 2026 8:51:25 PM (UTC+07:00) Bangkok…". Needs the UTC offset.
function originalSent(text){
  const m = String(text || "").slice(0, 4000).match(/(?:^|\n)\s*(?:Sent|Date):\s*(?:[A-Za-z]+,?\s+)?([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})(?:,?\s+at)?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?\s*(?:\(\s*(?:UTC|GMT)\s*([+-])(\d{1,2}):?(\d{2})\s*\)|(?:UTC|GMT)\s*([+-])(\d{1,2}):?(\d{2}))/);
  if (!m) return "";
  const mo = monNum(m[1]); if (!mo) return "";
  let h = +m[4]; const ap = (m[7] || "").toUpperCase();
  if (ap === "PM" && h < 12) h += 12; if (ap === "AM" && h === 12) h = 0;
  const sign = m[8] || m[11], oh = m[9] || m[12], om = m[10] || m[13];
  const d = new Date(`${m[3]}-${pad2(mo)}-${pad2(m[2])}T${pad2(h)}:${m[5]}:${m[6] || "00"}${sign}${pad2(oh)}:${om}`);
  return isNaN(d) ? "" : d.toISOString();
}
// When an email was really sent: the original time for forwards, else the email's own time.
const emailTime = (e) => originalSent(e.text) || (e.date && !isNaN(new Date(e.date)) ? new Date(e.date).toISOString() : "");
// The delivery date the store reports from the carrier, e.g. Target's "Delivered on Thu, Sep 24, 2026".
// Returns "YYYY-MM-DD", or a full time when the email gives one ("… at 2:41 PM").
function deliveredOnFrom(text){
  const m = String(text || "").match(/delivered\s+(?:on\s+)?(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+)?([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})(?:,?\s+(?:at\s+)?(\d{1,2}):(\d{2})\s*([ap])\.?\s*m\.?)?/i);
  if (!m) return "";
  const mo = monNum(m[1]); if (!mo || +m[2] < 1 || +m[2] > 31) return "";
  const date = `${m[3]}-${pad2(mo)}-${pad2(m[2])}`;
  if (!m[4]) return date;
  let h = +m[4]; const ap = m[6].toLowerCase();
  if (ap === "p" && h < 12) h += 12; if (ap === "a" && h === 12) h = 0;
  return new Date(+m[3], mo - 1, +m[2], h, +m[5]).toISOString();
}
function orderNoFrom(text){
  const m = String(text || "").match(/order\s*(?:#|no\.?|number|id)?\s*[:#]?\s*#?\s*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9\-]{5,25})/i);
  if (!m) return "";
  // Some emails glue the next word on: "#912003773992809are" -> 912003773992809
  return m[1].trim().toUpperCase().replace(/^(\d{8,})[A-Z]+$/, "$1");
}
// Apply status emails to orders already in the tracker. Never downgrades
// (a delivered order stays delivered), and never creates orders from them.
function applyStatusEmails(emails){
  const byNo = new Map();
  (S.orders || []).forEach(o => { if (o.orderNo) byNo.set(String(o.orderNo).toUpperCase(), o); });
  const changed = {canceled:0, shipped:0, arriving:0, delivered:0}; let unmatched = 0;
  const canceledNow = [];   // orders this batch of emails turned to Canceled (for alerts)
  const sorted = (emails || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  for (const e of sorted){
    const stage = statusFromEmail(e.subject, e.text);
    if (!stage) continue;
    const no = orderNoFrom([e.subject, e.text].join("\n"));
    const o = no && byNo.get(no);
    if (!o){ unmatched++; continue; }
    // Remember when each step happened. Forwarded emails use the original send time inside the
    // forward. For delivery, the date the store reports from the carrier ("Delivered on Thu, Sep 24")
    // wins over any email time.
    const sent = emailTime(e);
    o.dates = o.dates || {};
    if (stage === "delivered"){
      const said = deliveredOnFrom([e.subject, e.text].join("\n"));
      if (said){ if (o.dates.delivered !== said || o.dates.deliveredSrc !== "store"){ o.dates.delivered = said; o.dates.deliveredSrc = "store"; o.updatedAt = Date.now(); } }
      else if (sent && o.dates.deliveredSrc !== "store" && (!o.dates.delivered || sent < o.dates.delivered)){ o.dates.delivered = sent; o.dates.deliveredSrc = "email"; o.updatedAt = Date.now(); }
      // Also keep when the store sent its delivery email (earliest), shown as the store's email time.
      if (said && sent && (!o.dates.deliveredReported || sent < o.dates.deliveredReported)){ o.dates.deliveredReported = sent; o.updatedAt = Date.now(); }
    } else if (sent && (!o.dates[stage] || sent < o.dates[stage])){ o.dates[stage] = sent; o.updatedAt = Date.now(); }
    if (mergeTracking(o, trackingFromEmail(e.text))) { changed.tracking = (changed.tracking || 0) + 1; o.updatedAt = Date.now(); }
    if (looksLikeCode(o.item)){ const nm = itemFromEmailText(e.text); if (nm){ o.item = nm; o.updatedAt = Date.now(); } }
    const cur = o.stage || "placed";
    if (cur === stage) continue;
    if (cur === "delivered" || (cur === "canceled" && stage !== "delivered")) continue;
    if (stage !== "canceled" && STAGE_RANK[stage] < STAGE_RANK[cur]) continue;
    o.stage = stage; o.statusAt = String(e.date || "").slice(0, 10); o.updatedAt = Date.now();
    if (stage === "canceled") canceledNow.push(o);
    changed[stage]++;
  }
  const tracking = changed.tracking || 0; delete changed.tracking;
  return {changed, unmatched, tracking, canceledNow, total:Object.values(changed).reduce((a, b) => a + b, 0)};
}

// Subjects of true order confirmations (sent when the order is placed).
const CONFIRM_SUBJ = /(thanks?\s+for\s+(shopping|your\s+(order|purchase))|thank\s+you\s+for\s+(your\s+order|shopping|your\s+purchase|placing)|here'?s\s+your\s+order|order\s+confirm|we('|’)?ve\s+(got|received)\s+your\s+order|order\s+(has\s+been\s+)?(placed|received))/i;
// Fix orders first seen from a later email (e.g. "Items have arrived"): the confirmation
// sets the real order date and fills in the price and details that email didn't have.
function repairFromConfirmations(rows){
  const byKey = new Map((S.orders || []).filter(o => o.orderNo).map(o => [o.store + "|" + String(o.orderNo).toUpperCase(), o]));
  let fixed = 0;
  rows.forEach(r => {
    if (!r.orderNo) return;
    const o = byKey.get((r.store || "") + "|" + String(r.orderNo).toUpperCase());
    if (!o) return;
    // Any order email with the delivery address fills it in when the order doesn't have one.
    if (!o.shipAddr && r.shipAddr){ o.shipAddr = r.shipAddr; o.updatedAt = Date.now(); }
    if (!r.confirm) return;
    let changed = false;
    if (r.at && (!o.at || r.at < o.at)){ o.at = r.at; changed = true; }
    ["total", "priceEach", "shipTo", "card", "arrives", "buyer"].forEach(k => { if (!o[k] && r[k]){ o[k] = r[k]; changed = true; } });
    if (r.item && (!o.item || /^order$/i.test(o.item) || looksLikeCode(o.item))){ o.item = r.item; changed = true; }
    if (changed){ o.updatedAt = Date.now(); fixed++; }
  });
  return fixed;
}
// The address a store's email went to (its To line): a Hide My Email alias, or one address of a
// catch-all domain, rather than the inbox's own when there's another. Orders keep it as `sentTo`
// (1.9.69+), which is how order alerts find the account an order was placed on.
function recipientOf(to, own){
  const all = String(to || "").toLowerCase().match(/[a-z0-9._%+'-]+@[a-z0-9.-]+\.[a-z]{2,}/g) || [];
  return all.find(a => a !== String(own || "").toLowerCase()) || all[0] || "";
}
function emailsToRows(emails, inbox){
  const rows = [];
  (emails || []).forEach((e, i) => {
    if (statusFromEmail(e.subject, e.text)) return;
    const r = parseOrderEmail([e.subject, e.from, e.text].join("\n"));
    if (!r) return;
    const im = pickProductImage(e.images, r.item);
    // The order date in local time, from the original send time for forwarded emails
    // (the email's timestamp is UTC; late-evening orders would otherwise land on the next day).
    const sentIso = emailTime(e), when = sentIso ? new Date(sentIso) : null;
    rows.push(Object.assign(r, { line:i+1, sentTo:recipientOf(e.to, inbox.email), at:when && !isNaN(when) ? `${when.getFullYear()}-${String(when.getMonth()+1).padStart(2,"0")}-${String(when.getDate()).padStart(2,"0")}` : todayISO(), buyer:r.buyer || "", inboxEmail:inbox.email,image:im ? im.src : "", imageAlt:im ? im.alt : "",
      confirm:CONFIRM_SUBJ.test(e.subject || "") }));
  });
  return rows;
}

async function syncOneInbox(inbox, quiet){
  if (!DESK || !inbox || SYNCING.has(inbox.id)) return {added:0};
  if (!inbox.password){ if (!quiet) toast(`Add the app password for ${inbox.email} first.`, "err"); return {added:0}; }
  const syncViews = () => { if (UI.view === "settings-view" || UI.view === "orders") renderMain(); };
  SYNCING.set(inbox.id, "Connecting…"); syncViews();
  // First sync looks back 90 days; after that, just since the last one (plus a margin).
  // Also look back 90 days once to label existing orders with the inbox they came from.
  const statusEngine = (window.pvDesktop && window.pvDesktop.version >= 4);
  const imageEngine = (window.pvDesktop && window.pvDesktop.version >= 6);
  // confirmFixed: one 90-day pass to fix order dates/prices from their confirmations.
  const needsBackfill = !inbox.inboxTagged || !inbox.confirmFixed || !inbox.addrBackfilled || !inbox.datesV4 || (imageEngine && !inbox.imagesBackfilled) || (statusEngine && (!inbox.statusBackfilled || !inbox.trackingBackfilled));
  const days = inbox.lastSync && !needsBackfill ? Math.min(90, Math.ceil((Date.now() - inbox.lastSync) / 86400000) + 3) : 90;
  // Move verified order emails out of Spam first (the sync reads Spam either way).
  let rescued = 0;
  if (window.pvDesktop.rescueSpam && S.settings.rescueSpam !== false){
    try { const rr = await window.pvDesktop.rescueSpam({id:inbox.id, email:inbox.email, password:inbox.password, host:inbox.host, port:inbox.port, days:Math.max(days, 7)}); if (rr && rr.ok) rescued = rr.moved || 0; } catch(e){}
  }
  let res;
  try { res = await window.pvDesktop.syncInbox({id:inbox.id, email:inbox.email, password:inbox.password, host:inbox.host, port:inbox.port, days}); }
  catch(e){ res = {ok:false, error:"The sync stopped unexpectedly."}; }
  SYNCING.delete(inbox.id);
  const live = inboxById(inbox.id) || inbox;
  if (!res.ok){
    live.syncError = res.error; persist();
    syncViews();
    if (!quiet){ const me = mailError(inbox.provider, res.error, inbox.email), t = me.short || me.text; toast(t.includes(inbox.email) ? t : `${inbox.email}: ${t}`, "err"); }
    return {added:0, error:res.error};
  }
  const rows = emailsToRows(res.emails, inbox);
  const plan = planOrderImport(rows, {skipDeleted:true});
  if (plan.add.length) S.orders.push(...plan.add);
  const repaired = repairFromConfirmations(rows);
  live.confirmFixed = true; live.addrBackfilled = true; live.datesV4 = true;
  const st = applyStatusEmails(res.emails);
  // Label orders that don't know their inbox yet (added before this was tracked).
  const byNo = new Map((S.orders || []).filter(o => o.orderNo && !o.inbox).map(o => [String(o.orderNo).toUpperCase(), o]));
  if (byNo.size) (res.emails || []).forEach(e => { const o = byNo.get(orderNoFrom([e.subject, e.text].join("\n"))); if (o) o.inbox = inbox.email; });
  live.inboxTagged = true;
  // And the address the store wrote to, for orders added before that was kept (1.9.69).
  const noTo = new Map((S.orders || []).filter(o => o.orderNo && !o.sentTo && o.inbox === inbox.email).map(o => [String(o.orderNo).toUpperCase(), o]));
  if (noTo.size) (res.emails || []).forEach(e => { const o = noTo.get(orderNoFrom([e.subject, e.text].join("\n"))), to = o && recipientOf(e.to, inbox.email); if (to) o.sentTo = to; });

  const noImg = new Map((S.orders || []).filter(o => o.orderNo && !o.image).map(o => [String(o.orderNo).toUpperCase(), o]));
  if (noImg.size) (res.emails || []).forEach(e => {
    if (!e.images || !e.images.length) return;

  if (statusEngine){ live.statusBackfilled = true; live.trackingBackfilled = true; }
  live.lastResult = {scanned:res.scanned, found:rows.length, added:plan.add.length, updated:st.total};
  persist(); render();
  runAlerts();   // new cancellations or stuck orders from this sync
  reportOrderAlerts();   // orders on accounts given to buyers (Order alerts for buyers)
  const bits = [];
  if (plan.add.length) bits.push(plural(plan.add.length, "new order"));
  if (st.changed.canceled) bits.push(`${st.changed.canceled} canceled`);
  if (st.changed.shipped) bits.push(`${st.changed.shipped} shipped`);
  if (st.changed.arriving) bits.push(`${st.changed.arriving} arriving`);
  if (st.changed.delivered) bits.push(`${st.changed.delivered} delivered`);
  if (st.tracking) bits.push(`tracking for ${plural(st.tracking, "order")}`);
  if (pictured) bits.push(`photos for ${plural(pictured, "order")}`);
  if (repaired) bits.push(`fixed dates and prices for ${plural(repaired, "order")}`);
  if (rescued) bits.push(`moved ${plural(rescued, "order email")} out of Spam`);
  if (!quiet || bits.length) toast(bits.length ? `${inbox.email}: ${bits.join(", ")}` : `${inbox.email}: up to date`);

/* ================= PHONE TRACKER (encrypted relay) ================= */
// After each change, the orders (and only the orders) are encrypted with a key made
// from the phone passcode and uploaded to your relay. The relay can't read them;
// the phone page decrypts them. Settings live in S.settings.phone, inside the vault.
const PHONE_ITER = 310000;
const phB64u = (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const phB64s = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };

// The relay moved when the app became Orbit; trackers set up on the old address follow it.
const OLD_RELAYS = ["https://profile-vault-orders.profile-vault-phone-relay.workers.dev"];
const phoneCfg = () => {
  const c = (S && S.settings && S.settings.phone) || null;
  if (c && OLD_RELAYS.includes(String(c.url || "").replace(/\/+$/, ""))){ c.url = PHONE_RELAY; c.lastHash = ""; }
  return c;
};
const phoneLink = (c) => c ? c.url.replace(/\/+$/, "") + "/#" + c.id : "";
function phoneSnapshot(){

  return {v:1, sentAt:Date.now(), done:(c.doneCmds || []), canClean:CAN_CLEAN && (S.inboxes || []).some(i => i.password), clean:c.lastClean || null, orders:(S.orders || []).slice().sort((a, b) => (b.at || "").localeCompare(a.at || "") || (b.createdAt || 0) - (a.createdAt || 0)).map(o => {
    const name = storeLabel(o), bg = tintOf(o);
    return {
      id:o.id, item:o.item || "Order", orderNo:o.orderNo || "", store:orderStoreLabel(o), storeKey:storeKeyOf(o),
      initials:name.replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""),
      bg, fg:/^#(FFE000|FFD100)$/i.test(bg) ? "#000" : "#fff",
      qty:+o.qty || 1, total:o.total ? fmtMoney(orderMoney(o.total)) : "", totalNum:orderMoney(o.total) || 0,
      at:o.at || "", arrives:o.arrives || "", shipTo:o.shipTo || "", shipAddr:o.shipAddr || "", card:o.card || "",
      shippedAt:(o.dates && o.dates.shipped) || "", deliveredAt:(o.dates && o.dates.delivered) || ((o.stage === "delivered" && o.statusAt) || ""),
      deliveredApprox:!!(o.dates && o.dates.delivered && o.dates.deliveredSrc === "email"),
      deliveredReported:(o.dates && o.dates.deliveredSrc === "store" && o.dates.deliveredReported) || "",
      attention:(orderStuck(o) || {}).text || (recentlyCanceled(o) ? "Canceled recently" : ""),
      stage:o.stage || "placed", stageLabel:stageLabel(o.stage || "placed"), image:o.image || "", inbox:o.inbox || "",
      tracking:(o.tracking || []).map(t => ({carrier:carrierName(t), number:t.number, url:trackUrl(t)}))
    };

}
async function phoneKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:phB64d(salt), iterations:PHONE_ITER, hash:"SHA-256"}, base, 256));
}
let phoneTimer = null, phoneBusy = false;
// The built-in relay everyone can use with their license key. Advanced users can run their own.
const PHONE_RELAY = "https://orders.orbit-app.workers.dev";
// Upload pass: your own relay's write token, or this app's license key for the built-in relay.
const phoneAuth = (c) => c.token || ((licRead() || {}).key || "");
function schedulePhonePush(){
  const c = phoneCfg(); if (!c || !c.key || !DESK) return;
  // At most one upload every 30 seconds, a few seconds after the last change.
  const wait = Math.max(4000, 30000 - (Date.now() - (c.lastSent || 0)));
  clearTimeout(phoneTimer); phoneTimer = setTimeout(() => pushPhone(false), wait);
}
// Sends the encrypted snapshot. Skips when nothing changed unless forced.
async function pushPhone(force){
  const c = phoneCfg(); if (!c || !c.key || phoneBusy) return {ok:false};
  phoneBusy = true;
  try {
    const snap = phoneSnapshot();
    const plain = new TextEncoder().encode(JSON.stringify(Object.assign({}, snap, {sentAt:0})));
    const hash = phB64s(new Uint8Array(await crypto.subtle.digest("SHA-256", plain)));
    if (!force && hash === c.lastHash) return {ok:true, same:true};
    const key = await crypto.subtle.importKey("raw", phB64d(c.key), "AES-GCM", false, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(snap))));
    const r = await fetch(c.url.replace(/\/+$/, "") + "/s/" + c.id, {method:"PUT", headers:{"content-type":"application/json", authorization:"Bearer " + phoneAuth(c)},
      body:JSON.stringify({v:1, iter:PHONE_ITER, salt:c.salt, iv:phB64s(iv), ct:phB64s(ct)})});
    if (!r.ok) throw new Error(r.status === 401 ? (c.token ? "The relay didn't accept the write token." : "The relay didn't accept this app's license key.")
      : r.status === 403 ? "That phone link belongs to someone else. Turn the tracker off and on again." : "The relay answered " + r.status + ".");
    const live = phoneCfg(); if (live){ live.lastHash = hash; live.lastSent = Date.now(); live.lastError = ""; live.count = snap.orders.length; }
    persistQuiet();
    return {ok:true};
  } catch(e){
    const live = phoneCfg(); if (live){ live.lastError = String(e && e.message || e).slice(0, 160); persistQuiet(); }
    return {ok:false, error:String(e && e.message || e)};
  } finally {
    phoneBusy = false;
    if (UI.view === "settings-view"){ const box = $("#s-phone"); if (box) box.innerHTML = phoneSectionHTML(); }
  }
}
// Requests the phone left on the relay (delete these orders, clean emails), encrypted with the phone key.
// Checked every 2 minutes while FAFO is open. Handled ones are listed in the next snapshot,
// so the phone knows the result (deleted, or back again after an Undo here).
async function pullPhoneRequests(){
  const c = phoneCfg(); if (!c || !c.key || !c.id || !DESK) return;
  const base = c.url.replace(/\/+$/, "") + "/cmd/" + c.id, auth = {authorization:"Bearer " + phoneAuth(c)};
  let cmds = [];
  try { const r = await fetch(base, {headers:auth, cache:"no-store"}); if (!r.ok) return; cmds = (await r.json()).cmds || []; } catch(e){ return; }
  if (!cmds.length) return;
  const key = await crypto.subtle.importKey("raw", phB64d(c.key), "AES-GCM", false, ["decrypt"]);
  const del = new Set(), done = [], clean = [], handled = new Set(c.doneCmds || []);
  for (const m of cmds){
    if (phoneCleaning.has(m.cid)) continue;   // its Clean emails pass is still running
    // Already handled, but the relay didn't hear back: just clear it (never delete again after an Undo).
    if (handled.has(m.cid)){ done.push(m.cid); continue; }
    try {
      const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:phB64d(m.iv), additionalData:new TextEncoder().encode("orbit-cmd:" + c.id)}, key, phB64d(m.ct))));
      if (p && p.v === 1 && p.op === "clean"){ clean.push(m.cid); continue; }
      if (p && p.v === 1 && p.op === "delete" && Array.isArray(p.ids)) p.ids.slice(0, 1000).forEach(id => del.add(String(id)));
    } catch(e){ /* not made with this phone's key (or an old passcode): ignore */ }
    done.push(m.cid);
  }
  if (clean.length) phoneClean(clean, base, auth);
  if (!done.length) return;
  const gone = del.size ? forgetOrders(del) : [];
  const live = phoneCfg(); if (live) live.doneCmds = Array.from(new Set((live.doneCmds || []).concat(done))).slice(-50);
  persist();   // also sends the phone a fresh snapshot
  if (gone.length){ render(); toast(`Deleted ${plural(gone.length, "order")} from your phone`, "", {label:"Undo", run:() => restoreOrders(gone)}); }
  try { await fetch(base, {method:"DELETE", headers:Object.assign({"content-type":"application/json"}, auth), body:JSON.stringify({cids:done})}); } catch(e){}
}
// "Clean emails" from the phone: one clean pass, the same as auto-clean's. The request stays on
// the relay until the pass ends, so one cut short by closing FAFO runs again next time.
// Several taps waiting together run once.
const phoneCleaning = new Set();
async function phoneClean(cids, base, auth){
  cids.forEach(id => phoneCleaning.add(id));
  let res;
  try { res = await runAutoClean(true); } catch(e){ res = null; }
  // Locked meanwhile, or another clean was running: leave the request on the relay for the next check.
  if (!S || (res && res.busy)){ cids.forEach(id => phoneCleaning.delete(id)); return; }
  res = res || {moved:0, error:"Clean emails stopped unexpectedly."};
  const live = phoneCfg();
  if (live){ live.doneCmds = Array.from(new Set((live.doneCmds || []).concat(cids))).slice(-50); live.lastClean = {at:Date.now(), moved:res.moved || 0, error:res.error || ""}; }
  persist();   // sends the phone the result
  try { await fetch(base, {method:"DELETE", headers:Object.assign({"content-type":"application/json"}, auth), body:JSON.stringify({cids})}); } catch(e){}
  cids.forEach(id => phoneCleaning.delete(id));
}
let phoneReqTimer = null;
function schedulePhoneRequests(){
  clearInterval(phoneReqTimer);
  setTimeout(() => { if (S) pullPhoneRequests(); }, 20000);
  phoneReqTimer = setInterval(() => { if (S) pullPhoneRequests(); }, 2 * 60 * 1000);
}
// Save the vault without scheduling another phone push (avoids a loop).
function persistQuiet(){ const t = phoneTimer; persist(); clearTimeout(phoneTimer); phoneTimer = t && null; }

/* -- phone push alerts: encrypted here (RFC 8291 "aes128gcm"), the relay only forwards -- */
const phB64urlDec = (s) => { s = String(s || "").replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const phConcat = (...parts) => { const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let i = 0; parts.forEach(p => { out.set(p, i); i += p.length; }); return out; };
async function phHkdf(salt, ikm, info, len){
  const k = await crypto.subtle.importKey("raw", ikm, "HKDF", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"HKDF", hash:"SHA-256", salt, info}, k, len * 8));
}
// Encrypts a push message for one phone subscription (its p256dh key and auth secret).
async function webPushEncrypt(plain, uaPubB64, authB64, test){
  const enc = new TextEncoder(), uaPub = phB64urlDec(uaPubB64), authSecret = phB64urlDec(authB64);
  const as = test ? test.as : await crypto.subtle.generateKey({name:"ECDH", namedCurve:"P-256"}, true, ["deriveBits"]);
  const asPub = new Uint8Array(await crypto.subtle.exportKey("raw", as.publicKey));
  const uaKey = await crypto.subtle.importKey("raw", uaPub, {name:"ECDH", namedCurve:"P-256"}, false, []);
  const ecdh = new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH", public:uaKey}, as.privateKey, 256));
  const ikm = await phHkdf(authSecret, ecdh, phConcat(enc.encode("WebPush: info\0"), uaPub, asPub), 32);
  const salt = test ? test.salt : crypto.getRandomValues(new Uint8Array(16));
  const cek = await phHkdf(salt, ikm, enc.encode("Content-Encoding: aes128gcm\0"), 16);
  const nonce = await phHkdf(salt, ikm, enc.encode("Content-Encoding: nonce\0"), 12);
  const key = await crypto.subtle.importKey("raw", cek, "AES-GCM", false, ["encrypt"]);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv:nonce}, key, phConcat(plain, new Uint8Array([2]))));
  const header = new Uint8Array(21 + asPub.length);
  header.set(salt, 0); new DataView(header.buffer).setUint32(16, 4096); header[20] = asPub.length; header.set(asPub, 21);
  return phConcat(header, ct);
}
// Sends an alert to every phone that turned on alerts for this tracker.
async function phoneAlert(title, body, tag){
  const c = phoneCfg(); if (!c || !c.key || !DESK) return;
  const base = c.url.replace(/\/+$/, "") + "/push/" + c.id, auth = {authorization:"Bearer " + phoneAuth(c)};
  const r = await fetch(base + "/subs", {headers:auth, cache:"no-store"}); if (!r.ok) return;
  const subs = ((await r.json()) || {}).subs || []; if (!subs.length) return;
  const payload = new TextEncoder().encode(JSON.stringify({title, body, tag}));
  const sends = [];
  for (const s of subs){ try { sends.push({endpoint:s.endpoint, body:phB64s(await webPushEncrypt(payload, s.keys.p256dh, s.keys.auth))}); } catch(e){} }
  if (sends.length) await fetch(base + "/send", {method:"POST", headers:Object.assign({"content-type":"application/json"}, auth), body:JSON.stringify({sends})});
}

/* ================= LICENSE (desktop app) ================= */
// Keys come from two places, each with its own signed list of SHA-256 hashes of valid keys:
//  "gh":   made by hand with tools/license.mjs (which holds the private key), list on GitHub.
//  "auto": handed out by the license worker after "Continue with Discord" (license-worker/),
//          list served and signed by that worker with its own key.
// A key is accepted only if its list's signature checks out and its hash is on it.
const LICENSE_PUB = {kty:"EC", crv:"P-256", x:"GjzaSqmKaFThaxR29wozcPQcaifNz3hZKgzGK9fWNec", y:"v1TXigdCJwtUiUgGUvt9BR6p_mTC3Bk-gy9u6u_bEmk"};
const LICENSE_URL = "https://raw.githubusercontent.com/dolamv-coder/profile-vault-updates/main/licenses.json";
const LICENSE_RELAY = "https://orbit-license.orbit-app.workers.dev";
const LICENSE_AUTO_PUB = {kty:"EC", crv:"P-256", x:"4-1tu110ZgnQKKy0OahdM4YG9iYsqVULnPeYE4PgrJ0", y:"ihcZ1WTUYiiGZbjhX2NNWywmLsuhMohrw1MRqTTpgzM"};
const LIC_SOURCES = {gh:{url:LICENSE_URL, pub:LICENSE_PUB}, auto:{url:LICENSE_RELAY + "/licenses", pub:LICENSE_AUTO_PUB}};
const LICENSE_GRACE_DAYS = 30;   // works offline this long after the last successful check
const LIC_STORE = "pv-license";
const licNorm = (k) => String(k || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const licFormat = (k) => { const n = licNorm(k); return /^PVLT[A-Z0-9]{16}$/.test(n) ? "PVLT-" + n.slice(4).match(/.{4}/g).join("-") : String(k || "").trim().toUpperCase(); };
function licRead(){ try { return JSON.parse(localStorage.getItem(LIC_STORE) || "null"); } catch(e){ return null; } }
function licWrite(v){ try { if (v) localStorage.setItem(LIC_STORE, JSON.stringify(v)); else localStorage.removeItem(LIC_STORE); } catch(e){} stopKeyRequest(); }
async function licHash(k){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("pvlt:" + licNorm(k)));
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}
const LIC_KEY_OBJ = {};
async function licVerify(list, src = "gh"){
  try {
    if (!LIC_SOURCES[src] || !list || typeof list.body !== "string" || typeof list.sig !== "string") return null;
    LIC_KEY_OBJ[src] = LIC_KEY_OBJ[src] || await crypto.subtle.importKey("jwk", LIC_SOURCES[src].pub, {name:"ECDSA", namedCurve:"P-256"}, false, ["verify"]);
    const sig = Uint8Array.from(atob(list.sig), c => c.charCodeAt(0));
    const ok = await crypto.subtle.verify({name:"ECDSA", hash:"SHA-256"}, LIC_KEY_OBJ[src], sig, new TextEncoder().encode(list.body));
    return ok ? JSON.parse(list.body) : null;
  } catch(e){ return null; }
}
// 1.9.83+: the GitHub list also comes through FAFO's license server (/mirror/licenses.json, fetched from GitHub
// there), for networks that block raw.githubusercontent.com: security filters often do, since anyone can host
// files on it. It's the same signed file, so the copy can't change it. GitHub's is tried first; a copy that
// doesn't arrive or whose signature doesn't check out moves on to the next.
const LICENSE_MIRROR = LICENSE_RELAY + "/mirror/licenses.json";
async function licFetch(src = "gh"){
  const urls = src === "gh" ? [LICENSE_URL, LICENSE_MIRROR] : [LIC_SOURCES[src].url];
  let err;
  for (let i = 0; i < urls.length; i++){
    try {
      const r = await fetch(urls[i] + "?t=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      if (i < urls.length - 1 && !(await licVerify(j, src))) throw new Error("The license list's signature didn't check out");
      return j;
    } catch(e){ err = e; }
  }
  throw err;
}
// {st:"ok"|"off"|"expired"|"bad", exp, issued}
async function licCheck(key, list, src = "gh"){
  const body = await licVerify(list, src);
  if (!body) return {st:"bad"};
  const h = await licHash(key);
  const e = (body.keys || []).find(x => x.h === h);
  if (!e) return {st:"off", issued:body.issued};
  if (e.exp && new Date(e.exp) < new Date()) return {st:"expired", exp:e.exp, issued:body.issued};
  return {st:"ok", exp:e.exp || "", issued:body.issued};
}
const licMsg = (st) => st === "expired" ? "This license key has expired. Contact the seller to renew it."
  : st === "off" ? "This license key isn't active anymore. Contact the seller for help."
  : "FAFO couldn't verify its license list. Try again in a moment.";

// Runs before the lock screen. Resolves true when the app may open.
async function licenseGate(){
  if (!DESK || !(window.crypto && crypto.subtle)) return true;
  const L = licRead();
  if (!L || !L.key){ renderLicense(); return false; }
  const src = L.src || "gh";
  const cached = L.list ? await licCheck(L.key, L.list, src) : {st:"bad"};
  const fresh = Date.now() - (L.checkedAt || 0) < LICENSE_GRACE_DAYS * 86400000;
  if (cached.st === "ok" && fresh){ licRefresh(); return true; }
  // The saved key is kept no matter what; only a key that was turned off or
  // expired asks for a new one. Anything else (offline, a bad download) retries.
  let r, list = null;
  try { list = await licFetch(src); r = await licCheck(L.key, list, src); } catch(e){ r = {st:"offline"}; }
  // A cached copy older than what we already trust can't turn a key off.
  if ((r.st === "off" || r.st === "expired") && cached.st === "ok" && r.issued && cached.issued && r.issued < cached.issued) r = {st:"offline"};
  if (r.st === "ok"){ licWrite(Object.assign(L, {list, checkedAt:Date.now(), exp:r.exp || ""})); return true; }
  if (r.st === "off" || r.st === "expired"){ renderLicense(licMsg(r.st)); return false; }
  renderLicenseRetry(r.st === "offline" ? "Connect to the internet so FAFO can confirm your license." : licMsg("bad"));
  return false;
}

// Background re-check (on unlock and every 6 hours). Locks the app if the key was turned off.
async function licRefresh(){
  const L = licRead(); if (!DESK || !L || !L.key) return;
  const src = L.src || "gh";
  let list; try { list = await licFetch(src); } catch(e){ return; }
  const r = await licCheck(L.key, list, src);
  if (r.st === "bad") return;
  // Ignore a list older than the one we already trust (stale cache or a replayed file).
  const old = L.list ? await licVerify(L.list, src) : null;
  if (old && r.issued && old.issued && r.issued < old.issued) return;
  licWrite(Object.assign(L, {list, checkedAt:Date.now(), exp:r.exp || ""}));
  if (r.st !== "ok"){ S = null; KEY = null; renderLicense(licMsg(r.st)); }
}

// One wait for a Discord key at a time: each watch() takes the next number, and an older
// wait that's in the middle of a check when a newer one starts stops by itself.
let keyReqPoll = null, keyReqGen = 0;
// Any license being saved or removed ends a wait that's still going (and forgets it).
function stopKeyRequest(){ keyReqGen++; clearTimeout(keyReqPoll); try { localStorage.removeItem("orbit-keyreq"); } catch(e){} }
async function keyRequestBox(){
  const box = $("#lic-discord"); if (!box) return;

  go.hidden = !ready;
  const say = (t, tone) => { msg.textContent = t; msg.classList.toggle("is-ok", tone === "ok"); msg.classList.toggle("is-err", tone === "err"); };

    const key = licFormat(s.key), c = await licCheck(key, s.list, "auto");

  // the seller's decision. The app may be closed and reopened meanwhile.
  const reviewText = "Request sent. Waiting for the seller to approve it. FAFO activates by itself once it's approved, so you can close it and come back later.";

    clearTimeout(keyReqPoll);
    say(review ? reviewText : "Finish signing in with Discord in your browser…");

    const tick = async () => {
      if (gen !== keyReqGen || !$("#lic-dc-msg")) return;
      if (Date.now() - started > (review ? REVIEW_WAIT : SIGNIN_WAIT)){
        try { localStorage.removeItem("orbit-keyreq"); } catch(e){}

      }

      if (s.status === "issued") activate(s);

}

const SYNC_ERR = {

async function syncInfo(lic){

// "Fill it in with Discord": the same sign-in that hands out keys gives a Discord account its key back.
async function discordKeyFill(panel, onKey){
  const box = $("#ss-dc", panel); if (!box) return;
  let ready = false;
  try { const r = await fetch(LICENSE_RELAY + "/discord/ready", {cache:"no-store"}); ready = r.ok && !!(await r.json()).ready; } catch(e){}
  if (!ready || !box.isConnected) return;
  box.hidden = false;
  const msg = $("#ss-dc-msg", panel), btn = $("#ss-dc-go", panel);
  const say = (t, tone) => { msg.textContent = t; msg.classList.toggle("is-ok", tone === "ok"); msg.classList.toggle("is-err", tone === "err"); };
  let gen = 0;
  btn.addEventListener("click", () => {
    const r = phB64u(crypto.getRandomValues(new Uint8Array(18))), started = Date.now(), my = ++gen;
    window.open(LICENSE_RELAY + "/discord/start?r=" + r, "_blank", "noopener");
    say("Finish signing in with Discord in the new tab…");
    let heard = false;
    const tick = async () => {
      if (my !== gen || !box.isConnected) return;
      if (Date.now() - started > 15 * 60 * 1000){ say("Sign-in timed out. Try again.", "err"); return; }
      let s = null;
      try { const res = await fetch(LICENSE_RELAY + "/discord/status/" + r, {cache:"no-store"}); s = res.status >= 500 ? null : await res.json(); } catch(e){}
      if (my !== gen || !box.isConnected) return;
      if (s && s.status && s.status !== "unknown") heard = true;
      if (!s || !s.status || s.status === "pending" || (s.status === "unknown" && !heard)){ setTimeout(tick, 3000); return; }
      if (s.status === "issued" && s.key){ say("Got your license key.", "ok"); onKey(licFormat(s.key)); return; }
      if (s.status === "review"){ say("This Discord account doesn't have a license key yet. A request was sent to the seller.", "err"); return; }
      say(s.error || "Sign-in didn't finish. Try again.", "err");
    };
    setTimeout(tick, 3000);
  });
}

/* ================= UPDATES (desktop) ================= */
const UPD = { info:null, status:{state:"idle"} };
const CAN_UPDATE = !!(window.pvDesktop && window.pvDesktop.checkForUpdates);
function updStatusText(s){
  switch (s && s.state){
    case "checking": return "Checking for updates…";
    case "downloading": return `Downloading version ${esc(s.version)}…`;
    case "ready": return `Version ${esc(s.version)} is ready. Restart to finish updating.`;
    case "current": return "You're on the latest version.";
    case "needs-installer": return `Version ${esc(s.version)} needs a new download of the app.`;
    case "not-configured": return "Updates aren't set up yet.";
    case "error": return `Couldn't update: ${esc(updErrorText(s.error))}`;
    default: return "";
  }

// 1.9.83+: a failed check in words. The desktop app passes on Chromium's error (net::ERR_SSL_PROTOCOL_ERROR…),
// which says little to most people; the code stays at the end for whoever helps.
function updErrorText(e){
  const s = String(e || ""), m = s.match(/\bERR_[A-Z0-9_]+/), code = m ? m[0] : "";
  if (!code) return s || "unknown problem";
  const why = /^ERR_(INTERNET_DISCONNECTED|NETWORK_CHANGED|ADDRESS_UNREACHABLE|NETWORK_ACCESS_DENIED)$/.test(code) ? "This computer isn't connected to the internet."
    : /^ERR_NAME_(NOT_RESOLVED|RESOLUTION_FAILED)$/.test(code) ? "This network couldn't find the update server."
    : /^ERR_(TIMED_OUT|CONNECTION_TIMED_OUT)$/.test(code) ? "The update server took too long to answer."
    : /^ERR_CERT_/.test(code) ? "This computer didn't accept the update server's certificate. Check its date and time, and any antivirus or network software that checks secure connections."
    : /^ERR_(PROXY_|TUNNEL_)/.test(code) ? "This computer's proxy settings stopped the connection."
    : "Something on this computer or network blocked the update server, often antivirus web protection, a VPN, or a security filter in the router or internet provider's app.";
  return `${why} (${code})`;
}
// 1.9.83+: FAFO's own copy of update.json and the pages on its license server (/mirror, fetched from GitHub there),
// for networks that block raw.githubusercontent.com. A check on the built-in address that can't connect is tried
// once more through the copy; then the address goes back to the built-in one (an address of the user's own is
// left alone). Updates are still checked against the publisher's signature, so the copy can't change one.
const UPDATE_GH = "https://raw.githubusercontent.com/dolamv-coder/profile-vault-updates/main/update.json";
const UPDATE_MIRROR = LICENSE_RELAY + "/mirror/update.json";
const UPD_MIRROR_EVERY = 20 * 60 * 1000;   // checks on their own retry through the copy at most this often
let updMirror = null, updMirrorAt = 0;
async function updViaMirror(st, manual){
  const pd = window.pvDesktop;
  if (!CAN_UPDATE || !pd.setUpdateSource || !st || st.state !== "error" || !/\bERR_[A-Z0-9_]+/.test(String(st.error || ""))) return st;
  if (updMirror) return updMirror;
  if (!manual && Date.now() - updMirrorAt < UPD_MIRROR_EVERY) return st;
  updMirror = (async () => {
    let info = null; try { info = await pd.updateInfo(); } catch(e){}
    if (!info || info.source !== UPDATE_GH) return st;
    updMirrorAt = Date.now(); UPD.viaMirror = "trying";
    const set = await pd.setUpdateSource(UPDATE_MIRROR).catch(() => null);
    if (!set || !set.ok){ UPD.viaMirror = ""; return st; }
    let st2 = null;
    try { st2 = await pd.checkForUpdates(); } catch(e){}
    finally {
      // Back to the built-in address, unless an address was saved in Settings meanwhile.
      try { const now = await pd.updateInfo(); if (now && now.source === UPDATE_MIRROR) await pd.setUpdateSource(""); } catch(e){}
    }
    const ok = st2 && st2.state && st2.state !== "error";
    UPD.viaMirror = ok ? "yes" : "";
    return ok ? st2 : st;
  })();
  try { return await updMirror; } finally { updMirror = null; refreshUpdateInfo(); }
}
// Where friends get a fresh copy when an update needs a new download of the app.
const APP_DOWNLOAD = "https://github.com/dolamv-coder/profile-vault-updates/releases/latest/download/FAFO-Windows.zip";

      const t = $(".txt", pill); if (t) t.textContent = inst ? "New version" : "Update ready";
    }

        const res = await window.pvDesktop.trashPromos({id:ib.id, email:ib.email, password:ib.password, host:ib.host, port:ib.port, folder}, uids, r.uidValidity);
        if (!res.ok){ err = err || `${ib.email}: ${res.error}`; ok = false; break; }
        moved += res.moved || 0;
      }
    } catch(e){ err = err || "Auto-clean stopped unexpectedly."; ok = false; }
    if (ok && cfg.on) swept[ib.id] = true;
  }
  autoCleanRunning = false;
  if (!S) return;
  S.settings.autoClean = Object.assign({}, autoCleanCfg(), {inboxId:cfg.inboxId, v2:true, swept, sweptRules:CLEAN_RULES_KEY, lastRun:Date.now(), lastMoved:moved, lastError:err, total:(autoCleanCfg().total || 0) + moved});
  persist();
  if (moved){ CLEAN.result = null; toast(`${phone ? "Clean emails from your phone" : "Auto-clean"} moved ${plural(moved, "email")} to Trash`); }
  if (UI.view === "clean" && !CLEAN.busy) renderMain();
  return {moved, error:err};
}

function jsonOrdersToRows(text){
  let data; try { data = JSON.parse(text); } catch(e){ return null; }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.checkouts)) ? data.checkouts : (data && Array.isArray(data.orders)) ? data.orders : null;

  return list.map((c, i) => {
    const st = STORES.find(x => x[0] !== "other" && (x[0] === c.storeId || norm(x[1]) === norm(c.store)));
    return { line:i+1, store:st ? st[0] : "other", storeName:st ? "" : (c.store || "Other"),

  });
}

/* ================= SUBMIT SLOTS ================= */
const DEFAULT_CAP = 3;
const capOf = (k) => { const c = (S.caps || {})[k]; return c == null ? DEFAULT_CAP : c; };
const slotKey = (pid, k) => pid + "@" + k;
const isSel = (pid, k) => (S.slots || []).includes(slotKey(pid, k));
const isSub = (pid, k) => !!(S.subs || {})[slotKey(pid, k)];
function setSel(pid, k, on){
  S.slots = S.slots || [];
  const key = slotKey(pid, k);
  if (on){ if (!S.slots.includes(key)) S.slots.push(key); }
  else S.slots = S.slots.filter(x => x !== key);
}
function storeGroups(){
  const map = new Map();
  S.profiles.forEach(p => profileStores(p).forEach(e => {
    const k = storeKeyOf(e);
    if (!map.has(k)) map.set(k, {key:k, name:storeLabel(e), rows:[]});
    map.get(k).rows.push({p, e, l:loginById(e.loginId)});
  }));
  const out = Array.from(map.values());
  out.forEach(g => {
    g.rows.sort((a, b) => natural(a.p.name, b.p.name));
    g.cap = capOf(g.key);
    g.sel = g.rows.filter(r => isSel(r.p.id, g.key));
    g.sub = g.rows.filter(r => isSub(r.p.id, g.key));
    g.fresh = g.sel.filter(r => !isSub(r.p.id, g.key));
  });
  return out.sort((a, b) => natural(a.name, b.name));
}
const running = () => (S.lastBatch || []).filter(k => (S.subs || {})[k]).length;

/* The seller approves or declines each batch from its message in their Discord channel (the owner's requests,
   2026-10-06). A slot sent through the license worker from 1.9.91 keeps its batch id (S.subs[key].batch) and shows
   Pending approval until the worker says that batch is approved, then Success (okAt: when), or from 1.9.92 Declined
   (declinedAt). Slots sent before, or as a code, show Submitted. FAFO asks about every 30 seconds while the Submit page
   is in front, and every 5 minutes otherwise. A declined slot switched off just goes: the seller isn't told again. */
const subState = (x) => !x ? "" : x.declinedAt ? "no" : x.okAt ? "ok" : x.batch ? "wait" : "sent";
const isDeclined = (pid, k) => subState((S.subs || {})[slotKey(pid, k)]) === "no";
function clearDeclined(g, rows){
  rows.forEach(r => { delete S.subs[slotKey(r.p.id, g.key)]; setSel(r.p.id, g.key, false); });
  S.lastBatch = (S.lastBatch || []).filter(k => S.subs[k]);
  persist(); renderMain();
  toast(rows.length === 1 ? "Cleared. Switch it on again to submit it again." : `Cleared ${plural(rows.length, "declined slot")}.`);
}
let approvalAt = 0, approvalBusy = false;
async function refreshApprovals(force){
  const L = licRead();
  if (!S || !DESK || !L || !L.key || approvalBusy) return;
  const ids = [...new Set(Object.values(S.subs || {}).filter(x => subState(x) === "wait").map(x => x.batch))].slice(0, 100);
  if (!ids.length) return;
  if (!force && Date.now() - approvalAt < (UI.view === "submit" && !document.hidden ? 25000 : 300000)) return;
  approvalAt = Date.now(); approvalBusy = true;
  let d = null;
  try { const r = await fetch(LICENSE_RELAY + "/submissions/status?ids=" + ids.join(","), {headers:{authorization:"Bearer " + L.key}, cache:"no-store", signal:typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(20000) : undefined}); if (r.ok) d = await r.json(); }
  catch(e){}
  approvalBusy = false;
  if (!S || !d || !d.batches) return;
  let n = 0, no = 0;
  Object.values(S.subs || {}).forEach(x => {
    const b = subState(x) === "wait" && d.batches[x.batch];
    if (b && b.status === "approved"){ x.okAt = Number(b.at) || Date.now(); n++; }
    else if (b && b.status === "declined"){ x.declinedAt = Number(b.at) || Date.now(); no++; }
  });
  if (!n && !no) return;
  persist();
  if (UI.view === "submit") renderMain();
  if (n) toast(`Success: the seller approved your ${plural(n, "slot")}`);
  if (no) toast(`The seller declined ${no === 1 ? "1 of your slots" : `${no} of your slots`}. See the Submit page.`, "err");
}
setInterval(() => refreshApprovals(false), 10000);
window.addEventListener("online", () => refreshApprovals(true));

/* ---- slot limit: how many slots can be switched on at once, across all stores ---- */
// The seller sets it per license on the license worker; people ask for more from the Submit page.
const SLOT_DEFAULT = 20, SLOT_MAX = 500;
const slotAllow = () => { const a = S.settings.slotAllow; return a && a.limit > 0 ? a.limit : SLOT_DEFAULT; };
const slotsInUse = () => storeGroups().reduce((n, g) => n + g.sel.length, 0);
const slotReq = () => (S.settings.slotAllow || {}).request || null;
const canRequestSlots = () => DESK && !!(licRead() || {}).key && (S.settings.slotAllow || {}).canRequest !== false;
let slotCheckedAt = 0;
/* Submitting straight to the seller: from 1.9.52 a licensed desktop app sends each batch to the
   seller's private Discord channel through the license worker: from 1.9.53 a CSV of profiles for
   each store in the seller's columns plus its logins (email:password) in a separate file (1.9.52
   sent one CSV in Export → CSV's columns). From 1.9.87 each store's AYCD list goes too, and since 2026-10-06 the channel
   gets only that and the logins: the worker reads the CSV (to give out accounts) but doesn't post it, the seller's
   choice (1.9.91 says AYCD files). That's plain text, card numbers and passwords included: the seller chose it over
   encryption, and the Submit dialog says where the slots go. Before 1.9.52 the batch was sealed for
   the seller's collecting key (the one they confirmed from their channel); SELLER is that key, still
   used when someone sets that key as their recipient by hand, and to recognize slots sent that way. */
let SELLER = null;   // {pub, keyId}
async function refreshSeller(){
  let k = null;
  try {
    const r = await fetch(LICENSE_RELAY + "/submit/key", {cache:"no-store"});
    if (!r.ok) return SELLER;
    const d = await r.json();
    if (d && d.pub){ await importOwnerPub(d.pub); if (await keyIdOf(d.pub) === d.keyId) k = {pub:d.pub, keyId:d.keyId}; }
  } catch(e){ return SELLER; }
  const changed = JSON.stringify(k) !== JSON.stringify(SELLER);
  SELLER = k;
  if (changed && S && UI.view === "submit") renderMain();
  return SELLER;
}
// A recipient set by hand (a different invite) wins; otherwise slots go to the seller when they can.
const submitToSeller = () => SELLER && DESK && (licRead() || {}).key && (!S.submitTo || S.submitTo.pub === SELLER.pub) ? SELLER : null;
// The key this app last sent with. A different one is shown before anything is sent to it, so a
// swapped key can't take batches over silently.
const sellerPin = () => (S.settings.sellerPin || null);
async function sendToSeller(from, payload, stores, batch, k){
  const L = licRead() || {};
  for (let tries = 0; tries < 2; tries++){
    if (!k || !submitToSeller()) throw new Error("The seller isn't taking submissions here right now. Close this and submit again to get a code to send them.");
    const code = await sealSubmission(k.pub, payload);
    let r;
    try { r = await fetch(LICENSE_RELAY + "/submissions", {method:"POST", headers:{authorization:"Bearer " + L.key, "content-type":"application/json"}, body:JSON.stringify({code, keyId:k.keyId, name:from, slots:payload.slots.length, stores, batch})}); }
    catch(e){ throw new Error("Couldn't reach the seller. Check your connection and try again."); }
    if (r.ok){ const d = await r.json().catch(() => ({})); S.settings.sellerPin = {pub:k.pub, keyId:k.keyId}; persist(); return Object.assign({}, k, {id:d.id || batch, review:d.review || ""}); }
    const d = await r.json().catch(() => ({}));
    if (r.status === 409){
      // The seller's key changed. Seal again only for the key this app already sent with; any other
      // one is shown to the person first.
      const now = await refreshSeller(), pin = sellerPin();
      if (now && pin && now.pub === pin.pub && now.pub !== k.pub){ k = now; continue; }
      throw new Error("The seller's key has changed, so nothing was sent. Close this and submit again to see the new one.");
    }
    if (r.status === 425) throw new Error("Still sending. Wait a moment, then try again.");
    if (r.status === 401) throw new Error("Your license wasn't recognized, so nothing was sent.");
    if (r.status === 429) throw new Error("You've sent a lot this hour. Try again later.");
    if (r.status === 503){ SELLER = null; throw new Error("The seller isn't taking submissions here right now. Close this and submit again to get a code to send them."); }
    throw new Error(d.error === "too large" ? "That's too much to send at once. Switch some slots off and send them separately." : "Couldn't send to the seller. Try again in a moment.");
  }
  throw new Error("The seller isn't taking submissions here right now. Close this and submit again to get a code to send them.");
}
// A licensed desktop app sends to the seller's channel (AYCD files there, from the CSV and AYCD lists sent), unless a recipient was set by hand
// (someone else's invite), who still gets a sealed code.
const csvToSeller = () => DESK && !!(licRead() || {}).key && !S.submitTo;
// What the seller gets (1.9.53+), in the columns their tools take: for each store, a CSV of its slots,
// one row each, and a separate list of its logins, one email:password per line, in the same order as
// the first rows. Use Assigned Account slots come right after those: the license worker gives each one
// of the seller's own accounts, puts its email in the row and adds email:password to the logins file,
// so line N still goes with row N (buyers never see which). Other slots without a store login come
// last (one checking out with just an email has that email in the email column). A row's email is the
// account the slot checks out with (1.9.66+): its store login's, blank on Use Assigned Account until the
// worker puts the assigned account's there, or Pokémon Center's checkout email.
const SLOT_COLS = ["profile_name","first_name","last_name","email","phone_num","cc_number","cc_exp_month","cc_exp_year","cc_cvv",
  "shipping_street","shipping_street_2","shipping_city","shipping_state","shipping_zip_code","shipping_country",
  "billing_first_name","billing_last_name","billing_street","billing_street_2","billing_city","billing_state","billing_zip_code","billing_country"];
const slotEmail = (r) => asksSeller(r.e) ? "" : r.l ? r.l.email : modeOf(r.e) === "email" && r.e.email ? r.e.email : r.p.email;
function slotRow(r){
  const p = r.p, a = addrById(p.shipId) || {}, b = billAddr(p) || {}, c = cardById(p.cardId) || {};
  const y = String(c.expY || "");
  const email = slotEmail(r);
  return [p.name, a.first, a.last, email, p.phone,
    digits(c.number), c.expM ? String(c.expM).padStart(2, "0") : "", /^\d{2}$/.test(y) ? "20" + y : y, c.cvv,
    a.line1, a.line2, a.city, a.state, a.zip, a.country, b.first, b.last, b.line1, b.line2, b.city, b.state, b.zip, b.country];
}
// The same slot as AYCD exports a profile (1.9.87+, the owner's choice), for loading straight into AYCD: the account it
// checks out with on both addresses (the license worker puts an assigned account's there), the state and country
// written out, and the card's own name.
function slotAycd(r){
  const p = r.p, c = cardById(p.cardId) || {}, y = String(c.expY || ""), email = slotEmail(r);
  const place = (x) => { x = x || {}; return {name:[x.first, x.last].filter(Boolean).join(" "), email, phone:p.phone || "", line1:x.line1 || "", line2:x.line2 || "", line3:"",
    postCode:x.zip || "", city:x.city || "", country:aycdCountry(x.country), state:aycdState(x.state, x.country)}; };
  const bill = place(billAddr(p)), holder = c.holder || bill.name;

    paymentDetails:{nameOnCard:holder, cardType:c.redcard ? "RedCard" : AYCD_TYPE[brandOf(c.number)] || "", cardNumber:digits(c.number),
      cardExpMonth:c.expM ? String(c.expM).padStart(2, "0") : "", cardExpYear:/^\d{2}$/.test(y) ? "20" + y : y, cardCvv:c.cvv || ""},
    sameBillingAndShippingAddress:!!p.billSame, onlyCheckoutOnce:!!p.oneCheckout, matchNameOnCardAndAddress:norm(holder) === norm(bill.name)};
}
function slotsFiles(fresh){
  const cell = (v) => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const byStore = new Map();
  fresh.forEach(({g, r}) => { if (!byStore.has(g.key)) byStore.set(g.key, {store:g.name, key:g.key, rows:[]}); byStore.get(g.key).rows.push(r); });
  const files = [];
  byStore.forEach(({store, key, rows}) => {
    const rank = (r) => asksSeller(r.e) ? 1 : r.l ? 0 : 2;
    const sorted = rows.slice().sort((a, b) => rank(a) - rank(b));   // stable, so the Submit page's order holds
    files.push({store, storeKey:key, kind:"profiles", assigned:sorted.filter(r => rank(r) === 1).length, text:[SLOT_COLS.join(",")].concat(sorted.map(r => slotRow(r).map(cell).join(","))).join("\r\n")});
    files.push({store, storeKey:key, kind:"aycd", text:JSON.stringify(sorted.map(slotAycd))});   // the same rows, for AYCD (1.9.87+)
    const logins = sorted.filter(r => rank(r) === 0).map(r => `${r.l.email}:${r.l.password || ""}`);
    if (logins.length) files.push({store, kind:"logins", text:logins.join("\r\n")});
  });
  return files;
}
async function sendFilesToSeller(from, files, n, stores, batch){
  let r;
  try { r = await fetch(LICENSE_RELAY + "/submissions", {method:"POST", headers:{authorization:"Bearer " + (licRead() || {}).key, "content-type":"application/json"}, body:JSON.stringify({files, name:from, slots:n, stores, batch})}); }
  catch(e){ throw new Error("Couldn't reach the seller. Check your connection and try again."); }
  // `review` (2026-10-06): the batch waits for the seller to approve it in their channel.
  if (r.ok){ const d = await r.json().catch(() => ({})); return {keyId:"CSV", id:d.id || batch, review:d.review || ""}; }
  if (r.status === 425) throw new Error("Still sending. Wait a moment, then try again.");
  if (r.status === 401) throw new Error("Your license wasn't recognized, so nothing was sent.");
  if (r.status === 429) throw new Error("You've sent a lot this hour. Try again later.");
  if (r.status === 413) throw new Error("That's too much to send at once. Switch some slots off and send them separately.");
  if (r.status === 503) throw new Error("The seller's Discord channel isn't set up yet, so nothing was sent.");

}
// Offline, the last limit FAFO heard stays in force.
async function refreshSlotAllow(force){
  const L = licRead();
  if (!S || !DESK || !L || !L.key || (!force && Date.now() - slotCheckedAt < 60000)) return;
  slotCheckedAt = Date.now();
  refreshSeller();
  let d;
  try { const r = await fetch(LICENSE_RELAY + "/slots/limit", {headers:{authorization:"Bearer " + L.key}, cache:"no-store"}); if (!r.ok) return; d = await r.json(); } catch(e){ return; }
  if (!S || !(d && d.limit > 0)) return;
  const prev = S.settings.slotAllow || {};
  const next = {limit:d.limit, request:d.request || null, canRequest:d.canRequest !== false};
  if (JSON.stringify([prev.limit, prev.request || null, prev.canRequest !== false]) === JSON.stringify([next.limit, next.request, next.canRequest])) return;
  S.settings.slotAllow = next; persist();
  if (prev.limit && next.limit > prev.limit) toast(`You can now use ${next.limit} slots`);
  else if (prev.request && prev.request.status === "pending" && next.request && next.request.status === "denied") toast("Your request for more slots was declined", "err");
  if (UI.view === "submit") renderMain();
}
setInterval(() => { if (S && UI.view === "submit") refreshSlotAllow(false); }, 60000);
function slotLimitDialog(){

    mount:(panel, close) => { const b = $("#sl-req", panel); if (b) b.addEventListener("click", () => { close(); openSlotRequest(); }); }
  });
}
function openSlotRequest(){
  const n = slotAllow(), q = slotReq(), L = licRead() || {};
  if (!canRequestSlots()){ toast("Asking for more slots needs the FAFO desktop app with a license.", "err"); return; }
  if (q && q.status === "pending"){ toast(`You've asked for ${q.requested} slots. It's waiting for approval.`); return; }
  if (n >= SLOT_MAX){ toast(`${SLOT_MAX} slots is the most there is.`); return; }

          d = await r.json().catch(() => ({}));

async function toggleSlot(pid, k, on, cb){
  const g = storeGroups().find(x => x.key === k); if (!g) return;
  if (!on){
    if (isSub(pid, k)){
      const out = g.rows.filter(x => x.p.id === pid);
      if (isDeclined(pid, k)){ clearDeclined(g, out); return; }
      if (!(await confirmPull(g, out))){ if (cb) cb.checked = true; return; }
      pullSlots(g, out); return;
    }
    setSel(pid, k, false); persist(); renderMain(); return;
  }
  let swapped = false;
  if (g.sel.length >= g.cap){
    const p = S.profiles.find(x => x.id === pid);
    const r = await chooseSwap(g, p);
    if (!r){ if (cb) cb.checked = false; return; }
    if (r.raise){ const c = await promptCap(k, g.cap + 1); if (c == null){ if (cb) cb.checked = false; return; } }
    else if (isSub(r.out, k) && isDeclined(r.out, k)){ clearDeclined(g, g.rows.filter(x => x.p.id === r.out)); swapped = true; }
    else if (isSub(r.out, k)){
      // Swapping out a submitted slot pulls it, so the seller hears about it too.
      const out = g.rows.filter(x => x.p.id === r.out);
      if (!(await confirmPull(g, out))){ if (cb) cb.checked = false; return; }
      pullSlots(g, out); swapped = true;
    }
    else { setSel(r.out, k, false); swapped = true; }
  }
  if (!swapped && slotsInUse() >= slotAllow()){ if (cb) cb.checked = false; renderMain(); slotLimitDialog(); return; }
  setSel(pid, k, true); persist(); renderMain();
}
async function promptCap(k, suggested){
  const cur = capOf(k);
  const v = await promptDialog({title:"Slot cap", label:"How many slots can this store run at once?", value:String(suggested == null ? cur : suggested), confirm:"Save cap",
    validate:(x) => /^\d{1,3}$/.test(x) && +x >= 1 ? "" : "Enter a number from 1 upward."});
  if (v == null) return null;
  S.caps = S.caps || {}; S.caps[k] = +v;
  const g = storeGroups().find(x => x.key === k);
  if (g && g.sel.length > +v) g.sel.slice(+v).forEach(r => { if (!isSub(r.p.id, k)) setSel(r.p.id, k, false); });
  persist(); render(); return +v;
}

/* Pulling a submitted slot: it loses its Submitted mark, and when it went to the seller through
   FAFO, the seller gets a message in their Discord channel (license worker, POST /pull) listing
   the store, profile name, account email and card's last 4, so they can take it off their list.
   Alerts wait in S.pulls until the worker answers, so being offline loses nothing. A batch keeps
   its id across retries, so a reply that got lost doesn't post the same alert twice. */
const sentToSeller = (keyId) => !!keyId && (keyId === "CSV" || (SELLER && SELLER.keyId === keyId) || ((sellerPin() || {}).keyId === keyId));
const canTellSeller = () => DESK && !!(licRead() || {}).key;
function confirmPull(g, rows){
  const n = rows.length, it = n === 1 ? "it" : "them";
  const told = rows.filter(r => sentToSeller(((S.subs || {})[slotKey(r.p.id, g.key)] || {}).to)).length;
  const how = told && canTellSeller()
    ? (told === n ? `The seller gets a message in Discord to take ${it} off their list.` : `The seller gets a message about the ${plural(told, "slot")} sent to them. Tell whoever has the others yourself.`)
    : `FAFO can't tell them for you, so let whoever you sent ${it} to know.`;
  return confirmDialog({title:n === 1 ? `Pull ${rows[0].p.name} from ${g.name}?` : `Pull ${plural(n, "submitted slot")} from ${g.name}?`,
    body:`${how} Switch ${it} back on later to submit again.`, confirm:n === 1 ? "Pull slot" : `Pull ${n} slots`, danger:true});
}
function pullSlots(g, rows){
  const at = Date.now();
  S.pulls = S.pulls || [];
  let queued = 0;
  rows.forEach(r => {
    const key = slotKey(r.p.id, g.key), sub = (S.subs || {})[key] || {}, c = cardById(r.p.cardId);
    if (sentToSeller(sub.to) && canTellSeller() && subState(sub) !== "no"){
      S.pulls.push({id:uid(), key, at, to:sub.to, from:sub.from || S.submitName || "", store:g.name, profile:r.p.name,
        email:asksSeller(r.e) ? "Assigned account" : r.l ? r.l.email : (r.e.email || ""), card:c ? `${cardBrand(c)} ${last4(c.number)}` : "", sentAt:sub.at || 0});
      queued++;
    }
    delete S.subs[key];
    setSel(r.p.id, g.key, false);
  });
  S.lastBatch = (S.lastBatch || []).filter(k => S.subs[k]);
  persist(); renderMain();
  if (queued) flushPulls(true, rows.length);
  else toast(`Pulled ${plural(rows.length, "slot")}`);
}
let pullBusy = false, pullTriedAt = 0, pullAgain = null;
async function flushPulls(loud, n){
  if (!S || !(S.pulls || []).length) return;
  // A pull or "Try now" while a send is running: it goes (and says how it went) once that one ends.
  if (pullBusy){ if (loud) pullAgain = {n:(pullAgain ? pullAgain.n : 0) + (n || 0)}; return; }
  if (!loud && Date.now() - pullTriedAt < 60000) return;
  const lic = (licRead() || {}).key;
  if (!DESK || !lic){ if (loud) toast("Pulled. The seller will be told once FAFO can reach them.", "err"); return; }
  pullBusy = true; pullTriedAt = Date.now();
  // Give waiting alerts a batch id before sending (kept across retries), one batch per seller key.
  const fresh = new Map();
  S.pulls.forEach(x => { if (!x.batch){ if (!fresh.has(x.to)) fresh.set(x.to, b64u(crypto.getRandomValues(new Uint8Array(16)))); x.batch = fresh.get(x.to); } });
  if (fresh.size) persist();
  const batches = new Map();
  S.pulls.forEach(x => { if (!batches.has(x.batch)) batches.set(x.batch, []); batches.get(x.batch).push(x); });
  let told = 0, notTold = 0, waiting = 0;
  for (const [batch, list] of batches){
    let r = null, d = {};
    try {
      r = await fetch(LICENSE_RELAY + "/pull", {method:"POST", headers:{authorization:"Bearer " + lic, "content-type":"application/json"},
        body:JSON.stringify({keyId:list[0].to, name:list[0].from, batch, slots:list.map(x => ({store:x.store, profile:x.profile, email:x.email, card:x.card, sentAt:x.sentAt}))})});
      d = await r.json().catch(() => ({}));
    } catch(e){ r = null; }
    if (!S) break;
    const done = new Set(list.map(x => x.id));
    if (r && (r.ok || r.status === 400 || r.status === 413)){
      // Sent, or something retrying can't fix (the worker couldn't match the seller, or a malformed batch).
      S.pulls = S.pulls.filter(x => !done.has(x.id));
      if (r.ok && d.forwarded) told += list.length; else notTold += list.length;
    } else {
      if (r && r.status === 409) list.forEach(x => { delete x.batch; });   // that id was taken: use a new one next time
      waiting += list.length;
    }
  }
  pullBusy = false;
  if (pullAgain){ const a = pullAgain; pullAgain = null; setTimeout(() => flushPulls(true, a.n || undefined), 0); }
  if (!S) return;
  persist();
  if (UI.view === "submit") renderMain();
  if (!loud){
    if (notTold) toast(`FAFO couldn't tell the seller about ${plural(notTold, "pulled slot")}, so let them know yourself.`, "err");
    return;
  }
  const what = `Pulled ${plural(n || told + notTold + waiting, "slot")}.`;
  if (waiting) toast(`${what} FAFO couldn't reach the seller yet and will keep trying.`, "err");
  else if (notTold) toast(`${what} FAFO couldn't tell the seller, so let them know yourself.`, "err");
  else toast(`${what} The seller was told.`);
}
setInterval(() => { if (S && (S.pulls || []).length) flushPulls(false); }, 5 * 60 * 1000);
window.addEventListener("online", () => { pullTriedAt = 0; flushPulls(false); });

function openSubmitSlots(){
  if (slotsInUse() > slotAllow()){ slotLimitDialog(); return; }
  const groups = storeGroups();
  const fresh = [];
  groups.forEach(g => g.fresh.forEach(r => fresh.push({g, r})));
  if (!fresh.length) return;
  const viaCSV = csvToSeller(), seller = viaCSV ? null : submitToSeller(), to = viaCSV || seller ? null : S.submitTo;
  const pin = seller && sellerPin(), changedKey = !!(pin && pin.pub !== seller.pub);
  const batch = b64u(crypto.getRandomValues(new Uint8Array(16)));

  const stores = groups.filter(g => g.fresh.length).map(g => { const o = {name:g.name, n:g.fresh.length}, a = g.fresh.filter(r => asksSeller(r.e)).length; if (a) o.seller = a; return o; });

/* ================= COLLECTING FROM OTHERS ================= */
const APP_URL = "https://claude.ai/artifact/4cZrwMaJ8DFgpsZWoyt2iB";
let MODE = "vault", SUB = null, SENT = false;
const b64u = (buf) => toB64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const fromB64u = (s) => fromB64(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length + 3) % 4));
const ECDH = {name:"ECDH", namedCurve:"P-256"};
const SUB_INFO = enc.encode("profile-vault-submission-v1");
async function keyIdOf(pubB64u){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", fromB64u(pubB64u)));
  const hex = Array.from(h.slice(0,4)).map(x => x.toString(16).padStart(2,"0")).join("");
  return (hex.slice(0,4) + "-" + hex.slice(4)).toUpperCase();
}
async function subKey(priv, pub, salt, usage){
  const bits = await crypto.subtle.deriveBits({name:"ECDH", public:pub}, priv, 256);
  const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt, info:SUB_INFO}, hk, {name:"AES-GCM", length:256}, false, [usage]);
}
// Matches the fingerprint the license worker shows on its review page: 16 bytes of SHA-256.
async function fingerprintOf(pubB64u){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", fromB64u(pubB64u)));
  return Array.from(h.slice(0,16)).map(x => x.toString(16).padStart(2,"0")).join("").toUpperCase().match(/.{4}/g).join(" ");
}
async function importOwnerPub(pubB64u){ return crypto.subtle.importKey("raw", fromB64u(pubB64u), ECDH, false, []); }
async function sealSubmission(pubB64u, payload){
  const pub = await importOwnerPub(pubB64u);
  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveBits"]);
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const key = await subKey(eph.privateKey, pub, epk, "encrypt");
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(payload)));
  return "PVSUB1." + [b64u(epk), b64u(iv), b64u(ct)].join(".");
}
// With this vault's collecting key, or one it had before two vaults were merged (S.shareOld).
async function openSubmissionAny(code){
  const keys = [S.share].concat(S.shareOld || []).filter(k => k && k.priv);
  let err = null;
  for (const k of keys){ try { return await openSubmission(code, k.priv); } catch(e){ err = err || e; } }
  throw err || new Error("Set up collecting in Settings first.");
}
async function openSubmission(code, jwk){
  const parts = code.replace(/\.+$/, "").split(".");
  if (parts.length !== 4 || parts[0] !== "PVSUB1") throw new Error("One of the codes is incomplete. Ask the sender to copy it again.");
  try {
    const priv = await crypto.subtle.importKey("jwk", jwk, ECDH, false, ["deriveBits"]);
    const epkRaw = fromB64u(parts[1]);
    const epk = await crypto.subtle.importKey("raw", epkRaw, ECDH, false, []);
    const key = await subKey(priv, epk, epkRaw, "decrypt");
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64u(parts[2])}, key, fromB64u(parts[3]));
    return JSON.parse(dec.decode(pt));
  } catch(e){ throw new Error("A code wasn't made for this vault, or it was cut off when copied."); }
}
async function setupCollecting(){
  const kp = await crypto.subtle.generateKey(ECDH, true, ["deriveBits"]);
  S.share = { pub:b64u(await crypto.subtle.exportKey("raw", kp.publicKey)), priv:await crypto.subtle.exportKey("jwk", kp.privateKey), createdAt:Date.now() };
  await persist();
}

// Shift+click (or Shift+Space) on a row's tick (1.9.85+, as Orders already had): every row between it and the last
// one ticked or unticked, in the order shown, gets the same tick. Profiles (every layout), Cards and Generate.
const SEL_LAST = {};   // data-act -> the id clicked last
function selRange(e, act, id, on, set){
  const ids = $$(`#main input[data-act="${act}"][data-id]`).map(b => b.dataset.id);
  const a = ids.indexOf(SEL_LAST[act]), b = ids.indexOf(id);
  const range = e && e.shiftKey && a >= 0 && b >= 0 ? ids.slice(Math.min(a, b), Math.max(a, b) + 1) : [id];
  range.forEach(x => on ? set.add(x) : set.delete(x));
  SEL_LAST[act] = id;
  if (range.length > 1) try { window.getSelection().removeAllRanges(); } catch(err){}   // Shift+click also selects text
}
