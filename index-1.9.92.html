// the selection bar: Jig addresses gives each selected draft its own way of writing its address, and Mass
// edit changes the fields ticked on all of them, showing every draft's result before anything changes.
// Undo puts back what changed. (1.9.72 had Mass edit on Profiles; it moved here, where drafts are
// finished before they become profiles.)
//
// Jig only writes an address the ways USPS itself reads as the same address (Publication 28, which USPS's
// own address lookup follows): a direction before or after the street name (N, N., North), the street
// type at its end (USPS's standard abbreviation: Dr, Dr., Drive), the unit (Apt 4, Apt #4, # 4) and
// whether it's on line 1 or line 2, Saint, Fort or Mount in the city (St, St.), and the ZIP code with or
// without its ZIP+4. Stores cancel orders to addresses that look made up, so it uses those first, fewest
// changes first, then the address as it was. Only once they run out: a numbered street written out (18th,
// Eighteenth), then the other spellings USPS lists for street types (Str, Strt, Avn, Drv: they pass USPS
// but look like typos, and the owner wanted to try them), and last a dot inside the street name
// (Or.chard), which USPS's rules don't cover and only works some of the time. Each draft's address is kept
// different from every other draft's and every saved address.
const JIG_DIRS = [["North", "N"], ["South", "S"], ["East", "E"], ["West", "W"], ["Northeast", "NE"], ["Northwest", "NW"], ["Southeast", "SE"], ["Southwest", "SW"]];
// Street types from Publication 28's Appendix C1, "TYPE:USPS standard abbreviation:other spellings USPS
// recognizes". No abbreviation where USPS writes the word in full; Way's is Wy. Plurals USPS maps to the
// same type are left out, since they'd read as another street.
const JIG_C1 = ("ALLEY:ALY:ALLEE,ALLY|ANNEX:ANX:ANEX,ANNX|ARCADE:ARC|AVENUE:AVE:AV,AVEN,AVENU,AVN,AVNUE|BAYOU:BYU:BAYOO|BEACH:BCH|BEND:BND|BLUFF:BLF:BLUF|BLUFFS:BLFS|" +
  "BOTTOM:BTM:BOT,BOTTM|BOULEVARD:BLVD:BOUL,BOULV|BRANCH:BR:BRNCH|BRIDGE:BRG:BRDGE|BROOK:BRK|BROOKS:BRKS|BURG:BG|BURGS:BGS|BYPASS:BYP:BYPA,BYPAS,BYPS|" +
  "CAMP:CP:CMP|CANYON:CYN:CANYN,CNYN|CAPE:CPE|CAUSEWAY:CSWY:CAUSWA|CENTER:CTR:CEN,CENT,CENTR,CENTRE,CNTER,CNTR|CENTERS:CTRS|" +
  "CIRCLE:CIR:CIRC,CIRCL,CRCL,CRCLE|CIRCLES:CIRS|CLIFF:CLF|CLIFFS:CLFS|CLUB:CLB|COMMON:CMN|COMMONS:CMNS|CORNER:COR|CORNERS:CORS|COURSE:CRSE|COURT:CT|" +
  "COURTS:CTS|COVE:CV|COVES:CVS|CREEK:CRK|CRESCENT:CRES:CRSENT,CRSNT|CREST:CRST|CROSSING:XING:CRSSNG|CROSSROAD:XRD|CROSSROADS:XRDS|CURVE:CURV|DALE:DL|" +
  "DAM:DM|DIVIDE:DV:DIV,DVD|DRIVE:DR:DRIV,DRV|DRIVES:DRS|ESTATE:EST|ESTATES:ESTS|EXPRESSWAY:EXPY:EXP,EXPR,EXPW|EXTENSION:EXT:EXTN,EXTNSN|EXTENSIONS:EXTS|" +
  "FALL|FALLS:FLS|FERRY:FRY:FRRY|FIELD:FLD|FIELDS:FLDS|FLAT:FLT|FLATS:FLTS|FORD:FRD|FORDS:FRDS|FOREST:FRST|FORGE:FRG:FORG|FORGES:FRGS|FORK:FRK|FORKS:FRKS|" +
  "FORT:FT:FRT|FREEWAY:FWY:FREEWY,FRWAY,FRWY|GARDEN:GDN:GARDN,GRDEN,GRDN|GARDENS:GDNS:GRDNS|GATEWAY:GTWY:GATEWY,GATWAY,GTWAY|GLEN:GLN|GLENS:GLNS|" +
  "GREEN:GRN|GREENS:GRNS|GROVE:GRV:GROV|GROVES:GRVS|HARBOR:HBR:HARB,HARBR,HRBOR|HARBORS:HBRS|HAVEN:HVN|HEIGHTS:HTS:HT|HIGHWAY:HWY:HIGHWY,HIWAY,HIWY,HWAY|" +
  "HILL:HL|HILLS:HLS|HOLLOW:HOLW:HLLW|INLET:INLT|ISLAND:IS:ISLND|ISLANDS:ISS:ISLNDS|ISLE|JUNCTION:JCT:JCTION,JCTN,JUNCTN,JUNCTON|JUNCTIONS:JCTS:JCTNS|" +
  "KEY:KY|KEYS:KYS|KNOLL:KNL:KNOL|KNOLLS:KNLS|LAKE:LK|LAKES:LKS|LAND|LANDING:LNDG:LNDNG|LANE:LN|LIGHT:LGT|LIGHTS:LGTS|LOAF:LF|LOCK:LCK|LOCKS:LCKS|" +
  "LODGE:LDG:LDGE,LODG|LOOP|MALL|MANOR:MNR|MANORS:MNRS|MEADOW:MDW|MEADOWS:MDWS:MDW,MEDOWS|MEWS|MILL:ML|MILLS:MLS|MISSION:MSN:MISSN,MSSN|MOTORWAY:MTWY|" +
  "MOUNT:MT:MNT|MOUNTAIN:MTN:MNTAIN,MNTN,MOUNTIN,MTIN|MOUNTAINS:MTNS:MNTNS|NECK:NCK|ORCHARD:ORCH:ORCHRD|OVAL::OVL|OVERPASS:OPAS|PARK::PRK|" +
  "PARKWAY:PKWY:PARKWY,PKWAY,PKY|PASS|PASSAGE:PSGE|PATH|PIKE|PINE:PNE|PINES:PNES|PLACE:PL|PLAIN:PLN|PLAINS:PLNS|PLAZA:PLZ:PLZA|POINT:PT|POINTS:PTS|" +
  "PORT:PRT|PORTS:PRTS|PRAIRIE:PR:PRR|RADIAL:RADL:RAD,RADIEL|RAMP|RANCH:RNCH|RAPID:RPD|RAPIDS:RPDS|REST:RST|RIDGE:RDG:RDGE|RIDGES:RDGS|RIVER:RIV:RVR,RIVR|" +
  "ROAD:RD|ROADS:RDS|ROUTE:RTE|ROW|RUE|RUN|SHOAL:SHL|SHOALS:SHLS|SHORE:SHR:SHOAR|SHORES:SHRS:SHOARS|SKYWAY:SKWY|SPRING:SPG:SPNG,SPRNG|" +
  "SPRINGS:SPGS:SPNGS,SPRNGS|SPUR|SQUARE:SQ:SQR,SQRE,SQU|SQUARES:SQS:SQRS|STATION:STA:STATN,STN|STRAVENUE:STRA:STRAV,STRAVEN,STRAVN,STRVN,STRVNUE|" +
  "STREAM:STRM:STREME|STREET:ST:STRT,STR|STREETS:STS|SUMMIT:SMT:SUMIT,SUMITT|TERRACE:TER:TERR|THROUGHWAY:TRWY|TRACE:TRCE|TRACK:TRAK:TRK|TRAFFICWAY:TRFY|" +
  "TRAIL:TRL|TUNNEL:TUNL:TUNEL,TUNNL|TURNPIKE:TPKE:TRNPK,TURNPK|UNDERPASS:UPAS|UNION:UN|UNIONS:UNS|VALLEY:VLY:VALLY,VLLY|VALLEYS:VLYS|" +
  "VIADUCT:VIA:VDCT,VIADCT|VIEW:VW|VIEWS:VWS|VILLAGE:VLG:VILL,VILLAG,VILLG,VILLIAGE|VILLAGES:VLGS|VILLE:VL|VISTA:VIS:VIST,VST,VSTA|WALK|WALL|WAY:WY|WAYS|" +
  "WELL:WL|WELLS:WLS");
const JIG_TYPES = new Map();
JIG_C1.split("|").forEach(r => {
  const [full, std, other] = r.split(":"), t = (x) => x[0] + x.slice(1).toLowerCase(), others = other ? other.split(",") : [];
  const row = {full:t(full), std:std ? t(std) : "", other:others.map(t)};
  [full, std].concat(others).forEach(f => { if (f && !JIG_TYPES.has(f)) JIG_TYPES.set(f, row); });
});
// Saint, Sainte, Fort and Mount in a city's name, as USPS abbreviates them.
const JIG_CITY = [["Saint", "St"], ["Sainte", "Ste"], ["Fort", "Ft"], ["Mount", "Mt"]];
const JIG_ORD = ",First,Second,Third,Fourth,Fifth,Sixth,Seventh,Eighth,Ninth,Tenth,Eleventh,Twelfth,Thirteenth,Fourteenth,Fifteenth,Sixteenth,Seventeenth,Eighteenth,Nineteenth".split(",");
const JIG_TENS = ",,Twenty,Thirty,Forty,Fifty,Sixty,Seventy,Eighty,Ninety".split(",");
const JIG_TENTH = ",,Twentieth,Thirtieth,Fortieth,Fiftieth,Sixtieth,Seventieth,Eightieth,Ninetieth".split(",");
const genShuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = genRand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Spellings come out in the case the text is written in: all capitals, all small letters, or as listed.
const jigCase = (s) => { const L = String(s).replace(/[^A-Za-z]/g, ""); return L.length > 2 && L === L.toUpperCase() ? (x => x.toUpperCase()) : L && L === L.toLowerCase() ? (x => x.toLowerCase()) : (x => x); };
// A slot is one part of the address Jig can write another way: [{s, tier}], what's there now first.
// Tier 0 is a usual spelling, 1 a numbered street written out, 2 another USPS spelling, 3 a dot.
const jigSlot = (orig, forms) => { const seen = new Set([norm(orig)]), out = [{s:orig, tier:0}]; forms.forEach(([s, tier]) => { const k = norm(s); if (s && !seen.has(k)){ seen.add(k); out.push({s, tier}); } }); return out; };
function jigDir(w, caseOf){
  const bare = w.replace(/\./g, ""), row = JIG_DIRS.find(r => r.some(x => x.toLowerCase() === bare.toLowerCase()));
  return row ? jigSlot(w, [row[0], row[1], row[1].length === 2 ? row[1][0] + "." + row[1][1] + "." : row[1] + "."].map(x => [caseOf(x), 0])) : null;
}
function jigType(w, caseOf){
  const row = JIG_TYPES.get(w.replace(/\.$/, "").toUpperCase()); if (!row) return null;
  return jigSlot(w, [[row.full, 0]].concat(row.std ? [[row.std, 0], [row.std + ".", 0]] : [], row.other.map(x => [x, 2])).map(([x, t]) => [caseOf(x), t]));
}
// 18th <-> Eighteenth and 21st <-> Twenty First (as USPS writes it), 1 to 99; null for anything else.
function jigOrdinal(w, caseOf){
  const m = /^(\d{1,2})(st|nd|rd|th)$/i.exec(w);
  if (m){ const n = +m[1]; return n ? caseOf(n < 20 ? JIG_ORD[n] : n % 10 ? JIG_TENS[(n / 10) | 0] + " " + JIG_ORD[n % 10] : JIG_TENTH[n / 10]) : null; }
  const k = w.toLowerCase().replace(/-/g, " ").split(" "), at = (list, x) => list.findIndex((y, i) => i && y.toLowerCase() === x);
  let n = -1;
  if (k.length === 1){ n = at(JIG_ORD, k[0]); if (n < 1){ const t = at(JIG_TENTH, k[0]); n = t > 1 ? t * 10 : -1; } }
  else if (k.length === 2){ const t = at(JIG_TENS, k[0]), o = at(JIG_ORD, k[1]); n = t > 1 && o >= 1 && o <= 9 ? t * 10 + o : -1; }
  return n >= 1 && n <= 99 ? caseOf(n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th")) : null;
}
// The same unit written the usual other ways, s itself first: an apartment stays an apartment, a suite a
// suite. "# 4", with the space, is how USPS writes it.
function jigUnit(s){
  s = String(s || "").trim().replace(/\s+/g, " ");
  const m = s.match(/^(?:(apt|apartment|unit|ste|suite)\.?\s*#?\s*|#\s*)([A-Za-z0-9-]+)$/i); if (!m) return [s];
  const kind = (m[1] || "#").toLowerCase(), u = m[2], caseOf = jigCase(s);
  const forms = /^(ste|suite)$/.test(kind) ? ["Suite " + u, "Ste " + u, "Ste. " + u, "Suite #" + u, "Ste #" + u]
    : kind === "unit" ? ["Unit " + u, "Unit #" + u, "#" + u, "# " + u]
    : ["Apt " + u, "Apt #" + u, "Apt. " + u, "Apartment " + u, "#" + u, "# " + u];
  return jigSlot(s, forms.map(x => [caseOf(x), 0])).map(x => x.s);
}
const JIG_UNIT_AT_END = /^(.*?\S)(,?\s+)((?:apt|apartment|unit|ste|suite)\.?\s*#?\s*[A-Za-z0-9-]+|#\s*[A-Za-z0-9-]+)$/i;
const JIG_PARTS = ["line1", "line2", "city", "zip"];
// Every way Jig writes address a, changing only the parts named (line1, line2, city, zip), in the order it
// uses them: usual spellings (fewest changes first, at random within that), the address as it was, then
// numbered streets written out, other USPS spellings, and dots. Each {line1, line2, city, zip, zip4, tier,
// ord, usps, dot}, where zip4 keeps a ZIP+4 Jig left off; orig is the address as it was. "123 N St" keeps
// its N: that's the street's name.
function jigChoices(a, parts){
  parts = new Set(parts || JIG_PARTS);
  const clean = (s) => String(s || "").trim().replace(/\s+/g, " ");
  const line1 = clean(a.line1), line2 = clean(a.line2), city = clean(a.city), zip = clean(a.zip);
  const slots = [];   // {opts} and where it goes: word (and span), unit, place (the unit's line), city (a word) or zip
  let words = [], head = line1, sep = "", unit = "", unitAt = "", nameAt = 0, end = 0;
  if (line1){
    const um = line1.match(JIG_UNIT_AT_END);
    if (um && /\s/.test(um[1])){ head = um[1]; sep = um[2]; unit = um[3]; unitAt = "line1"; }
    words = head.split(" ");
    const caseOf = jigCase(line1), start = words.length > 1 && /\d/.test(words[0]) ? 1 : 0;
    end = words.length; nameAt = start;
    if (parts.has("line1")){
      const add = (i, opts) => { if (opts && opts.length > 1) slots.push({opts, word:i}); };
      if (end - start >= 3 && jigDir(words[end - 1], caseOf) && !jigDir(words[end - 2], caseOf)){ add(end - 1, jigDir(words[end - 1], caseOf)); end--; }
      if (end - start >= 2 && jigType(words[end - 1], caseOf)){ add(end - 1, jigType(words[end - 1], caseOf)); end--; }
      if (end - start >= 2 && jigDir(words[start], caseOf) && !jigDir(words[start + 1], caseOf)){ add(start, jigDir(words[start], caseOf)); nameAt = start + 1; }
      // A street named by a number alone: 18th, Eighteenth, Twenty First.
      const name = words.slice(nameAt, end).join(" "), ord = end > nameAt && end - nameAt <= 2 ? jigOrdinal(name, caseOf) : null;
      if (ord){ slots.push({opts:jigSlot(name, [[ord, 1]]), word:nameAt, span:end - nameAt}); }
      if (unitAt === "line1") slots.push({opts:jigSlot(unit, jigUnit(unit).slice(1).map(x => [x, 0])), unit:true});
    }
  } else end = 0;
  if (!unitAt && line2 && jigUnit(line2).length > 1){ unit = line2; unitAt = "line2"; if (parts.has("line2")) slots.push({opts:jigSlot(line2, jigUnit(line2).slice(1).map(x => [x, 0])), unit:true}); }
  // The unit on the other line (USPS prefers it on line 1).
  if (unitAt && head && parts.has("line1") && parts.has("line2") && (unitAt === "line2" || !line2)) slots.push({opts:[{s:unitAt, tier:0}, {s:unitAt === "line1" ? "line2" : "line1", tier:0}], place:true});
  const cityWords = city.split(" ");
  if (parts.has("city") && cityWords.length > 1){
    const caseOf = jigCase(city);
    cityWords.forEach((w, i) => { const row = JIG_CITY.find(r => r.some(x => x.toLowerCase() === w.replace(/\.$/, "").toLowerCase())); if (row) slots.push({opts:jigSlot(w, [row[0], row[1], row[1] + "."].map(x => [caseOf(x), 0])), city:i}); });
  }
  // The ZIP+4, or the one this draft had before Jig dropped it (zip4), so Jig can put it back.
  const zm = /^(\d{5})-?(\d{4})$/.exec(zip), z4 = zm ? zm[1] + "-" + zm[2] : /^\d{5}-\d{4}$/.test(a.zip4 || "") && a.zip4.slice(0, 5) === zip ? a.zip4 : "";
  if (parts.has("zip") && z4) slots.push({opts:jigSlot(zip, [[z4.slice(0, 5), 0], [z4, 0]]), zip:true});
  // An address from one pick of each slot's spellings; a part nothing changed keeps its text exactly.
  const render = (pick) => {
    const ws = words.slice(), cw = cityWords.slice(), ch = new Set();
    let u = unit, at = unitAt, z = zip;
    slots.forEach((sl, i) => {
      if (!pick[i]) return;
      const s = sl.opts[pick[i]].s;
      if (sl.unit){ u = s; ch.add(unitAt); } else if (sl.place){ at = s; ch.add("line1").add("line2"); } else if (sl.zip){ z = s; ch.add("zip"); }
      else if (sl.city != null){ cw[sl.city] = s; ch.add("city"); }
      else { ws[sl.word] = s; for (let j = 1; j < (sl.span || 1); j++) ws[sl.word + j] = ""; ch.add("line1"); }
    });
    if (pick.dot){ ws[pick.dot[0]] = pick.dot[1]; ch.add("line1"); }
    const street = ws.filter(Boolean).join(" ");
    const out = {line1:street, line2, city:cw.join(" "), zip:z, zip4:z4 && z === z4.slice(0, 5) ? z4 : String(a.zip4 || "")};
    if (unitAt === "line1") { if (at === "line2"){ out.line2 = u; } else out.line1 = street + sep + u; }
    else if (unitAt === "line2"){ if (at === "line1"){ out.line1 = street + " " + u; out.line2 = ""; } else out.line2 = u; }
    JIG_PARTS.forEach(k => { if (!ch.has(k)) out[k] = String(a[k] == null ? "" : a[k]); });
    return out;
  };
  // Every combination of the slots' spellings: highest tier and how many parts it changes.
  let combos = [{pick:[], tier:0, k:0}];
  slots.forEach((sl) => {
    let opts = sl.opts.map((o, j) => ({j, tier:o.tier}));
    if (combos.length * opts.length > 12000) opts = opts.filter(o => o.tier < 2);   // a very long address: no typo-like spellings
    combos = combos.flatMap(c => opts.map(o => ({pick:c.pick.concat(o.j), tier:Math.max(c.tier, o.tier), k:c.k + (o.j ? 1 : 0)})));
  });
  const flags = (c) => ({ord:slots.some((sl, i) => sl.opts[c.pick[i]].tier === 1), usps:slots.some((sl, i) => sl.opts[c.pick[i]].tier === 2)});
  const make = (c, dot) => Object.assign(render(Object.assign(c.pick.slice(), {dot})), {tier:dot ? 3 : c.tier}, flags(c), {dot:!!dot});
  const byK = (list) => genShuffle(list).sort((x, y) => x.k - y.k);
  const orig = make(combos[0]);
  const order = byK(combos.filter(c => c.tier === 0 && c.k)).map(c => make(c));
  order.push(orig);
  [1, 2].forEach(t => byK(combos.filter(c => c.tier === t)).forEach(c => order.push(make(c))));
  // Last: a dot inside a word of the street name (not a number written out), with the usual spellings.
  if (parts.has("line1") && !slots.some(sl => sl.span)){
    const dots = [], plain = combos.filter(c => c.tier === 0);
    for (let i = nameAt; i < end && dots.length < 3000; i++){
      const w = words[i]; if (!/^[A-Za-z]{4,}$/.test(w)) continue;
      for (let p = 1; p < w.length; p++) plain.forEach(c => dots.push({c, dot:[i, w.slice(0, p) + "." + w.slice(p)], k:c.k + 1}));
    }
    byK(dots).forEach(d => order.push(make(d.c, d.dot)));
  }
  return {orig, order};
}
// The next way of writing one part (line1, line2, city or zip) of address a, for the draft editor's Jig:
// one it hasn't shown yet (shown) that no other draft or saved address has, if there is one, in Jig's
// usual order. Null if that part can't be written another way.
function jigNext(a, part, taken, shown){
  const c = jigChoices(a, [part]), t = new Set(taken), free = (x) => !t.has(draftAddrKey(Object.assign({}, a, x)));
  const list = c.order.filter(x => norm(x[part]) !== norm(a[part])), fresh = (x) => !shown.has(norm(x[part]));
  if (!list.length) return null;
  return (list.find(x => free(x) && fresh(x)) || list.find(free) || list.find(fresh) || list[0])[part];
}
// Addresses a jigged draft mustn't end up with: the other drafts' (all but those in skip) and every saved one.
const jigTaken = (skip) => draftList().filter(d => !skip.has(d.id)).map(draftAddrKey).concat(S.addresses.map(draftAddrKey));
// A new address for each of rows (the parts named), each different from the others' and from taken, in
// Jig's order. One with no way left keeps its address. {out, repeats, ord, usps, dotted}: how many still
// match another address, and how many needed a numbered street written out, another USPS spelling or a dot.
function jigAssign(rows, parts, taken){
  const used = new Set(taken), groups = new Map();
  const res = {out:[], repeats:0, ord:0, usps:0, dotted:0};
  rows.forEach(d => {
    const gk = draftAddrKey(d);
    let g = groups.get(gk); if (!g){ g = {c:jigChoices(d, parts), i:0}; groups.set(gk, g); }
    const key = (x) => draftAddrKey(Object.assign({}, d, x));
    while (g.i < g.c.order.length && used.has(key(g.c.order[g.i]))) g.i++;
    let v = g.c.order[g.i];
    if (v) g.i++; else { v = g.c.orig; res.repeats++; }
    if (v !== g.c.orig){ if (v.ord) res.ord++; if (v.usps) res.usps++; if (v.dot) res.dotted++; }
    used.add(key(v));
    res.out.push({line1:v.line1, line2:v.line2, city:v.city, zip:v.zip, zip4:v.zip4});
  });
  return res;
}
// How many different addresses Jig can make of a (the parts named), not counting ones already taken.
function jigWays(a, parts, taken){
  const t = new Set(taken);
  return jigChoices(a, parts).order.filter(x => !t.has(draftAddrKey(Object.assign({}, a, x)))).length;
}
// What jigging needed beyond the usual spellings, for a summary: lines of text.
function jigNotes(res){
  return [res.ord ? `${plural(res.ord, "draft")} ${res.ord === 1 ? "writes" : "write"} the street's number out (like Eighteenth), since the usual spellings ran out` : "",
    res.usps ? `${plural(res.usps, "draft")} ${res.usps === 1 ? "uses" : "use"} one of USPS's other spellings for the street type (like Str or Drv)` : "",
    res.dotted ? `${plural(res.dotted, "draft")} ${res.dotted === 1 ? "has" : "have"} a dot in the street name, since every other way of writing it ran out` : ""].filter(Boolean);
}

/* ---------- Jig for Pokémon Center (1.9.80+) ---------- */
// From the owner's notes on the Mega Evolution drop at Pokémon Center (18 orders, none canceled): up to five
// orders to one building, each with a line 2 of its own: a unit the building doesn't have (Ste, #fl, Bldg,
// Ofc, Suite, Dept or Ste. with a letter, Spc, Apt), a bare number at the end of line 1, or no unit with the
// street type the other way (Drive, Dr). A building with a real apartment or unit keeps its number, so the
// package still gets there: only the word before it changes (Apt 4, # 4, Unit 4, Spc 4, Ste 4, or 4 on
// line 1). Orders to one building that share a name get a letter doubled inside it (Hayes, Hayyes), the last
// name and the first name taking turns. From 1.9.81 Room is one of the made-up units, and one of the words
// for a real unit (Room 4), after an order to the owner went through with one. Billing never gets any of
// this (pkcBase). Jig for Target is the USPS-spelling Jig above; which one Jig uses is the shared setting jigFor.
const PKC_PER = 5;
function jigFor(){ return S && S.settings && S.settings.jigFor === "pokemon" ? "pokemon" : "target"; }
// The choice, as two buttons (on the Generate page and in the draft and profile editors), and the Jig
// actions' names for it.
function jigForHTML(){
  return `<div class="jig-for-row"><span>Jig for</span><div class="seg jig-for" role="group" aria-label="Jig for">${[["target", "Target"], ["pokemon", "Pokémon Center"]]
    .map(([k, l]) => `<button type="button" data-act="jig-for" data-id="${k}" aria-pressed="${jigFor() === k}">${l}</button>`).join("")}</div></div>`;
}
function jigLabel(one){ return jigFor() === "pokemon" ? "Jig for Pokémon Center" : one ? "Jig address" : "Jig addresses"; }
function setJigFor(k){
  S.settings.jigFor = k === "pokemon" ? "pokemon" : "target"; persist();
  document.documentElement.dataset.jigfor = jigFor();
  $$('[data-act="jig-for"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === jigFor())));
  render();
}
const pkcNum = (lo, hi) => lo + genRand(hi - lo + 1);
// Made-up units for a building that has none, each with a new number every time.
const PKC_MADE = [() => "Ste " + pkcNum(10, 899), () => "#fl" + (genRand(2) ? pkcNum(1, 12) : pkcNum(1001, 1299)), () => "Bldg " + pkcNum(1, 99),
  () => "Ofc " + pkcNum(1, 20), () => "Suite " + pkcNum(100, 899), () => "Dept " + pkcNum(100, 999) + "abcdef"[genRand(6)],
  () => "Ste. " + pkcNum(100, 899) + "abcdef"[genRand(6)], () => "Spc " + pkcNum(1, 150), () => "Apt " + pkcNum(101, 999),
  () => "Room " + pkcNum(1, 40)];   // Room: 1.9.81+
const PKC_UNIT = /^(?:(?:apt|apartment|unit|ste|suite|spc|space|bldg|building|ofc|office|dept|fl|floor|rm|room|lot|trlr)\.?\s*#?\s*|#\s*(?:fl)?)([A-Za-z0-9-]+)$/i;
// A building's real unit, if it has one: {head: line 1 without it, num: its number, text: as written}.
// Anything on line 2 counts as the unit; a number is only rewritten when it's written like one.
function pkcRealUnit(b){
  const l1 = String(b.line1 || "").trim().replace(/\s+/g, " "), l2 = String(b.line2 || "").trim().replace(/\s+/g, " ");
  if (l2){ const m = l2.match(PKC_UNIT); return {head:l1, num:m ? m[1] : "", text:l2}; }
  const um = l1.match(JIG_UNIT_AT_END);
  if (um && /\s/.test(um[1])){ const m = um[3].match(PKC_UNIT); return {head:um[1], num:m ? m[1] : "", text:um[3]}; }
  return {head:l1, num:"", text:""};
}
// Line 1 with its street type written the other way (Drive, Dr), or "" if it has none.
function pkcTypeOther(line1){
  const w = String(line1 || "").trim().split(/\s+/), caseOf = jigCase(line1);
  let i = w.length - 1;
  if (i > 1 && JIG_DIRS.some(r => r.some(x => x.toLowerCase() === w[i].replace(/\./g, "").toLowerCase()))) i--;
  if (i < 1 || /^\d/.test(w[i])) return "";
  const row = JIG_TYPES.get(w[i].replace(/\.$/, "").toUpperCase()); if (!row) return "";
  const to = w[i].replace(/\.$/, "").toLowerCase() === row.full.toLowerCase() ? row.std : row.full;
  if (!to) return "";
  w[i] = caseOf(to); return w.join(" ");
}
// One key per building: its street with the type and direction written one way, its real unit's number,
// city and 5-digit ZIP, so Drive and Dr, or Apt 4 and # 4, are the same building.
function pkcBuildingKey(b){
  const u = pkcRealUnit(b), one = (w) => { const t = JIG_TYPES.get(w.toUpperCase()); if (t) return (t.std || t.full).toLowerCase();
    const r = JIG_DIRS.find(x => x.some(y => y.toLowerCase() === w.toLowerCase())) || JIG_CITY.find(x => x.some(y => y.toLowerCase() === w.toLowerCase())); return r ? r[1].toLowerCase() : w.toLowerCase(); };
  const words = (s) => String(s || "").replace(/[.,]/g, " ").trim().split(/\s+/).filter(Boolean).map(one).join(" ");
  return [words(u.head), norm(u.num || u.text), words(b.city), norm(b.state), String(b.zip || "").trim().slice(0, 5)].join("|");
}
// The address and name d had before Jig for Pokémon Center last changed them (d.pkc), while they're still as
// it left them: jigging again starts from the building, and billing gets the real address and name.
function pkcBase(d){
  const p = d && d.pkc && typeof d.pkc === "object" ? d.pkc : null, b = Object.assign({}, d), s = (x) => String(x == null ? "" : x);
  if (p && p.was && s(d.line1) === s(p.line1) && s(d.line2) === s(p.line2)){ b.line1 = s(p.was.line1); b.line2 = s(p.was.line2); }
  if (p && p.name && s(d.first) === s(p.first) && s(d.last) === s(p.last)){ b.first = s(p.name.first); b.last = s(p.name.last); }
  return b;
}
// The ways Jig for Pokémon Center writes building b, in order: functions giving {line1, line2} (a made-up
// unit's number is new every call). With no unit: each made-up kind once (shuffled) with a bare number and
// the street type the other way, the address as typed, then made-up units again on either street type.
// With a real unit: its number with each other word, on line 2 or bare on line 1, on either street type.
function pkcForms(b){
  const u = pkcRealUnit(b), other = pkcTypeOther(u.head), out = [];
  if (!u.text){
    const first = PKC_MADE.map(f => () => ({line1:u.head, line2:f()})).concat([() => ({line1:u.head + " " + pkcNum(2, 999), line2:""})], other ? [() => ({line1:other, line2:""})] : []);
    genShuffle(first).forEach(f => out.push(f));
    out.push(() => ({line1:u.head, line2:""}));
    out.more = () => { const f = genPick(PKC_MADE), h = other && genRand(2) ? other : u.head; return () => ({line1:h, line2:f()}); };
    return out;
  }
  const n = u.num, seen = new Set();
  const add = (x) => { const k = norm(x.line1) + "|" + norm(x.line2); if (!seen.has(k)){ seen.add(k); out.push(() => x); } };
  [u.head, other].filter(Boolean).forEach(h => {
    add({line1:h, line2:u.text});
    if (n) [null, "Spc " + n, "# " + n, "Unit " + n, "Ste " + n, "Apt " + n, "#" + n, "Room " + n].forEach(f => add(f ? {line1:h, line2:f} : {line1:h + " " + n, line2:""}));
  });
  return out;
}
// A name with one letter doubled inside it, so it still reads and sounds the same: a consonant between two
// vowels (Hayyes, Avva, Allen), or an e or o away from other vowels (Hayees, Broown); never the first or last
// letter. Then an e or h at the end where names often have one (Browne, Clarke, Sarah). The letters names
// double most come first. Shorter than 3 letters: none.
const PKC_DOUBLE = {l:3, n:3, r:3, s:3, t:3, m:3, d:3, p:3, f:3, g:3, c:3, b:3, z:2, y:2, e:2, o:2, k:1, v:1, w:1, h:1};
function pkcNameForms(w){
  w = String(w || "").trim(); if (!/^[A-Za-z][A-Za-z'-]{2,}$/.test(w)) return [];
  const out = [], lo = w.toLowerCase(), V = (c) => "aeiou".includes(c || ""), Vy = (c) => V(c) || c === "y";
  for (let i = 1; i < w.length - 1; i++){
    const c = lo[i], p = lo[i - 1], n = lo[i + 1], sc = PKC_DOUBLE[c];
    if (!sc || p === c || n === c) continue;
    if (c === "e" || c === "o" ? V(p) || V(n) : V(c) || !Vy(p) || !Vy(n)) continue;
    out.push({s:w.slice(0, i + 1) + w[i] + w.slice(i + 1), sc});
  }
  const up = w === w.toUpperCase();
  if (/[nk]$/i.test(w)) out.push({s:w + (up ? "E" : "e"), sc:2});
  if (w.length <= 5 && /[^aeiou]a$/i.test(w)) out.push({s:w + (up ? "H" : "h"), sc:2});
  return genShuffle(out).sort((x, y) => y.sc - x.sc).map(x => x.s);
}
// Names for copies of one name at a building, after the first: the last name changed, then the first name,
// taking turns (each list in pkcNameForms' order); only once those run out (past five or so), both.
function pkcNameList(first, last){
  const L = pkcNameForms(last), F = pkcNameForms(first), out = [];
  for (let i = 0; i < Math.max(L.length, F.length); i++){ if (L[i]) out.push({first, last:L[i]}); if (F[i]) out.push({first:F[i], last}); }
  L.forEach(l => F.forEach(f => out.push({first:f, last:l})));
  return out;
}
// Addresses rows (drafts) would put more than five drafts at, counting every other draft there: [{line, n}].
function pkcCrowded(rows){
  const ids = new Set(rows.map(d => d.id)), count = new Map(), lines = new Map(), mine = new Set();
  const add = (d, own) => { const b = pkcBase(d), k = pkcBuildingKey(b); count.set(k, (count.get(k) || 0) + 1); if (own) mine.add(k);
    if (!lines.has(k)) lines.set(k, draftAddrLine(Object.assign({}, b, {line2:pkcRealUnit(b).text}))); };
  draftList().filter(d => !ids.has(d.id)).forEach(d => add(d, false));
  rows.forEach(d => add(d, true));
  return [...mine].filter(k => count.get(k) > PKC_PER).map(k => ({line:lines.get(k), n:count.get(k)}));
}
// Names already on each street (pkcStreetKey), as {key: Set}: the other drafts' (all but those in skip) and
// the shipping addresses of the other profiles (all but skipProfile), so a jigged name doesn't repeat theirs.
function pkcNamesTaken(skip, skipProfile){
  const m = new Map(), add = (b, first, last) => { if (!first || !last) return; const k = pkcStreetKey(b); if (!m.has(k)) m.set(k, new Set()); m.get(k).add(norm(first + " " + last)); };
  draftList().filter(d => !skip.has(d.id)).forEach(d => add(pkcBase(d), d.first, d.last));
  S.profiles.filter(p => p.id !== skipProfile).forEach(p => { const a = addrById(p.shipId); if (a) add(a, a.first, a.last); });
  return m;
}
// Jig for Pokémon Center on rows (drafts, or a profile's address as one): a new line 1 and 2 each, different
// from each other's and from taken, and a new name where its name is already on the street (namesTaken, or
// an earlier row's). {out:[{line1, line2, first, last, pkc}], buildings, named, sameName, repeats}: how many
// names changed, how many repeat with no other way to write them, how many still match another address.
// (pkcCrowded says which addresses have more than five.)
function pkcAssign(rows, taken, namesTaken){
  const used = new Set(taken), groups = new Map(), names = new Map(), lists = new Map(), res = {out:[], buildings:0, named:0, sameName:0, repeats:0};
  const namesAt = (sk) => { let s = names.get(sk); if (!s){ s = new Set(namesTaken && namesTaken.get(sk) || []); names.set(sk, s); } return s; };
  rows.forEach(d => {
    const b = pkcBase(d), gk = pkcBuildingKey(b);
    let g = groups.get(gk);
    if (!g){ g = {forms:pkcForms(b), i:0}; groups.set(gk, g); res.buildings++; }
    const key = (x) => draftAddrKey(Object.assign({}, b, x));
    let v = null;
    for (let tries = 0; !v && tries < 2000; tries++){
      if (g.i >= g.forms.length){ if (!g.forms.more) break; g.forms.push(g.forms.more()); }
      const x = g.forms[g.i]();
      if (!used.has(key(x))) v = x;
      if (v || !g.forms.more || tries % 6 === 5) g.i++;   // a made-up number gets a few more tries
    }
    if (!v){ v = {line1:b.line1, line2:b.line2}; res.repeats++; }
    used.add(key(v));
    // The name: kept while it's free on the street; otherwise the next way of writing it that is, the last name
    // and the first name taking turns (one list per name in a run, so the turns hold).
    const at = namesAt(pkcStreetKey(b)), nk = norm(b.first + " " + b.last);
    let nm = {first:String(b.first || ""), last:String(b.last || "")};
    if (nm.first && nm.last && at.has(nk)){
      if (!lists.has(nk)) lists.set(nk, pkcNameList(nm.first, nm.last));
      const alt = lists.get(nk).find(x => !at.has(norm(x.first + " " + x.last)));
      if (alt){ nm = alt; res.named++; } else res.sameName++;
    }
    at.add(norm(nm.first + " " + nm.last));
    const pkc = {line1:v.line1, line2:v.line2, was:{line1:String(b.line1 || ""), line2:String(b.line2 || "")}, first:nm.first, last:nm.last};
    if (nm.first !== String(b.first || "") || nm.last !== String(b.last || "")) pkc.name = {first:String(b.first || ""), last:String(b.last || "")};
    res.out.push({line1:v.line1, line2:v.line2, first:nm.first, last:nm.last, pkc});
  });
  return res;
}
// The street a building is on, without any unit: where names are compared for one profile.
const pkcStreetKey = (b) => pkcBuildingKey({line1:pkcRealUnit(b).head, line2:"", city:b.city, state:b.state, zip:b.zip});
// The editors' Jig on line 2, for Pokémon Center: building b with the next unit (or a number on line 1, or
// the street type the other way) that isn't taken and wasn't shown before (shown: line 2s, or line 1s where
// line 2 is empty). {line1, line2}, or null.
function pkcNextLine2(b, taken, shown){
  const t = new Set(taken), forms = pkcForms(b), head = pkcRealUnit(b).head, key = (x) => draftAddrKey(Object.assign({}, b, x));
  for (let tries = 0, i = 0; tries < 400; tries++){
    if (i >= forms.length){ if (!forms.more) break; forms.push(forms.more()); }
    const x = forms[i]();
    if ((x.line2 || norm(x.line1) !== norm(head)) && !t.has(key(x)) && !shown.has(norm(x.line2 || x.line1))) return x;
    if (!forms.more || tries % 6 === 5) i++;
  }
  return null;
}
// The editors' Jig on a first or last name (k), for Pokémon Center: the next way of writing b's that wasn't
// shown, ending with the name as it was. Null for a name too short to write another way.
function pkcNextName(b, k, shown){
  const list = pkcNameForms(b[k]); if (!list.length) return null;
  list.push(String(b[k] || ""));
  return list.find(x => !shown.has(norm(x))) || list[0];
}
// Jig for Pokémon Center on one address (a profile's): the next unit that isn't taken or shown before
// (address keys), and a letter doubled in the name if it's on the street already (namesTaken, from
// pkcNamesTaken). {line1, line2, first, last}, or null.
function pkcOneAddr(a, taken, shown, namesTaken){
  const t = new Set(taken), sh = shown || new Set(), now = draftAddrKey(a), forms = pkcForms(a), key = (x) => draftAddrKey(Object.assign({}, a, x));
  let v = null;
  for (let tries = 0, i = 0; !v && tries < 400; tries++){
    if (i >= forms.length){ if (!forms.more) break; forms.push(forms.more()); }
    const x = forms[i](), k = key(x);
    if (k !== now && !t.has(k) && !sh.has(k)) v = x;
    if (!forms.more || tries % 6 === 5) i++;
  }
  if (!v) return null;
  const names = (namesTaken && namesTaken.get(pkcStreetKey(a))) || new Set();
  let nm = {first:String(a.first || ""), last:String(a.last || "")};
  if (a.first && a.last && names.has(norm(a.first + " " + a.last))){ const alt = pkcNameList(nm.first, nm.last).find(x => !names.has(norm(x.first + " " + x.last))); if (alt) nm = alt; }
  return {line1:v.line1, line2:v.line2, first:nm.first, last:nm.last};
}

// The selected drafts, in the order the page shows them (then any it doesn't).
function draftsInOrder(ids){
  const set = new Set(ids), shown = visibleDrafts().filter(d => set.has(d.id)), seen = new Set(shown.map(d => d.id));
  return shown.concat(draftList().filter(d => set.has(d.id) && !seen.has(d.id)));
}
function draftChanges(before, after, keys){
  const str = (x) => x == null ? "" : typeof x === "object" ? JSON.stringify(x) : String(x), set = {};
  keys.forEach(k => { if (str(after[k]) !== str(before[k])) set[k] = after[k]; });
  return set;
}
// Puts changes ([{id, set}]) on the drafts and returns what Undo needs.
function applyDraftChanges(list){
  const m = Object.assign({}, genDrafts()), before = {}, now = Date.now();
  list.forEach(x => { const d = m[x.id]; if (!d || !Object.keys(x.set).length) return; before[x.id] = d; m[x.id] = Object.assign({}, d, x.set, {updatedAt:now}); });
  setDrafts(m); render();
  return before;
}
function undoDraftChanges(before){
  const m = Object.assign({}, genDrafts()); Object.keys(before).forEach(id => { if (m[id]) m[id] = before[id]; });
  setDrafts(m); render();
}

// Jig addresses: each of the drafts gets its own way of writing its address (street, unit, city, ZIP), at once.
function jigDrafts(ids){
  const rows = draftsInOrder(ids); if (!rows.length) return;
  if (jigFor() === "pokemon"){ jigDraftsPkc(rows); return; }
  const res = jigAssign(rows, JIG_PARTS, jigTaken(new Set(rows.map(d => d.id))));
  const list = rows.map((d, i) => ({id:d.id, set:draftChanges(d, res.out[i], JIG_PARTS.concat("zip4"))})), n = list.filter(x => JIG_PARTS.some(k => k in x.set)).length;
  if (!n){ toast(rows.length === 1 ? "There's no other way to write this address" : "There's no other way to write these addresses", "err"); return; }
  const before = applyDraftChanges(list);
  const kept = rows.length - n - res.repeats;
  const msg = [`Jigged ${plural(n, "address", "addresses")}${kept > 0 ? `, and ${kept} ${kept === 1 ? "keeps its address" : "keep their addresses"} as it was` : ""}.`]
    .concat(jigNotes(res).map(x => x + "."), res.repeats ? [`${res.repeats} still ${res.repeats === 1 ? "matches" : "match"} another address: there's no other way left to write it.`] : []).join(" ");
  toast(msg, res.repeats ? "err" : "", {label:"Undo", run:() => { undoDraftChanges(before); toast("Jig undone"); }});
}
// Jig for Pokémon Center on drafts (1.9.80+): each gets its own unit or line 1, and repeated names at one
// building a letter doubled, at once with Undo. The summary says when a building has more than five.
function jigDraftsPkc(rows){
  const skip = new Set(rows.map(d => d.id)), res = pkcAssign(rows, jigTaken(skip), pkcNamesTaken(skip)), over = pkcCrowded(rows);
  const list = rows.map((d, i) => ({id:d.id, set:draftChanges(d, res.out[i], ["line1", "line2", "first", "last", "pkc"])}));
  if (!list.some(x => Object.keys(x.set).length)){ toast("These drafts are already jigged for Pokémon Center", "err"); return; }
  const before = applyDraftChanges(list);
  const msg = [`Jigged ${plural(rows.length, "draft")} for Pokémon Center${res.buildings > 1 ? ` at ${res.buildings} addresses` : ""}: each has its own unit${res.named ? `, and ${plural(res.named, "repeated name")} got a doubled letter` : ""}.`]
    .concat(over.map(o => `${o.line} has ${o.n} drafts: up to ${PKC_PER} per address went through at Pokémon Center.`),
      res.sameName ? [`${plural(res.sameName, "draft")} ${res.sameName === 1 ? "shares its" : "share their"} name with another at the address: it's too short to write another way. Give ${res.sameName === 1 ? "it" : "them"} a new random name.`] : [],
      res.repeats ? [`${res.repeats} still ${res.repeats === 1 ? "matches" : "match"} another address.`] : []).join(" ");
  toast(msg, over.length || res.repeats ? "err" : "", {label:"Undo", run:() => { undoDraftChanges(before); toast("Jig undone"); }});
}
async function deleteSelectedDrafts(){
  const ids = [...UI.genSel].filter(x => genDrafts()[x]);
  if (ids.length && await confirmDialog({title:`Delete ${plural(ids.length, "draft")}?`, body:"They haven't been imported into Profiles yet. You can undo right after.", confirm:"Delete drafts", danger:true})) deleteDrafts(ids);
}
// Duplicate (1.9.77+): new drafts like the ones picked, going round them in the order shown, each numbered
// after the highest "<name> #n" in use for its name. A copy keeps its draft's name, group, address and the
// address typed in Generate (billTo), but not its email; Jig gives each its own way of writing the address,
// and the phone numbers and names can be new. {list:[{d, from}], jig}: jig is jigAssign's result, or null.
function dupPlan(rows, o){
  const nums = new Map(), seq = draftList().reduce((x, d) => Math.max(x, d.n || 0), 0), now = Date.now();
  const names = new Set(draftList().map(d => norm(d.first + " " + d.last)));
  // Jig for Pokémon Center (1.9.80+): a copy starts from its draft's real address and name, then gets its own.
  const pkc = o.jig && jigFor() === "pokemon";
  const list = [];
  for (let i = 0; i < o.qty; i++){
    const s = rows[i % rows.length], src = pkc ? pkcBase(s) : s, nm0 = String(s.name || "").trim(), m = /^(.*\S)\s*#(\d+)$/.exec(nm0), base = m ? m[1] : nm0 || "Draft";
    if (!nums.has(norm(base))) nums.set(norm(base), genNextNumber(base));
    const num = nums.get(norm(base)); nums.set(norm(base), num + 1);
    let who = {first:src.first || "", last:src.last || ""};
    if (o.names){ let tries = 0; do { who = genName(); } while (names.has(norm(who.first + " " + who.last)) && ++tries < 30); names.add(norm(who.first + " " + who.last)); }
    const d = {id:uid(), n:seq + i + 1, name:`${base} #${num}`, group:s.group || "", first:who.first, last:who.last, line1:src.line1 || "", line2:src.line2 || "",
      city:s.city || "", state:s.state || "", zip:s.zip || "", email:o.emails[i] || "", phone:o.phone ? genPhone(s.state) : s.phone || "", createdAt:now, updatedAt:now};
    if (s.zip4) d.zip4 = s.zip4;
    if (draftBillTo(s)) d.billTo = Object.assign({}, s.billTo);
    if (!pkc && s.pkc && typeof s.pkc === "object") d.pkc = JSON.parse(JSON.stringify(s.pkc));   // as its draft: the real address and name
    list.push({d, from:s});
  }
  let jig = null;
  if (pkc && list.length){
    jig = pkcAssign(list.map(x => x.d), jigTakenAll(), pkcNamesTaken(new Set()));
    list.forEach((x, i) => { const r = jig.out[i]; Object.assign(x.d, {line1:r.line1, line2:r.line2, first:r.first, last:r.last, pkc:r.pkc}); });
  } else if (o.jig && list.length){
    jig = jigAssign(list.map(x => x.d), JIG_PARTS, jigTakenAll());
    list.forEach((x, i) => { Object.assign(x.d, jig.out[i]); if (!x.d.zip4) delete x.d.zip4; });
  }
  return {list, jig};
}
function openDraftDuplicate(ids){
  const rows = draftsInOrder(ids); if (!rows.length) return;
  const k = rows.length, who = (d) => `${d.first || ""} ${d.last || ""}`.trim(), people = [...new Set(rows.map(who).filter(Boolean))];
  let plan = null;
  openLayer({
    title:`Duplicate ${plural(k, "draft")}`, dismiss:false,
    body:`<p style="margin:-4px 0 16px;color:var(--ink-2)">Makes new drafts like ${k === 1 ? "this one" : "the ones you picked"}, numbered after the last one. Each copy keeps its draft's name, group and the address you typed in Generate, so billing stays the same.</p>

          if (made.length){ const m = Object.assign({}, genDrafts()); made.forEach(d => { delete m[d.id]; UI.genSel.delete(d.id); }); setDrafts(m); render(); }
          toast("Mass edit undone");
        }});
      });
      draw();
    }
  });
}

// What a mass edit (r: {set: typed values by field, modes}) would make of each draft, without changing
// anything: rows [{id, after, set}], the preview's columns, and lines, warnings and errors ([field, message]).
// cache keeps random results (names, phone numbers, jigs) while what they depend on stays the same.
function dmPlan(ids, r, cache){
  let rows = draftsInOrder(ids);
  const s = r.set, M = r.modes;
  const plan = {rows:[], cols:[], lines:[], warns:[], errs:[], touched:Object.keys(s).length > 0 || M.size > 0, emails:null, leftOut:[], extra:[]};
  if (!rows.length) return plan;
  // Emails, one per draft in the order shown (1.9.78+). Fewer leaves the drafts after them out of the whole
  // edit; more makes new drafts for the rest, copies of the first ones (as Duplicate makes them: their own
  // jigged address and phone number) that get the edit too. Ticked and blank clears every email.
  let emails = null;
  if ("email" in s){
    const em = plan.emails = genEmails(s.email), k = em.list.length - rows.length;
    if (!em.list.length && em.bad.length) plan.errs.push(["dm_email", "Enter one email per line, or leave it blank to clear them."]);
    else if (em.list.length){
      emails = em.list;
      if (k < 0){ plan.leftOut = rows.slice(em.list.length); rows = rows.slice(0, em.list.length); }
      else if (k > 0){
        const key = "extra|" + k + "|" + rows.map(d => d.id).join(",");
        let extra = cache.get(key);
        if (!extra){ [...cache.keys()].forEach(x => { if (x.startsWith("extra|")) cache.delete(x); }); extra = dupPlan(rows, {qty:k, jig:true, phone:true, names:false, emails:[]}).list.map(x => Object.assign({}, x.d, {_from:x.from.name})); cache.set(key, extra); }
        plan.extra = extra; rows = rows.concat(extra);
      }
    }
  }
  const sel = new Set(rows.map(d => d.id));
  const after = rows.map(d => { const a = Object.assign({}, d); delete a._from; return a; });
  const need = {first:"Enter a first name.", last:"Enter a last name.", line1:"Enter a street address.", city:"Enter a city.", state:"Choose one."};
  Object.keys(need).forEach(k => { if (k in s && !s[k]) plan.errs.push(["dm_" + k, need[k]]); });
  if ("name" in s){
    if (!s.name) plan.errs.push(["dm_name", "Enter a name."]);
    else {
      const m = /^(.*\S)\s*#(\d+)$/.exec(s.name), base = m ? m[1] : s.name, from = m ? +m[2] : genNextNumber(base, sel);
      after.forEach((a, i) => { a.name = `${base} #${from + i}`; });
    }
  }
  ["group", "first", "last", "line1", "line2", "city", "state", "zip"].forEach(k => { if (k in s) after.forEach(a => { a[k] = s[k]; }); });
  if ("email" in s && !plan.errs.some(([f]) => f === "dm_email")) after.forEach((a, i) => { a.email = emails ? emails[i] : ""; });
  // A street, city, state or ZIP typed here is a correction, so the address the draft bills to (billTo,
  // 1.9.75+) follows it. Jig, below, never changes it.
  const typedAddr = ["line1", "line2", "city", "state", "zip"].filter(k => k in s);
  if (typedAddr.length) after.forEach(a => { if (draftBillTo(a)){ a.billTo = Object.assign({}, a.billTo); typedAddr.forEach(k => { a.billTo[k] = s[k]; }); } });
  if ("zip" in s && !genZipOk(s.zip)) plan.errs.push(["dm_zip", s.zip ? "Use 5 digits, or ZIP+4." : "Enter a ZIP code."]);
  if (plan.emails){
    const em = plan.emails, n = rows.length - plan.extra.length;
    if (em.list.length){
      const taken = new Set(S.profiles.map(p => norm(p.email)).concat(draftList().filter(d => !sel.has(d.id)).map(d => norm(d.email))).filter(Boolean));
      const used = em.list.filter(e => taken.has(norm(e))).length;
      plan.lines.push(`${plural(em.list.length, "email")}, one for each draft in the order shown`);
      if (plan.leftOut.length) plan.warns.push(`${plural(plan.leftOut.length, "draft")} left out of this edit, with no email for ${plan.leftOut.length === 1 ? "it" : "them"}: ${esc(plan.leftOut.map(d => d.name).join(", "))}`);
      if (plan.extra.length) plan.warns.push(`${plural(plan.extra.length, "new draft")} for the extra emails: ${esc(plan.extra.map(d => d.name).join(", "))}, ${plan.extra.length === 1 ? "a copy" : "copies"} of ${esc([...new Set(plan.extra.map(d => d._from))].join(", "))} with ${plan.extra.length === 1 ? "its" : "their"} own jigged address and phone number`);
      if (em.bad.length) plan.warns.push(`${plural(em.bad.length, "line")} ${em.bad.length === 1 ? "isn't an email" : "aren't emails"} and ${em.bad.length === 1 ? "is" : "are"} left out: ${esc(em.bad.slice(0, 3).join(", "))}${em.bad.length > 3 ? "…" : ""}`);
      if (em.dup) plan.warns.push(`${plural(em.dup, "repeated email")} used once`);
      if (used) plan.warns.push(`${plural(used, "email")} ${used === 1 ? "is" : "are"} already on a profile or another draft`);
    } else if (!em.bad.length) plan.warns.push(`Clears the email on ${n === 1 ? "this draft" : `all ${n} drafts`}`);
  }
  if ("phone" in s){
    const p = digits(s.phone);
    if (p && p.length < 7) plan.errs.push(["dm_phone", "Enter a phone number, or leave it blank."]);
    after.forEach(a => { a.phone = p; });
  }
  // New random first names and New random last names (1.9.84+; before, one New random names did both): each
  // draft's own, different from the others' where the lists allow, and its full name unlike another draft's.
  // Rolled once per set of drafts, so typing elsewhere doesn't reshuffle them.
  const namesUsed = M.has("rfirst") || M.has("rlast") ? new Set(draftList().filter(d => !sel.has(d.id)).map(d => norm(d.first + " " + d.last))) : null;
  for (const [m, k] of [["rfirst", "first"], ["rlast", "last"]]){
    if (!M.has(m)) continue;
    const key = m + "|" + rows.map(d => d.id).join(",");
    let list = cache.get(key);
    if (!list){
      const seen = new Set(), taken = new Set(namesUsed);
      list = after.map(a => { let x, full, t = 0;
        do { x = genName("any")[k]; full = norm(k === "first" ? x + " " + a.last : a.first + " " + x); } while ((seen.has(x) || taken.has(full)) && ++t < 40);
        seen.add(x); taken.add(full); return x; });
      [...cache.keys()].forEach(x => { if (x.startsWith(m)) cache.delete(x); }); cache.set(key, list);
    }
    after.forEach((a, i) => { a[k] = list[i]; });
  }
  // New random phone numbers, with the area codes of each draft's state (as it will be).
  if (M.has("phone")){
    const key = "phone|" + after.map(a => a.state).join(",");
    let list = cache.get(key);
    if (!list){ const used = new Set(); list = after.map(a => { let p, t = 0; do { p = genPhone(a.state); } while (used.has(p) && ++t < 30); used.add(p); return p; }); cache.set(key, list); }
    after.forEach((a, i) => { a.phone = list[i]; });
  }
  // Jig for Pokémon Center (1.9.80+), after any typed changes: each draft its own unit, and a name already at
  // the address a letter doubled. Billing keeps the real address and name (d.pkc remembers them).
  if (M.has("pkc")){
    const key = "pkc|" + after.map(a => draftAddrKey(a) + "~" + norm(a.first + " " + a.last)).join("/");
    let res = cache.get(key);
    if (!res){ res = pkcAssign(after.map(a => Object.assign({}, a)), jigTaken(sel), pkcNamesTaken(sel)); [...cache.keys()].forEach(x => { if (x.startsWith("pkc")) cache.delete(x); }); cache.set(key, res); }
    after.forEach((a, i) => { ["line1", "line2", "first", "last", "pkc"].forEach(k => { a[k] = res.out[i][k]; }); });
    plan.lines.push(`Each draft gets its own unit for Pokémon Center${res.named ? `, and ${plural(res.named, "repeated name")} ${res.named === 1 ? "gets" : "get"} a letter doubled` : ""}`);
    pkcCrowded(after).forEach(o => plan.warns.push(`${esc(o.line)} would have ${o.n} drafts: up to ${PKC_PER} per address went through at Pokémon Center`));
    if (res.sameName) plan.warns.push(`${plural(res.sameName, "draft")} ${res.sameName === 1 ? "shares its" : "share their"} name with another at the address: it's too short to write another way. Use New random first names or last names to give each its own.`);
    if (res.repeats) plan.warns.push(`${plural(res.repeats, "draft")} still ${res.repeats === 1 ? "matches" : "match"} another address`);
  }
  // Jig, after any typed address changes, so it jigs the address each draft will have.
  const parts = [["jig1", "line1"], ["jig2", "line2"], ["jigc", "city"], ["jigz", "zip"]].filter(([m]) => M.has(m)).map(([, k]) => k), jigging = parts.length > 0;
  if (jigging){
    const taken = jigTaken(sel), base = after.map(a => Object.assign({}, a));
    const key = "jig|" + parts.join(",") + "|" + base.map(draftAddrKey).join("/");
    let res = cache.get(key);
    if (!res){ res = jigAssign(base, parts, taken); [...cache.keys()].forEach(x => { if (x.startsWith("jig")) cache.delete(x); }); cache.set(key, res); }
    after.forEach((a, i) => { JIG_PARTS.concat("zip4").forEach(k => { a[k] = res.out[i][k]; }); });
    if (M.has("jig2") && !base.some(a => jigUnit(a.line2).length > 1)) plan.warns.push(base.some(a => a.line2) ? "Address line 2 isn't an apartment, suite or unit that Jig can write another way" : "None of these drafts has an address line 2 to jig");
    if (M.has("jigc") && !base.some(a => jigChoices(a, ["city"]).order.length > 1)) plan.warns.push("Jig only changes a city's name where it has Saint, Fort or Mount (St, Ft, Mt) in it");
    if (M.has("jigz") && !base.some(a => /^\d{5}-?\d{4}$/.test(String(a.zip || "").trim()))) plan.warns.push("None of these drafts has a ZIP+4 to jig. Put the ZIP+4 from USPS's ZIP Code lookup in ZIP code first, then jig it.");
    jigNotes(res).forEach(x => plan.lines.push(x));
    if (res.repeats){
      const one = new Set(base.map(draftAddrKey)).size === 1;
      plan.warns.push(`${plural(res.repeats, "draft")} still ${res.repeats === 1 ? "matches" : "match"} another address: ${one ? `${esc([base[0].line1, base[0].line2, base[0].city].filter(Boolean).join(", "))} can be written only ${plural(jigWays(base[0], parts, taken), "way")} that no other draft or saved address uses` : "there's no other way left to write it"}. Jig more of the address, change the rest by hand, or select fewer drafts.`);
    }
  }
  plan.rows = rows.map((d, i) => d._from ? {id:d.id, after:after[i], set:{}, isNew:true, from:d._from}
    : {id:d.id, after:after[i], set:draftChanges(d, after[i], DM_FIELDS.concat("zip4", "billTo", "pkc"))});
  // The preview's columns: the ones anything changes in.
  const any = (keys) => plan.rows.some(x => keys.some(k => k in x.set));
  const COLS = [{label:"Group", keys:["group"], show:(a) => a.group}, {label:"Name", keys:["first", "last"], show:(a) => [a.first, a.last].filter(Boolean).join(" ")},
    {label:"Address", keys:["line1", "line2", "city", "state", "zip"], show:(a) => draftAddrLine(a)}, {label:"Email", keys:["email"], show:(a) => a.email}, {label:"Phone", keys:["phone"], show:(a) => fmtPhone(a.phone)}];
  plan.cols = COLS.filter(c => any(c.keys));
  // Addresses: all different, or how many still share one.
  if (any(["line1", "line2", "city", "state", "zip"]) || jigging || M.has("pkc")){
    const t = new Set(jigTaken(sel)), seen = new Map();
    after.forEach(a => { const k = draftAddrKey(a); seen.set(k, (seen.get(k) || 0) + 1); });
    const clash = after.filter(a => seen.get(draftAddrKey(a)) > 1 || t.has(draftAddrKey(a))).length;
    if (!clash && rows.length > 1) plan.lines.push(`All ${rows.length} addresses are different, and none matches another draft or a saved address`);
    else if (clash && !jigging && !M.has("pkc")) plan.warns.push(`${plural(clash, "draft")} would share an address with another. Jig the address to make each one different.`);
  }
  return plan;
}

/* ---------- Jig on one profile (1.9.74+) ---------- */
// Every saved address and draft address: a profile's jigged shipping address mustn't match any of them (its
// own as well, which a profile billing to its shipping address keeps as its billing address).
const jigTakenAll = () => S.addresses.map(draftAddrKey).concat(draftList().map(draftAddrKey));
// The next way of writing address a (the parts named), in Jig's usual order: one no other address has and
// not offered before (shown: address keys), if there is one. Null if there's no other way to write it.
function jigOneAddr(a, parts, taken, shown){
  const c = jigChoices(a, parts), t = new Set(taken), sh = shown || new Set(), key = (x) => draftAddrKey(Object.assign({}, a, x)), now = draftAddrKey(a);
  const list = c.order.filter(x => key(x) !== now);
  if (!list.length) return null;
  return list.find(x => !t.has(key(x)) && !sh.has(key(x))) || list.find(x => !t.has(key(x))) || list.find(x => !sh.has(key(x))) || list[0];
}
// Jig address on one profile: its shipping address gets its own way of being written (a copy, if other
// profiles share it). A profile billing to its shipping address keeps the address as it was as its billing
// address, since the bank checks that against the card. Undo puts everything back.
function jigProfile(p){
  const a = addrById(p.shipId);
  if (!a){ toast("This profile has no shipping address yet", "err"); return; }
  if ((a.country || "US") !== "US"){ toast("Jig works on US addresses", "err"); return; }
  const pkc = jigFor() === "pokemon";   // 1.9.80+: a unit of its own, and the name if another address on the street has it
  const v = pkc ? pkcOneAddr(a, jigTakenAll(), null, pkcNamesTaken(new Set(), p.id)) : jigOneAddr(a, JIG_PARTS, jigTakenAll());
  if (!v){ toast("There's no other way to write this address", "err"); return; }
  const before = {profile:JSON.stringify(p), addresses:new Map(S.addresses.map(x => [x.id, JSON.stringify(x)]))};
  const fields = {}; ADDR_F.forEach(k => { fields[k] = a[k] || ""; });
  (pkc ? ["line1", "line2", "first", "last"] : JIG_PARTS).forEach(k => { fields[k] = v[k]; });
  const kept = p.billSame;
  if (kept){ p.billSame = false; p.billId = p.shipId; p.shipId = resolveAddr(fields, null, p.id, p.billId); }
  else p.shipId = resolveAddr(fields, p.shipId, p.id, p.billId);
  p.updatedAt = Date.now();
  persist(); render();
  const renamed = pkc && (v.first !== String(a.first || "") || v.last !== String(a.last || ""));
  toast(`Jigged ${p.name}${pkc ? " for Pokémon Center" : ""}: ${streetLine(addrById(p.shipId))}${renamed ? `, as ${v.first} ${v.last}` : ""}.${kept ? ` Billing keeps the address${renamed ? " and name" : ""} as it was.` : ""}`, "", {label:"Undo", run:() => { undoProfileJig(p.id, before); toast("Jig undone"); }});
}
function undoProfileJig(id, before){
  const p = S.profiles.find(x => x.id === id); if (!p) return;
  const put = (o, json) => { Object.keys(o).forEach(k => delete o[k]); Object.assign(o, JSON.parse(json)); };
  put(p, before.profile);
  const used = (aid) => S.profiles.some(q => q.shipId === aid || (!q.billSame && q.billId === aid));
  S.addresses = S.addresses.filter(x => before.addresses.has(x.id) || used(x.id));
  S.addresses.forEach(x => { const j = before.addresses.get(x.id); if (j && j !== JSON.stringify(x)) put(x, j); });
  persist(); render();
}

/* ---------- Mass edit on Profiles (1.9.90+) ---------- */

// them all at once. As on Generate, each ticked field goes onto every selected profile and the rest stay as they
// are, the window shows every profile as it will be before Change, and Change has Undo. No Jig here (the owner
// keeps bulk Jig on Generate) and no Email: a profile's email follows its stores (1.9.86+), so adding or removing
// stores can change it. A card or a billing address in the old shipping name takes the new one, as in the editor.
const PM_FIELDS = ["group", "name", "phone", "size", "once", "stores", "first", "last", "line1", "line2", "city", "state", "zip", "bill"];
const PM_SHIP = ["first", "last", "line1", "line2", "city", "state", "zip"];
const pmFull = (a) => a ? [a.first, a.last].filter(Boolean).join(" ") : "";
// The selected profiles in the order the page shows them, then any it doesn't (filtered out), by name.

    .concat(S.profiles.filter(p => set.has(p.id) && !seen.has(p.id)).sort((a, b) => natural(a.name, b.name)));
}
// What Mass edit shows and changes on a profile.
function pmState(p){

  return {name:p.name || "", group:(groupById(p.groupId) || {}).name || "", phone:p.phone || "", size:p.size || "", once:!!p.oneCheckout, email:p.email || "",
    stores:profileStores(p).map(e => Object.assign({}, e)), ship:adr(addrById(p.shipId)), billSame:!!p.billSame, bill:p.billSame ? null : adr(addrById(p.billId)), holder:c ? c.holder || "" : null};
}
// A profile's email from its stores, as the editor saves it (emailToSave): none on Use Assigned Account only, else a
// store login's (the one it has, if it's one of them), else Pokémon Center's checkout email, else the one it has.
function pmEmail(a){
  const st = a.stores;

  const ls = st.filter(e => modeOf(e) === "login").map(e => loginById(e.loginId)).filter(l => l && l.email);

function openProfileMassEdit(ids){
